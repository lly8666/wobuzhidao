name: tmp-v2-m2-wolfssl-source-relay

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-v2-m2-wolfssl-source-relay.yml

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wolfSSL/wolfssl
          ref: ac01707f552c611fbd135cc723b2682b3e7f80f2
          fetch-depth: 1
          path: wolfssl-src
      - name: Verify and archive exact source
        run: |
          set -euo pipefail
          cd wolfssl-src
          test "$(git rev-parse HEAD)" = ac01707f552c611fbd135cc723b2682b3e7f80f2
          git describe --tags --exact-match HEAD | tee /tmp/wolfssl-tag.txt
          git rev-parse HEAD | tee /tmp/wolfssl-commit.txt
          git archive --format=tar.gz --prefix=wolfssl-ac01707f/ HEAD > /tmp/wolfssl-ac01707f-source.tar.gz
          sha256sum /tmp/wolfssl-ac01707f-source.tar.gz | tee /tmp/wolfssl-source.sha256
          grep -E '^AC_INIT|WOLFSSL_VERSION' configure.ac | head -20 > /tmp/wolfssl-version-evidence.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: v2-m2-wolfssl-source
          path: |
            /tmp/wolfssl-ac01707f-source.tar.gz
            /tmp/wolfssl-source.sha256
            /tmp/wolfssl-tag.txt
            /tmp/wolfssl-commit.txt
            /tmp/wolfssl-version-evidence.txt
