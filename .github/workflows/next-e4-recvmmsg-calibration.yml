name: next-e4-recvmmsg-synthetic-calibration
run-name: e4-recvmmsg-config-${{ github.sha }}
on:
  push:
    branches: ["next/performance-efficiency-20261008"]
    paths:
      - ".github/e4-recvmmsg-calibration-case.json"
permissions:
  contents: read
jobs:
  one-nonproduct-calibration-case:
    if: github.ref_name == 'next/performance-efficiency-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify explicit single-case commit and immutable helper blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          # Match the repository's one STATUS + one new devlog contract without
          # allowing executable changes in the calibration case commit.
          changed=[row.split("\t",1) for row in subprocess.check_output(
              ["git","diff","--name-status","HEAD^","HEAD"],text=True).splitlines()]
          cases=[(status,path) for status,path in changed
                 if path==".github/e4-recvmmsg-calibration-case.json"]
          stat=[(status,path) for status,path in changed if path=="docs/STATUS.json"]
          log=[(status,path) for status,path in changed
               if path.startswith("docs/devlog/") and path.endswith(".md")]
          assert len(changed)==3 and len(cases)==1 and len(stat)==1 and len(log)==1
          assert cases[0][0] in ("A","M") and stat[0][0]=="M" and log[0][0]=="A"
          d=json.loads(Path(".github/e4-recvmmsg-calibration-case.json").read_text())
          assert set(d)=={"schema","case_id","mode","product_source_sha","fixture_git_blob","driver_git_blob","tracer_git_blob"}
          assert d["schema"]=="wbd-e4-synthetic-calibration-case/v1"
          assert d["mode"] in ("off","on")
          assert re.fullmatch(r"e4-"+d["mode"]+r"-[0-9]{2}",d["case_id"])
          assert d["product_source_sha"]=="ba8ed1e656d32fa2d59cd0d5907fbc1ad10b3072"
          for key,path in (("fixture_git_blob","tools/testdata/e4_recvmmsg_calibration.c"),
                           ("driver_git_blob","tools/e4_recvmmsg_calibration.py"),
                           ("tracer_git_blob","tools/afpacket_recvmmsg_tracepoint.py")):
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==d[key],(key,"unapproved_helper_change")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("MODE="+d["mode"]+"\n")
          print("WBD_E4_ONE_CASE_CONFIG_VALIDATED")
          PY
      - name: Enforce one case and pin synthetic source and mode
        shell: bash
        run: |
          set -euo pipefail
          test "$MODE" = off || test "$MODE" = on
          test "$GITHUB_REF_NAME" = next/performance-efficiency-20261008
          python3 -m py_compile tools/e4_recvmmsg_calibration.py tools/afpacket_recvmmsg_tracepoint.py
          cc -O2 -Wall -Wextra -Werror tools/testdata/e4_recvmmsg_calibration.c -o "$RUNNER_TEMP/e4-recvmmsg-calibration"
          test -x "$RUNNER_TEMP/e4-recvmmsg-calibration"
      - name: Install BPF observer only in the ON case
        if: env.MODE == 'on'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bpftrace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bpftrace
          fi
      - name: Run exactly ONE 12s local AF_UNIX calibration case
        id: single
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo python3 tools/e4_recvmmsg_calibration.py \
            --fixture "$RUNNER_TEMP/e4-recvmmsg-calibration" \
            --mode "$MODE" \
            --output artifacts/e4-recvmmsg-calibration.json
          cat artifacts/e4-recvmmsg-calibration.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/e4-recvmmsg-calibration.json").read_text())
          assert x["status"]=="ONE_SYNTHETIC_CASE_COMPLETE_NOT_CALIBRATED"
          assert x["mode"] in ("off","on")
          assert x["fixture"]["target_calls"]==48000
          assert x["fixture"]["decoy_calls"]==48000
          assert x["product_cpu_gain"]=="UNPROVEN"
          assert x["tracer_overhead_qualified"] is False
          if x["mode"]=="on":
              assert x["kernel_counters"]["entered"]==48000
              assert x["kernel_counters"]["exited"]==48000
              assert x["kernel_counters"]["unpaired"]==0
          else:
              assert x["kernel_counters"]=="NOT_MEASURED_OBSERVER_OFF"
          print("WBD_E4_ONE_SYNTHETIC_CASE_COMPLETE_NOT_CALIBRATED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-recvmmsg-calibration-case-${{ github.run_id }}
          path: artifacts/e4-recvmmsg-calibration.json
          if-no-files-found: warn
      - name: Propagate invalid case even if upload succeeded
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.single.outcome }}
        run: test "$RESULT" = success
