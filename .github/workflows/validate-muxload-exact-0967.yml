name: validate-muxload-exact-0967f983

on:
  push:
    branches:
      - agent/audit-backlog-exact-0967
    paths:
      - '.github/workflows/validate-muxload-exact-0967.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: 0967f983c36504dfd430bb76456e1e8f8331dea8

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rtt: [20, 100]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "WBD_VALIDATION_SOURCE source_sha=$SOURCE_SHA helper_sha=$GITHUB_SHA rtt=${{ matrix.rtt }}"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc curl unzip openssl iproute2 iptables
      - name: Build exact-source pinned DTLS and one-public-flow stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/wolf-art /tmp/wolf /tmp/muxload
          mkdir -p /tmp/wolf-art /tmp/wolf/src /tmp/wolf/build /tmp/muxload/assets /tmp/muxload/results
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9529710833/zip" -o /tmp/wolfssl-source.zip
          unzip -q /tmp/wolfssl-source.zip -d /tmp/wolf-art
          echo '4a7ff40a32db0d7a262aaea2d2e674da6708250cba908441c737c981fc84f88b  /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz -C /tmp/wolf/src --strip-components=1
          (cd /tmp/wolf/src && ./autogen.sh)
          (cd /tmp/wolf/build && /tmp/wolf/src/configure --enable-dtls13 --disable-shared --enable-static CFLAGS='-O2 -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384')
          make -C /tmp/wolf/build -j2 src/libwolfssl.la
          gcc -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384 -O2 -Wall -Wextra -Werror -I/tmp/wolf/build -I/tmp/wolf/src \
            native/dtls/wbd_dtls_shim.c /tmp/wolf/build/src/.libs/libwolfssl.a -lm -o /tmp/muxload/assets/wbd_dtls_shim
          gcc -O2 -Wall -Wextra -Werror scripts/udp_multistream_oneway_probe.c -lm -o /tmp/muxload/assets/udp_multistream_oneway_probe
          python3 -m py_compile scripts/bench_mux_two_session_single_flow_100m.py scripts/bench_mux_two_session_100m_runner.py
          go test ./internal/control ./internal/linkdata ./internal/session ./internal/faketcp ./internal/realityfront ./cmd/wbd-link-proxy ./cmd/wbd-link-server-mux -count=1
          go build -trimpath -o /tmp/muxload/assets/wbd-faketcp ./cmd/wbd-faketcp
          go build -trimpath -o /tmp/muxload/assets/wbd-faketcp-mux ./cmd/wbd-faketcp-mux
          go build -trimpath -o /tmp/muxload/assets/wbd-link-proxy ./cmd/wbd-link-proxy
          go build -trimpath -o /tmp/muxload/assets/wbd-link-server-mux ./cmd/wbd-link-server-mux
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-front.invalid' -keyout /tmp/muxload/assets/front.key -out /tmp/muxload/assets/front.pem >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-dtls.invalid' -keyout /tmp/muxload/assets/dtls.key -out /tmp/muxload/assets/dtls.pem >/dev/null 2>&1
          printf '%s\n' "$SOURCE_SHA" >/tmp/muxload/SOURCE_SHA.txt
      - name: Run 40/60/80/100 Mbit aggregate inner sweep under 20 percent loss
        run: |
          set -euo pipefail
          test "$(cat /tmp/muxload/SOURCE_SHA.txt)" = "$SOURCE_SHA"
          for per_stream in 20 30 40 50; do
            total=$((per_stream * 2))
            for fec in off 20:20; do
              safe_fec="${fec/:/x}"
              label="rtt${{ matrix.rtt }}-load${total}-${safe_fec}"
              echo "=== ${label} ==="
              sudo -E python3 scripts/bench_mux_two_session_100m_runner.py run \
                --rtt '${{ matrix.rtt }}' --loss 20 --fec "$fec" \
                --offered-mbps-per-stream "$per_stream" --duration 2 \
                --assets /tmp/muxload/assets --out-dir "/tmp/muxload/results/${label}"
            done
          done
      - name: Validate exact-source characterization outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          files=sorted(glob.glob('/tmp/muxload/results/*/result.json'))
          assert len(files)==8, files
          loads=set()
          for p in files:
              r=json.load(open(p)); a=r['probe']['aggregate']
              assert r.get('public_flow_count') == 1, r
              assert r.get('inner_stream_count') == 2, r
              assert r.get('setup_loss_pct') == 0.0 and r.get('measurement_loss_pct') == 20.0, r
              loads.add(int(round(r['offered_mbps_total'])))
              print('WBD_MUXLOAD_POINT',os.path.basename(os.path.dirname(p)),json.dumps({'delivery':a['delivery_ratio'],'goodput':a['delivered_mbps_active'],'p99_ms':a['oneway_p99_ms'],'fec':r['fec']},sort_keys=True))
          assert loads == {40,60,80,100}, loads
          PY
          echo "WBD_MUXLOAD_EXACT_PASS source_sha=$SOURCE_SHA rtt=${{ matrix.rtt }} loads=40,60,80,100 loss_pct=20 fec=off,20:20 public_flows=1 inner_streams=2"
      - name: Make artifacts readable
        if: always()
        run: sudo chmod -R a+rX /tmp/muxload/results /tmp/muxload/SOURCE_SHA.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muxload-exact-0967-rtt${{ matrix.rtt }}
          path: |
            /tmp/muxload/results/
            /tmp/muxload/SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: bench
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact-source load marker
        run: |
          echo "WBD_MUXLOAD_40_100_PASS source_sha=${SOURCE_SHA} rtt=20,100 loads=40,60,80,100 loss_pct=20 fec=off,20:20"
