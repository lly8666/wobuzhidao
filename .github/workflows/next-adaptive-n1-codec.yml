name: next-adaptive-n1-codec
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n1-codec.yml"
      - "internal/datapath/quality_health_v3.go"
      - "internal/datapath/quality_health_v3_test.go"
      - "internal/datapath/quality_feedback_v3.go"
      - "internal/datapath/quality_feedback_v3_test.go"
      - "internal/datapath/quality_health_live.go"
      - "internal/datapath/lane.go"
      - "internal/datapath/quality_pn_window.go"
      - "internal/datapath/quality_pair_range.go"
      - "internal/datapath/quality_echo_v4.go"
      - "internal/datapath/quality_echo_v4_test.go"
      - "internal/datapath/quality_health_echo_live.go"
      - "internal/datapath/control_health_padding.go"
      - "internal/tlsrecord/record.go"
      - "internal/tlsrecord/control_padding_test.go"
      - "internal/datapath/quality_pn_window_test.go"
      - "internal/tlsrecord/decoder.go"
      - "internal/runtimeowner/quality.go"
      - "internal/runtimeowner/quality_window.go"
      - "internal/runtimeowner/quality_pair.go"
      - "internal/runtimeowner/quality_echo_live.go"
      - "internal/runtimeowner/control_policy.go"
      - "internal/runtimeowner/control_policy_test.go"
      - "internal/runtimeowner/quality_echo_live_test.go"
      - "internal/runtimeowner/quality_pair_test.go"
      - "internal/runtimeowner/quality_window_test.go"
      - "internal/runtimeowner/send_batch.go"
      - "internal/runtimeowner/quality_live_test.go"
      - "internal/runtimeowner/health.go"
      - "internal/runtimeowner/runtime.go"
      - "internal/runtimeentry/lifecycle.go"
      - "docs/WIRE_SPEC.md"
permissions:
  contents: read
concurrency:
  group: next-adaptive-n1-codec-${{ github.ref }}
  cancel-in-progress: false
jobs:
  versioned-104-byte-health-codec-strict-vector-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - name: Repository/Actions authority and exact SOURCE
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          echo "SOURCE=$GITHUB_SHA; N1 live 104-byte control and bounded DATA PN ledgers; no paired WAN loss qualification" >> "$GITHUB_STEP_SUMMARY"
      - name: Independent quality codec and one-latest feedback mailbox/race fences
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/datapath \
            -run '^TestN1Quality(HealthV3|Feedback|ReceivePN|EchoV4)' -count=2 -timeout=90s -v
      - name: Control-only KindHealth encrypted padding lengths and tamper under race
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/tlsrecord -run '^TestN1Control' -count=2 -timeout=90s -v
      - name: Merged idle and event-driven quality control under race
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/runtimeowner -run '^TestN1Control' -count=2 -timeout=90s -v
      - name: Legacy health v1 and plaintext record regression
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/datapath ./internal/tlsrecord -count=1 -timeout=90s
      - name: Actual V3 encrypted control, 128B correlated echo return, source history replay fences under race
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/runtimeowner \
            -run '^TestN1QualityV3' -count=2 -timeout=90s -v
