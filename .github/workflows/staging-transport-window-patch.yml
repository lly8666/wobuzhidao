name: staging-transport-window-patch

on:
  push:
    branches:
      - agent/fec-zombie-fix-7d859
    paths:
      - '.github/workflows/staging-transport-window-patch.yml'
      - 'scripts/staging_transport_window_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply asserted patch
        run: python3 scripts/staging_transport_window_patch.py
      - name: Verify Go changes
        run: |
          set -euo pipefail
          gofmt -w internal/faketcp/window.go internal/faketcp/window_test.go internal/faketcp/server_mux.go cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/main_linux.go
          go test ./internal/faketcp ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux -count=1
          git diff --check
      - name: Commit patch and remove staging helper
        run: |
          set -euo pipefail
          git rm .github/workflows/staging-transport-window-patch.yml scripts/staging_transport_window_patch.py
          git config user.name 'lly8666'
          git config user.email '30583594+lly8666@users.noreply.github.com'
          git add internal/faketcp/window.go internal/faketcp/window_test.go internal/faketcp/server_mux.go cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/main_linux.go native/dtls/wbd_dtls_shim.c .github/workflows/windows-portable-bundle.yml scripts/build_linux_server_bundle.sh .github/workflows/reconnect-netem.yml
          git commit -m 'fix(transport): bound FakeTCP window to DTLS replay budget'
          git push origin HEAD:agent/fec-zombie-fix-7d859
