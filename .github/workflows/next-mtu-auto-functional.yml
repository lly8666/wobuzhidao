name: next-mtu-auto-functional
on:
  push:
    branches: ['work/mtu-auto-inner-20261008']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  linux-unit-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.12', cache: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Source, parameter catalog, unit, build and race
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/parameter_catalog.py
          go test ./... -count=1
          go test -race ./... -count=1
          go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
  windows-unit:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.12', cache: false }
      - name: Windows unit and build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "SHA mismatch" }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows owned-only MTU restoration script mock
        shell: pwsh
        run: ./tools/test_windows_tun_mtu.ps1
  linux-real-tun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real kernel TUN with derived MTUs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
          ns=wbd-auto-mtu
          trap 'sudo ip netns del "$ns" >/dev/null 2>&1 || true' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip tuntap add dev wbdmtu mode tun
          for mtu in 576 1143 1199 1249; do
            sudo ip netns exec "$ns" ip link set dev wbdmtu mtu "$mtu" up
            actual=$(sudo ip netns exec "$ns" cat /sys/class/net/wbdmtu/mtu)
            test "$actual" = "$mtu"
          done
          sudo ip netns exec "$ns" ip link del dev wbdmtu
          echo "TUN_MTUS_PASS source=$GITHUB_SHA"
