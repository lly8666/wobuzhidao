name: tmp-v2-m1-iptables-relay

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-v2-m1-iptables-relay.yml

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package iptables test helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables
          ROOT=/tmp/iptroot
          mkdir -p "$ROOT/usr/sbin" "$ROOT/usr/lib/x86_64-linux-gnu"
          cp -a /usr/sbin/iptables* /usr/sbin/xtables* "$ROOT/usr/sbin/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libxtables.so* "$ROOT/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/lib/x86_64-linux-gnu/libnftnl.so* "$ROOT/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/lib/x86_64-linux-gnu/libmnl.so* "$ROOT/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/lib/x86_64-linux-gnu/libip4tc.so* "$ROOT/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libip6tc.so* "$ROOT/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/lib/x86_64-linux-gnu/libnfnetlink.so* "$ROOT/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/lib/x86_64-linux-gnu/xtables "$ROOT/usr/lib/x86_64-linux-gnu/"
          tar -C "$ROOT" -czf /tmp/iptables-helper.tgz .
          sha256sum /tmp/iptables-helper.tgz > /tmp/iptables-helper.sha256
          ldd /usr/sbin/iptables-nft > /tmp/iptables-ldd.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: v2-m1-iptables-helper
          path: |
            /tmp/iptables-helper.tgz
            /tmp/iptables-helper.sha256
            /tmp/iptables-ldd.txt
