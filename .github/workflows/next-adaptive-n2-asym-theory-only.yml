name: next-adaptive-n2-asym-theory-only

on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - "tools/adaptive_n2_asym_reference.py"
      - "tools/test_adaptive_n2_asym_reference.py"
      - "docs/evidence/adaptive-n2-c05-c06-asym-model-freeze-v1.json"
      - ".github/workflows/next-adaptive-n2-asym-theory-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-independent-model-only-no-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact reference SOURCE and no traffic
        shell: bash
        run: |
          set -euo pipefail
          echo "ASYM_MODEL_SOURCE=$(git rev-parse HEAD)"
          git status --porcelain
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          echo "No product binaries, no network/netem, no throughput load"
      - name: Independent IID asymmetric IID analytic model units
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n2_asym_reference.py
          python3 -m unittest discover -s tools -p 'test_adaptive_n2_asym_reference.py' -v
      - name: Freeze theoretical asymmetric independent line residual before performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n2-asym"
          python3 tools/adaptive_n2_asym_reference.py \
            --manifest docs/evidence/adaptive-n2-c05-c06-asym-model-freeze-v1.json \
            --output "$RUNNER_TEMP/n2-asym/asym-frozen-reference.json"
      - name: Output exact model/test provenance only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"n2-asym"
          files=["tools/adaptive_n2_asym_reference.py",
                 "tools/test_adaptive_n2_asym_reference.py",
                 "docs/evidence/adaptive-n2-c05-c06-asym-model-freeze-v1.json"]
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          r={"schema":1,"source_sha":os.environ["GITHUB_SHA"],
             "run_id":os.environ["GITHUB_RUN_ID"],
             "kind":"INDEPENDENT_ASYM_MODEL_ONLY_NOT_PRODUCT_TEST",
             "measured_performance_jobs":0,"N2_pass":False,
             "input_and_helper_sha256":{f:sha(root/f) for f in files},
             "output_sha256":sha(out/"asym-frozen-reference.json")}
          (out/"asym-reference-receipt.json").write_text(
             json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-n2-asym-model-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/n2-asym/asym-frozen-reference.json
            ${{ runner.temp }}/n2-asym/asym-reference-receipt.json
          retention-days: 30
