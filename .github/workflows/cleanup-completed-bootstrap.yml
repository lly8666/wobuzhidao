name: cleanup-completed-bootstrap

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/cleanup-completed-bootstrap.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 1
      - name: Verify permanent product and acceptance files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f cmd/wbd-windows-gui/profile_ui_windows.go
          test -f internal/windowsruntime/controller_idle_soak_test.go
          test -f .github/workflows/windows-idle-wake-soak.yml
          test -f .github/workflows/windows-portable-bundle.yml
          test -f .github/workflows/windows-routing-policy.yml
          test -f .github/workflows/fullstack-mux-mixed-fec.yml
      - name: Remove completed one-shot bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-fec-matrix-hidden-windows.yml \
            .github/workflows/apply-fec-physical-acceptance.yml \
            .github/workflows/apply-fec-weak15.yml \
            .github/workflows/apply-link-keepalive-read-before-probe.yml \
            .github/workflows/apply-native-windows-underlay.yml \
            .github/workflows/apply-server-negotiated-mtu-fix.yml \
            .github/workflows/apply-windows-install-directory.yml \
            .github/workflows/apply-windows-ui-cn.yml \
            tools/apply_fec_matrix_hidden_windows.py \
            tools/apply_fec_physical_acceptance.py \
            tools/apply_fec_weak15.py \
            tools/apply_link_keepalive_read_before_probe.py \
            tools/apply_native_windows_underlay.py \
            tools/apply_windows_install_directory_bundle.py \
            tools/apply_windows_ui_cn.py \
            tools/fix_fec_weak15_contract_tests.py \
            tools/fix_native_windows_underlay_legacy_iphelper.py \
            tools/patch_windows_ui_fec_and_acceptance.py \
            .github/workflows/cleanup-completed-bootstrap.yml
          git diff --check
          git status --short
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove completed bootstrap artifacts'
          git push origin HEAD:agent/fix-per-association-mtu-20260914
