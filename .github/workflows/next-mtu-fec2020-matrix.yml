name: next-mtu-fec2020-matrix
on:
  push:
    branches: ['work/mtu-fec2020-matrix-20261008']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  mtu-functional-matrix:
    name: fec20-${{ matrix.scope }}-${{ matrix.kind }}-o${{ matrix.outer }}-loss${{ matrix.loss }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scope: [kernel, fec-link]
        kind: [tcp, udp, udp-jumbo]
        outer: [1300, 1400]
        loss: [0, 5, 10]
    steps:
      - uses: actions/checkout@v4
      - name: Exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "SCENARIO scope=${{ matrix.scope }} kind=${{ matrix.kind }} outer=${{ matrix.outer }} loss=${{ matrix.loss }}"
      - name: Linux socket fixture dependencies
        if: matrix.scope == 'kernel'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
      - uses: actions/setup-go@v5
        if: matrix.scope == 'link'
        with: { go-version: '1.23.12', cache: false }
      - name: Exactly one isolated functional scenario
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
          KIND: ${{ matrix.kind }}
          OUTER: ${{ matrix.outer }}
          LOSS: ${{ matrix.loss }}
          WBD_FEC2020_MATRIX: '1'
          WBD_MTU_KIND: ${{ matrix.kind }}
          WBD_MTU_OUTER: ${{ matrix.outer }}
          WBD_MTU_LOSS: ${{ matrix.loss }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE" == kernel ]]; then
            sudo --preserve-env=GITHUB_ACTIONS python3 tools/test_mtu_loss_sockets.py \
              --kind "$KIND" --outer "$OUTER" --loss "$LOSS" --fec-parity 20
          else
            go test ./internal/linkdata -run '^TestActionsMTUFEC2020Wire$' -count=1 -v
          fi

  linux-unit-race-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.12', cache: false }
      - name: Verify exact SHA, parameter catalog, unit, race, native and ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/parameter_catalog.py
          go test ./... -count=1
          go test -race ./... -count=1
          go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
  windows-unit-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.12', cache: false }
      - name: Native Windows Go build and unit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "SHA mismatch" }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Owned-only MTU set, rollback, legacy restore
        shell: pwsh
        run: |
          ./tools/test_windows_tun_mtu.ps1
          ./tools/test_windows_splitroute.ps1
          ./tools/test_windows_splitroute.ps1 -DerivedTunnelMTU 1173
          ./tools/test_windows_splitroute.ps1 -DerivedTunnelMTU 1273
  linux-real-tun-mtu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Linux kernel TUN derived MTU values
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
          ns=wbd-auto-record-mtu
          trap 'sudo ip netns del "$ns" >/dev/null 2>&1 || true' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip tuntap add dev wbdmtu mode tun
          for mtu in 576 1173 1273; do
            sudo ip netns exec "$ns" ip link set dev wbdmtu mtu "$mtu" up
            actual=$(sudo ip netns exec "$ns" cat /sys/class/net/wbdmtu/mtu)
            test "$actual" = "$mtu"
          done
          sudo ip netns exec "$ns" ip link del dev wbdmtu
          echo "FEC20_TUN_BOUNDS_PASS sha=$GITHUB_SHA"
