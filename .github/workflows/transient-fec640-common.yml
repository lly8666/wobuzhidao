name: transient-fec640-common
on:
  workflow_call:
    inputs:
      rate_label:
        required: true
        type: string
      rate_bps:
        required: true
        type: string
      spike_loss:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  transient:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact product fix
        uses: actions/checkout@v4
        with:
          ref: bfca8bdc8bc42840607a1a5cc6de18b806e02bb8
          path: product
      - name: Checkout exact diagnostic helper
        uses: actions/checkout@v4
        with:
          ref: cd5a78f7fd34df2d83854fbee7b3cf5e2f09632d
          path: helper
      - name: Checkout suite overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: suite
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - name: Install network and native build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool iproute2 iptables tcpdump unzip gcc make openssl curl
      - name: Run FEC640 transient
        env:
          TEST_RATE_BPS: ${{ inputs.rate_bps }}
          SPIKE_LOSS_PCT: ${{ inputs.spike_loss }}
          PRODUCT_SOURCE_SHA: 'bfca8bdc8bc42840607a1a5cc6de18b806e02bb8'
          HELPER_SOURCE_SHA: 'cd5a78f7fd34df2d83854fbee7b3cf5e2f09632d'
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/suite/.github/scripts/run_transient_profile_300ms_v4_fec640.sh" "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/helper"
      - name: Print CPU and FEC640 summary
        if: always()
        env:
          RATE_LABEL: ${{ inputs.rate_label }}
          SPIKE_LOSS: ${{ inputs.spike_loss }}
        run: |
          AUDIT="$RUNNER_TEMP/transient-${RATE_LABEL}-5-${SPIKE_LOSS}-5-300ms-120s/transient-audit.json"
          if [[ -f "$AUDIT" ]]; then
            python3 - "$AUDIT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("CPU_SUMMARY", json.dumps(d.get("resource") or {}, sort_keys=True))
          print("FEC640_SUMMARY", json.dumps(d.get("fec640") or {}, sort_keys=True))
          print("PENDING4096_SUMMARY", json.dumps(d.get("pending4096") or {}, sort_keys=True))
          PY
          else
            echo "SUMMARY audit missing: $AUDIT"
          fi
      - name: Upload complete transient diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-fec640-${{ inputs.rate_label }}-300ms-5-${{ inputs.spike_loss }}-5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/transient-${{ inputs.rate_label }}-5-${{ inputs.spike_loss }}-5-300ms-120s
            ${{ runner.temp }}/singlelane-transient-${{ inputs.rate_label }}-5to${{ inputs.spike_loss }}to5-300ms-120s
          if-no-files-found: warn
          retention-days: 7
