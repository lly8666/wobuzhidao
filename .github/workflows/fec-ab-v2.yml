name: fec-ab-v2

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: contains(github.event.pull_request.title, '[fecab2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc iproute2 iptables curl unzip openssl
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Restore exact udp2raw and UDPspeeder binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets /tmp/raw /tmp/speeder
          curl -fL 'https://github.com/wangyu-/udp2raw/releases/download/20230206.0/udp2raw_binaries.tar.gz' -o /tmp/udp2raw.tar.gz
          curl -fL 'https://github.com/wangyu-/UDPspeeder/releases/download/20230206.0/speederv2_binaries.tar.gz' -o /tmp/speeder.tar.gz
          echo '503cf5781aa97e50b4954c6bc4622c3ea6be02f6a35def4bb3b3eaf95bd2c7e8  /tmp/udp2raw.tar.gz' | sha256sum -c -
          echo 'b64dd376a948995cb5da17d8eb171338ccd0553b9380e5164f8cb5ac4131bcaa  /tmp/speeder.tar.gz' | sha256sum -c -
          tar -xzf /tmp/udp2raw.tar.gz -C /tmp/raw
          tar -xzf /tmp/speeder.tar.gz -C /tmp/speeder
          cp "$(find /tmp/raw -type f -name udp2raw_amd64 -print -quit)" /tmp/assets/udp2raw_amd64
          cp "$(find /tmp/speeder -type f -name speederv2_amd64 -print -quit)" /tmp/assets/speederv2_amd64
          chmod +x /tmp/assets/udp2raw_amd64 /tmp/assets/speederv2_amd64
          echo 'c81c7699194188172f37f747cdeba9fb54214bc4b3ba2d85cfdfccd5f7f70c3c  /tmp/assets/udp2raw_amd64' | sha256sum -c -
          echo 'f2ac1feedc10003255c1072346b1f3ee4935fc7bf2053af69ad52b7369d4b25a  /tmp/assets/speederv2_amd64' | sha256sum -c -
      - name: Build pinned DTLS 1.3 shim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9529710833/zip" -o /tmp/wolfssl-source.zip
          mkdir -p /tmp/wolf-art /tmp/wolf/src /tmp/wolf/build
          unzip -q /tmp/wolfssl-source.zip -d /tmp/wolf-art
          echo '4a7ff40a32db0d7a262aaea2d2e674da6708250cba908441c737c981fc84f88b  /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz -C /tmp/wolf/src --strip-components=1
          (cd /tmp/wolf/src && ./autogen.sh)
          (cd /tmp/wolf/build && /tmp/wolf/src/configure --enable-dtls13 --disable-shared --enable-static)
          make -C /tmp/wolf/build -j2 src/libwolfssl.la
          gcc -O2 -Wall -Wextra -Werror -I/tmp/wolf/build -I/tmp/wolf/src \
            native/dtls/wbd_dtls_shim.c /tmp/wolf/build/src/.libs/libwolfssl.a -lm -o /tmp/assets/wbd_dtls_shim
      - name: Build WBD FEC and probes
        run: |
          set -euo pipefail
          go test ./internal/fec -count=1
          go build -trimpath -o /tmp/assets/wbd-fec-proxy ./cmd/wbd-fec-proxy
          gcc -O2 -Wall -Wextra -Werror -pthread scripts/udp_rate_probe.c -lm -o /tmp/assets/udp_rate_probe
          gcc -O2 -Wall -Wextra -Werror scripts/udp_oneway_probe.c -lm -o /tmp/assets/udp_oneway_probe
          chmod +x /tmp/assets/*
      - name: Create test certificates
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets/certs
          cat >/tmp/assets/certs/server.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:wbd.test
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 7 -subj '/CN=WBD FEC AB Root CA' \
            -keyout /tmp/assets/certs/ca.key -out /tmp/assets/certs/ca.pem >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -sha256 -subj '/CN=wbd.test' \
            -keyout /tmp/assets/certs/server.key -out /tmp/assets/certs/server.csr >/dev/null 2>&1
          openssl x509 -req -in /tmp/assets/certs/server.csr -CA /tmp/assets/certs/ca.pem -CAkey /tmp/assets/certs/ca.key \
            -CAcreateserial -days 7 -sha256 -extfile /tmp/assets/certs/server.ext -out /tmp/assets/certs/server.pem >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: fec-ab-v2-assets
          path: /tmp/assets
          retention-days: 7

  bench:
    if: contains(github.event.pull_request.title, '[fecab2]')
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rtt: [20, 100, 300, 600]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables
      - uses: actions/download-artifact@v4
        with:
          name: fec-ab-v2-assets
          path: /tmp/assets
      - name: Restore executable modes
        run: chmod +x /tmp/assets/udp2raw_amd64 /tmp/assets/speederv2_amd64 /tmp/assets/wbd_dtls_shim /tmp/assets/wbd-fec-proxy /tmp/assets/udp_rate_probe /tmp/assets/udp_oneway_probe
      - name: Run corrected one-way FEC A/B
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fec-ab-v2-rtt${{ matrix.rtt }}"
          sudo python3 scripts/bench_wbd_fec_ab_runner.py \
            --udp2raw /tmp/assets/udp2raw_amd64 \
            --speeder /tmp/assets/speederv2_amd64 \
            --wbd-fec /tmp/assets/wbd-fec-proxy \
            --shim /tmp/assets/wbd_dtls_shim \
            --cert-dir /tmp/assets/certs \
            --latency-probe /tmp/assets/udp_rate_probe \
            --oneway-probe /tmp/assets/udp_oneway_probe \
            --out "$OUT" --rtt ${{ matrix.rtt }} --losses 0,1,5,10,20 \
            --link-mbps 200 --inner-mbps 75 --duration 2 --packet-size 1200 --seed 260825
          sudo chown -R "$USER:$USER" "$OUT"
          cat "$OUT/results.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fec-ab-v2-rtt-${{ matrix.rtt }}
          path: ${{ runner.temp }}/fec-ab-v2-rtt${{ matrix.rtt }}
          retention-days: 14

  aggregate:
    if: contains(github.event.pull_request.title, '[fecab2]')
    needs: bench
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fec-ab-v2-rtt-*
          path: /tmp/all
      - name: Aggregate paired deltas
        run: |
          python3 - <<'PY'
          import csv, glob, json
          rows=[]
          for p in glob.glob('/tmp/all/**/results.csv', recursive=True):
              rows += list(csv.DictReader(open(p)))
          def num(r,k):
              try: return float(r[k])
              except (KeyError,ValueError,TypeError): return None
          pairs={}
          for r in rows:
              pairs.setdefault((int(r['rtt_ms']),float(r['loss_pct_per_direction'])),{})[r['mode']]=r
          out=[]
          print('RTT,loss,speeder_delivery,wbd_delivery,delta_pp,speeder_Mbps,wbd_Mbps,delta_Mbps,speeder_lat_p99,wbd_lat_p99,delta_lat_ms,fec_RSS_reduction_pct,total_RSS_reduction_pct,fec_CPU_reduction_pct,total_CPU_reduction_pct')
          for key in sorted(pairs):
              p=pairs[key]; s=p.get('speeder'); w=p.get('wbd')
              if not s or not w: continue
              sd,wd=num(s,'bulk_delivery_ratio'),num(w,'bulk_delivery_ratio')
              sg,wg=num(s,'bulk_delivered_mbps'),num(w,'bulk_delivered_mbps')
              sl,wl=num(s,'latency_p99_ms'),num(w,'latency_p99_ms')
              sfr,wfr=num(s,'fec_rss_peak_kb'),num(w,'fec_rss_peak_kb')
              strr,wtrr=num(s,'total_rss_peak_kb'),num(w,'total_rss_peak_kb')
              sfc,wfc=num(s,'fec_cpu_ms'),num(w,'fec_cpu_ms')
              stc,wtc=num(s,'total_cpu_ms'),num(w,'total_cpu_ms')
              def reduction(a,b): return ((a-b)/a*100.0) if a not in (None,0) and b is not None else None
              d={
                  'rtt_ms':key[0],'loss_pct_per_direction':key[1],
                  'speeder_established':s.get('established'),'wbd_established':w.get('established'),
                  'speeder_failure':s.get('failure',''),'wbd_failure':w.get('failure',''),
                  'speeder_delivery':sd,'wbd_delivery':wd,'delivery_delta_pp':(wd-sd)*100 if sd is not None and wd is not None else None,
                  'speeder_mbps':sg,'wbd_mbps':wg,'goodput_delta_mbps':wg-sg if sg is not None and wg is not None else None,
                  'speeder_latency_p99_ms':sl,'wbd_latency_p99_ms':wl,'latency_p99_delta_ms':wl-sl if sl is not None and wl is not None else None,
                  'fec_rss_reduction_pct':reduction(sfr,wfr),'total_rss_reduction_pct':reduction(strr,wtrr),
                  'fec_cpu_reduction_pct':reduction(sfc,wfc),'total_cpu_reduction_pct':reduction(stc,wtc),
                  'speeder_fec_rss_kb':sfr,'wbd_fec_rss_kb':wfr,'speeder_total_rss_kb':strr,'wbd_total_rss_kb':wtrr,
                  'speeder_fec_cpu_ms':sfc,'wbd_fec_cpu_ms':wfc,'speeder_total_cpu_ms':stc,'wbd_total_cpu_ms':wtc,
              }
              out.append(d)
              def f(x): return '' if x is None else f'{x:.3f}'
              print(','.join([str(key[0]),str(key[1]),f(sd),f(wd),f(d['delivery_delta_pp']),f(sg),f(wg),f(d['goodput_delta_mbps']),f(sl),f(wl),f(d['latency_p99_delta_ms']),f(d['fec_rss_reduction_pct']),f(d['total_rss_reduction_pct']),f(d['fec_cpu_reduction_pct']),f(d['total_cpu_reduction_pct'])]))
              print('FEC_AB_DELTA '+json.dumps(d,sort_keys=True))
          if len(out)!=20: raise SystemExit(f'expected 20 paired points, got {len(out)}')
          bad=[d for d in out if d['speeder_failure'] or d['wbd_failure']]
          if bad: raise SystemExit('paired case failures: '+json.dumps(bad,sort_keys=True))
          open('/tmp/fec-ab-v2-summary.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fec-ab-v2-summary
          path: /tmp/fec-ab-v2-summary.json
          retention-days: 30
