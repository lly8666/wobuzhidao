name: next-longmix-preflight
on:
  push:
    branches: [investigation/longmix-20261008]
    paths:
      - "tools/longmix_profile.py"
      - "tools/test_longmix_profile.py"
      - "tools/longmix_udp_business.py"
      - "tools/longmix_tcp_business.py"
      - "tools/test_longmix_tcp_business.py"
      - "tools/test_longmix_udp_business.py"
      - "tools/longmix_constant_stage.py"
      - "tools/prepare_longmix_udp.py"
      - "tools/test_prepare_longmix_udp.py"
      - "tools/check_longmix_udp_compact.py"
      - "tools/test_check_longmix_udp.py"
      - ".github/workflows/next-longmix-udp-sample.yml"
      - "tools/check_performance_workflow_policy.py"
      - ".github/workflows/next-strict-weaknet.yml"
      - ".github/workflows/next-longmix-one-sample-dispatch.yml"
      - "tools/test_longmix_strict_workflow.py"
      - ".github/workflows/next-longmix-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-static-and-kernel-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository and existing one-sample workflow policy
        run: |
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
      - name: Validate 12-sample immutable plan and fair-by-byte pacing
        run: |
          python3 tools/test_longmix_profile.py
          python3 tools/test_longmix_udp_business.py
          python3 tools/test_longmix_tcp_business.py
          python3 tools/test_prepare_longmix_udp.py
          python3 tools/test_check_longmix_udp.py
          python3 tools/test_longmix_strict_workflow.py
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from longmix_profile import sample_matrix
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/longmix-precheck-input.json").write_text(json.dumps(sample_matrix()[0]))
          PY
          python3 tools/prepare_longmix_udp.py --sample artifacts/longmix-precheck-input.json --artifact-dir artifacts/longmix-precheck
          bash -n artifacts/longmix-precheck/generated-longmix-udp-a.sh
      - name: Kernel IPv4 fragment / EMSGSIZE functional boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
          sudo modprobe tun || true
          sudo --preserve-env=GITHUB_ACTIONS python3 tools/test_inner_mtu9000_fragment_kernel.py
      - name: Important qualification limit
        run: |
          echo "PRECHECK_ONLY: No formal client/server business processes exercised"
          echo "A/B/C 300s fullstack samples remain NOT_RUN"
