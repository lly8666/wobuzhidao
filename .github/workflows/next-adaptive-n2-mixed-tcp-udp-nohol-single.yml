name: next-adaptive-n2-mixed-tcp-udp-nohol-single
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-mixed-tcp-udp-nohol-single.yml"
      - "tools/adaptive_n2_mixed_nohol_realpath.py"
      - "tools/adaptive_n2_mixed_nohol_business.py"
      - "tools/test_adaptive_n2_mixed_nohol.py"
permissions:
  contents: read
concurrency:
  group: adaptive-n2-mixed-tcp-udp-nohol-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-source-mixed-tcp-udp-10ms-nohol-120s:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact one SOURCE and one functional sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n2-mixed-tcp-udp-nohol
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "adaptive-n2:MIXED_NOHOL:auto-initial20-min4:mixed_tcp_udp_10ms:loss1pct:300ms:10mbps_each:120s:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/adaptive-n2-mixed-tcp-udp-nohol/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n2-mixed-tcp-udp-nohol/runner-cpu-scope.json
          {
            cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true
          } > artifacts/adaptive-n2-mixed-tcp-udp-nohol/runner-preflight.txt
      - name: Exact SOURCE N2 M1 Go unit/race before any live measurement
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/adaptivefec
          go test -race -count=1 ./internal/adaptivefec ./internal/datapath ./internal/runtimeowner ./internal/linkdata
      - name: Frozen single true TCP/UDP mixed fast-10ms realpath preflight (no traffic)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n2_mixed_nohol_realpath.py tools/adaptive_n2_mixed_nohol_business.py
          python3 -m unittest discover -s tools -p 'test_adaptive_n2_mixed_nohol.py' -v
      - name: Install five-netns kernel prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build exact current SOURCE binaries
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n2-mixed-tcp-udp-nohol
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 tools/adaptive_n2_mixed_nohol_realpath.py prepare \
            --root . --script "$ART/n2-mixed-nohol-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n2-mixed-nohol-derived.sh"
          grep -q 'strict_resource_sampler.py' "$ART/n2-mixed-nohol-derived.sh"
          grep -q 'resource-samples.jsonl' "$ART/n2-mixed-nohol-derived.sh"
      - name: One SOURCE single 120s mixed Linux TCP+UDP, four long plus short TCP streams and independent 10ms UDP at 1pct each-way
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n2-mixed-tcp-udp-nohol
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n2-mixed-tcp-udp-nohol/n2-mixed-nohol-derived.sh
      - name: Independent protected Normal auto and first-unique delivery check
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_mixed_nohol_realpath.py verify \
            --artifact-dir artifacts/adaptive-n2-mixed-tcp-udp-nohol \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-mixed-tcp-udp-nohol/summary.json
      - name: Report fail and preserve small evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n2-mixed-tcp-udp-nohol/summary.json || true
          tail -n 50 artifacts/adaptive-n2-mixed-tcp-udp-nohol/client.log || true
          tail -n 50 artifacts/adaptive-n2-mixed-tcp-udp-nohol/server.log || true
          echo "SOURCE_SHA=$GITHUB_SHA; N2 mixed true TCP+UDP/10ms first arrivals 120s 1pct 300ms each-way, Normal auto, one scenario, not full N2 or native Windows TUN qualification" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only owned raw PCAP after bounded analyzer, including failure cases
        if: always()
        run: |
          find artifacts/adaptive-n2-mixed-tcp-udp-nohol -maxdepth 1 -type f -name '*.pcap' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n2-mixed-tcp-udp-nohol-${{ github.sha }}
          path: |
            artifacts/adaptive-n2-mixed-tcp-udp-nohol/
            !artifacts/adaptive-n2-mixed-tcp-udp-nohol/*.pcap
            !artifacts/adaptive-n2-mixed-tcp-udp-nohol/wbd-client
            !artifacts/adaptive-n2-mixed-tcp-udp-nohol/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce functional result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
