name: apply-fec-physical-acceptance

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/apply-fec-physical-acceptance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 0
      - name: Apply physical FEC acceptance changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/apply_fec_physical_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/windows_linux_wintun_lane_soak.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; throw 'PowerShell parse failed' }
          Select-String -LiteralPath scripts/windows_linux_wintun_lane_soak.ps1 -SimpleMatch "ValidateSet('off','20:4','20:8','20:10','20:12','20:16','20:20')" | Out-Null
          Select-String -LiteralPath scripts/windows_linux_wintun_lane_soak.ps1 -SimpleMatch 'WBD_FEC_NEGOTIATION_BIDIRECTIONAL_PASS' | Out-Null
          Write-Output 'WBD_FEC_PHYSICAL_PATCH_PARSE_PASS'
      - name: Commit physical FEC acceptance changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/windows_linux_wintun_lane_soak.ps1
          if (git diff --cached --quiet) { Write-Output 'script already patched'; exit 0 }
          git commit -m 'test: generalize Windows physical FEC acceptance'
          git pull --rebase origin agent/fix-per-association-mtu-20260914
          git push origin HEAD:agent/fix-per-association-mtu-20260914
