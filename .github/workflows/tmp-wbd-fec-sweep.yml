name: tmp-wbd-fec-sweep

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-wbd-fec-sweep.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run 20:10 and 20:20 FEC sweep
        run: |
          set -euo pipefail
          mkdir -p /tmp/fec
          go run ./cmd/wbd-fec-sweep > /tmp/fec/results.csv
          python3 - <<'PY'
          import csv, statistics
          rows=list(csv.DictReader(open('/tmp/fec/results.csv')))
          groups={}
          for r in rows: groups.setdefault((r['fec'],int(r['loss_pct'])),[]).append(r)
          fields=['mean_ms','p50_ms','p95_ms','p99_ms','late_ratio','delivery_ratio','traffic_x']
          with open('/tmp/fec/median.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['fec','loss_pct']+fields)
              for key in sorted(groups,key=lambda x:(x[0],x[1])):
                  rs=groups[key]
                  vals=[statistics.median(float(r[x]) for r in rs) for x in fields]
                  w.writerow([key[0],key[1]]+vals)
          print(open('/tmp/fec/median.csv').read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wbd-fec-sweep
          path: /tmp/fec/*.csv
