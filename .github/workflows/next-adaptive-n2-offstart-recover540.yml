name: next-adaptive-n2-offstart-recover540
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-offstart-recover540.yml"
      - "tools/adaptive_n2_offstart_recover540.py"
      - "tools/adaptive_n2_recover540_stage.py"
permissions:
  contents: read
concurrency:
  group: adaptive-n2-offstart-recover540-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-v3-normal-auto-offstart-10mbps-300ms-losswave540-extended-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact one SOURCE and one functional sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n2-offstart-recover540
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "adaptive-n2:auto-min0-initial0:wave-0152050-extended-recover:300ms:10mbps_each:540s:netem-seed-unapplied601:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/adaptive-n2-offstart-recover540/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n2-offstart-recover540/runner-cpu-scope.json
          {
            cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true
          } > artifacts/adaptive-n2-offstart-recover540/runner-preflight.txt
      - name: Install five-netns kernel prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build exact current SOURCE binaries
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n2-offstart-recover540
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 -m py_compile tools/adaptive_n2_offstart_recover540.py tools/adaptive_n2_recover540_stage.py
          python3 tools/adaptive_n2_offstart_recover540.py prepare \
            --root . --script "$ART/n2-offstart-recover540-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n2-offstart-recover540-derived.sh"
      - name: One protected Normal off-start auto 10Mbps each-way 300ms 540s six-phase netem waveform (final clean 240s)
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n2-offstart-recover540
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n2-offstart-recover540/n2-offstart-recover540-derived.sh
      - name: Independent protected Normal auto and first-unique delivery check
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_offstart_recover540.py check \
            --artifact-dir artifacts/adaptive-n2-offstart-recover540 \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-offstart-recover540/summary.json
      - name: Report fail and preserve small evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n2-offstart-recover540/summary.json || true
          tail -n 50 artifacts/adaptive-n2-offstart-recover540/client.log || true
          tail -n 50 artifacts/adaptive-n2-offstart-recover540/server.log || true
          echo "SOURCE_SHA=$GITHUB_SHA; N2 V3 Normal off-start 300ms six-phase actual loss wave: inspect summary classification; tc netem RNG seed unsupported on this runner and not applied, actual drop counters mandatory; NEVER infer full N2 PASS; Windows TUN/CPU OFF/other modes NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n2-offstart-recover540-540s-${{ github.sha }}
          path: |
            artifacts/adaptive-n2-offstart-recover540/
            !artifacts/adaptive-n2-offstart-recover540/*.pcap
            !artifacts/adaptive-n2-offstart-recover540/wbd-client
            !artifacts/adaptive-n2-offstart-recover540/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce functional result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
