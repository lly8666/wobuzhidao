name: faketcp-pcap-20loss

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pcap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install packet tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables tcpdump
      - name: Build and unit-test native FakeTCP
        run: |
          go test ./internal/faketcp -count=1
          go build -trimpath -o /tmp/wbd-faketcp ./cmd/wbd-faketcp
          python3 -m py_compile scripts/analyze_faketcp_pcap.py scripts/faketcp_first_arrival_probe.py
      - name: Capture 20 percent loss wire behavior
        run: |
          set -euo pipefail
          C=wbdpcapc$$
          R=wbdpcapr$$
          S=wbdpcaps$$
          cleanup() {
            set +e
            [[ -n "${CPID:-}" ]] && sudo kill -TERM "$CPID" 2>/dev/null
            [[ -n "${SPID:-}" ]] && sudo kill -TERM "$SPID" 2>/dev/null
            [[ -n "${RPID:-}" ]] && sudo kill -TERM "$RPID" 2>/dev/null
            [[ -n "${TPID:-}" ]] && sudo kill -INT "$TPID" 2>/dev/null
            [[ -n "${TSPID:-}" ]] && sudo kill -INT "$TSPID" 2>/dev/null
            sleep .2
            sudo ip netns del "$C" 2>/dev/null
            sudo ip netns del "$R" 2>/dev/null
            sudo ip netns del "$S" 2>/dev/null
          }
          wait_capture_ready() {
            local pid="$1"
            local log="$2"
            local label="$3"
            for _ in $(seq 1 100); do
              if grep -q 'listening on ' "$log" 2>/dev/null; then
                kill -0 "$pid" 2>/dev/null || {
                  echo "$label tcpdump exited after reporting readiness" >&2
                  cat "$log" >&2 || true
                  return 1
                }
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$label tcpdump exited before readiness" >&2
                cat "$log" >&2 || true
                return 1
              fi
              sleep .05
            done
            echo "$label tcpdump readiness timeout" >&2
            cat "$log" >&2 || true
            return 1
          }
          trap cleanup EXIT

          # Three namespaces put the impairment in a forwarding namespace. The
          # client capture point is therefore BEFORE client->server netem loss,
          # so every original send and retransmission is observable in pcap.
          sudo ip netns add "$C"
          sudo ip netns add "$R"
          sudo ip netns add "$S"
          sudo ip link add c0 type veth peer name r0
          sudo ip link add r1 type veth peer name s0
          sudo ip link set c0 netns "$C"
          sudo ip link set r0 netns "$R"
          sudo ip link set r1 netns "$R"
          sudo ip link set s0 netns "$S"
          sudo ip -n "$C" addr add 10.84.0.1/24 dev c0
          sudo ip -n "$R" addr add 10.84.0.254/24 dev r0
          sudo ip -n "$R" addr add 10.84.1.254/24 dev r1
          sudo ip -n "$S" addr add 10.84.1.2/24 dev s0
          for N in "$C" "$R" "$S"; do sudo ip -n "$N" link set lo up; done
          sudo ip -n "$C" link set c0 up
          sudo ip -n "$R" link set r0 up
          sudo ip -n "$R" link set r1 up
          sudo ip -n "$S" link set s0 up
          sudo ip -n "$C" route add 10.84.1.0/24 via 10.84.0.254
          sudo ip -n "$S" route add 10.84.0.0/24 via 10.84.1.254
          sudo ip netns exec "$R" sysctl -qw net.ipv4.ip_forward=1
          sudo ip netns exec "$C" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          sudo ip netns exec "$S" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP

          # 20ms RTT comes from 10ms on each router egress. Start without loss
          # for deterministic handshake capture; stage 20% random loss for data.
          sudo ip netns exec "$R" tc qdisc add dev r1 root netem limit 50000 delay 10ms rate 200mbit
          sudo ip netns exec "$R" tc qdisc add dev r0 root netem limit 50000 delay 10ms rate 200mbit

          sudo ip netns exec "$C" tcpdump -i c0 -s 0 -U -w /tmp/faketcp20-client.pcap \
            'tcp and (port 54003 or port 54010)' >/tmp/tcpdump-client.log 2>&1 & TPID=$!
          sudo ip netns exec "$S" tcpdump -i s0 -s 0 -U -w /tmp/faketcp20-server.pcap \
            'tcp and (port 54003 or port 54010)' >/tmp/tcpdump-server.log 2>&1 & TSPID=$!
          # Do not start the WBD handshake until both packet capture processes
          # have actually opened their interfaces. A blind sleep made the wire
          # evidence flaky: data could be captured while the initial SYN was
          # missed, causing the strict analyzer to report that the three-way
          # handshake was not visible.
          wait_capture_ready "$TPID" /tmp/tcpdump-client.log client
          wait_capture_ready "$TSPID" /tmp/tcpdump-server.log server

          sudo ip netns exec "$S" python3 "$GITHUB_WORKSPACE/scripts/faketcp_first_arrival_probe.py" \
            server --bind 127.0.0.1:54000 --expect 800 --window 6.0 --out /tmp/first20.json \
            >/tmp/first20-server.log 2>&1 & RPID=$!
          sudo ip netns exec "$S" /tmp/wbd-faketcp server \
            --listen 10.84.1.2:54003 --target-udp 127.0.0.1:54000 >/tmp/faketcp20-server.log 2>&1 & SPID=$!
          sleep .15
          sudo ip netns exec "$C" /tmp/wbd-faketcp client \
            --local-udp 127.0.0.1:54004 --source 10.84.0.1:54010 --remote 10.84.1.2:54003 \
            >/tmp/faketcp20-client.log 2>&1 & CPID=$!
          for i in $(seq 1 300); do
            grep -q 'READY role=client' /tmp/faketcp20-client.log && grep -q 'READY role=server' /tmp/faketcp20-server.log && break
            sleep .05
          done
          grep -q 'READY role=client' /tmp/faketcp20-client.log
          grep -q 'READY role=server' /tmp/faketcp20-server.log

          sudo ip netns exec "$R" tc qdisc replace dev r1 root netem limit 50000 delay 10ms loss random 20% rate 200mbit
          sudo ip netns exec "$R" tc qdisc replace dev r0 root netem limit 50000 delay 10ms loss random 20% rate 200mbit
          sudo ip netns exec "$C" python3 "$GITHUB_WORKSPACE/scripts/faketcp_first_arrival_probe.py" \
            client --dest 127.0.0.1:54004 --count 800 --size 1200 --interval-ms 1
          wait "$RPID" || true
          RPID=
          # Keep shadow TCP alive after the latency observation window so RTO
          # behavior is visible. It is deliberately not part of latency scoring.
          sleep 2

          sudo kill -TERM "$CPID" "$SPID" 2>/dev/null || true
          wait "$CPID" || true
          wait "$SPID" || true
          CPID= SPID=
          sudo kill -INT "$TPID" "$TSPID" 2>/dev/null || true
          wait "$TPID" || true
          wait "$TSPID" || true
          TPID= TSPID=

          cat /tmp/first20-server.log
          cat /tmp/faketcp20-client.log
          cat /tmp/faketcp20-server.log
          cat /tmp/tcpdump-client.log
          cat /tmp/tcpdump-server.log
          python3 scripts/analyze_faketcp_pcap.py /tmp/faketcp20-client.pcap \
            --client-port 54010 --server-port 54003 --out /tmp/faketcp20-analysis.json
          python3 - <<'PY'
          import json,re
          first=json.load(open('/tmp/first20.json'))
          wire=json.load(open('/tmp/faketcp20-analysis.json'))
          logs=open('/tmp/faketcp20-client.log').read()+open('/tmp/faketcp20-server.log').read()
          stats=[json.loads(x) for x in re.findall(r'WBD_FAKETCP_STATS (\{.*\})',logs)]
          assert stats, logs
          fast=sum(x['sender']['FastRetransmits'] for x in stats)
          rto=sum(x['sender']['RTOTransmits'] for x in stats)
          sacks=sum(x['sender']['SACKed'] for x in stats)
          print('FIRST20_FINAL',json.dumps(first,sort_keys=True))
          print('WIRE20_FINAL',json.dumps(wire,sort_keys=True))
          print('ARQ20_FINAL',json.dumps({'fast':fast,'rto':rto,'sacked':sacks,'stats':stats},sort_keys=True))
          # Inner performance is primary. 20% loss must not push successfully
          # surviving first transmissions behind the TCP sequence hole.
          assert first['p50_ms'] <= 12.0, first
          assert first['p75_ms'] <= 15.0, first
          # Wire-visible TCP-like behavior, independent of WBD counters.
          assert wire['data_first_transmissions'] == 800, wire
          assert wire['duplicate_acks'] >= 3, wire
          assert wire['sack_ack_packets'] > 0, wire
          assert wire['retransmission_events'] > 0, wire
          assert wire['fast_retransmit_evidence'] > 0, wire
          assert wire['rto_scale_retransmit_evidence'] > 0, wire
          assert fast > 0 and rto > 0 and sacks > 0, (fast,rto,sacks)
          PY
      - name: Upload packet capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faketcp-pcap-20loss
          path: |
            /tmp/faketcp20-client.pcap
            /tmp/faketcp20-server.pcap
            /tmp/faketcp20-analysis.json
            /tmp/first20.json
            /tmp/faketcp20-client.log
            /tmp/faketcp20-server.log
          if-no-files-found: warn
