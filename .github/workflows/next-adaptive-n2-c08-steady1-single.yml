name: next-adaptive-n2-c08-steady1-single
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-c08-steady1-single.yml"
      - "tools/adaptive_n2_c08_steady1.py"
permissions:
  contents: read
concurrency:
  group: adaptive-n2-c08-steady1-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-source-c08-steady1pct-realpath-normal-auto-240s:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact one SOURCE and one functional sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n2-c08-steady1
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "adaptive-n2:C08:auto-initial20-min4:steady1pct:300ms:10mbps_each:240s:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/adaptive-n2-c08-steady1/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n2-c08-steady1/runner-cpu-scope.json
          {
            cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true
          } > artifacts/adaptive-n2-c08-steady1/runner-preflight.txt
      - name: Exact SOURCE N2 M1 Go unit/race before any live measurement
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/adaptivefec
          go test -race -count=1 ./internal/adaptivefec ./internal/datapath ./internal/runtimeowner ./internal/linkdata
      - name: Install five-netns kernel prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build exact current SOURCE binaries
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n2-c08-steady1
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 tools/adaptive_n2_c08_steady1.py prepare \
            --root . --script "$ART/n2-c08-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n2-c08-derived.sh"
      - name: One exact SOURCE C08 steady1pct 240s 300ms one-way Normal auto 10Mbps each, actively evaluate frozen last60 grades
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n2-c08-steady1
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n2-c08-steady1/n2-c08-derived.sh
      - name: Independent protected Normal auto and first-unique delivery check
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_c08_steady1.py check \
            --artifact-dir artifacts/adaptive-n2-c08-steady1 \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-c08-steady1/summary.json
      - name: Report fail and preserve small evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n2-c08-steady1/summary.json || true
          tail -n 50 artifacts/adaptive-n2-c08-steady1/client.log || true
          tail -n 50 artifacts/adaptive-n2-c08-steady1/server.log || true
          echo "SOURCE_SHA=$GITHUB_SHA; N2 C08 V3 Normal auto steady 1% 240s diagnostics ON; one scenario only; overall adaptive/wire/CPU OFF/p99/physical NOT QUALIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only owned raw PCAP after bounded analyzer, including failure cases
        if: always()
        run: |
          find artifacts/adaptive-n2-c08-steady1 -maxdepth 1 -type f -name '*.pcap' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n2-c08-steady1-${{ github.sha }}
          path: |
            artifacts/adaptive-n2-c08-steady1/
            !artifacts/adaptive-n2-c08-steady1/*.pcap
            !artifacts/adaptive-n2-c08-steady1/wbd-client
            !artifacts/adaptive-n2-c08-steady1/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce functional result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
