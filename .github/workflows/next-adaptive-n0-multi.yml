name: next-adaptive-n0-multi
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n0-multi.yml"
      - "tools/adaptive_n0_multi_realpath.py"
      - "tools/adaptive_n0_multi_check.py"
      - "internal/datapath/quality_health_live.go"
      - "internal/datapath/quality_feedback_v3.go"
      - "internal/datapath/quality_health_v3.go"
      - "internal/datapath/lane.go"
      - "internal/datapath/quality_pn_window.go"
      - "internal/datapath/quality_pair_range.go"
      - "internal/datapath/quality_echo_v4.go"
      - "internal/datapath/quality_echo_v4_test.go"
      - "internal/datapath/quality_health_echo_live.go"
      - "internal/datapath/control_health_padding.go"
      - "internal/tlsrecord/record.go"
      - "internal/tlsrecord/control_padding_test.go"
      - "internal/datapath/quality_pn_window_test.go"
      - "internal/tlsrecord/decoder.go"
      - "internal/runtimeowner/quality.go"
      - "internal/runtimeowner/quality_window.go"
      - "internal/runtimeowner/quality_pair.go"
      - "internal/runtimeowner/quality_echo_live.go"
      - "internal/runtimeowner/control_policy.go"
      - "internal/runtimeowner/control_policy_test.go"
      - "internal/runtimeowner/health_test.go"
      - "internal/runtimeowner/quality_echo_live_test.go"
      - "internal/runtimeowner/quality_pair_test.go"
      - "internal/runtimeowner/quality_window_test.go"
      - "internal/runtimeowner/send_batch.go"
      - "internal/runtimeowner/health.go"
      - "internal/runtimeowner/runtime.go"
      - "internal/runtimeentry/lifecycle.go"
permissions:
  contents: read
concurrency:
  group: adaptive-n0-three-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  three-isolated-native-clients-one-server-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One exact SOURCE, one bounded multi-client functional scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n0-multi
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "N0:3-native:distinct-V3:one-shared-server:lossless300ms:$GITHUB_SHA" \
            --receipt artifacts/adaptive-n0-multi/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n0-multi/runner-cpu-scope.json
          { cat /proc/pressure/cpu 2>/dev/null || true; cat /sys/fs/cgroup/cpu.max 2>/dev/null || true; cat /proc/loadavg || true; } > artifacts/adaptive-n0-multi/runner-preflight.txt
      - name: Install real Linux kernel path prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build exact product source and fail-closed derived 9-namespace script
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n0-multi
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 tools/adaptive_n0_multi_realpath.py --root . --script "$ART/n0-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n0-derived.sh"
      - name: One true three-client bidirectional AF_PACKET TPROXY shared-TUN sample
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n0-multi
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n0-multi/n0-derived.sh
      - name: Independent admission/lease/profile/suite/first-delivery analysis
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n0_multi_check.py \
            --artifact-dir artifacts/adaptive-n0-multi --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n0-multi/summary.json
      - name: Preserve bounded failure evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n0-multi/summary.json || true
          tail -n 45 artifacts/adaptive-n0-multi/server.log || true
          for i in 2 3; do tail -n 35 "artifacts/adaptive-n0-multi/client$i.log" || true; done
          echo "SOURCE=$GITHUB_SHA; 3 native Linux clients; functional not perf; Windows Wintun/AES/auto/P6/physical NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n0-three-native-${{ github.sha }}
          path: |
            artifacts/adaptive-n0-multi/
            !artifacts/adaptive-n0-multi/*.pcap
            !artifacts/adaptive-n0-multi/wbd-client
            !artifacts/adaptive-n0-multi/wbd-server
          retention-days: 30
      - name: Enforce independent sample and validation result
        if: always()
        env:
          SAMPLE_RESULT: ${{ steps.sample.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          test "$SAMPLE_RESULT" = success
          test "$VERIFY_RESULT" = success
