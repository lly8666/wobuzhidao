name: next-adaptive-n2-c10-ge-ctmc-time-single
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-c10-ge-ctmc-time-single.yml"
      - "tools/adaptive_n2_c10_ge_realpath.py"
      - "tools/adaptive_n2_ge_eventmap.c"
      - "tools/adaptive_n2_ge_eventmap.py"
      - "tools/test_adaptive_n2_c10_ge_realpath.py"
      - "docs/evidence/adaptive-n2-c10-ctmc-event-trace-freeze-v1.json"
permissions:
  contents: read
concurrency:
  group: adaptive-n2-c10-ge-ctmc-time-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-source-c10-real-240s-time-driven-gilbert-elliott-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact one SOURCE and one functional sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n2-c10-ge-ctmc-time
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "adaptive-n2:C10:GE-real-450ms-50ms-bad50pct:seed2026101210:auto-initial20-min4:300ms:10mbps_each:240s:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/adaptive-n2-c10-ge-ctmc-time/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n2-c10-ge-ctmc-time/runner-cpu-scope.json
          {
            cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true
          } > artifacts/adaptive-n2-c10-ge-ctmc-time/runner-preflight.txt
      - name: Exact SOURCE N2 M1 Go unit/race before any live measurement
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/adaptivefec
          go test -race -count=1 ./internal/adaptivefec ./internal/datapath ./internal/runtimeowner ./internal/linkdata
      - name: C10 frozen 900-boundary CTMC truth-independent model and formal-script preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n2_ge_eventmap.py tools/adaptive_n2_c10_ge_realpath.py
          python3 -m unittest discover -s tools -p 'test_adaptive_n2_ge_reference.py' -v
          python3 -m unittest discover -s tools -p 'test_adaptive_n2_c10_ge_realpath.py' -v
          python3 tools/adaptive_n2_ge_eventmap.py unit
          mkdir -p artifacts/adaptive-n2-c10-ge-ctmc-time
          python3 tools/adaptive_n2_ge_eventmap.py freeze \
            --output artifacts/adaptive-n2-c10-ge-ctmc-time/ge-frozen-trace.json
          python3 tools/adaptive_n2_ge_reference.py \
            --manifest docs/evidence/adaptive-n2-ge-ctmc-freeze-v1.json \
            --output artifacts/adaptive-n2-c10-ge-ctmc-time/ge-independent-mds-reference.json
      - name: Install five-netns kernel prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl clang llvm libbpf-dev
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build exact current SOURCE binaries
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n2-c10-ge-ctmc-time
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          clang -O2 -g -target bpf -I "/usr/include/$(uname -m)-linux-gnu" \
            -c tools/adaptive_n2_ge_eventmap.c -o "$ART/ge-eventmap.o"
          llvm-objdump -h "$ART/ge-eventmap.o" > "$ART/ge-eventmap-elf.txt"
          grep 'classifier' "$ART/ge-eventmap-elf.txt"
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 tools/adaptive_n2_c10_ge_realpath.py prepare \
            --root . --script "$ART/n2-c10-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n2-c10-derived.sh"
          grep -q 'strict_resource_sampler.py' "$ART/n2-c10-derived.sh"
          grep -q 'resource-samples.jsonl' "$ART/n2-c10-derived.sh"
      - name: One exact SOURCE C10 time-driven frozen 900-event 240s GE one-source protected Normal auto 10Mbps each 300ms one-way
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n2-c10-ge-ctmc-time
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n2-c10-ge-ctmc-time/n2-c10-derived.sh
      - name: Independent true time-driven GE map/drop and protected first-unique delivery check
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_c10_ge_realpath.py check \
            --artifact-dir artifacts/adaptive-n2-c10-ge-ctmc-time \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-c10-ge-ctmc-time/summary.json
      - name: Report fail and preserve small evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n2-c10-ge-ctmc-time/summary.json || true
          tail -n 50 artifacts/adaptive-n2-c10-ge-ctmc-time/client.log || true
          tail -n 50 artifacts/adaptive-n2-c10-ge-ctmc-time/server.log || true
          echo "SOURCE_SHA=$GITHUB_SHA; N2 C10 V3 Normal auto 240s time-driven GE GOOD450ms BAD50ms BAD drop50pct diagnostics ON; one scenario only; overall adaptive/wire/CPU OFF/p99/physical NOT QUALIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only owned raw PCAP after bounded analyzer, including failure cases
        if: always()
        run: |
          find artifacts/adaptive-n2-c10-ge-ctmc-time -maxdepth 1 -type f -name '*.pcap' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n2-c10-ge-ctmc-time-${{ github.sha }}
          path: |
            artifacts/adaptive-n2-c10-ge-ctmc-time/
            !artifacts/adaptive-n2-c10-ge-ctmc-time/*.pcap
            !artifacts/adaptive-n2-c10-ge-ctmc-time/wbd-client
            !artifacts/adaptive-n2-c10-ge-ctmc-time/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce functional result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
