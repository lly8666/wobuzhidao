name: raw-rto-p6-package-dispatch
run-name: raw-rto-p6-package-dispatch

on:
  push:
    branches:
      - qualification/raw-rcvbuf-controller-20261007

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Build fixed-source P6 targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/next-p6-package.yml/dispatches" --input - <<'JSON'
          {"ref":"qualification/raw-rto-physical-20261008"}
          JSON
