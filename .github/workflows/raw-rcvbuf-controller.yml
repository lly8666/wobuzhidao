name: raw-rcvbuf-performance-dispatch
run-name: raw-rcvbuf-performance-dispatch

on:
  push:
    branches:
      - qualification/raw-rcvbuf-controller-20261007

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch six independent exact-source samples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: qualification/raw-rcvbuf-20261007
          SOURCE: 3d3e24f1271ddf960aa57035a6217476f1826bbc
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local kind="$1" parity="$2" mode="$3" scenario="$4" seed="$5" rate="$6" lanes="$7"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/next-strict-weaknet.yml/dispatches" --input - <<JSON
          {"ref":"$REF","inputs":{"qualification_kind":"$kind","fec_parity":"$parity","mode":"$mode","scenario":"$scenario","seed":"$seed","rate_mbps":"$rate","lanes":"$lanes","cpu_profile":"false","stateful_middlebox":"false","wan_neighbors":"dynamic","product_source_sha":"$SOURCE"}}
          JSON
          }
          dispatch formal20 20 normal lossless 1521 10 1
          dispatch formal20 20 normal 5205 1521 10 1
          dispatch formal20 20 game lossless 1479 3 4
          dispatch formal20 20 game 5205 1479 3 4
          dispatch fec-profile-screen 12 normal lossless 1508 10 1
          dispatch fec-profile-screen 12 normal 5305 1508 10 1
