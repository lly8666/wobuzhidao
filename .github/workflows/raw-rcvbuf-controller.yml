name: rto-exact-source-network-gates
run-name: rto-exact-source-network-gates

on:
  push:
    branches:
      - qualification/raw-rcvbuf-controller-20261007

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-source network and lifecycle functional gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref='qualification/large-datagram-rto-20261007'
          for wf in next-predelivery-tools.yml next-linux-server.yml next-lifecycle-fullstack.yml next-default-network.yml next-splitroute.yml; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" --input - <<JSON
          {"ref":"$ref"}
          JSON
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/next-config-effective.yml/dispatches" --input - <<JSON
          {"ref":"$ref","inputs":{"case_id":"f20-l1-p0"}}
          JSON
