name: established-rto-foundation-retry
run-name: established-rto-foundation-retry

on:
  push:
    branches:
      - qualification/raw-rcvbuf-controller-20261007

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run exact-source Foundation only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref='qualification/large-datagram-rto-20261007'
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/next-foundation.yml/dispatches" --input - <<JSON
          {"ref":"$ref","inputs":{"run_extended":"false","run_legacy_soak":"false"}}
          JSON
