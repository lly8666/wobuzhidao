name: next-adaptive-n3-aes-protected-admission-gate
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n3-aes-protected-admission-gate.yml"
      - "internal/realityfront/policy_v3.go"
      - "internal/realityfront/policy_v3_test.go"
      - "internal/realityfront/n3_aes_protected_admission_test.go"
      - "internal/datapath/n2_protected_policy_candidate.go"
      - "internal/datapath/n3_aes_authenticated_handoff_test.go"
permissions:
  contents: read
jobs:
  one-source-protected-aes-admission-unit-race-no-product-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - name: Exact source and policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          echo "N3_AES_ADMISSION_SOURCE=$GITHUB_SHA"
      - name: Real TLS protected AES admission and complete bidirectional FEC lane handoffs
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/realityfront -run '^TestN3'
          go test -count=1 -v ./internal/datapath -run '^TestN3'
          go test -count=1 ./internal/realityfront ./internal/datapath ./internal/tlsrecord ./internal/runtimeowner ./internal/linkdata ./internal/adaptivefec
      - name: Same-source authenticated policy races and noHOL regressions
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/realityfront ./internal/datapath ./internal/tlsrecord ./internal/runtimeowner
      - name: Changed package vet plus both target cross builds
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/datapath ./internal/tlsrecord
          GOOS=windows GOARCH=amd64 go build -o /tmp/n3-admission-windows.exe ./cmd/wbd-client
          GOOS=linux GOARCH=arm64 go build -o /tmp/n3-admission-linux-arm64 ./cmd/wbd-server
      - name: Preserve unqualified, exact source for later real AES tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/n3-admission
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          files=["internal/realityfront/policy_v3.go","internal/realityfront/policy_v3_test.go",
                 "internal/realityfront/n3_aes_protected_admission_test.go",
                 "internal/datapath/n2_protected_policy_candidate.go",
                 "internal/datapath/n3_aes_authenticated_handoff_test.go"]
          out={"schema":1,"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
               "scope":"N3_PROTECTED_TLS_ADMISSION_AND_V3_AES_DIRECTIONAL_LANE_FUNCTIONAL_SCOPED",
               "files_sha256":{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files},
               "actual_5netns_AES_performance":"NOT_RUN",
               "client_AES_CLI":"NOT_ADVERTISED","Windows_GUI_AES":"NOT_ADVERTISED",
               "product_performance_jobs":0,"N3_release_qualification":"INCOMPLETE"}
          pathlib.Path("artifacts/n3-admission/result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n3-protected-admission-${{ github.sha }}
          path: artifacts/n3-admission/
          retention-days: 30
          if-no-files-found: warn
