name: Apply fullstack harness alignment once

on:
  push:
    branches:
      - feat/single-flow-reality-faketcp
    paths:
      - '.github/workflows/apply-fullstack-harness-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/single-flow-reality-faketcp
          fetch-depth: 0
      - name: Align fullstack qualification harnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # OpenWrt one-shot launches the low-level LINK tools directly.
          one('scripts/openwrt_fullstack_one_shot.sh',
              'PIDS=()\nPLATFORM_CLIENT_PID=\n',
              'PIDS=()\nPLATFORM_CLIENT_PID=\nINNER_MTU=${WBD_INNER_MTU:-1360}\nLINK_PLAINTEXT_MTU=${WBD_LINK_PLAINTEXT_MTU:-1400}\n')
          one('scripts/openwrt_fullstack_one_shot.sh',
              '    -listen "$tip" -service 127.0.0.1:49000 \\\n    -ticket-dir "$TICKET_DIR"',
              '    -listen "$tip" -service 127.0.0.1:49000 -mtu "$INNER_MTU" \\\n    -ticket-dir "$TICKET_DIR"')
          one('scripts/openwrt_fullstack_one_shot.sh',
              '    -mode client -listen 127.0.0.1:47101 -dtls 127.0.0.1:46101 -fec off \\\n    -demo-reality-ticket "$TICKET"',
              '    -mode client -listen 127.0.0.1:47101 -dtls 127.0.0.1:46101 -fec off \\\n    -mtu "$LINK_PLAINTEXT_MTU" -demo-reality-ticket "$TICKET"')

          # Startup stress previously fed the user-facing inner MTU directly to
          # wbd-link-proxy. Keep the inner and LINK plaintext layers explicit.
          one('.github/scripts/single-flow-startup-stress.sh',
              'LINK_MTU=${SFSTRESS_LINK_MTU:-1360}\n',
              'INNER_MTU=${SFSTRESS_INNER_MTU:-1360}\nLINK_PLAINTEXT_MTU=${SFSTRESS_LINK_PLAINTEXT_MTU:-1400}\n')
          one('.github/scripts/single-flow-startup-stress.sh',
              '  -listen 127.0.0.1:47000 -service 127.0.0.1:48000 \\\n  -ticket-dir "$ROOT/tickets"',
              '  -listen 127.0.0.1:47000 -service 127.0.0.1:48000 -mtu "$INNER_MTU" \\\n  -ticket-dir "$ROOT/tickets"')
          one('.github/scripts/single-flow-startup-stress.sh',
              "-fec off -mtu '$LINK_MTU' -lanes 1",
              "-fec off -mtu '$LINK_PLAINTEXT_MTU' -lanes 1")
          one('.github/scripts/single-flow-startup-stress.sh',
              'one_way_delay=${ONE_WAY_DELAY:-off} mtu=${LINK_MTU}',
              'one_way_delay=${ONE_WAY_DELAY:-off} inner_mtu=${INNER_MTU} link_plaintext_mtu=${LINK_PLAINTEXT_MTU}')

          # Under high latency/loss, all four client tickets can be ready a few
          # hundred ms before the fourth server bootstrap log is observable.
          # Wait for the server-side barrier before starting DTLS instead of
          # racing an immediate exact-count assertion.
          one('scripts/game_lane_fullstack.sh',
              '''test "$(grep -c 'WBD_SINGLE_FLOW_BOOTSTRAP_READY.*same_flow=1' "$LOG_DIR/faketcp-mux.log")" -eq "$LANES"

for i in $(seq 1 "$LANES"); do
  dport=$((46100+i)); fport=$((45100+i))
''',
              '''for _ in $(seq 1 900); do
  server_bootstraps=$(grep -c 'WBD_SINGLE_FLOW_BOOTSTRAP_READY.*same_flow=1' "$LOG_DIR/faketcp-mux.log" || true)
  if [[ "$server_bootstraps" -ge "$LANES" ]]; then break; fi
  sleep .05
done
test "$(grep -c 'WBD_SINGLE_FLOW_BOOTSTRAP_READY.*same_flow=1' "$LOG_DIR/faketcp-mux.log")" -eq "$LANES"

for i in $(seq 1 "$LANES"); do
  dport=$((46100+i)); fport=$((45100+i))
''')

          # Pin both MTU layers in the weak-net qualification itself.
          one('.github/workflows/reconnect-netem.yml',
              "          PROBE_COUNT: '4'\n        run: |\n",
              "          PROBE_COUNT: '4'\n          INNER_MTU: '1360'\n          LINK_PLAINTEXT_MTU: '1400'\n        run: |\n")
          PY

          bash -n scripts/openwrt_fullstack_one_shot.sh
          bash -n .github/scripts/single-flow-startup-stress.sh
          bash -n scripts/game_lane_fullstack.sh
          grep -q 'LINK_PLAINTEXT_MTU=${WBD_LINK_PLAINTEXT_MTU:-1400}' scripts/openwrt_fullstack_one_shot.sh
          grep -q 'LINK_PLAINTEXT_MTU=${SFSTRESS_LINK_PLAINTEXT_MTU:-1400}' .github/scripts/single-flow-startup-stress.sh
          grep -q 'server_bootstraps=' scripts/game_lane_fullstack.sh
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-fullstack-harness-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/openwrt_fullstack_one_shot.sh .github/scripts/single-flow-startup-stress.sh scripts/game_lane_fullstack.sh .github/workflows/reconnect-netem.yml .github/workflows/apply-fullstack-harness-fix-once.yml
          git diff --cached --check
          git commit -m 'test: align fullstack MTU layers and bootstrap barrier'
          git push origin HEAD:feat/single-flow-reality-faketcp
