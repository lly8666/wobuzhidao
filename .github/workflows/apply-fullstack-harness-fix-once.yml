name: Apply fullstack harness alignment once

on:
  push:
    branches:
      - feat/single-flow-reality-faketcp
    paths:
      - '.github/workflows/apply-fullstack-harness-fix-once.yml'
      - '.github/scripts/apply-fullstack-harness-fix-once.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/single-flow-reality-faketcp
          fetch-depth: 0
      - name: Apply harness patch
        run: python3 .github/scripts/apply-fullstack-harness-fix-once.py
      - name: Validate shell harnesses
        run: |
          bash -n scripts/openwrt_fullstack_one_shot.sh
          bash -n .github/scripts/single-flow-startup-stress.sh
          bash -n scripts/game_lane_fullstack.sh
          git diff --check
      - name: Commit non-workflow harness patch
        run: |
          git restore .github/workflows/reconnect-netem.yml
          rm .github/scripts/apply-fullstack-harness-fix-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/openwrt_fullstack_one_shot.sh .github/scripts/single-flow-startup-stress.sh scripts/game_lane_fullstack.sh .github/scripts/apply-fullstack-harness-fix-once.py
          git diff --cached --check
          git commit -m 'test: align fullstack MTU layers and bootstrap barrier'
          git push origin HEAD:feat/single-flow-reality-faketcp
