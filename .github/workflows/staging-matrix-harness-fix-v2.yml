name: staging-publish-qualification-trigger-blobs

on:
  push:
    branches:
      - agent/matrix-harness-fix-f885
    paths:
      - '.github/workflows/staging-matrix-harness-fix-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate asserted workflow blobs from exact staging SHA
        run: |
          set -euo pipefail
          BASE=1bfd86dda5fe030dd0e475f097038fd835ea0957
          git fetch origin "$BASE" --depth=1
          git show "$BASE":.github/workflows/game-lane-rotation-soak.yml > /tmp/soak.yml
          git show "$BASE":.github/workflows/transport-20x20-matrix.yml > /tmp/matrix.yml
          python3 - <<'PY'
          from pathlib import Path
          soak=Path('/tmp/soak.yml')
          s=soak.read_text()
          old="""    branches:\n      - feat/single-flow-reality-faketcp\n"""
          new="""    branches:\n      - feat/single-flow-reality-faketcp\n      - agent/fec-zombie-fix-7d859\n"""
          assert s.count(old)==1, s.count(old)
          soak.write_text(s.replace(old,new,1))

          matrix=Path('/tmp/matrix.yml')
          m=matrix.read_text()
          oldm="""      - 'scripts/bench_v2_transport_20x20.py'\n      - '.github/workflows/transport-20x20-matrix.yml'\n"""
          newm="""      - 'scripts/bench_v2_transport_20x20.py'\n      - '.github/workflows/transport-20x20-matrix.yml'\n      - '.github/workflows/game-lane-rotation-soak.yml'\n"""
          assert m.count(oldm)==1, m.count(oldm)
          matrix.write_text(m.replace(oldm,newm,1))
          PY
          grep -q -- "- agent/fec-zombie-fix-7d859" /tmp/soak.yml
          grep -q -- "- '.github/workflows/game-lane-rotation-soak.yml'" /tmp/matrix.yml
          mkdir -p scripts
          cp /tmp/soak.yml scripts/staging_game_lane_rotation_soak_trigger.yml
          cp /tmp/matrix.yml scripts/staging_transport_20x20_soak_trigger.yml
          git diff --no-index /dev/null scripts/staging_game_lane_rotation_soak_trigger.yml >/tmp/soak.diff || test $? -eq 1
          git diff --no-index /dev/null scripts/staging_transport_20x20_soak_trigger.yml >/tmp/matrix.diff || test $? -eq 1
      - name: Publish content-addressed blobs on helper branch
        run: |
          set -euo pipefail
          git config user.name 'wbd-staging-bot'
          git config user.email 'wbd-staging-bot@users.noreply.github.com'
          git add scripts/staging_game_lane_rotation_soak_trigger.yml scripts/staging_transport_20x20_soak_trigger.yml
          git diff --cached --check
          git commit -m 'test(staging): publish qualification trigger blobs'
          git push origin HEAD:agent/matrix-harness-fix-f885
