name: diagnostic-sack-rack-weaknet

on:
  push:
    branches:
      - agent/matrix-harness-fix-f885
    paths:
      - '.github/workflows/staging-matrix-harness-fix-v2.yml'

permissions:
  actions: read
  contents: read

jobs:
  sack-rack-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - fec: off
            label: off-r1
          - fec: off
            label: off-r2
          - fec: '20:20'
            label: fec20-r1
          - fec: '20:20'
            label: fec20-r2
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact failing soak harness
        run: |
          set -euo pipefail
          BASE=89a4650b09c4f3862ba02316cec2ae258a8f0853
          git fetch origin "$BASE" --depth=1
          git show "$BASE":scripts/game_lane_fullstack.sh > scripts/game_lane_fullstack.sh
          git show "$BASE":scripts/game_lane_rotation_soak_control.sh > scripts/game_lane_rotation_soak_control.sh
      - name: Install namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables tcpdump
      - uses: actions/download-artifact@v4
        with:
          name: game-lane-rotation-soak-assets
          path: ${{ runner.temp }}/wbd-soak-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lly8666/wobuzhidao
          run-id: 34424978270
      - name: Verify exact product SHA and switch diagnostic recovery only
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/wbd-soak-assets"
          chmod +x "$ASSET"/wbd-* "$ASSET"/wbd_dtls_shim
          test "$(cat "$ASSET/SOURCE_SHA.txt")" = 89a4650b09c4f3862ba02316cec2ae258a8f0853
          python3 - <<'PY'
          from pathlib import Path
          base=Path('scripts/game_lane_fullstack.sh')
          s=base.read_text()
          assert s.count('--shadow-recovery legacy') >= 1
          s=s.replace('--shadow-recovery legacy','--shadow-recovery sack-rack')
          old='--fallback-target 127.0.0.1:9 --bootstrap-timeout 12s --max-sessions 8 \\\n'
          new='--fallback-target 127.0.0.1:9 --bootstrap-timeout 12s --max-sessions 8 --shadow-recovery sack-rack \\\n'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1).replace('recovery=legacy','recovery=sack-rack')
          base.write_text(s)

          ctl=Path('scripts/game_lane_rotation_soak_control.sh')
          c=ctl.read_text()
          assert c.count('--shadow-recovery legacy') >= 1
          c=c.replace('--shadow-recovery legacy','--shadow-recovery sack-rack')
          assert '"$DURATION_SEC" -ge 500' in c
          c=c.replace('"$DURATION_SEC" -ge 500','"$DURATION_SEC" -ge 120',1)
          c=c.replace('DURATION_SEC must be >=500','DURATION_SEC must be >=120',1)
          ctl.write_text(c)
          PY
          grep -q -- '--shadow-recovery sack-rack' scripts/game_lane_fullstack.sh
          grep -q -- '--shadow-recovery sack-rack' scripts/game_lane_rotation_soak_control.sh
          ! grep -q 'recovery=legacy' scripts/game_lane_fullstack.sh
      - name: Run exact-product SACK-RACK weak-net diagnostic
        env:
          LANES: '4'
          FEC: ${{ matrix.fec }}
          DURATION_SEC: '120'
          RATE_BPS: '1000000'
          PAYLOAD_BYTES: '1000'
          ROTATE_INTERVAL_SEC: '25'
          ROTATIONS: '3'
          NETEM_DELAY_MS: '300'
          NETEM_LOSS_PCT: '20'
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/sack-rack-${{ matrix.label }}"
          mkdir -p "$LOG"
          sudo -E bash scripts/game_lane_rotation_soak_control.sh "$RUNNER_TEMP/wbd-soak-assets" "$LOG"
          grep -q 'WBD_HOSTED_NETEM_READY delay_ms=300 loss_pct=20 direction=bidirectional' "$LOG/netem.log"
          grep -q 'READY role=server-mux.*recovery=sack-rack' "$LOG/faketcp-mux.log"
          test "$(grep -h -c 'READY role=client.*recovery=sack-rack' "$LOG"/faketcp-*.log "$LOG"/lane-*-faketcp.log 2>/dev/null | awk '{s+=$1} END{print s+0}')" -ge 4
          ! grep -q 'WBD_FAKETCP_OUTSTANDING_LIMIT.*action=rst' "$LOG/faketcp-mux.log"
          echo "WBD_SACK_RACK_DIAGNOSTIC_PASS fec=${{ matrix.fec }} label=${{ matrix.label }}"
      - name: Diagnose
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/sack-rack-${{ matrix.label }}"
          for f in faketcp-mux.log rotation.log game-server.log game-client.log load-result.json; do
            echo "=== $f ==="; tail -n 220 "$LOG/$f" 2>/dev/null || true
          done
          find "$LOG" -maxdepth 1 -name '*faketcp.log' -print | sort | while read -r f; do echo "=== $f ==="; tail -n 80 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sack-rack-diagnostic-${{ matrix.label }}
          path: ${{ runner.temp }}/sack-rack-${{ matrix.label }}
          retention-days: 7
