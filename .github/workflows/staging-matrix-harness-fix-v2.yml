name: staging-matrix-harness-fix-v2

on:
  push:
    branches:
      - agent/matrix-harness-fix-f885
    paths:
      - '.github/workflows/staging-matrix-harness-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact f885 matrix inputs
        run: |
          set -euo pipefail
          git fetch origin f8855c34b91b9434331477f2f86baf68cd1826bd --depth=1
          git show f8855c34b91b9434331477f2f86baf68cd1826bd:scripts/bench_v2_transport_20x20.py > scripts/bench_v2_transport_20x20.py
          git show f8855c34b91b9434331477f2f86baf68cd1826bd:.github/workflows/transport-20x20-matrix.yml > .github/workflows/transport-20x20-matrix.yml
      - name: Apply asserted harness patch
        run: |
          set -euo pipefail
          python3 scripts/staging_matrix_harness_patch.py
          python3 -m py_compile scripts/bench_v2_transport_20x20.py
          git diff --check
      - name: Exercise netem compatibility path on this runner
        run: |
          set -euo pipefail
          sudo ip netns add wbd-seed-probe
          trap 'sudo ip netns del wbd-seed-probe 2>/dev/null || true' EXIT
          sudo ip netns exec wbd-seed-probe ip link set lo up
          sudo python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('m','scripts/bench_v2_transport_20x20.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.install_netem('wbd-seed-probe','lo',20,1.0,12345)
          PY
          sudo ip netns exec wbd-seed-probe tc qdisc show dev lo
      - name: Publish validated matrix blobs on helper branch
        run: |
          set -euo pipefail
          cp .github/workflows/transport-20x20-matrix.yml scripts/staging_transport_20x20_patched.yml
          git config user.name 'wbd-staging-bot'
          git config user.email 'wbd-staging-bot@users.noreply.github.com'
          git add scripts/bench_v2_transport_20x20.py scripts/staging_transport_20x20_patched.yml
          git diff --cached --check
          git commit -m 'test(transport): publish validated matrix blobs'
          git push origin HEAD:agent/matrix-harness-fix-f885
