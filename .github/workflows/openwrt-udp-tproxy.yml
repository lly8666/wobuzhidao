name: openwrt-udp-tproxy

on:
  push:
    paths:
      - 'cmd/wbd-platform-proxy-openwrt/**'
      - 'cmd/wbd-platform-proxy-server/**'
      - 'internal/platformproxy/**'
      - 'scripts/openwrt_tproxy.sh'
      - 'scripts/openwrt_udp_tproxy_netns.sh'
      - '.github/workflows/openwrt-udp-tproxy.yml'
  pull_request:
    paths:
      - 'cmd/wbd-platform-proxy-openwrt/**'
      - 'cmd/wbd-platform-proxy-server/**'
      - 'internal/platformproxy/**'
      - 'scripts/openwrt_tproxy.sh'
      - 'scripts/openwrt_udp_tproxy_netns.sh'
      - '.github/workflows/openwrt-udp-tproxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udp-tproxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install namespace and TPROXY tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: Unit tests and binaries
        run: |
          go test ./internal/platformproxy -count=1
          go build -o "$RUNNER_TEMP/wbd-platform-proxy-openwrt" ./cmd/wbd-platform-proxy-openwrt
          go build -o "$RUNNER_TEMP/wbd-platform-proxy-server" ./cmd/wbd-platform-proxy-server
      - name: Root network-namespace OpenWrt UDP TPROXY qualification
        run: |
          sudo scripts/openwrt_udp_tproxy_netns.sh \
            "$RUNNER_TEMP/wbd-platform-proxy-openwrt" \
            "$RUNNER_TEMP/wbd-platform-proxy-server"
