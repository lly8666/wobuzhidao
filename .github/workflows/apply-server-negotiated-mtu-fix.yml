name: apply server negotiated MTU fix

on:
  push:
    branches:
      - feat/single-flow-reality-faketcp
    paths:
      - .github/workflows/apply-server-negotiated-mtu-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply negotiated per-tunnel MTU patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              p.write_text(text.replace(old, new, 1))

          Path('internal/rawipbackend/meta.go').write_text(r'''package rawipbackend

import (
    "encoding/binary"
    "encoding/hex"
    "errors"
    "net/netip"

    "github.com/lly8666/wobuzhidao/internal/logicaltunnel"
)

var magic = [4]byte{'W', 'B', 'R', 'I'}

const (
    Version1 = byte(1)
    Version2 = byte(2)
    Version3 = byte(3)
    MetaLen  = 8
    TunnelMetaLen    = 4 + 1 + logicaltunnel.TunnelIDBytes + 4
    TunnelMetaMTULen = TunnelMetaLen + 2
)

type SessionMeta struct {
    SID string
}

type TunnelMeta struct {
    TunnelID logicaltunnel.TunnelID
    Address4 netip.Addr
    InnerMTU uint16
}

func MarshalSessionMeta(sid string) ([]byte, error) {
    b, err := hex.DecodeString(sid)
    if err != nil || len(b) != 3 {
        return nil, errors.New("rawipbackend: sid must be six hexadecimal characters")
    }
    out := make([]byte, MetaLen)
    copy(out[:4], magic[:])
    out[4] = Version1
    copy(out[5:8], b)
    return out, nil
}

func UnmarshalSessionMeta(p []byte) (SessionMeta, bool) {
    if len(p) != MetaLen || p[0] != magic[0] || p[1] != magic[1] || p[2] != magic[2] || p[3] != magic[3] || p[4] != Version1 {
        return SessionMeta{}, false
    }
    return SessionMeta{SID: hex.EncodeToString(p[5:8])}, true
}

func MarshalTunnelMeta(tunnelID logicaltunnel.TunnelID, address4 netip.Addr) ([]byte, error) {
    id, err := logicaltunnel.ParseTunnelID(string(tunnelID))
    if err != nil || !address4.IsValid() || !address4.Is4() {
        return nil, errors.New("rawipbackend: invalid logical tunnel metadata")
    }
    idRaw, _ := hex.DecodeString(string(id))
    addr := address4.As4()
    out := make([]byte, TunnelMetaLen)
    copy(out[:4], magic[:])
    out[4] = Version2
    copy(out[5:5+logicaltunnel.TunnelIDBytes], idRaw)
    copy(out[5+logicaltunnel.TunnelIDBytes:], addr[:])
    return out, nil
}

func MarshalTunnelMetaWithMTU(tunnelID logicaltunnel.TunnelID, address4 netip.Addr, innerMTU uint16) ([]byte, error) {
    if innerMTU == 0 {
        return nil, errors.New("rawipbackend: inner MTU must be positive")
    }
    legacy, err := MarshalTunnelMeta(tunnelID, address4)
    if err != nil {
        return nil, err
    }
    out := make([]byte, TunnelMetaMTULen)
    copy(out, legacy)
    out[4] = Version3
    binary.BigEndian.PutUint16(out[TunnelMetaLen:], innerMTU)
    return out, nil
}

func UnmarshalTunnelMeta(p []byte) (TunnelMeta, bool) {
    if len(p) < 5 || p[0] != magic[0] || p[1] != magic[1] || p[2] != magic[2] || p[3] != magic[3] {
        return TunnelMeta{}, false
    }
    switch p[4] {
    case Version2:
        if len(p) != TunnelMetaLen {
            return TunnelMeta{}, false
        }
    case Version3:
        if len(p) != TunnelMetaMTULen {
            return TunnelMeta{}, false
        }
    default:
        return TunnelMeta{}, false
    }
    id, err := logicaltunnel.ParseTunnelID(hex.EncodeToString(p[5 : 5+logicaltunnel.TunnelIDBytes]))
    if err != nil {
        return TunnelMeta{}, false
    }
    var raw [4]byte
    copy(raw[:], p[5+logicaltunnel.TunnelIDBytes:5+logicaltunnel.TunnelIDBytes+4])
    meta := TunnelMeta{TunnelID: id, Address4: netip.AddrFrom4(raw)}
    if p[4] == Version3 {
        meta.InnerMTU = binary.BigEndian.Uint16(p[TunnelMetaLen:])
        if meta.InnerMTU == 0 {
            return TunnelMeta{}, false
        }
    }
    return meta, true
}
''')

          Path('internal/rawipbackend/meta_test.go').write_text(r'''package rawipbackend

import (
    "net/netip"
    "testing"

    "github.com/lly8666/wobuzhidao/internal/logicaltunnel"
)

func testTunnelID(t *testing.T) logicaltunnel.TunnelID {
    t.Helper()
    id, err := logicaltunnel.ParseTunnelID("00112233445566778899aabbccddeeff")
    if err != nil {
        t.Fatal(err)
    }
    return id
}

func TestSessionMetaRoundTrip(t *testing.T) {
    wire, err := MarshalSessionMeta("7c31a9")
    if err != nil {
        t.Fatal(err)
    }
    if len(wire) != MetaLen {
        t.Fatalf("len=%d want=%d", len(wire), MetaLen)
    }
    got, ok := UnmarshalSessionMeta(wire)
    if !ok || got.SID != "7c31a9" {
        t.Fatalf("got=%+v ok=%v", got, ok)
    }
}

func TestSessionMetaRejectsInvalidSID(t *testing.T) {
    for _, sid := range []string{"", "123", "zzzzzz", "12345678"} {
        if _, err := MarshalSessionMeta(sid); err == nil {
            t.Fatalf("MarshalSessionMeta(%q) unexpectedly succeeded", sid)
        }
    }
}

func TestTunnelMetaV2RoundTrip(t *testing.T) {
    id := testTunnelID(t)
    addr := netip.MustParseAddr("10.66.0.17")
    wire, err := MarshalTunnelMeta(id, addr)
    if err != nil {
        t.Fatal(err)
    }
    if len(wire) != TunnelMetaLen {
        t.Fatalf("len=%d want=%d", len(wire), TunnelMetaLen)
    }
    got, ok := UnmarshalTunnelMeta(wire)
    if !ok || got.TunnelID != id || got.Address4 != addr || got.InnerMTU != 0 {
        t.Fatalf("got=%+v ok=%v", got, ok)
    }
    if _, ok := UnmarshalSessionMeta(wire); ok {
        t.Fatal("v2 tunnel metadata was misclassified as historical v1 SID metadata")
    }
}

func TestTunnelMetaV3MTURoundTrip(t *testing.T) {
    id := testTunnelID(t)
    addr := netip.MustParseAddr("10.66.0.17")
    for _, mtu := range []uint16{576, 1280, 1300, 1360, 1460} {
        wire, err := MarshalTunnelMetaWithMTU(id, addr, mtu)
        if err != nil {
            t.Fatalf("mtu=%d: %v", mtu, err)
        }
        if len(wire) != TunnelMetaMTULen {
            t.Fatalf("mtu=%d len=%d want=%d", mtu, len(wire), TunnelMetaMTULen)
        }
        got, ok := UnmarshalTunnelMeta(wire)
        if !ok || got.TunnelID != id || got.Address4 != addr || got.InnerMTU != mtu {
            t.Fatalf("mtu=%d got=%+v ok=%v", mtu, got, ok)
        }
    }
}

func TestTunnelMetaV3RejectsZeroMTUAndMalformedLength(t *testing.T) {
    id := testTunnelID(t)
    addr := netip.MustParseAddr("10.66.0.17")
    if _, err := MarshalTunnelMetaWithMTU(id, addr, 0); err == nil {
        t.Fatal("zero MTU unexpectedly accepted")
    }
    wire, err := MarshalTunnelMetaWithMTU(id, addr, 1300)
    if err != nil {
        t.Fatal(err)
    }
    if _, ok := UnmarshalTunnelMeta(wire[:len(wire)-1]); ok {
        t.Fatal("truncated v3 metadata unexpectedly accepted")
    }
}
''')

