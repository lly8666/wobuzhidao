	if err != nil {
		return nil, err
	}
	if innerMTU == 0 {
		return rawipbackend.MarshalTunnelMeta(binding.Config.TunnelID, lease)
	}
	return rawipbackend.MarshalTunnelMetaWithMTU(binding.Config.TunnelID, lease, innerMTU)
}''')

