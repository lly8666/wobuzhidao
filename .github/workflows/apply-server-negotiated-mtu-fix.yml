		overhead += gamelane.HeaderSize
	case backendRawIP:
	default:
		return 0, fmt.Errorf("negotiated inner MTU is not defined for backend %q", backend)
	}
	inner := int(stats.Config.MTU) - overhead
	if inner < 576 || inner > dataplane.MaxPacketLen {
		return 0, fmt.Errorf("negotiated LINK MTU %d cannot represent backend=%s inner MTU after overhead=%d", stats.Config.MTU, backend, overhead)
	}
	return uint16(inner), nil
}

func marshalPeerTunnelMeta(ps *peerSession, backend serviceBackend) ([]byte, error) {
	binding, ok := peerTunnelBinding(ps)
	if !ok {
		return nil, errors.New("raw-IP transport lacks Logical Tunnel binding")
	}
	lease, err := binding.Config.LeaseIPv4()
	if err != nil {
		return nil, err
	}
