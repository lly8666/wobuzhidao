import (
    "net/netip"
    "testing"

    "github.com/lly8666/wobuzhidao/internal/control"
    "github.com/lly8666/wobuzhidao/internal/logicaltunnel"
    "github.com/lly8666/wobuzhidao/internal/rawipbackend"
    "github.com/lly8666/wobuzhidao/internal/realityfront"
)

type mtuStartupSession struct{ stats control.LinkSessionStats }

func (s mtuStartupSession) State() control.State { return control.StateEstablished }
func (s mtuStartupSession) Stats() control.LinkSessionStats { return s.stats }
func (s mtuStartupSession) HandleWire([]byte, uint64) ([]byte, error) { return nil, nil }

func TestNegotiatedPeerInnerMTUUsesBackendOverhead(t *testing.T) {
    cases := []struct {
        name string
        backend serviceBackend
        linkMTU uint16
        want uint16
    }{
        {"game-1300", backendGame, 1340, 1300},
        {"game-1360", backendGame, 1400, 1360},
        {"rawip-1392", backendRawIP, 1400, 1392},
    }
    for _, tc := range cases {
        t.Run(tc.name, func(t *testing.T) {
            ps := &peerSession{startup: mtuStartupSession{stats: control.LinkSessionStats{Configured: true, Config: control.LinkConfig{MTU: tc.linkMTU}}}}
            got, err := negotiatedPeerInnerMTU(ps, tc.backend)
            if err != nil || got != tc.want {
                t.Fatalf("got=%d err=%v want=%d", got, err, tc.want)
            }
        })
    }
}

func TestMarshalPeerTunnelMetaCarriesNegotiatedMTU(t *testing.T) {
    id, err := logicaltunnel.ParseTunnelID("00112233445566778899aabbccddeeff")
    if err != nil { t.Fatal(err) }
    lease := netip.MustParseAddr("10.66.0.42")
    ps := &peerSession{startup: mtuStartupSession{stats: control.LinkSessionStats{Configured: true, Config: control.LinkConfig{MTU: 1340}}}}
    peerTunnelBindings.Store(ps, realityfront.TicketBinding{Account: "mtu-test", Config: logicaltunnel.TunnelConfig{TunnelID: id, Address4: netip.PrefixFrom(lease, 32).String(), Routes4: []string{"0.0.0.0/0"}}})
    defer forgetPeerTunnel(ps)
    wire, err := marshalPeerTunnelMeta(ps, backendGame)
    if err != nil { t.Fatal(err) }
    meta, ok := rawipbackend.UnmarshalTunnelMeta(wire)
    if !ok || meta.InnerMTU != 1300 || meta.TunnelID != id || meta.Address4 != lease {
        t.Fatalf("meta=%+v ok=%v", meta, ok)
    }
}
''')

