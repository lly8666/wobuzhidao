package main

import (
    "fmt"
    "net/netip"
    "strconv"

    "github.com/lly8666/wobuzhidao/internal/dataplane"
    "github.com/lly8666/wobuzhidao/internal/rawipbackend"
)

func effectiveTunnelMTU(meta rawipbackend.TunnelMeta, legacyMTU int) (int, error) {
    mtu := legacyMTU
    if meta.InnerMTU != 0 {
        mtu = int(meta.InnerMTU)
    }
    if mtu < 576 || mtu > dataplane.MaxPacketLen {
        return 0, fmt.Errorf("Logical Tunnel inner MTU %d outside 576..%d", mtu, dataplane.MaxPacketLen)
    }
    return mtu, nil
}

