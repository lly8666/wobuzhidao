name: next-e1-lowrtt-fullstack
run-name: e1-source32ms-normal1-lowrtt15ms-sparse45ms-seed1846
on:
  push:
    branches: ["next/performance-efficiency-20261008"]
    paths:
      - ".github/workflows/next-e1-lowrtt-fullstack.yml"
      - "tools/prepare_e1_lowrtt_fullstack.py"
      - "tools/e1_lowrtt_sparse_stage.py"
      - "tools/realpath_udp_duplex.py"
      - "tools/check_e1_lowrtt_fullstack.py"
permissions:
  contents: read
jobs:
  one-15ms-real-fullstack-protector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: a2db258b436a41fdee98c6c53abec9bab6ce600f
      ART: ${{ github.workspace }}/artifacts/e1-real-lowrtt-normal1
      WBD_STRICT_MODE: normal
      WBD_STRICT_SCENARIO: lossless
      WBD_STRICT_SEED: "1846"
      WBD_STRICT_RATE_MBPS: "0.328"
      WBD_STRICT_LANES: "1"
      WBD_STRICT_FEC_PARITY: "20"
      WBD_STRICT_FEC_SCREEN: "0"
      WBD_STRICT_CPU_PROFILE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - name: Check repo, hard source and one real business workload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 -m unittest discover -s tools -p 'test_e1_lowrtt_fullstack.py' -v
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$WBD_STRICT_MODE:$WBD_STRICT_LANES:$WBD_STRICT_SCENARIO" = normal:1:lossless
          test "$WBD_STRICT_RATE_MBPS" = 0.328
          mkdir -p "$ART"
          python3 tools/perf_sample_guard.py claim \
            --identity "E1:source=$SOURCE_SHA:harness=$GITHUB_SHA:normal1:15ms:45ms:96-1372-4068:FEC20-20:seed1846:lossless:single" \
            --receipt "$ART/sample-claim.json"
          python3 tools/prepare_e1_lowrtt_fullstack.py --output "$RUNNER_TEMP/e1-fullstack-sample.sh"
      - name: Install same strict fullstack netns/faketcp/tun tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            iproute2 iptables nftables tcpdump openssl build-essential bison flex \
            pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
      - name: Compile source frozen with uniform 32ms
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-seeded-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-seeded-tc" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/e1-frozen-product" "$SOURCE_SHA"
          (
            cd "$RUNNER_TEMP/e1-frozen-product"
            go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
            go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          )
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
      - name: One actual 15ms fullstack sparse UDP scenario
        id: sample
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_WORKSPACE,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_FEC_PARITY,WBD_STRICT_FEC_SCREEN,WBD_STRICT_CPU_PROFILE,WBD_STRICT_TC \
            env GITHUB_SHA="$SOURCE_SHA" WBD_HARNESS_SHA="$GITHUB_SHA" WBD_STRICT_ARTIFACT_DIR="$ART" \
            bash "$RUNNER_TEMP/e1-fullstack-sample.sh"
      - name: Fail closed on real 96/1372/4068 per-size first arrival and p99
        id: audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_e1_lowrtt_fullstack.py \
            --artifact-dir "$ART" --source-sha "$SOURCE_SHA" \
            --output "$ART/e1-lowrtt-summary.json"
          cat "$ART/e1-lowrtt-summary.json"
      - name: Hash then remove bounded owned pcaps
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["ART"]).resolve()
          expected=(Path(os.environ["GITHUB_WORKSPACE"])/"artifacts/e1-real-lowrtt-normal1").resolve()
          assert root==expected
          receipts=[]
          for path in root.glob("*.pcap*"):
              if path.is_file():
                  raw=path.read_bytes()
                  receipts.append({"name":path.name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
                  path.unlink()
          (root/"capture-cleanup.json").write_text(json.dumps({"deleted":True,"captures":receipts},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-normal1-15ms-sparse-fullstack-${{ github.sha }}
          path: |
            ${{ github.workspace }}/artifacts/e1-real-lowrtt-normal1/*.json
            ${{ github.workspace }}/artifacts/e1-real-lowrtt-normal1/*.jsonl
            ${{ github.workspace }}/artifacts/e1-real-lowrtt-normal1/*.txt
            ${{ github.workspace }}/artifacts/e1-real-lowrtt-normal1/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Never hide a business or analyzer failure
        if: always()
        env:
          SAMPLE: ${{ steps.sample.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          test "$SAMPLE" = success
          test "$AUDIT" = success
