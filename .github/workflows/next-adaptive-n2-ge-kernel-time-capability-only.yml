name: next-adaptive-n2-ge-kernel-time-capability-only
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-ge-kernel-time-capability-only.yml"
      - "tools/adaptive_n2_ge_time_smoke.c"
      - "tools/adaptive_n2_ge_time_probe.py"
permissions:
  contents: read
jobs:
  one-kernel-time-permission-probe-no-product-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact source repository performance policy and independent timer unit
        shell: bash
        run: |
          set -euo pipefail
          echo "C10_CAPABILITY_ONLY_SOURCE=$GITHUB_SHA"
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 -m py_compile tools/adaptive_n2_ge_time_probe.py
          python3 tools/adaptive_n2_ge_time_probe.py unit
          echo "No production binaries or traffic load in this workflow"
      - name: Install kernel BPF build and namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang llvm libbpf-dev iproute2 iputils-ping
          clang --version
          tc -V
      - name: Build tiny CLOCK_MONOTONIC kernel tc BPF phase verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/n2-ge-time-capability
          clang -O2 -g -target bpf -I "/usr/include/$(uname -m)-linux-gnu" \
            -c tools/adaptive_n2_ge_time_smoke.c \
            -o artifacts/n2-ge-time-capability/ge-time-capability.o
          llvm-objdump -h artifacts/n2-ge-time-capability/ge-time-capability.o \
            > artifacts/n2-ge-time-capability/elf-sections.txt
          grep 'classifier' artifacts/n2-ge-time-capability/elf-sections.txt
      - name: Kernel netns tc egress time-based nonbusiness 32-packet smoke
        id: kernel
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ART="$GITHUB_WORKSPACE/artifacts/n2-ge-time-capability"
          A="wbdgeA" B="wbdgeB"
          recpid=""
          cleanup() {
            if [ -n "$recpid" ]; then kill "$recpid" 2>/dev/null || true; fi
            sudo ip netns del "$A" 2>/dev/null || true
            sudo ip netns del "$B" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$A"
          sudo ip netns add "$B"
          sudo ip link add vethGEa type veth peer name vethGEb
          sudo ip link set vethGEa netns "$A"
          sudo ip link set vethGEb netns "$B"
          sudo ip -n "$A" address add 198.19.20.1/30 dev vethGEa
          sudo ip -n "$B" address add 198.19.20.2/30 dev vethGEb
          sudo ip -n "$A" link set lo up
          sudo ip -n "$B" link set lo up
          sudo ip -n "$A" link set vethGEa up
          sudo ip -n "$B" link set vethGEb up
          sudo ip netns exec "$A" ping -q -c 2 -W 1 198.19.20.2
          sudo ip netns exec "$A" tc qdisc add dev vethGEa clsact
          sudo ip netns exec "$A" tc filter add dev vethGEa egress pref 1 \
            bpf da obj "$ART/ge-time-capability.o" sec classifier
          sudo ip netns exec "$A" tc -s filter show dev vethGEa egress \
            > "$ART/tc-filter-loaded.txt"
          cat "$ART/tc-filter-loaded.txt"
          sudo ip netns exec "$B" python3 "$GITHUB_WORKSPACE/tools/adaptive_n2_ge_time_probe.py" \
            receiver --output "$ART/received.json" &
          recpid=$!
          sleep 0.4
          sudo ip netns exec "$A" python3 "$GITHUB_WORKSPACE/tools/adaptive_n2_ge_time_probe.py" \
            sender --output "$ART/sent.json"
          wait "$recpid"
          recpid=""
          sudo ip netns exec "$A" tc -s filter show dev vethGEa egress \
            > "$ART/tc-filter-after.txt"
          python3 tools/adaptive_n2_ge_time_probe.py verify \
            --sent "$ART/sent.json" --received "$ART/received.json" \
            --output "$ART/time-capability-result.json"
      - name: Independently preserve source and outcome receipt
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/n2-ge-time-capability
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          art=pathlib.Path("artifacts/n2-ge-time-capability")
          files=["tools/adaptive_n2_ge_time_smoke.c","tools/adaptive_n2_ge_time_probe.py",
                 "docs/evidence/adaptive-n2-ge-ctmc-freeze-v1.json"]
          files.extend(str(p) for p in sorted(art.iterdir()) if p.is_file())
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          out={"schema":1,"source_sha":os.environ["GITHUB_SHA"],
              "run_id":os.environ["GITHUB_RUN_ID"],
              "kind":"C10_KERNEL_TIME_CAPABILITY_ONLY_NOT_GE_PRODUCT_TEST",
              "measurement_jobs":0,"N2_product_pass":False,
              "files_sha256":{p:sha(p) for p in files if pathlib.Path(p).exists()}}
          (art/"receipt.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n2-ge-kernel-time-capability-${{ github.sha }}
          path: artifacts/n2-ge-time-capability/
          retention-days: 30
          if-no-files-found: warn
      - name: Fail closed on unsupported kernel clock attachment
        if: always()
        env:
          KERNEL_PROBE_OUTCOME: ${{ steps.kernel.outcome }}
        shell: bash
        run: |
          test "$KERNEL_PROBE_OUTCOME" = success
