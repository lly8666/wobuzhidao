name: lane-duplex-p6-dispatch
run-name: lane-duplex-p6-dispatch

on:
  push:
    branches:
      - qualification/lane-duplex-controller-20261007

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-source P6 package workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/next-p6-package.yml/dispatches" --input - <<'JSON'
          {"ref":"qualification/lane-duplex-20261007"}
          JSON
