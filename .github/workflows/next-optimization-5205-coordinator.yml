name: next-optimization-5205-coordinator

on:
  push:
    branches: [main]
    paths: [.github/perf-optimization-5205-request.json]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch independent samples and audit summaries (no workload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect-optimization-5205.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-5205-${{ github.run_id }}
          path: optimization-5205/
          if-no-files-found: error
