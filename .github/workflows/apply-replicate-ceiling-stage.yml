name: Apply replicate ceiling stage

on:
  push:
    branches:
      - dev/wbd-multilane-v1
    paths:
      - .github/workflows/apply-replicate-ceiling-stage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/wbd-multilane-v1
          fetch-depth: 0
      - name: Restore tested replicate ceiling changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lly8666/wobuzhidao/git/blobs/89f7ed191a58d7862ec8d2f0ae69067a5bd3c7e8" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/repl-stage.b64
          base64 -d /tmp/repl-stage.b64 > /tmp/repl-stage.tgz
          tar -xzf /tmp/repl-stage.tgz
          rm .github/workflows/apply-replicate-ceiling-stage.yml
          go test ./internal/benchmark -count=1
          go vet ./internal/benchmark
          git config user.name "wobuzhidao handoff bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: add 2x and 3x replication ceiling sweep"
          git push origin HEAD:dev/wbd-multilane-v1
