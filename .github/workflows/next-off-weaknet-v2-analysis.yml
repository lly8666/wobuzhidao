name: next-off-weaknet-v2-analysis
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - "tools/check_strict_off_weaknet_v2.py"
      - "tools/test_strict_off_weaknet_v2.py"
      - "tools/check_strict_fec_profile_screen.py"
      - ".github/workflows/next-off-weaknet-v2-analysis.yml"
      - "docs/FEC_OFF_PERFORMANCE_ACCEPTANCE.md"
      - "scripts/strict_weaknet_sample.sh"
      - "tools/check_strict_weaknet_loss_tolerant_v1.py"
      - ".github/workflows/next-strict-weaknet.yml"
permissions:
  contents: read
jobs:
  isolated-off-v2-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python analysis modules and run targeted policy vectors
        run: |
          set -euo pipefail
          bash -n scripts/strict_weaknet_sample.sh
          python3 -m py_compile tools/check_strict_off_weaknet_v2.py tools/check_strict_fec_profile_screen.py tools/check_strict_weaknet_loss_tolerant_v1.py tools/strict_weaknet_stage.py
          python3 -m unittest discover -s tools -p 'test_strict_off_weaknet_v2.py' -v
          echo 'OFF_WEAKNET_V2_ANALYSIS_TESTS_PASS_ONLY: not a 120s measurement, never a performance qualification'
