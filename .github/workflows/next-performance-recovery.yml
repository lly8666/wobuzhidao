name: next-performance-recovery

on:
  push:
    branches:
      - next/tlslike-dataplane
    paths:
      - ".github/workflows/next-performance-recovery.yml"
      - "cmd/wbd-server/main_linux.go"
      - "internal/runtimeentry/**"
      - "internal/runtimeowner/**"
      - "internal/datapath/**"
      - "internal/faketcp/**"
      - "scripts/strict_weaknet_sample.sh"
      - "tools/strict_resource_sampler.py"
      - "tools/check_strict_weaknet.py"
      - "docs/qualification/PERFORMANCE_RECOVERY_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-performance-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Targeted core
        run: go test ./internal/runtimeentry ./internal/runtimeowner ./internal/datapath ./internal/faketcp ./internal/linkdata ./internal/fec -count=1
      - name: Targeted race
        run: go test -race ./internal/runtimeentry ./internal/runtimeowner ./internal/datapath ./internal/faketcp ./internal/linkdata ./internal/fec -count=1

  normal10-lossless:
    needs: core-race
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ART: ${{ github.workspace }}/artifacts/perf-recovery-normal10
      WBD_STRICT_MODE: normal
      WBD_STRICT_SCENARIO: lossless
      WBD_STRICT_SEED: "601"
      WBD_STRICT_RATE_MBPS: "10"
      WBD_STRICT_LANES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install network tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl \
            build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          ss -0 -a -m -n >/dev/null
      - name: Build pinned tc and formal binaries
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          mkdir -p "$ART"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
      - name: Run exclusive Normal10 lossless evidence sample
        id: sample
        continue-on-error: true
        env:
          WBD_STRICT_ARTIFACT_DIR: ${{ env.ART }}
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_ARTIFACT_DIR,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC \
            bash scripts/strict_weaknet_sample.sh
      - name: Analyze without converting CAPACITY_LIMITED to pass
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_weaknet.py \
            --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --mode normal --scenario lossless --seed 601 \
            --target-mbps 10 --lanes 1 \
            --output "$ART/summary.json"
          python3 - "$ART/server-diag.jsonl" "$ART/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          diag=Path(sys.argv[1]); summary=Path(sys.argv[2])
          if summary.exists():
              x=json.loads(summary.read_text())
              print(json.dumps({"classifications":x.get("classifications"),"generator":x.get("generator"),"resource":x.get("resource")},indent=2,sort_keys=True))
          if diag.exists():
              rows=[json.loads(line) for line in diag.read_text().splitlines() if line.strip()]
              if rows:
                  print("FINAL_SERVER_DIAGNOSTIC")
                  print(json.dumps((rows[-1].get("product") or {}),indent=2,sort_keys=True))
          PY
      - name: Upload Normal10 receive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-recovery-normal10-${{ github.sha }}
          path: ${{ env.ART }}
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
      - name: Preserve collection failures
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
        run: |
          echo "sample=$SAMPLE_OUTCOME (performance classification is in summary.json)"
          test "$SAMPLE_OUTCOME" = success
