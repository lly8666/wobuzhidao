name: next-crypto-packet-core
on:
  push:
    branches: ["next/crypto-packet-efficiency-20261010"]
    paths:
      - "internal/tlsrecord/**"
      - "internal/faketcp/**"
      - ".github/workflows/next-crypto-packet-core.yml"
      - "go.mod"
      - "go.sum"
permissions: {contents: read}
concurrency:
  group: crypto-packet-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Unit, race, scalar fallback, fuzz, full-package build
        run: |
          set -euo pipefail
          go mod verify
          go test ./... -count=1
          go test -race ./internal/tlsrecord ./internal/faketcp ./internal/linkdata ./internal/fec -count=1
          go test -tags=purego ./internal/tlsrecord ./internal/faketcp -count=1
          go test -tags=noasm ./internal/tlsrecord ./internal/faketcp -count=1
          go test ./internal/tlsrecord -run '^$' -fuzz '^FuzzDecoderOpenPayload$' -fuzztime=15s
          go build ./...
          GOOS=linux GOARCH=arm GOARM=7 go build ./internal/tlsrecord ./internal/faketcp
          GOOS=linux GOARCH=arm64 go build ./...
  windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Native Windows unit and build
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/tlsrecord ./internal/faketcp ./internal/fec ./internal/linkdata -count=1
          go build ./...
  linux-arm64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Native ARM64 and fallback with race
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          go test ./internal/tlsrecord ./internal/faketcp ./internal/fec ./internal/linkdata -count=1 -v
          go test -race ./internal/tlsrecord ./internal/faketcp -count=1
          go test -tags=purego ./internal/tlsrecord ./internal/faketcp -count=1
          go test -tags=noasm ./internal/tlsrecord ./internal/faketcp -count=1
          mkdir -p artifacts/native-arm64-crypto
          go test ./internal/tlsrecord -run '^$' -bench '^BenchmarkNativeAEADShortMTUHotspot$' -benchtime=350ms -count=1 -cpu=1 -cpuprofile=artifacts/native-arm64-crypto/cpu.pprof > artifacts/native-arm64-crypto/aead-bench.txt
          go tool pprof -top -nodecount=50 artifacts/native-arm64-crypto/cpu.pprof > artifacts/native-arm64-crypto/aead-profile-top.txt
          go test ./internal/faketcp -run '^TestTCPChecksumIndependentOracleExtended$' -bench '^BenchmarkTCPChecksumCurrent$' -benchtime=200ms -count=3 -cpu=1 > artifacts/native-arm64-crypto/checksum-bench.txt
          go test ./internal/tlsrecord -run '^TestPoly1305PackagingOracle$' -bench '^BenchmarkPoly1305PackagingResearch$' -benchtime=250ms -count=3 -cpu=1 > artifacts/native-arm64-crypto/poly1305-packaging-bench.txt
          uname -a > artifacts/native-arm64-crypto/uname.txt
          go version > artifacts/native-arm64-crypto/go-version.txt
          sha256sum artifacts/native-arm64-crypto/* > artifacts/native-arm64-crypto/SHA256SUMS
      - name: Upload bounded synthetic native crypto hotspot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-crypto-hotspot
          path: artifacts/native-arm64-crypto/*
          retention-days: 30
          if-no-files-found: warn
