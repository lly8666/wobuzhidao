name: next-adaptive-n3-aes128-lossless-single
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n3-aes128-lossless-single.yml"
permissions:
  contents: read
concurrency:
  group: next-n3-aes128-lossless-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-source-aes128-authenticated-v3-300ms-lossless-100s:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Single frozen AES128 source and runner security context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          mkdir -p artifacts/n3-aes128-lossless
          python3 tools/perf_sample_guard.py claim \
            --identity "n3:AES128-GCM:V3-authenticated-Normal-auto-min4:lossless-300ms-each:10Mbps-each:100s:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/n3-aes128-lossless/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/n3-aes128-lossless/runner-cpu-scope.json
          lscpu --json > artifacts/n3-aes128-lossless/lscpu.json
          (grep -m1 -E '^(flags|Features)[[:space:]]*:' /proc/cpuinfo || true) > artifacts/n3-aes128-lossless/isa-flags.txt
          { cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true; } > artifacts/n3-aes128-lossless/runner-preflight.txt
      - name: Same SOURCE AES128/AES256 TLS AEAD admission, downgrade and N2 noHOL unit/race
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/tlsrecord ./internal/realityfront ./internal/adaptivefec
          go test -race -count=1 ./internal/tlsrecord ./internal/realityfront ./internal/runtimeowner ./internal/linkdata ./internal/adaptivefec ./internal/datapath
      - name: Derivation syntax and one AES suite before product traffic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n3_aes_realpath.py
          python3 - <<'PY'
          import json,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"tools")
          from adaptive_n3_aes_realpath import prepare
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)
              prepare(Path("."),p/"derived.sh",p/"prep.json","aes-128-gcm")
              sh=(p/"derived.sh").read_text()
              assert sh.count("--record-cipher aes-128-gcm")==1
              assert "--record-cipher aes-256-gcm" not in sh
              assert sh.count('"v3_client_record_cipher": "aes-128-gcm"')==1
              assert sh.count('"v3_client_record_cipher": "chacha20-poly1305"')==0
              assert sh.count("--fec-mode auto --fec-min-parity 4 --lanes 1")==1
              assert sh.count('--duration 100 --drain 10 --rate-mbps 10 --bounded-stats')==2
              r=json.loads((p/"prep.json").read_text())
              assert r["suite"]=="aes-128-gcm"
              print("N3_AES128_AUTHENTICATED_REALPATH_DERIVATION_PREFLIGHT_PASS")
          PY
      - name: Install five-netns real Linux kernel prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Build one-source real protected V3 client/server and exact AES128 fixture
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/n3-aes128-lossless
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 tools/adaptive_n3_aes_realpath.py prepare \
            --root . --suite aes-128-gcm --script "$ART/n3-aes128-derived.sh" \
            --receipt "$ART/harness-prep.json"
          bash -n "$ART/n3-aes128-derived.sh"
      - name: One AES128-GCM real protected V3 100s bidirectional 10Mbps 300ms each one-way
        id: sample
        continue-on-error: true
        shell: bash
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/n3-aes128-lossless
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/n3-aes128-lossless/n3-aes128-derived.sh
      - name: Independently check AES128 suite binding, first unique, ciphertext path and lossless probes
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n3_aes_realpath.py check \
            --suite aes-128-gcm \
            --artifact-dir artifacts/n3-aes128-lossless \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/n3-aes128-lossless/summary.json
      - name: Preserve bounded true logs and scoped outcomes
        if: always()
        shell: bash
        run: |
          cat artifacts/n3-aes128-lossless/summary.json || true
          tail -n 60 artifacts/n3-aes128-lossless/client.log || true
          tail -n 60 artifacts/n3-aes128-lossless/server.log || true
          echo "N3 AES128 single SOURCE=$GITHUB_SHA; first-delivery 100s only, CPU diag ON, no physical Windows qualification" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove owned raw PCAP after checker, never upload plaintext or keys
        if: always()
        shell: bash
        run: |
          find artifacts/n3-aes128-lossless -maxdepth 1 -name '*.pcap' -type f -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n3-aes128-realpath-${{ github.sha }}
          path: |
            artifacts/n3-aes128-lossless/
            !artifacts/n3-aes128-lossless/*.pcap
            !artifacts/n3-aes128-lossless/wbd-client
            !artifacts/n3-aes128-lossless/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual measurement and independent result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
