name: next-strict-packet-socket-diagnostic

on:
  push:
    branches:
      - next/tlslike-dataplane
    paths:
      - ".github/workflows/next-strict-packet-socket-diagnostic.yml"
      - "scripts/strict_weaknet_sample.sh"
      - "tools/strict_resource_sampler.py"
      - "tools/check_strict_weaknet.py"
      - "docs/qualification/STRICT_PACKET_SOCKET_DIAGNOSTIC_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-socket-half-rate:
    name: packet-socket-${{ matrix.mode }}-${{ matrix.rate }}mbps
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: normal
            lanes: 1
            rate: "5"
            seed: 511
          - mode: game
            lanes: 4
            rate: "1.5"
            seed: 512
    env:
      ART: ${{ github.workspace }}/artifacts/packet-socket-${{ matrix.mode }}
      WBD_STRICT_MODE: ${{ matrix.mode }}
      WBD_STRICT_SCENARIO: lossless
      WBD_STRICT_SEED: ${{ matrix.seed }}
      WBD_STRICT_RATE_MBPS: ${{ matrix.rate }}
      WBD_STRICT_LANES: ${{ matrix.lanes }}
      WBD_STRICT_DIAGNOSTIC_RATE_ONLY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository continuity contract
        env:
          CHANGE_BASE: ${{ github.event.before }}
        run: python3 tools/check_repository.py

      - name: Install network tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl \
            build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          ss -0 -a -m -n >/dev/null

      - name: Build pinned tc and formal binaries
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          mkdir -p "$ART"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server

      - name: Run isolated packet-socket diagnostic
        id: sample
        continue-on-error: true
        env:
          WBD_STRICT_ARTIFACT_DIR: ${{ env.ART }}
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_ARTIFACT_DIR,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC,WBD_STRICT_DIAGNOSTIC_RATE_ONLY \
            bash scripts/strict_weaknet_sample.sh

      - name: Analyze packet socket boundary
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_weaknet.py \
            --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --mode "$WBD_STRICT_MODE" --scenario lossless --seed "$WBD_STRICT_SEED" \
            --target-mbps "$WBD_STRICT_RATE_MBPS" --lanes "$WBD_STRICT_LANES" \
            --output "$ART/summary.json"

      - name: Show packet-socket evidence
        if: always()
        run: |
          python3 - "$ART/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.exists():
              raise SystemExit(0)
          x=json.loads(p.read_text())
          print(json.dumps({
              "source_sha": x.get("source_sha"),
              "mode": x.get("mode"),
              "classifications": x.get("classifications"),
              "errors": x.get("errors"),
              "packet_socket_by_endpoint": (x.get("resource") or {}).get("packet_socket_by_endpoint"),
              "socket_drop_by_endpoint": (x.get("resource") or {}).get("socket_drop_by_endpoint"),
              "generator": x.get("generator"),
              "latency": x.get("latency"),
          }, indent=2, sort_keys=True))
          PY
          tail -n 60 "$ART/client.log" || true
          tail -n 60 "$ART/server.log" || true

      - name: Upload packet-socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-packet-socket-${{ matrix.mode }}-${{ github.sha }}
          path: ${{ env.ART }}
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30

      - name: Enforce diagnostic target
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          echo "sample=$SAMPLE_OUTCOME validator=$VALIDATE_OUTCOME"
          test "$SAMPLE_OUTCOME" = success
          test "$VALIDATE_OUTCOME" = success
