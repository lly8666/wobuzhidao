name: next-strict-packet-socket-diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: normal
        type: choice
        options: [normal, game]
      lanes:
        required: true
        default: "1"
        type: string
      rate_mbps:
        required: true
        default: "5"
        type: string
      seed:
        required: true
        default: "511"
        type: string

permissions:
  contents: read

jobs:
  packet-socket-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ART: \${{ github.workspace }}/artifacts/packet-socket-single
      WBD_STRICT_MODE: \${{ inputs.mode }}
      WBD_STRICT_SCENARIO: lossless
      WBD_STRICT_SEED: \${{ inputs.seed }}
      WBD_STRICT_RATE_MBPS: \${{ inputs.rate_mbps }}
      WBD_STRICT_LANES: \${{ inputs.lanes }}
      WBD_STRICT_DIAGNOSTIC_RATE_ONLY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim exactly one sample
        run: |
          set -euo pipefail
          mkdir -p "$ART"
          python3 tools/perf_sample_guard.py claim \
            --identity "packet-socket:$WBD_STRICT_MODE:seed$WBD_STRICT_SEED:rate$WBD_STRICT_RATE_MBPS:lanes$WBD_STRICT_LANES:sha$GITHUB_SHA" \
            --receipt "$ART/sample-claim.json"

      - name: Install and build
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl \
            build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server

      - name: Run exactly one packet-socket sample
        id: sample
        continue-on-error: true
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC,WBD_STRICT_DIAGNOSTIC_RATE_ONLY \
            env WBD_STRICT_ARTIFACT_DIR="$ART" bash scripts/strict_weaknet_sample.sh

      - name: Analyze loss-tolerant-v1
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_weaknet_loss_tolerant_v1.py \
            --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --mode "$WBD_STRICT_MODE" --scenario lossless \
            --seed "$WBD_STRICT_SEED" --target-mbps "$WBD_STRICT_RATE_MBPS" \
            --lanes "$WBD_STRICT_LANES" --output "$ART/summary-loss-tolerant-v1.json"

      - name: Upload packet-socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packet-socket-single-\${{ inputs.mode }}-seed\${{ inputs.seed }}-\${{ github.sha }}
          path: \${{ env.ART }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Preserve collection failure
        if: always()
        run: test "\${{ steps.sample.outcome }}" = success
