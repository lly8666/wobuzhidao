name: Apply FEC matrix and hide Windows child consoles

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - .github/workflows/apply-fec-matrix-hidden-windows.yml
      - tools/apply_fec_matrix_hidden_windows.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply product changes
        shell: pwsh
        run: python tools/apply_fec_matrix_hidden_windows.py
      - name: Format and inspect
        shell: pwsh
        run: |
          gofmt -w internal/fec/fec.go internal/fec/profile_matrix_test.go internal/control/link.go internal/control/fec_profiles_test.go internal/linkdata/path.go cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/fec_profiles_test.go internal/windowsruntime/plan.go internal/windowsruntime/game_mtu.go internal/windowsruntime/executor.go internal/windowsruntime/controller.go internal/windowsruntime/process_hidden_windows.go internal/windowsruntime/process_hidden_other.go internal/windowsruntime/process_hidden_windows_test.go internal/windowsruntime/fec_profiles_test.go cmd/wbd-windows-gui/main_windows.go cmd/wbd-windows-portable/main_windows.go
          git diff --check
          git status --short
      - name: FEC matrix unit and recovery tests
        shell: pwsh
        run: |
          go test ./internal/fec ./internal/control ./internal/linkdata ./cmd/wbd-link-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/windowsruntime ./internal/windowsgui ./cmd/wbd-windows-gui ./cmd/wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows runtime entry points
        shell: pwsh
        run: |
          go build -trimpath -o $env:RUNNER_TEMP\wbd-link-proxy.exe .\cmd\wbd-link-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-H=windowsgui" -o $env:RUNNER_TEMP\wbd-windows-gui.exe .\cmd\wbd-windows-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-H=windowsgui" -o $env:RUNNER_TEMP\wbd.exe .\cmd\wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify no-console policy is wired to launch sites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-Content internal\windowsruntime\executor.go -Raw
          if ($runtime -notmatch 'configureHiddenProcess\(cmd\)') { throw 'OSRunner does not hide child windows' }
          $controller = Get-Content internal\windowsruntime\controller.go -Raw
          if (($controller | Select-String -Pattern 'configureHiddenProcess\(cmd\)' -AllMatches).Matches.Count -lt 2) { throw 'direct runtime PowerShell commands are not hidden' }
          $gui = Get-Content cmd\wbd-windows-gui\main_windows.go -Raw
          if ($gui -notmatch 'CreationFlags: 0x08000000') { throw 'GUI Npcap helper is not CREATE_NO_WINDOW' }
          $portable = Get-Content cmd\wbd-windows-portable\main_windows.go -Raw
          if (($portable | Select-String -Pattern 'CreationFlags: 0x08000000' -AllMatches).Matches.Count -lt 2) { throw 'portable helper/GUI launches are not CREATE_NO_WINDOW' }
          Write-Output 'WBD_WINDOWS_NO_CONSOLE_PASS runtime=hidden powershell=hidden gui_handoff=hidden'
      - name: Commit tested product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/fec/fec.go internal/fec/profile_matrix_test.go internal/control/link.go internal/control/fec_profiles_test.go internal/linkdata/path.go cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/fec_profiles_test.go internal/windowsruntime/plan.go internal/windowsruntime/game_mtu.go internal/windowsruntime/executor.go internal/windowsruntime/controller.go internal/windowsruntime/process_hidden_windows.go internal/windowsruntime/process_hidden_other.go internal/windowsruntime/process_hidden_windows_test.go internal/windowsruntime/fec_profiles_test.go cmd/wbd-windows-gui/main_windows.go cmd/wbd-windows-portable/main_windows.go
          git commit -m "feat: add fixed FEC matrix and hide Windows child consoles"
          git push origin HEAD:agent/fix-per-association-mtu-20260914
