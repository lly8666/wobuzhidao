name: exp-single-flow-utls

on:
  push:
    branches:
      - exp/single-flow-utls-firefox120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify pinned uTLS module graph
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run single-flow Reality persona tests
        run: |
          set -euo pipefail
          go test ./internal/realityfront -count=1
          go build ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux
