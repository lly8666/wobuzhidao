name: transport-200m

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: contains(github.event.pull_request.title, '[200m]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc iproute2 iptables curl unzip openssl
      - name: Restore exact carrier binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets /tmp/raw /tmp/speeder
          curl -fL 'https://github.com/wangyu-/udp2raw/releases/download/20230206.0/udp2raw_binaries.tar.gz' -o /tmp/udp2raw.tar.gz
          curl -fL 'https://github.com/wangyu-/UDPspeeder/releases/download/20230206.0/speederv2_binaries.tar.gz' -o /tmp/speeder.tar.gz
          echo '503cf5781aa97e50b4954c6bc4622c3ea6be02f6a35def4bb3b3eaf95bd2c7e8  /tmp/udp2raw.tar.gz' | sha256sum -c -
          echo 'b64dd376a948995cb5da17d8eb171338ccd0553b9380e5164f8cb5ac4131bcaa  /tmp/speeder.tar.gz' | sha256sum -c -
          tar -xzf /tmp/udp2raw.tar.gz -C /tmp/raw
          tar -xzf /tmp/speeder.tar.gz -C /tmp/speeder
          cp "$(find /tmp/raw -type f -name udp2raw_amd64 -print -quit)" /tmp/assets/udp2raw_amd64
          cp "$(find /tmp/speeder -type f -name speederv2_amd64 -print -quit)" /tmp/assets/speederv2_amd64
          chmod +x /tmp/assets/udp2raw_amd64 /tmp/assets/speederv2_amd64
          echo 'c81c7699194188172f37f747cdeba9fb54214bc4b3ba2d85cfdfccd5f7f70c3c  /tmp/assets/udp2raw_amd64' | sha256sum -c -
          echo 'f2ac1feedc10003255c1072346b1f3ee4935fc7bf2053af69ad52b7369d4b25a  /tmp/assets/speederv2_amd64' | sha256sum -c -
      - name: Build pinned DTLS shim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9529710833/zip" -o /tmp/wolfssl-source.zip
          mkdir -p /tmp/wolf-art /tmp/wolf/src /tmp/wolf/build
          unzip -q /tmp/wolfssl-source.zip -d /tmp/wolf-art
          echo '4a7ff40a32db0d7a262aaea2d2e674da6708250cba908441c737c981fc84f88b  /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz -C /tmp/wolf/src --strip-components=1
          (cd /tmp/wolf/src && ./autogen.sh)
          (cd /tmp/wolf/build && /tmp/wolf/src/configure --enable-dtls13 --disable-shared --enable-static)
          make -C /tmp/wolf/build -j2 src/libwolfssl.la
          gcc -O2 -Wall -Wextra -Werror -I/tmp/wolf/build -I/tmp/wolf/src \
            native/dtls/wbd_dtls_shim.c /tmp/wolf/build/src/.libs/libwolfssl.a -lm -o /tmp/assets/wbd_dtls_shim
          chmod +x /tmp/assets/wbd_dtls_shim
      - name: Build rate probe and certificates
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra -Werror -pthread scripts/udp_rate_probe.c -lm -o /tmp/assets/udp_rate_probe
          mkdir -p /tmp/assets/certs
          cat >/tmp/assets/certs/server.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:wbd.test
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 7 -subj '/CN=WBD 200M Root CA' \
            -keyout /tmp/assets/certs/ca.key -out /tmp/assets/certs/ca.pem >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -sha256 -subj '/CN=wbd.test' \
            -keyout /tmp/assets/certs/server.key -out /tmp/assets/certs/server.csr >/dev/null 2>&1
          openssl x509 -req -in /tmp/assets/certs/server.csr -CA /tmp/assets/certs/ca.pem -CAkey /tmp/assets/certs/ca.key \
            -CAcreateserial -days 7 -sha256 -extfile /tmp/assets/certs/server.ext -out /tmp/assets/certs/server.pem >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: transport-200m-assets
          path: /tmp/assets
          retention-days: 7

  bench:
    if: contains(github.event.pull_request.title, '[200m]')
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rtt: [20, 100, 300, 600]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables
      - uses: actions/download-artifact@v4
        with:
          name: transport-200m-assets
          path: /tmp/assets
      - name: Restore executable modes
        run: chmod +x /tmp/assets/udp2raw_amd64 /tmp/assets/speederv2_amd64 /tmp/assets/wbd_dtls_shim /tmp/assets/udp_rate_probe
      - name: Run 200M public-link RTT/loss sweep
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/wbd-200m-rtt${{ matrix.rtt }}"
          sudo python3 scripts/bench_v2_transport_200m.py \
            --udp2raw /tmp/assets/udp2raw_amd64 \
            --speeder /tmp/assets/speederv2_amd64 \
            --shim /tmp/assets/wbd_dtls_shim \
            --cert-dir /tmp/assets/certs \
            --probe /tmp/assets/udp_rate_probe \
            --out "$OUT" --rtt ${{ matrix.rtt }} --losses 0,1,5,10,20 \
            --link-mbps 200 --inner-mbps 90 --duration 2 --packet-size 1200
          sudo chown -R "$USER:$USER" "$OUT"
          cat "$OUT/results.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-200m-rtt-${{ matrix.rtt }}
          path: ${{ runner.temp }}/wbd-200m-rtt${{ matrix.rtt }}
          retention-days: 14

  aggregate:
    if: contains(github.event.pull_request.title, '[200m]')
    needs: bench
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: transport-200m-rtt-*
          path: /tmp/all
      - name: Aggregate
        run: |
          python3 - <<'PY'
          import csv,glob,json
          rows=[]
          for p in glob.glob('/tmp/all/**/results.csv',recursive=True):
              rows += list(csv.DictReader(open(p)))
          rows.sort(key=lambda r:(int(r['rtt_ms']),float(r['loss_pct_per_direction'])))
          print('RTT,loss,delivery,inner_Mbps,p99_ms,cpu_cores_both,RSS_MiB_both,outer_c2s,outer_s2c')
          for r in rows:
              print(f"{r['rtt_ms']},{r['loss_pct_per_direction']},{r['delivery_ratio']},{r['inner_delivered_mbps']},{r['p99_ms']},{r['cpu_core_fraction_both_endpoints']},{float(r['rss_peak_kb_both_endpoints'])/1024:.2f},{r['outer_c2s_mbps']},{r['outer_s2c_mbps']}")
          if len(rows)!=20: raise SystemExit(f'expected 20 rows, got {len(rows)}')
          open('/tmp/transport-200m-summary.json','w').write(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: transport-200m-summary
          path: /tmp/transport-200m-summary.json
          retention-days: 30
