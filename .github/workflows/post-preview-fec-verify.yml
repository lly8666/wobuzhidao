name: post-preview-fec-verify

on:
  push:
    branches:
      - fix/post-preview-fec-lifecycle-20260914
    paths:
      - 'internal/fec/**'
      - 'internal/linkdata/**'
      - '.github/workflows/post-preview-fec-verify.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: FEC and LINK unit tests
        run: go test ./internal/fec ./internal/linkdata -count=1
      - name: FEC and LINK race tests
        run: go test -race ./internal/fec ./internal/linkdata -count=1
