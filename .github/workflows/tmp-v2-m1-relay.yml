name: tmp-v2-m1-relay

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-v2-m1-relay.yml

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned V2 baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2/udp2raw /tmp/v2/speeder
          curl -LfsS -o /tmp/v2/udp2raw.tar.gz https://github.com/wangyu-/udp2raw/releases/download/20230206.0/udp2raw_binaries.tar.gz
          curl -LfsS -o /tmp/v2/speeder.tar.gz https://github.com/wangyu-/UDPspeeder/releases/download/20230206.0/speederv2_binaries.tar.gz
          echo '503cf5781aa97e50b4954c6bc4622c3ea6be02f6a35def4bb3b3eaf95bd2c7e8  /tmp/v2/udp2raw.tar.gz' | sha256sum -c -
          echo 'b64dd376a948995cb5da17d8eb171338ccd0553b9380e5164f8cb5ac4131bcaa  /tmp/v2/speeder.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v2/udp2raw.tar.gz -C /tmp/v2/udp2raw
          tar -xzf /tmp/v2/speeder.tar.gz -C /tmp/v2/speeder
          echo 'c81c7699194188172f37f747cdeba9fb54214bc4b3ba2d85cfdfccd5f7f70c3c  /tmp/v2/udp2raw/udp2raw_amd64' | sha256sum -c -
          echo 'f2ac1feedc10003255c1072346b1f3ee4935fc7bf2053af69ad52b7369d4b25a  /tmp/v2/speeder/speederv2_amd64' | sha256sum -c -
          chmod +x /tmp/v2/udp2raw/udp2raw_amd64 /tmp/v2/speeder/speederv2_amd64
          sha256sum /tmp/v2/udp2raw.tar.gz /tmp/v2/speeder.tar.gz /tmp/v2/udp2raw/udp2raw_amd64 /tmp/v2/speeder/speederv2_amd64 | tee /tmp/v2/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v2-m1-pinned-baseline
          path: |
            /tmp/v2/udp2raw.tar.gz
            /tmp/v2/speeder.tar.gz
            /tmp/v2/udp2raw/udp2raw_amd64
            /tmp/v2/speeder/speederv2_amd64
            /tmp/v2/SHA256SUMS.txt
