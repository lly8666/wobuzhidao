name: linux-server-v3-firewall

on:
  workflow_dispatch:
  push:
    branches:
      - exp/singleflow-realitylike-v3
      - dev/wbd-raw-fec-v2
    paths:
      - scripts/linux_server_firewall.sh
      - scripts/linux_server_guard.sh
      - scripts/linux_server_manager_v3.sh
      - .github/workflows/linux-server-firewall.yml
  pull_request:
    paths:
      - scripts/linux_server_firewall.sh
      - scripts/linux_server_guard.sh
      - scripts/linux_server_manager_v3.sh
      - .github/workflows/linux-server-firewall.yml

permissions:
  contents: read

jobs:
  composition:
    name: V3 one-public-owner composition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          sh -n scripts/linux_server_firewall.sh
          sh -n scripts/linux_server_guard.sh
          sh -n scripts/linux_server_manager_v3.sh
      - name: Assert V3 single-flow manager composition
        run: |
          set -euo pipefail
          grep -F 'WBD_LINUX_SERVER_BIND_V3 public_owner=raw-mux' scripts/linux_server_manager_v3.sh
          grep -F 'reality_like=in-flow' scripts/linux_server_manager_v3.sh
          grep -F 'wbd-faketcp-mux' scripts/linux_server_manager_v3.sh
          if grep -F '"$PREFIX/bin/wbd-reality-front"' scripts/linux_server_manager_v3.sh; then
            echo 'V3 manager must not install or execute standalone wbd-reality-front' >&2
            exit 1
          fi
          grep -F 'V3 never installs or executes it as a public listener' scripts/linux_server_manager_v3.sh
      - name: Assert single-port render
        run: |
          set -euo pipefail
          for backend in nft iptables; do
            out=$(sh scripts/linux_server_firewall.sh render --backend "$backend" --port 40443 --state /tmp/wbd-fw-render.state)
            echo "$out"
            grep -F "backend=$backend mode=single port=40443" <<<"$out"
            ! grep -F 'mode=legacy' <<<"$out"
          done

  firewall:
    name: firewall ${{ matrix.backend }} single port
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [nft, iptables]
    steps:
      - uses: actions/checkout@v4
      - name: Install firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iptables
      - name: Qualify WBD-owned single-port lifecycle
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          ns="wbd-fw-${BACKEND}"
          state="/tmp/${ns}.state"
          cleanup() {
            sudo ip netns exec "$ns" sh "$GITHUB_WORKSPACE/scripts/linux_server_firewall.sh" cleanup --backend "$BACKEND" --port 40443 --state "$state" >/dev/null 2>&1 || true
            sudo ip netns del "$ns" >/dev/null 2>&1 || true
            sudo rm -f "$state" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up

          extra=()
          if [[ "$BACKEND" == nft ]]; then
            sudo ip netns exec "$ns" nft add table inet filter
            sudo ip netns exec "$ns" nft 'add chain inet filter input { type filter hook input priority 0; policy drop; }'
            extra=(--nft-input inet:filter:input)
          fi

          sudo ip netns exec "$ns" sh "$GITHUB_WORKSPACE/scripts/linux_server_firewall.sh" apply \
            --backend "$BACKEND" --port 40443 --state "$state" "${extra[@]}"
          sudo test -s "$state"
          sudo grep -F 'PUBLIC_PORT=40443' "$state"

          if [[ "$BACKEND" == nft ]]; then
            rules=$(sudo ip netns exec "$ns" nft -a list chain inet filter input)
            echo "$rules"
            [[ $(grep -c 'wbd-server-public' <<<"$rules") -eq 1 ]]
            ! grep -q 'wbd-server-front' <<<"$rules"
            ! grep -q 'wbd-server-raw' <<<"$rules"
            sudo ip netns exec "$ns" nft list table inet wbd_server | grep -F 'wbd-server-rst'
          else
            rules=$(sudo ip netns exec "$ns" iptables -S INPUT)
            echo "$rules"
            [[ $(grep -c -- '--dport 40443 .*wbd-server-public' <<<"$rules") -eq 1 ]]
            ! grep -q 'wbd-server-front' <<<"$rules"
            ! grep -q 'wbd-server-raw' <<<"$rules"
            sudo ip netns exec "$ns" iptables -S OUTPUT | grep -F 'wbd-server-rst'
          fi

          sudo ip netns exec "$ns" sh "$GITHUB_WORKSPACE/scripts/linux_server_firewall.sh" cleanup \
            --backend "$BACKEND" --port 40443 --state "$state" "${extra[@]}"
          test ! -e "$state"

          if [[ "$BACKEND" == nft ]]; then
            after=$(sudo ip netns exec "$ns" nft -a list chain inet filter input)
            ! grep -q 'wbd-server-' <<<"$after"
            ! sudo ip netns exec "$ns" nft list table inet wbd_server >/dev/null 2>&1
          else
            ! sudo ip netns exec "$ns" iptables -S | grep -q 'wbd-server-'
          fi

      - name: Guard cleanup on child exit
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          ns="wbd-guard-${BACKEND}"
          state="/tmp/${ns}.state"
          cleanup() { sudo ip netns del "$ns" >/dev/null 2>&1 || true; sudo rm -f "$state" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up
          extra=()
          if [[ "$BACKEND" == nft ]]; then
            sudo ip netns exec "$ns" nft add table inet filter
            sudo ip netns exec "$ns" nft 'add chain inet filter input { type filter hook input priority 0; policy drop; }'
            extra=(--nft-input inet:filter:input)
          fi
          sudo ip netns exec "$ns" sh "$GITHUB_WORKSPACE/scripts/linux_server_guard.sh" \
            --backend "$BACKEND" --port 40443 --state "$state" "${extra[@]}" \
            -- sh -c 'exit 0'
          test ! -e "$state"
          if [[ "$BACKEND" == nft ]]; then
            ! sudo ip netns exec "$ns" nft list table inet wbd_server >/dev/null 2>&1
            ! sudo ip netns exec "$ns" nft -a list chain inet filter input | grep -q 'wbd-server-'
          else
            ! sudo ip netns exec "$ns" iptables -S | grep -q 'wbd-server-'
          fi
