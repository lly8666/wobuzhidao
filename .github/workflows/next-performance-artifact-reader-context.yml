name: next-performance-artifact-reader-context

on:
  push:
    branches: [main]
    paths:
      - .github/perf-artifact-clientdrop-request.json
      - .github/workflows/next-performance-artifact-reader-context.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-existing-artifact-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Load request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('.github/perf-artifact-clientdrop-request.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for env,key in [('ARTIFACT_ID','artifact_id'),('SOURCE_RUN','source_run'),('SOURCE_SHA','source_sha'),('EXPECTED_NAME','artifact_name')]:
                  f.write(f"{env}={d[key]}\n")
          PY
      - name: Verify and download immutable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(echo "$meta" | jq -r .name)" = "$EXPECTED_NAME"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "$SOURCE_RUN"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$SOURCE_SHA"
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/evidence.zip"
      - name: Extract transition context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-reader
          python3 - <<'PY'
          import json, os, zipfile
          zpath=os.path.join(os.environ['RUNNER_TEMP'],'evidence.zip')
          keys=[
            'Outstanding','PeakOutstanding','Pending','Abandoned','ForgivenGaps',
            'RepairEvictionCalls','RepairEvictionScanSteps','RepairEvictionMaxScan',
            'FreshBlocked','FreshWindowBypass','FreshEmitFailures','RepairExpiredSkipped',
            'RecoveryTicks','GapForgiveChecks','GapIndexSteps','GapMetadataDropped',
            'GapExpiredForgiven','RepairEvictionNS','RepairEvictionMaxNS',
            'FreshLockWaitNS','FreshLockWaitMaxNS','FreshCriticalNS','FreshCriticalMaxNS',
            'OldestOutstandingAge','OldestOutOfOrderAge','FreshSent','Retransmitted',
            'FastRepairs','RTORepairs','RepairSelected','RepairAttempts','RepairSucceeded',
            'RepairFailures','RepairDeferred','Received','Duplicates','LateFirstArrival'
          ]
          def find(z,suffix):
              m=[n for n in z.namelist() if n.endswith(suffix)]
              if len(m)!=1: raise SystemExit(f'{suffix}: {m}')
              return m[0]
          def rows(z,name):
              out=[]
              with z.open(name) as f:
                  for raw in f:
                      try: out.append(json.loads(raw))
                      except Exception: pass
              return out
          def skmem(text):
              out={'rmem_alloc':0,'rcv_buf':0,'drops':0}
              for line in (text or '').splitlines():
                  p=line.find('skmem:(')
                  if p<0: continue
                  body=line[p+7:].split(')',1)[0]
                  f={}
                  for token in body.split(','):
                      token=token.strip()
                      for k in ('rb','tb','bl','r','t','f','w','o','d'):
                          if token.startswith(k):
                              v=token[len(k):]
                              if v and v.lstrip('-').isdigit(): f[k]=int(v)
                              break
                  out['rmem_alloc']=max(out['rmem_alloc'],f.get('r',0))
                  out['rcv_buf']=max(out['rcv_buf'],f.get('rb',0))
                  out['drops']=max(out['drops'],f.get('d',0))
              out['rmem_ratio']=out['rmem_alloc']/out['rcv_buf'] if out['rcv_buf'] else 0.0
              return out
          def packet(row,ep):
              s=((((row.get('namespaces') or {}).get(ep) or {}).get('ss_packet') or {}).get('stdout') or '')
              return skmem(s)
          def product(row,side):
              p=row.get('product') or {}
              if side=='server': return p.get('tunnel') if p.get('present') else None
              return p
          def laneid(l):
              r=l.get('ref') or {}
              return f"{r.get('ID',0)}:{r.get('Generation',0)}"
          def near(diag,side,ts):
              candidates=[]
              for row in diag:
                  p=product(row,side)
                  if p: candidates.append((abs(int(row.get('unix_ns',0))-ts),row,p))
              if not candidates: return None
              _,row,p=min(candidates,key=lambda x:x[0])
              lanes={}
              for lane in p.get('lanes') or []:
                  tr=lane.get('transport') or {}
                  lanes[laneid(lane)]={k:tr[k] for k in keys if k in tr}
              return {'unix_ns':row.get('unix_ns'),'lanes':lanes}
          with zipfile.ZipFile(zpath) as z:
              names={s:find(z,s) for s in ('resources.jsonl','stage-events.jsonl','client-diag.jsonl','server-diag.jsonl')}
              rr=rows(z,names['resources.jsonl'])
              ev=rows(z,names['stage-events.jsonl'])
              cd=rows(z,names['client-diag.jsonl'])
              sd=rows(z,names['server-diag.jsonl'])
          by={x.get('event'):x for x in ev}
          bounds={k:(int(by[k+'_start']['unix_ns']),int(by[k+'_end']['unix_ns'])) for k in ('pre','stress','post')}
          origin=bounds['pre'][0]
          def stage(ts):
              for k,(a,b) in bounds.items():
                  if a<=ts<b:return k
              return 'outside'
          trans=[]
          prev={'client':0,'server':0}
          for i,row in enumerate(rr):
              cur={ep:packet(row,ep)['drops'] for ep in ('client','server')}
              delta={ep:max(0,cur[ep]-prev[ep]) for ep in cur}
              if any(delta.values()):
                  ts=int(row.get('unix_ns',0))
                  ctx=[]
                  for j in range(max(0,i-3),min(len(rr),i+4)):
                      x=rr[j]; xt=int(x.get('unix_ns',0))
                      ctx.append({
                        'sample_index':j,
                        'elapsed_s':(xt-origin)/1e9,
                        'stage':stage(xt),
                        'packet':{ep:packet(x,ep) for ep in ('client','server')},
                        'processes':{ep:(x.get('processes') or {}).get(ep) for ep in ('client','server')},
                        'proc_stat':x.get('proc_stat'),
                        'loadavg':x.get('loadavg'),
                        'pressure':x.get('pressure'),
                      })
                  trans.append({
                    'sample_index':i,'elapsed_s':(ts-origin)/1e9,'stage':stage(ts),'drop_delta':delta,
                    'context':ctx,
                    'client_transport_nearest':near(cd,'client',ts),
                    'server_transport_nearest':near(sd,'server',ts),
                  })
              prev=cur
          out={'artifact_id':int(os.environ['ARTIFACT_ID']),'source_sha':os.environ['SOURCE_SHA'],'resource_keys':list(rr[0].keys()) if rr else [],'transitions':trans}
          with open('artifact-reader/transition-context.json','w') as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
          print('WBD_TRANSITION_CONTEXT '+json.dumps(out,sort_keys=True))
          PY
      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: clientdrop-context-${{ env.ARTIFACT_ID }}-${{ env.SOURCE_SHA }}
          path: artifact-reader/transition-context.json
          if-no-files-found: error
          retention-days: 30
