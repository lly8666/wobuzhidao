name: windows-faketcp-persona

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/faketcp/**'
      - 'cmd/wbd-faketcp/**'
      - '.github/workflows/windows-faketcp-persona.yml'
  push:
    branches:
      - feat/single-flow-reality-faketcp
      - dev/wbd-raw-fec-v2
    paths:
      - 'internal/faketcp/**'
      - 'cmd/wbd-faketcp/**'
      - '.github/workflows/windows-faketcp-persona.yml'

permissions:
  contents: read

jobs:
  packet_persona:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Execute Windows packet persona and backend tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/faketcp -run 'Test(Windows11Persona|WindowsDefaultPacketPersona|LegacyPersona)' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "Windows FakeTCP persona tests failed: $LASTEXITCODE" }
          go test ./cmd/wbd-faketcp -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "Windows FakeTCP backend tests failed: $LASTEXITCODE" }
          go build -trimpath -o "$env:RUNNER_TEMP\wbd-faketcp.exe" ./cmd/wbd-faketcp
          if ($LASTEXITCODE -ne 0) { throw "Windows FakeTCP build failed: $LASTEXITCODE" }
          Write-Output 'WBD_WINDOWS_FAKETCP_PERSONA_PASS ttl=128 options=mss,nop,ws8,nop,nop,sack df=1 ipid=incrementing backend_tests=pass'
