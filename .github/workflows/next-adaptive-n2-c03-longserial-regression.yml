name: next-adaptive-n2-c03-longserial-regression
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-c03-longserial-regression.yml"
      - "tools/adaptive_n2_c03_longserial_gate.py"
      - "tools/test_adaptive_n2_c03_longserial_gate.py"
      - "tools/adaptive_n2_c03_wave.py"
      - "tools/adaptive_n2_c03_stage.py"
permissions:
  contents: read
concurrency:
  group: adaptive-n2-c03-longserial-regression-single-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-v3-normal-c03-300ms-wave780-single-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact one SOURCE and one functional sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive-n2-c03-longserial-regression
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 tools/perf_sample_guard.py claim \
            --identity "adaptive-n2:auto-min4:wave-0152050:300ms:10mbps_each:780s:netem-seed-unapplied601:biz2026092201-2026092202:sha$GITHUB_SHA" \
            --receipt artifacts/adaptive-n2-c03-longserial-regression/sample-claim.json
          python3 tools/e4_runner_cpu_scope.py --output artifacts/adaptive-n2-c03-longserial-regression/runner-cpu-scope.json
          lscpu --json > artifacts/adaptive-n2-c03-longserial-regression/lscpu.json
          (grep -m1 -E '^(flags|Features)[[:space:]]*:' /proc/cpuinfo || true) > artifacts/adaptive-n2-c03-longserial-regression/isa-flags.txt
          {
            cat /proc/pressure/cpu 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            grep '^cpu ' /proc/stat || true
            cat /proc/loadavg || true
          } > artifacts/adaptive-n2-c03-longserial-regression/runner-preflight.txt
      - name: C03 independent freeze and stage preflight before any netem load
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n2_c03_wave.py tools/adaptive_n2_c03_stage.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from adaptive_n2_c03_wave import c03_frozen, PHASES, DURATION
          from adaptive_n2_c03_stage import STAGES
          m=c03_frozen(Path("."))
          assert DURATION==780 and STAGES==PHASES
          assert len(m["grade_screens"])==6
          print("C03_FROZEN_INDEPENDENT_MODEL_SHA256="+m["manifest_sha256"])
          PY
      - name: Independent first-delivery gate self-tests BEFORE real workload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/adaptive_n2_c03_longserial_gate.py
          python3 -m unittest discover -s tools -p 'test_adaptive_n2_c03_longserial_gate.py' -v
      - name: Install five-netns kernel prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
          test -c /dev/net/tun
      - name: Exact SOURCE Go N2 unit/race before measurement
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/adaptivefec
          go test -race -count=1 ./internal/adaptivefec ./internal/datapath ./internal/runtimeowner ./internal/linkdata
      - name: Build exact current SOURCE binaries
        shell: bash
        run: |
          set -euo pipefail
          ART=artifacts/adaptive-n2-c03-longserial-regression
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
          sha256sum "$ART/wbd-client" "$ART/wbd-server" > "$ART/binary-sha256.txt"
          python3 -m py_compile tools/adaptive_n2_c03_wave.py tools/adaptive_n2_c03_stage.py
          python3 tools/adaptive_n2_c03_wave.py prepare \
            --root . --script "$ART/n2-c03-derived.sh" --receipt "$ART/harness-prep.json"
          bash -n "$ART/n2-c03-derived.sh"
          grep -q "adaptive_n2_c03_stage.py" "$ART/n2-c03-derived.sh"
          grep -q "resource-samples.jsonl" "$ART/n2-c03-derived.sh"
      - name: One protected Normal auto 10Mbps each-way 300ms 780s six-phase netem waveform (final clean 180s)
        id: sample
        continue-on-error: true
        env:
          WBD_REALPATH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/adaptive-n2-c03-longserial-regression
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_REALPATH_ARTIFACT_DIR \
            bash artifacts/adaptive-n2-c03-longserial-regression/n2-c03-derived.sh
      - name: Independent protected Normal auto and first-unique delivery check
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_c03_wave.py check \
            --artifact-dir artifacts/adaptive-n2-c03-longserial-regression \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-c03-longserial-regression/summary.json
      - name: Scoped long-lived clean-stage first-delivery and model grade gate
        id: serial_gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/adaptive_n2_c03_longserial_gate.py \
            --artifact-dir artifacts/adaptive-n2-c03-longserial-regression \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/adaptive-n2-c03-longserial-regression/serial-gate.json
      - name: Report fail and preserve small evidence
        if: always()
        shell: bash
        run: |
          cat artifacts/adaptive-n2-c03-longserial-regression/summary.json || true
          cat artifacts/adaptive-n2-c03-longserial-regression/serial-gate.json || true
          tail -n 50 artifacts/adaptive-n2-c03-longserial-regression/client.log || true
          tail -n 50 artifacts/adaptive-n2-c03-longserial-regression/server.log || true
          echo "SOURCE_SHA=$GITHUB_SHA; N2 V3 Normal 300ms six-phase actual loss wave: inspect summary classification; tc netem RNG seed unsupported on this runner and not applied, actual drop counters mandatory; NEVER infer full N2 PASS; Windows TUN/CPU OFF/other modes NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean only owned raw PCAP before artifact upload
        if: always()
        run: |
          find artifacts/adaptive-n2-c03-longserial-regression -maxdepth 1 -type f -name '*.pcap' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-n2-c03-longserial-regression-780s-${{ github.sha }}
          path: |
            artifacts/adaptive-n2-c03-longserial-regression/
            !artifacts/adaptive-n2-c03-longserial-regression/*.pcap
            !artifacts/adaptive-n2-c03-longserial-regression/wbd-client
            !artifacts/adaptive-n2-c03-longserial-regression/wbd-server
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce functional result
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SERIAL_GATE_OUTCOME: ${{ steps.serial_gate.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
          test "$SERIAL_GATE_OUTCOME" = success
