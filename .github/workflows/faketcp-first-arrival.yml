name: faketcp-first-arrival

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rtt: [20, 100]
        loss: [0, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables
      - name: Unit tests and build
        run: |
          go test ./internal/faketcp -count=1
          go build -trimpath -o /tmp/wbd-faketcp ./cmd/wbd-faketcp
          python3 -m py_compile scripts/faketcp_first_arrival_probe.py
      - name: Measure first complete datagram arrival
        env:
          RTT: ${{ matrix.rtt }}
          LOSS: ${{ matrix.loss }}
        run: |
          set -euo pipefail
          C=wbdlatc$$
          S=wbdlats$$
          cleanup() {
            set +e
            [[ -n "${CPID:-}" ]] && sudo kill -TERM "$CPID" 2>/dev/null
            [[ -n "${SPID:-}" ]] && sudo kill -TERM "$SPID" 2>/dev/null
            [[ -n "${RPID:-}" ]] && sudo kill -TERM "$RPID" 2>/dev/null
            sleep .15
            sudo ip netns del "$C" 2>/dev/null
            sudo ip netns del "$S" 2>/dev/null
          }
          trap cleanup EXIT
          sudo ip netns add "$C"
          sudo ip netns add "$S"
          sudo ip link add vc type veth peer name vs
          sudo ip link set vc netns "$C"
          sudo ip link set vs netns "$S"
          sudo ip -n "$C" addr add 10.83.0.1/24 dev vc
          sudo ip -n "$S" addr add 10.83.0.2/24 dev vs
          sudo ip -n "$C" link set lo up
          sudo ip -n "$S" link set lo up
          sudo ip -n "$C" link set vc up
          sudo ip -n "$S" link set vs up
          sudo ip netns exec "$C" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          sudo ip netns exec "$S" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          HALF=$(python3 - <<PY
          print(float("$RTT")/2.0)
          PY
          )
          sudo ip netns exec "$C" tc qdisc add dev vc root netem limit 50000 delay "${HALF}ms" rate 200mbit
          sudo ip netns exec "$S" tc qdisc add dev vs root netem limit 50000 delay "${HALF}ms" rate 200mbit

          sudo ip netns exec "$S" python3 "$GITHUB_WORKSPACE/scripts/faketcp_first_arrival_probe.py" \
            server --bind 127.0.0.1:53000 --expect 500 --window 3.0 --out /tmp/first.json \
            >/tmp/first-server.log 2>&1 & RPID=$!
          sudo ip netns exec "$S" /tmp/wbd-faketcp server \
            --listen 10.83.0.2:53003 --target-udp 127.0.0.1:53000 >/tmp/faketcp-server.log 2>&1 & SPID=$!
          sleep .15
          sudo ip netns exec "$C" /tmp/wbd-faketcp client \
            --local-udp 127.0.0.1:53004 --source 10.83.0.1:53010 --remote 10.83.0.2:53003 \
            >/tmp/faketcp-client.log 2>&1 & CPID=$!
          for i in $(seq 1 300); do
            grep -q 'READY role=client' /tmp/faketcp-client.log && grep -q 'READY role=server' /tmp/faketcp-server.log && break
            sleep .05
          done
          grep -q 'READY role=client' /tmp/faketcp-client.log
          grep -q 'READY role=server' /tmp/faketcp-server.log

          if [[ "$LOSS" != "0" ]]; then
            sudo ip netns exec "$C" tc qdisc replace dev vc root netem limit 50000 delay "${HALF}ms" loss random "${LOSS}%" rate 200mbit
            sudo ip netns exec "$S" tc qdisc replace dev vs root netem limit 50000 delay "${HALF}ms" loss random "${LOSS}%" rate 200mbit
          fi
          sudo ip netns exec "$C" python3 "$GITHUB_WORKSPACE/scripts/faketcp_first_arrival_probe.py" \
            client --dest 127.0.0.1:53004 --count 500 --size 1200 --interval-ms 2
          wait "$RPID" || true
          RPID=
          sudo kill -TERM "$CPID" "$SPID" 2>/dev/null || true
          wait "$CPID" || true
          wait "$SPID" || true
          CPID= SPID=
          cat /tmp/first-server.log
          cat /tmp/faketcp-client.log
          cat /tmp/faketcp-server.log

          python3 - <<'PY'
          import json, os, re
          rtt=float(os.environ['RTT']); loss=float(os.environ['LOSS'])
          row=json.load(open('/tmp/first.json'))
          floor=rtt/2.0
          print('FIRST_ARRIVAL_FINAL',json.dumps(row,sort_keys=True))
          # First-arrival performance invariant: holes must not hold later complete
          # datagrams behind the TCP cumulative ACK point.
          assert row['p50_ms'] <= floor + 20.0, (floor,row)
          assert row['p75_ms'] <= floor + 25.0, (floor,row)
          if loss == 0:
              assert row['received_first'] == row['expected'], row
              assert row['p99_ms'] <= floor + 30.0, (floor,row)
          else:
              texts=open('/tmp/faketcp-client.log').read()+open('/tmp/faketcp-server.log').read()
              stats=[json.loads(x) for x in re.findall(r'WBD_FAKETCP_STATS (\{.*\})',texts)]
              assert stats, texts
              retries=sum(s['sender']['FastRetransmits']+s['sender']['RTOTransmits'] for s in stats)
              assert retries > 0, stats
          PY
