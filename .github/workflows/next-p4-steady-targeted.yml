name: next-p4-steady-targeted

on:
  push:
    branches: ['next/tlslike-dataplane']
  workflow_dispatch:

permissions:
  contents: read

# Per-SHA targeting must not queue behind the branch-wide 31-minute P5 soak.
concurrency:
  group: next-p4-steady-targeted-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository contract
        env:
          CHANGE_BASE: ${{ github.event.before }}
        run: python tools/check_repository.py

  steady-core:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Steady FakeTCP/runtime/lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          go test ./internal/faketcp ./internal/runtimeowner ./internal/runtimeentry -count=1 -v \
            | tee "artifacts/p4-steady-${RUNNER_OS}.log"
          go build ./cmd/wbd-client
          go build ./cmd/wbd-server
      - name: Linux race
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/faketcp ./internal/runtimeowner ./internal/runtimeentry -count=1 \
            | tee artifacts/p4-steady-race.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-steady-core-${{ runner.os }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn

  lifecycle-focus:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Game4 rotation dormant and close focus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          go test ./internal/runtimeentry -count=1 -v \
            -run='^(TestLifecycleEntryGameThreeAndFourLaneMatrix|TestLifecycleEntryGameReplacementDormantWakeKeepsStableLease|TestLifecycleEntryAutomaticRotationTimerConverges|TestLifecycleEntryPayloadIdleAutoDormantAndBusinessWake|TestLifecycleEntryExplicitCloseEmitsSteadyFINBeforeNetworkDetach)$' \
            | tee artifacts/p4-lifecycle-focus.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-lifecycle-focus-${{ github.sha }}
          path: artifacts
          if-no-files-found: error

  linux-privileged:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        backend: [iptables, nft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Install root-network tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ip >/dev/null 2>&1 || ! command -v iptables >/dev/null 2>&1 || ! command -v nft >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables nftables
          fi
          sudo modprobe tun
          test -c /dev/net/tun
      - name: Shared TUN backend
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          go test -c ./internal/linuxserver -o /tmp/p4-linux-shared-tun.test
          NS="wbdp4-target-${BACKEND}-$$"
          cleanup() { sudo ip netns del "$NS" 2>/dev/null || true; }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          NFT_FORWARD=''
          if test "$BACKEND" = nft; then
            sudo ip netns exec "$NS" nft add table inet filter
            printf '%s\n' 'add chain inet filter forward { type filter hook forward priority 0; policy drop; }' | sudo ip netns exec "$NS" nft -f -
            NFT_FORWARD='inet:filter:forward'
          else
            sudo ip netns exec "$NS" iptables -P FORWARD DROP
          fi
          sudo ip netns exec "$NS" env \
            WBD_P4_LINUX_TUN_NET=1 \
            WBD_P4_FIREWALL_BACKEND="$BACKEND" \
            WBD_P4_NFT_FORWARD="$NFT_FORWARD" \
            GITHUB_SHA="$GITHUB_SHA" \
            /tmp/p4-linux-shared-tun.test -test.v -test.run '^TestPrivilegedSharedTUNRuntime$'
      - name: OpenWrt TPROXY ownership
        if: matrix.backend == 'nft'
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe nf_tproxy_ipv4 2>/dev/null || true
          sudo modprobe nft_tproxy 2>/dev/null || true
          go test -c ./internal/openwrtclient -o /tmp/p4-openwrt-tproxy.test
          sudo scripts/openwrt_tproxy_netns.sh /tmp/p4-openwrt-tproxy.test
