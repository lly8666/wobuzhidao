name: Apply live FEC weak-1.5x

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - .github/workflows/apply-fec-weak15.yml
      - tools/apply_fec_weak15.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare bootstrap generator
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('tools/apply_fec_weak15.py')
          s = p.read_text(encoding='utf-8')
          if s.count('if n != 1:') != 1:
              raise SystemExit('replace_once guard changed unexpectedly')
          if s.count('text.replace(old, new)') != 1:
              raise SystemExit('replace_once write changed unexpectedly')
          s = s.replace('if n != 1:', 'if n < 1:', 1)
          s = s.replace('text.replace(old, new)', 'text.replace(old, new, 1)', 1)
          p.write_text(s, encoding='utf-8')
          '@ | python -
      - name: Apply FEC implementation
        shell: pwsh
        run: python tools/apply_fec_weak15.py
      - name: Format and inspect
        shell: pwsh
        run: |
          gofmt -w internal/fec/fec.go internal/fec/fastblock_encoder.go internal/fec/block.go internal/fec/weak15_test.go internal/control/link.go internal/linkdata/path.go internal/linkdata/weak15_test.go cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/main_test.go internal/windowsruntime/plan.go internal/windowsruntime/game_mtu.go
          git diff --check
          git status --short
      - name: Test FEC codec and immutable link
        shell: pwsh
        run: |
          go test ./internal/fec ./internal/control ./internal/linkdata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/wbd-link-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/windowsruntime ./internal/windowsgui ./cmd/wbd-windows-gui ./cmd/wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit product implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/fec/fec.go internal/fec/fastblock_encoder.go internal/fec/block.go internal/fec/weak15_test.go internal/control/link.go internal/linkdata/path.go internal/linkdata/weak15_test.go cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/main_test.go internal/windowsruntime/plan.go internal/windowsruntime/game_mtu.go
          git commit -m "feat: restore live FEC weak-1.5x profile"
          git push origin HEAD:agent/fix-per-association-mtu-20260914
