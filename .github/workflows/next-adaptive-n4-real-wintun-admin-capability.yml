name: next-adaptive-n4-real-wintun-admin-capability
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n4-real-wintun-admin-capability.yml"
      - "internal/windowsclient/native_admin_created_wintun_windows_test.go"
      - "internal/windowsclient/native_admin_requested_guid_windows_test.go"
      - "internal/windowsclient/native_admin_guid_journal_windows_test.go"
      - "internal/windowsclient/native_admin_crossproc_crash_windows_test.go"
      - "internal/windowsclient/native_orphan_empty_wal_windows.go"
      - "internal/windowsclient/native_orphan_empty_wal_windows_test.go"
      - "internal/windowsclient/native_orphan_owned_guard_windows.go"
      - "internal/windowsclient/native_orphan_owned_guard_windows_test.go"
      - "internal/windowsclient/native_journal_adapter_proof_windows.go"
      - "internal/windowsclient/native_journal_adapter_proof_windows_test.go"
      - "internal/windowsclient/native_unified_network_transaction.go"
      - "internal/windowsclient/native_admin_created_wintun_mutation_windows_test.go"
      - "internal/windowsclient/native_admin_unified_wal_windows_test.go"
      - "internal/windowsclient/native_unified_assembly_windows.go"
      - "internal/windowsclient/native_unified_assembly_windows_test.go"
      - "internal/windowsclient/tun_windows.go"
      - "internal/windowsclient/native_wintun_owner_windows.go"
      - "internal/windowsclient/native_unified_network_owner_windows.go"
      - "internal/windowsclient/native_dns_snapshot_windows.go"
      - "internal/windowsclient/native_ipinterface_windows.go"
      - "internal/windowsclient/native_mtu_write_windows.go"
      - "internal/windowsclient/native_lease_windows.go"
      - "internal/windowsclient/native_dns_write_windows.go"
      - "internal/windowsclient/native_unified_stage_dns_windows.go"
      - "internal/windowsclient/native_address_snapshot_windows.go"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-native-wintun-readonly:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact SOURCE and fetch pinned official Wintun DLL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts/n4-driver-probe
          python - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile
          url="https://www.wintun.net/builds/wintun-0.14.1.zip"
          expected="07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          with urllib.request.urlopen(url, timeout=60) as resp:
              data=resp.read(4*1024*1024+1)
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit("Wintun official archive hash mismatch")
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              dll=z.read("wintun/bin/amd64/wintun.dll")
          pathlib.Path("artifacts/n4-driver-probe/wintun.dll").write_bytes(dll)
          print("PINNED_WINTUN_ARCHIVE_SHA256="+expected)
          print("WIN64_DLL_SHA256="+hashlib.sha256(dll).hexdigest())
          PY
      - name: Real isolated adapter LUID plus read-only DNS/IPv4 capability
        shell: bash
        env:
          WBD_N4_ADMIN_ISOLATED: "1"
          WBD_N4_ADMIN_PROBE_REPORT: "artifacts/n4-driver-probe/capability.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -mod=readonly -c -o artifacts/n4-driver-probe/n4-probe.test.exe ./internal/windowsclient
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run '^TestN4WindowsHostedCreatedWintunReadOnlyCapability$' -test.timeout=8m
          test -s "$WBD_N4_ADMIN_PROBE_REPORT"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("artifacts/n4-driver-probe/capability.json").read_text())
          assert a["source_sha"] == __import__("os").environ["GITHUB_SHA"]
          assert a["runner"]=="Windows" and a["physical"]=="NOT_RUN"
          assert a["real_write"]=="NOT_RUN" and a["wfp_production"]=="NOT_RUN"
          assert a["result"] in ("UNSUPPORTED","SCOPED_CREATED_WINTUN_READ_ONLY_PASS")
          if a["result"]=="SCOPED_CREATED_WINTUN_READ_ONLY_PASS":
              for field in ("created_adapter","native_luid","ipv4_address_read","ipv4_interface_read","native_dns_read"):
                  assert a[field].startswith("PASS"),field
          print("N4_REAL_WINTUN_CAPABILITY="+a["result"])
          PY
      - name: Isolated Wintun requested GUID corroborated by native LUID-to-GUID
        shell: bash
        env:
          WBD_N4_ADMIN_GUID_PROBE: "1"
          WBD_N4_ADMIN_GUID_PROBE_REPORT: "artifacts/n4-driver-probe/guid-readback.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run '^TestN4WindowsHostedRequestedGUIDNativeReadback$' -test.timeout=3m
          test -s "$WBD_N4_ADMIN_GUID_PROBE_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path("artifacts/n4-driver-probe/guid-readback.json").read_text())
          assert j["source_sha"]==os.environ["GITHUB_SHA"] and j["runner"]=="Windows"
          assert j["physical"]=="NOT_RUN" and j["wfp"]=="NOT_RUN"
          assert j["os_route"]=="NOT_RUN" and j["cross_process_crash"]=="NOT_RUN"
          assert j["result"] in ("SCOPED_REQUESTED_GUID_NATIVE_MATCH_PASS",
             "UNSUPPORTED_WINTUN_DLL","UNSUPPORTED_REQUESTED_GUID_CREATE")
          if j["result"]=="SCOPED_REQUESTED_GUID_NATIVE_MATCH_PASS":
              assert j["requested_guid"].startswith("PASS")
              assert j["native_luid_guid"].startswith("PASS")
          print("N4_REQUESTED_GUID_PROBE="+j["result"])
          PY
      - name: Live Wintun GUID + generation vs bounded checksum WAL (read-only)
        shell: bash
        env:
          WBD_N4_ADMIN_GUID_JOURNAL: "1"
          WBD_N4_ADMIN_GUID_JOURNAL_REPORT: "artifacts/n4-driver-probe/guid-journal.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run '^TestN4WindowsHostedGUIDBoundJournalReadOnlyProof$' -test.timeout=3m
          test -s "$WBD_N4_ADMIN_GUID_JOURNAL_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path("artifacts/n4-driver-probe/guid-journal.json").read_text())
          assert j["source_sha"]==os.environ["GITHUB_SHA"] and j["runner"]=="Windows"
          assert j["cross_process_crash"]=="NOT_RUN" and j["physical"]=="NOT_RUN"
          assert j["wfp"]=="NOT_RUN" and j["routes"]=="NOT_RUN"
          assert j["result"] in ("SCOPED_REAL_JOURNAL_GUID_READ_ONLY_PROOF_PASS","UNSUPPORTED_DRIVER_OR_ADMIN")
          if j["result"]=="SCOPED_REAL_JOURNAL_GUID_READ_ONLY_PROOF_PASS":
              for field in ("native_wintun","guid_journal","legacy","foreign","corruption"):
                  assert j[field].startswith("PASS"),field
          print("N4_GUID_JOURNAL_READONLY="+j["result"])
          PY
      - name: Real child TerminateProcess + no-create read-only WAL identity
        shell: bash
        env:
          WBD_N4_ADMIN_CRASH_PROBE: "1"
          WBD_N4_ADMIN_CRASH_PROBE_REPORT: "artifacts/n4-driver-probe/crash-readonly.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run '^TestN4WindowsHostedCrossProcessCrashReadOnlyIdentity$' -test.timeout=3m
          test -s "$WBD_N4_ADMIN_CRASH_PROBE_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("artifacts/n4-driver-probe/crash-readonly.json").read_text())
          assert x["source_sha"]==os.environ["GITHUB_SHA"] and x["runner"]=="Windows"
          for k in ("physical","wfp","routes","dns","real_apply_recover"):
              assert x[k]=="NOT_RUN"
          assert x["result"] in ("SCOPED_CROSSPROCESS_CRASH_READONLY_IDENTITY_PASS","UNSUPPORTED_ORPHAN_ADAPTER_NOT_PERSISTED")
          if x["result"]=="UNSUPPORTED_ORPHAN_ADAPTER_NOT_PERSISTED":
              assert x["empty_wal_recovery"] in ("PASS_EMPTY_WAL_ONLY_NATIVE_ABSENCE_AND_WFP_READONLY","UNSUPPORTED_OS_ABSENCE_UNPROVEN")
          if x["result"]=="SCOPED_CROSSPROCESS_CRASH_READONLY_IDENTITY_PASS":
              for k in ("child_crash","no_create_reopen","journal_guid","borrowed_cannot_mutate"):
                  assert x[k].startswith("PASS")
          print("N4_CRASH_READONLY="+x["result"])
          PY
      - name: Crash after durable guard intent (no OS guard or route write)
        shell: bash
        env:
          WBD_N4_ADMIN_GUARD_CRASH_PROBE: "1"
          WBD_N4_ADMIN_GUARD_CRASH_PROBE_REPORT: "artifacts/n4-driver-probe/crash-guard-intent.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run TestN4WindowsHostedRealGuardIntentOnlyCrashRecovery -test.timeout=3m
          test -s "$WBD_N4_ADMIN_GUARD_CRASH_PROBE_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("artifacts/n4-driver-probe/crash-guard-intent.json").read_text())
          assert x["source_sha"]==os.environ["GITHUB_SHA"] and x["runner"]=="Windows"
          assert x["wfp"]=="READONLY_ABSENCE_ONLY"
          assert all(x[k]=="NOT_RUN" for k in ("route_write","dns_write","full_crash_recover","physical"))
          assert x["result"] in ("SCOPED_GUARD_INTENT_ONLY_ORPHAN_RETIRE_PASS",
             "UNSUPPORTED_ORIGINAL_ADAPTER_PERSISTED","UNSUPPORTED_SAFE_RETIRE_UNPROVEN")
          if x["result"]=="SCOPED_GUARD_INTENT_ONLY_ORPHAN_RETIRE_PASS":
              for k in ("live_refusal","child_crash","guard_intent_retire","route_sidecar"):
                  assert x[k].startswith("PASS"),k
          print("N4_GUARD_INTENT_CRASH="+x["result"])
          PY
      - name: Real native lease DAD, MTU and DNS Set/Clear on isolated created Wintun
        shell: bash
        env:
          WBD_N4_ADMIN_MUTATION: "1"
          WBD_N4_ADMIN_MUTATION_REPORT: "artifacts/n4-driver-probe/mutation.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run '^TestN4WindowsHostedOwnedAdapterNativeIPWritesAndRestore$' -test.timeout=10m
          test -s "$WBD_N4_ADMIN_MUTATION_REPORT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads(Path("artifacts/n4-driver-probe/mutation.json").read_text())
          assert j["source_sha"]==os.environ["GITHUB_SHA"]
          assert j["physical"]=="NOT_RUN" and j["routes"]=="NOT_RUN"
          assert j["guard"]=="TEST_ONLY_FAKE_NOT_PRODUCTION_WFP"
          assert j["route_probe"] in ("NOT_RUN","PASS_ISOLATED_TESTNET_32_CREATE_GET_DELETE")
          assert j["result"] in ("SCOPED_ISOLATED_NATIVE_IP_WRITE_RESTORE_PASS",
             "UNSUPPORTED_DRIVER_OR_ADMIN","UNSUPPORTED_FRESH_DNS_BASELINE"),j["result"]
          if j["result"]=="SCOPED_ISOLATED_NATIVE_IP_WRITE_RESTORE_PASS":
              for k in ("adapter","lease","mtu","dns","route_probe"):
                  assert j[k].startswith("PASS"),k
          print("N4_REAL_WINTUN_MUTATION="+j["result"])
          PY
      - name: Real Wintun unified WAL Apply/Recover (fake WFP and routes)
        shell: bash
        env:
          WBD_N4_ADMIN_UNIFIED_WAL: "1"
          WBD_N4_ADMIN_UNIFIED_WAL_REPORT: "artifacts/n4-driver-probe/unified-wal.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./artifacts/n4-driver-probe/n4-probe.test.exe -test.v -test.run TestN4WindowsHostedUnifiedWALRealLeaseMTUDNS -test.timeout=8m
          test -s "$WBD_N4_ADMIN_UNIFIED_WAL_REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("artifacts/n4-driver-probe/unified-wal.json").read_text())
          assert r["source_sha"]==os.environ["GITHUB_SHA"] and r["runner"]=="Windows"
          assert r["physical"]=="NOT_RUN" and r["cross_process_crash"]=="NOT_RUN"
          assert r["guard"]=="TEST_ONLY_FAKE_NOT_PRODUCTION_WFP"
          assert r["routes"]=="TEST_ONLY_FAKE_NO_CAPTURE_ROUTES"
          assert r["result"] in ("SCOPED_REAL_WINTUN_NATIVE_WAL_APPLY_RECOVER_PASS",
            "UNSUPPORTED_DRIVER_OR_ADMIN","UNSUPPORTED_FRESH_DNS_BASELINE")
          if r["result"]=="SCOPED_REAL_WINTUN_NATIVE_WAL_APPLY_RECOVER_PASS":
              for key in ("adapter","lease","mtu","dns","stage_assembly"):
                  assert r[key].startswith("PASS"),key
          print("N4_HOSTED_REAL_WAL="+r["result"])
          PY
      - name: Publish honest limited driver evidence (no binary/DLL)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n4-created-wintun-readonly-${{ matrix.runner }}-${{ github.sha }}
          path: |
            artifacts/n4-driver-probe/capability.json
            artifacts/n4-driver-probe/guid-readback.json
            artifacts/n4-driver-probe/guid-journal.json
            artifacts/n4-driver-probe/crash-readonly.json
            artifacts/n4-driver-probe/crash-guard-intent.json
            artifacts/n4-driver-probe/mutation.json
            artifacts/n4-driver-probe/unified-wal.json
          if-no-files-found: warn
          retention-days: 30
