name: next-fec-simd-core
on:
  push:
    branches: ["next/fec-simd-20261010"]
    paths:
      - "internal/fec/**"
      - "internal/linkdata/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/next-fec-simd-core.yml"
permissions: {contents: read}
concurrency:
  group: fec-simd-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-amd64-isa-and-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Go module, ISA and scalar oracles
        run: |
          set -euo pipefail
          go mod verify
          go test ./internal/fec ./internal/linkdata -count=1
          go test -tags=wbd_fec_scalar ./internal/fec ./internal/linkdata -count=1
          go test -tags=noasm ./internal/fec ./internal/linkdata -count=1
          go test -tags=wbd_fec_fused ./internal/fec ./internal/linkdata -count=1
          go test -race -tags=wbd_fec_fused ./internal/fec ./internal/linkdata -count=1
          GOOS=linux GOARCH=arm GOARM=7 go build ./internal/fec ./internal/linkdata
          GOOS=linux GOARCH=arm64 go build ./internal/fec ./internal/linkdata
      - name: Expose arch and actual capability (not CPU gain)
        run: |
          uname -m
          go env GOOS GOARCH GOAMD64
          go test -v ./internal/fec -run '^TestFECMulEntireGF256AndRuntimeFallback$' -count=1
  windows-amd64-core:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Windows native build and tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/fec ./internal/linkdata -count=1
          go test -tags=wbd_fec_scalar ./internal/fec -count=1
          go test -tags=wbd_fec_fused ./internal/fec -count=1
          go build ./...
          go env GOOS GOARCH GOAMD64
  linux-arm64-native-core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: false}
      - name: Verify true native ISA, not cross-build
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          cat /proc/cpuinfo | head -n 35
          go test -v ./internal/fec -run '^TestFECMulEntireGF256AndRuntimeFallback$' -count=1
          go test ./internal/fec ./internal/linkdata -count=1
          go test -tags=wbd_fec_scalar ./internal/fec ./internal/linkdata -count=1
          go test -tags=wbd_fec_fused ./internal/fec ./internal/linkdata -count=1
          go test -race ./internal/fec ./internal/linkdata -count=1
