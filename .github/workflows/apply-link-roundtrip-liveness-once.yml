          Path('cmd/wbd-link-proxy/liveness_test.go').write_text(r'''package main

import (
	"os"
	"strings"
	"testing"
	"time"

	"github.com/lly8666/wobuzhidao/internal/control"
	"github.com/lly8666/wobuzhidao/internal/linkdata"
)

func testLinkPath(t *testing.T) *linkdata.Path {
	t.Helper()
	path, err := linkdata.New(control.LinkConfig{
		FECMode: control.FECOff, Scheduler: control.FECSchedulerNone,
		MTU: 1400, LaneCount: 1,
	}, maxBlocks)
	if err != nil {
		t.Fatal(err)
	}
	return path
}

func TestClientRemoteRXDeadlineUsesThreeKeepaliveWindows(t *testing.T) {
	base := time.Unix(1_700_000_000, 0)
	keepalive := 10 * time.Second
	if clientRemoteRXExpired(base, base.Add(3*keepalive-time.Nanosecond), keepalive) {
		t.Fatal("liveness budget expired before three keepalive windows")
	}
	if !clientRemoteRXExpired(base, base.Add(3*keepalive), keepalive) {
		t.Fatal("liveness budget did not expire at three keepalive windows")
	}
}

func TestKeepaliveTrackerUsesTwelveProbesInsideThreeWindowBudget(t *testing.T) {
	start := time.Unix(1_700_000_000, 0)
	keepalive := 6 * time.Second
	wait := clientKeepaliveProbeWait(keepalive)
	tracker := newClientKeepaliveTracker(start, keepalive)
	now := start.Add(keepalive)
	var nonce uint64
	for i := 1; i <= clientKeepaliveTotalProbeAttempts; i++ {
		send, gotNonce, dead := tracker.poll(now, keepalive)
		if dead || !send {
			t.Fatalf("attempt %d send=%t dead=%t", i, send, dead)
		}
		if i == 1 {
			nonce = gotNonce
		} else if gotNonce != nonce {
			t.Fatalf("attempt %d changed nonce: got=%d want=%d", i, gotNonce, nonce)
		}
		now = now.Add(wait)
	}
	if now.Sub(start) != clientRemoteRXTimeout(keepalive) {
		t.Fatalf("retirement point=%s want=%s", now.Sub(start), clientRemoteRXTimeout(keepalive))
	}
	if send, _, dead := tracker.poll(now, keepalive); send || !dead {
		t.Fatalf("after 12 misses send=%t dead=%t", send, dead)
	}
}

func TestKeepaliveTrackerTwelfthProbePongRecovers(t *testing.T) {
	start := time.Unix(1_700_000_000, 0)
	keepalive := 60 * time.Millisecond
	wait := clientKeepaliveProbeWait(keepalive)
	tracker := newClientKeepaliveTracker(start, keepalive)
	now := start.Add(keepalive)
	var nonce uint64
	for i := 1; i <= clientKeepaliveTotalProbeAttempts; i++ {
		send, gotNonce, dead := tracker.poll(now, keepalive)
		if !send || dead {
			t.Fatalf("attempt %d send=%t dead=%t", i, send, dead)
		}
		nonce = gotNonce
		if i != clientKeepaliveTotalProbeAttempts {
			now = now.Add(wait)
		}
	}
	pongAt := now.Add(wait / 2)
	if !tracker.observePong(nonce, pongAt, keepalive) {
		t.Fatal("matching PONG on final allowed probe did not recover")
	}
	if send, _, dead := tracker.poll(start.Add(clientRemoteRXTimeout(keepalive)), keepalive); send || dead {
		t.Fatalf("recovered tracker fired at old deadline send=%t dead=%t", send, dead)
	}
}

func TestKeepaliveTrackerRejectsUnmatchedPong(t *testing.T) {
	start := time.Unix(1_700_000_000, 0)
	keepalive := 30 * time.Millisecond
	tracker := newClientKeepaliveTracker(start, keepalive)
	_, nonce, _ := tracker.poll(start.Add(keepalive), keepalive)
	if tracker.observePong(nonce+1, start.Add(keepalive+time.Millisecond), keepalive) {
		t.Fatal("unmatched PONG proved liveness")
	}
}

func TestClientDataLoopOutboundTrafficCannotMaskMissingRoundTrip(t *testing.T) {
	client := udp4(t)
	dtls := udp4(t)
	app := udp4(t)
	defer client.Close()
	defer dtls.Close()
	defer app.Close()

	stop := make(chan os.Signal, 1)
	done := make(chan error, 1)
	keepalive := 10 * time.Millisecond
	go func() {
		done <- clientDataLoop(client, addr(dtls), testLinkPath(t), establishedStartup{}, keepalive, stop)
	}()

	deadline := time.Now().Add(500 * time.Millisecond)
	for time.Now().Before(deadline) {
		_, _ = app.WriteToUDP([]byte("outbound-does-not-prove-peer-liveness"), addr(client))
		select {
		case err := <-done:
			if err == nil || !strings.Contains(err.Error(), "liveness timeout") {
				t.Fatalf("client loop error=%v", err)
			}
			return
		case <-time.After(5 * time.Millisecond):
		}
	}
	stop <- os.Interrupt
	t.Fatal("continuous outbound traffic masked keepalive round-trip failure")
}

func TestClientDataLoopInboundTrafficCannotMaskUpstreamBlackhole(t *testing.T) {
	client := udp4(t)
	dtls := udp4(t)
	defer client.Close()
	defer dtls.Close()

	wire, err := control.MarshalLink(control.Ping{Nonce: 7})
	if err != nil {
		t.Fatal(err)
	}
	stopInbound := make(chan struct{})
	go func() {
		ticker := time.NewTicker(2 * time.Millisecond)
		defer ticker.Stop()
		for {
			select {
			case <-stopInbound:
				return
			case <-ticker.C:
				_, _ = dtls.WriteToUDP(wire, addr(client))
			}
		}
	}()
	defer close(stopInbound)

	stop := make(chan os.Signal, 1)
	done := make(chan error, 1)
	go func() {
		done <- clientDataLoop(client, addr(dtls), testLinkPath(t), establishedStartup{}, 20*time.Millisecond, stop)
	}()
	select {
	case err := <-done:
		if err == nil || !strings.Contains(err.Error(), "liveness timeout") {
			t.Fatalf("client loop error=%v", err)
		}
	case <-time.After(400 * time.Millisecond):
		stop <- os.Interrupt
		t.Fatal("continuous downstream traffic masked missing client->server->client round trip")
	}
}

func TestClientDataLoopKeepaliveSurvives300msRTTAndTwoDroppedProbes(t *testing.T) {
	client := udp4(t)
	dtls := udp4(t)
	defer client.Close()
	defer dtls.Close()

	peerStop := make(chan struct{})
	go func() {
		buf := make([]byte, 65535)
		seen := 0
		for {
			_ = dtls.SetReadDeadline(time.Now().Add(20 * time.Millisecond))
			n, peer, err := dtls.ReadFromUDP(buf)
			if err != nil {
				select {
				case <-peerStop:
					return
				default:
					continue
				}
			}
			frame, err := control.UnmarshalLink(buf[:n])
			if err != nil {
				continue
			}
			ping, ok := frame.(control.Ping)
			if !ok {
				continue
			}
			seen++
			if seen <= 2 {
				continue
			}
			pong, err := control.MarshalLink(control.Pong{Nonce: ping.Nonce})
			if err != nil {
				continue
			}
			go func(dst *net.UDPAddr, b []byte) {
				time.Sleep(300 * time.Millisecond)
				_, _ = dtls.WriteToUDP(b, dst)
			}(peer, pong)
		}
	}()
	defer close(peerStop)

	stop := make(chan os.Signal, 1)
	done := make(chan error, 1)
	go func() {
		done <- clientDataLoop(client, addr(dtls), testLinkPath(t), establishedStartup{}, 300*time.Millisecond, stop)
	}()

	select {
	case err := <-done:
		t.Fatalf("300ms RTT/two dropped probes caused false retirement: %v", err)
	case <-time.After(850 * time.Millisecond):
	}
	stop <- os.Interrupt
	select {
	case err := <-done:
		if err != nil {
			t.Fatalf("shutdown error=%v", err)
		}
	case <-time.After(time.Second):
		t.Fatal("client loop did not stop")
	}
}
