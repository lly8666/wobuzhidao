name: Windows routing policy

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
  workflow_dispatch:

jobs:
  routing-policy:
    name: routing ${{ matrix.policy }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        policy: ['000', '001', '010', '011', '100', '101', '110', '111']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go routing packages
        shell: pwsh
        run: |
          go test ./internal/ipset ./internal/windowsruntime ./internal/windowsgui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/wbd-windows-gui ./cmd/wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate routing policy ${{ matrix.policy }}
        shell: pwsh
        env:
          WBD_ROUTING_POLICY_CASE: ${{ matrix.policy }}
        run: |
          go test ./internal/windowsruntime -run TestRoutingPolicyActionCase -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_routing_policy_action_test.ps1 -Policy '${{ matrix.policy }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
