name: windows-linux-npcap-keepalive-soak

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/windows-linux-npcap-keepalive-soak.yml'
      - 'scripts/windows_linux_wintun_keepalive_soak.ps1'
      - '.github/scripts/windows_game_pause_resume.py'
      - 'scripts/wsl_wintun_lane_soak_server.sh'
      - 'internal/windowsruntime/**'
      - 'internal/windowsgui/**'
      - 'cmd/wbd-windows-qualify/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-linux-npcap-keepalive-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { lanes: 1, fec: 'off', slug: '1lane-fec-off' }
          - { lanes: 1, fec: '20:20', slug: '1lane-fec-on' }
          - { lanes: 4, fec: 'off', slug: '4lane-fec-off' }
          - { lanes: 4, fec: '20:20', slug: '4lane-fec-on' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux-soak-linux-assets
          path: ${{ runner.temp }}\linux-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34910039256
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux-soak-windows-assets
          path: ${{ runner.temp }}\windows-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34910039256
      - name: Rebuild current Windows qualifier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'windows-assets\wbd-windows-qualify.exe'
          go build -trimpath -o $out .\cmd\wbd-windows-qualify
          if($LASTEXITCODE){throw 'current wbd-windows-qualify build failed'}
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-assets\QUALIFIER_SOURCE_SHA.txt') -Value $env:GITHUB_SHA -Encoding ascii
          Write-Output "WBD_CURRENT_QUALIFIER_READY sha=$env:GITHUB_SHA"
      - name: Patch and validate keepalive formal harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $h=(Resolve-Path '.\scripts\windows_linux_wintun_keepalive_soak.ps1').Path
          $patched=New-Object System.Collections.Generic.List[string]
          $argLineCount=0;$startLineCount=0;$proofCount=0
          foreach($line in (Get-Content -LiteralPath $h)){
            if($line.StartsWith('$serverArgumentLine=')){
              $argLineCount++
              $patched.Add('function Start-WslServer([string[]]$Arguments){$psi=[System.Diagnostics.ProcessStartInfo]::new();$psi.FileName=''wsl.exe'';$psi.UseShellExecute=$false;foreach($arg in $Arguments){[void]$psi.ArgumentList.Add([string]$arg)};$proc=[System.Diagnostics.Process]::new();$proc.StartInfo=$psi;if(-not$proc.Start()){throw ''failed to start WSL keepalive server''};return $proc}')
              $patched.Add('[string[]]$serverArgs=@(''-d'',$distro,''--'',''sudo'',''bash'',$wslServerScript,$wslAssets,$wslLog,"$innerMTU","$ConnectionMTU","$Lanes","$LossPct","${ServerIdleSec}s",''420s'')')
              continue
            }
            if($line.StartsWith('$server=Start-Process -FilePath ''wsl.exe''')){$startLineCount++;$patched.Add('$server=Start-WslServer $serverArgs');continue}
            if($line.Contains('initial real-Npcap production connection proof missing')){
              $proofCount++
              $patched.Add('  $qualStdout=Get-Content -LiteralPath $qualOut -Raw;$qualStderr=if(Test-Path -LiteralPath $qualErr){Get-Content -LiteralPath $qualErr -Raw}else{''''};$qualText=$qualStdout+"`n"+$qualStderr')
              $patched.Add('  if($qualText-notmatch''WBD_FAKETCP_WINDOWS_RAW_SYNACK_RX''-or$qualStdout-notmatch''WBD_WINDOWS_QUALIFY_CONNECTED''){throw ''initial real-Npcap production connection proof missing''}')
              $patched.Add('  $keepaliveReady=([regex]::Matches($qualStdout,''WBD_LINK_READY role=client[^\r\n]*keepalive=0s'')).Count;if($keepaliveReady-lt$Lanes){throw "explicit keepalive=0 not active on all initial lanes: ready=$keepaliveReady want=$Lanes"};Write-Output "WBD_KEEPALIVE_ZERO_LINK_READY lanes=$keepaliveReady"')
              continue
            }
            $patched.Add($line)
          }
          if($argLineCount-ne1-or$startLineCount-ne1-or$proofCount-ne1){throw "keepalive source shape changed arg_line=$argLineCount start_line=$startLineCount proof_line=$proofCount"}
          Set-Content -LiteralPath $h -Value $patched -Encoding utf8
          $tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($h,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw 'keepalive harness PowerShell parse failed'}
          python -m py_compile .\.github\scripts\windows_game_pause_resume.py
          $serverText=Get-Content -LiteralPath '.\scripts\wsl_wintun_lane_soak_server.sh' -Raw
          if($serverText-notmatch'(?m)^SHARED_TUN_IDLE_TIMEOUT=\$\{8:-180s\}$'){throw 'shared-TUN idle parameter missing'}
          if(-not$serverText.Contains('-idle-timeout "$SHARED_TUN_IDLE_TIMEOUT"')){throw 'shared-TUN gateway does not use parameterized idle timeout'}
          $harnessText=Get-Content -LiteralPath $h -Raw
          if(-not$harnessText.Contains('ArgumentList.Add')-or-not$harnessText.Contains("'420s'")){throw 'keepalive harness exact-argv/420s launch missing'}
          if(-not$harnessText.Contains('keepalive=0s')){throw 'keepalive=0 runtime proof missing'}
          Write-Output 'WBD_KEEPALIVE_SOAK_PRECHECK_PASS gateway_idle=420s link_idle=60s launch=exact-argv evidence=stdout+stderr keepalive=0s'
      - name: Provision and verify WSL Linux runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';wsl.exe --status;if($LASTEXITCODE){throw 'WSL2 runtime unavailable'}
          $marker=Join-Path $env:RUNNER_TEMP 'wbd-soak-ephemeral-wsl.txt';$distros=@(& wsl.exe -l -q|ForEach-Object{$_.Replace([string][char]0,'').Trim()}|Where-Object{$_})
          if($distros.Count-eq0){$d='Ubuntu-24.04';& wsl.exe --install -d $d --no-launch --web-download;if($LASTEXITCODE){throw 'WSL distro install failed'};$deadline=[DateTime]::UtcNow.AddMinutes(3);do{Start-Sleep 2;$distros=@(& wsl.exe -l -q|ForEach-Object{$_.Replace([string][char]0,'').Trim()}|Where-Object{$_})}while(($distros-notcontains$d)-and[DateTime]::UtcNow-lt$deadline);if($distros-notcontains$d){throw 'WSL distro did not register'};Set-Content $marker $d -Encoding ascii;& wsl.exe -d $d -u root -- bash -lc "printf '[user]\ndefault=root\n' > /etc/wsl.conf";& wsl.exe --terminate $d}else{$d=[string]$distros[0]}
          $d=$d.Replace([string][char]0,'').Trim();& wsl.exe -d $d -u root -- bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables python3 sudo';if($LASTEXITCODE){throw 'WSL prerequisites failed'}
          & wsl.exe -d $d -- true;if($LASTEXITCODE){throw 'selected WSL distro preflight failed'}
          Write-Output "WBD_WSL_RUNTIME_READY distro=$d"
      - name: Install signed ephemeral Npcap 1.88 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$driverUrl='https://github.com/user-attachments/files/32200327/npcap.zip';$driverZip=Join-Path $env:RUNNER_TEMP 'npcap-test.zip';$driverDir=Join-Path $env:RUNNER_TEMP 'npcap-test';Invoke-WebRequest -UseBasicParsing -Uri $driverUrl -OutFile $driverZip
          $driverHash=(Get-FileHash -Algorithm SHA256 $driverZip).Hash.ToLowerInvariant();if($driverHash-ne'6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'Npcap driver ZIP hash mismatch'};Expand-Archive $driverZip $driverDir -Force
          $officialUrl='https://npcap.com/dist/npcap-1.88.exe';$official=Join-Path $env:RUNNER_TEMP 'npcap-1.88.exe';$extract=Join-Path $env:RUNNER_TEMP 'npcap-1.88-extract';Invoke-WebRequest -UseBasicParsing $officialUrl -OutFile $official;$officialHash=(Get-FileHash -Algorithm SHA256 $official).Hash.ToLowerInvariant();if($officialHash-ne'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'Npcap official container hash mismatch'}
          $sig=Get-AuthenticodeSignature $official;$subject=if($sig.SignerCertificate){[string]$sig.SignerCertificate.Subject}else{''};if($sig.Status-ne'Valid'-or$subject-notmatch'Nmap Software LLC'){throw 'Npcap official signature invalid'};New-Item -ItemType Directory -Force $extract|Out-Null;& 7z x -y "-o$extract" $official|Out-Null;if($LASTEXITCODE){throw 'Npcap extraction failed'}
          .\scripts\windows_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $driverDir -UserlandExtractDir $extract;.\scripts\windows_npcap_driver_ci.ps1 -Action Status;Add-Content $env:GITHUB_PATH "$env:SystemRoot\System32\Npcap"
          Write-Output "WBD_NPCAP_TEST_RUNTIME_READY version=1.88 driver_zip_sha256=$driverHash official_sha256=$officialHash"
      - name: Run keepalive zero 20-220-60 production flow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$log=Join-Path $env:RUNNER_TEMP 'keepalive-${{ matrix.slug }}';New-Item -ItemType Directory -Force $log|Out-Null
          [ordered]@{qualifier_source_sha=$env:GITHUB_SHA;base_artifact_source_sha='4cd0c700fc386de21734b3e66e7b58182ce538bf';artifact_run_id=34910039256}|ConvertTo-Json|Set-Content -LiteralPath(Join-Path $log 'product-source.json') -Encoding utf8
          .\scripts\windows_linux_wintun_keepalive_soak.ps1 -BinDir "$env:RUNNER_TEMP\windows-assets" -LinuxAssets "$env:RUNNER_TEMP\linux-assets" -Lanes ${{ matrix.lanes }} -FEC '${{ matrix.fec }}' -ConnectionMTU 1420 -RateBps 2000000 -LossPct 15 -FirstDurationSec 20 -PauseDurationSec 220 -SecondDurationSec 60 -ServerIdleSec 60 -LogDir $log
      - name: Print keepalive summary
        if: always()
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'keepalive-${{ matrix.slug }}';foreach($n in @('product-source.json','summary.json','pause-resume-result.json','mtu-budget.json','network-end.log','error-scan.log','qualifier.stdout.log','qualifier.stderr.log','link-server.log','wsl-wrapper.stderr.log')){$p=Join-Path $log $n;if(Test-Path $p){Write-Output "=== $n ===";Get-Content $p|Select-Object -First 350}}
      - name: Remove ephemeral Npcap
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue';.\scripts\windows_npcap_driver_ci.ps1 -Action Cleanup;if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Remove ephemeral WSL distribution
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue';$marker=Join-Path $env:RUNNER_TEMP 'wbd-soak-ephemeral-wsl.txt';if(Test-Path $marker){$d=(Get-Content $marker -Raw).Trim();if($d){& wsl.exe --terminate $d 2>$null;& wsl.exe --unregister $d;if($LASTEXITCODE){throw 'WSL unregister failed'}}}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npcap-keepalive-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}\keepalive-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
