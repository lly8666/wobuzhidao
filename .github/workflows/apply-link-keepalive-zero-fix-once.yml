name: Apply existing LINK keepalive zero semantics

on:
  push:
    branches:
      - feat/single-flow-reality-faketcp
    paths:
      - .github/workflows/apply-link-keepalive-zero-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/single-flow-reality-faketcp
          fetch-depth: 0
      - name: Apply keepalive=0 semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cmd/wbd-link-proxy/main.go')
          s = p.read_text()
          old = '''\tkeepalive := o.keepalive
          \tif keepalive <= 0 {
          \t\tkeepalive = defaultKeepalive
          \t}
          '''
          new = '''\tkeepalive := o.keepalive
          '''
          assert s.count(old) == 1, 'unexpected runClient keepalive normalization shape'
          s = s.replace(old, new, 1)

          old = 'flag.DurationVar(&o.keepalive, "keepalive", defaultKeepalive, "client heartbeat interval for DTLS-protected WBD PING")'
          new = 'flag.DurationVar(&o.keepalive, "keepalive", defaultKeepalive, "client heartbeat interval for DTLS-protected WBD PING; 0 disables heartbeat/liveness enforcement")'
          assert s.count(old) == 1, 'unexpected keepalive flag help shape'
          s = s.replace(old, new, 1)

          old = '''\t\tif !now.Before(nextPing) {
          \t\t\tif err := sendLifecycle(conn, dtlsAddr, control.Ping{Nonce: uint64(now.UnixNano())}); err != nil {
          '''
          new = '''\t\tif clientKeepaliveDue(nextPing, now, keepalive) {
          \t\t\tif err := sendLifecycle(conn, dtlsAddr, control.Ping{Nonce: uint64(now.UnixNano())}); err != nil {
          '''
          assert s.count(old) == 1, 'unexpected client ping scheduling shape'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('cmd/wbd-link-proxy/liveness.go')
          s = p.read_text()
          helper = '''
          func clientKeepaliveDue(nextPing, now time.Time, keepalive time.Duration) bool {
          \treturn keepalive > 0 && !now.Before(nextPing)
          }
          '''
          assert 'func clientKeepaliveDue(' not in s, 'helper already exists'
          p.write_text(s.rstrip() + '\n' + helper)

          Path('cmd/wbd-link-proxy/keepalive_zero_test.go').write_text('''package main

          import (
          \t"testing"
          \t"time"
          )

          func TestClientKeepaliveDueDisabledAtZero(t *testing.T) {
          \tnow := time.Unix(1000, 0)
          \tif clientKeepaliveDue(now.Add(-time.Hour), now, 0) {
          \t\tt.Fatal("keepalive=0 must not schedule LINK PING")
          \t}
          \tif clientKeepaliveDue(now.Add(-time.Hour), now, -time.Second) {
          \t\tt.Fatal("non-positive keepalive must stay disabled")
          \t}
          }

          func TestClientKeepaliveDueAtPositiveInterval(t *testing.T) {
          \tnow := time.Unix(1000, 0)
          \tif clientKeepaliveDue(now.Add(time.Millisecond), now, time.Second) {
          \t\tt.Fatal("positive keepalive fired before deadline")
          \t}
          \tif !clientKeepaliveDue(now, now, time.Second) {
          \t\tt.Fatal("positive keepalive did not fire at deadline")
          \t}
          }

          func TestKeepaliveZeroNeverForcesRemoteRXExpiry(t *testing.T) {
          \tlast := time.Unix(1000, 0)
          \tif clientRemoteRXExpired(last, last.Add(24*time.Hour), 0) {
          \t\tt.Fatal("keepalive=0 must not force blackhole retirement")
          \t}
          }
          ''')
          PY
          gofmt -w cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/liveness.go cmd/wbd-link-proxy/keepalive_zero_test.go
          go test ./cmd/wbd-link-proxy
      - name: Commit corrected semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-link-keepalive-zero-fix-once.yml
          git add cmd/wbd-link-proxy/main.go cmd/wbd-link-proxy/liveness.go cmd/wbd-link-proxy/keepalive_zero_test.go
          git commit -m 'fix(link): honor keepalive zero as disabled'
          git push origin HEAD:feat/single-flow-reality-faketcp
