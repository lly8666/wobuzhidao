name: fec-timehorizon5s-verify
on:
  push:
    branches: [agent/socket-diag-fec640-20260913]
    paths: ['.github/triggers/fec-timehorizon5s-verify.trigger']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout horizon64 product candidate
        uses: actions/checkout@v4
        with:
          ref: d7d5d18d768c3dd14be067e7b46541e6d00c7b2c
          path: product
      - name: Checkout suite
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: suite
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - name: Apply 5s wall-clock horizon candidate
        run: python3 "$GITHUB_WORKSPACE/suite/.github/scripts/instrument_fec_time_horizon5s_diag.py" "$GITHUB_WORKSPACE/product"
      - name: Format candidate
        working-directory: product
        run: gofmt -w internal/fec/block.go internal/fec/decoder_observe.go internal/fec/block_time_horizon_test.go
      - name: FEC unit tests
        working-directory: product
        run: go test ./internal/fec/...
      - name: FEC and session race tests
        working-directory: product
        run: go test -race ./internal/fec/... ./internal/session/...
      - name: Focused generation and time horizon tests
        working-directory: product
        run: go test ./internal/fec -run 'TestBlockDecoder(RecoveryHorizon|LateFirstSeen|TimeHorizon)' -count=10
