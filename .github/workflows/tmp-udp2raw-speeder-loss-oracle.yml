name: tmp-udp2raw-speeder-loss-oracle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-udp2raw-speeder-loss-oracle.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iptables
      - name: Download pinned udp2raw and UDPspeeder
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/udp2raw.tgz https://github.com/wangyu-/udp2raw/releases/download/20230206.0/udp2raw_binaries.tar.gz
          curl -LfsS -o /tmp/speeder.tgz https://github.com/wangyu-/UDPspeeder/releases/download/20230206.0/speederv2_binaries.tar.gz
          mkdir -p /tmp/oracle/udp2raw /tmp/oracle/speeder
          tar -xzf /tmp/udp2raw.tgz -C /tmp/oracle/udp2raw
          tar -xzf /tmp/speeder.tgz -C /tmp/oracle/speeder
          find /tmp/oracle -maxdepth 2 -type f -printf '%p\n'
          sha256sum /tmp/udp2raw.tgz /tmp/speeder.tgz /tmp/oracle/udp2raw/udp2raw_amd64 /tmp/oracle/speeder/speederv2_amd64 | tee /tmp/oracle/SHA256SUMS.txt
          chmod +x /tmp/oracle/udp2raw/udp2raw_amd64 /tmp/oracle/speeder/speederv2_amd64
      - name: Write deterministic UDP oracle harness
        run: |
          cat > /tmp/oracle/oracle.py <<'PY'
          import argparse, heapq, json, math, random, select, signal, socket, struct, sys, time

          def pct(v, p):
              if not v: return 0.0
              v=sorted(v); i=max(0,min(len(v)-1,math.ceil(p*len(v)/100)-1)); return v[i]

          def echo(port):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('127.0.0.1',port))
              while True:
                  d,a=s.recvfrom(65535); s.sendto(d,a)

          def proxy(port,target_port,loss,delay_ms,seed,stats):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('127.0.0.1',port)); s.setblocking(False)
              target=('127.0.0.1',target_port); peer=None; q=[]; rng=random.Random(seed); seq=0
              st={'loss_pct':loss,'forward_seen':0,'forward_dropped':0,'forward_bytes':0,'reverse_seen':0,'reverse_bytes':0}
              stop=False
              def done(*_):
                  nonlocal stop; stop=True
              signal.signal(signal.SIGTERM,done); signal.signal(signal.SIGINT,done)
              while not stop:
                  now=time.monotonic()
                  while q and q[0][0] <= now:
                      _,_,data,dst=heapq.heappop(q); s.sendto(data,dst)
                  timeout=0.01 if not q else max(0,min(0.01,q[0][0]-now))
                  r,_,_=select.select([s],[],[],timeout)
                  if not r: continue
                  try: data,addr=s.recvfrom(65535)
                  except BlockingIOError: continue
                  if addr == target:
                      st['reverse_seen']+=1; st['reverse_bytes']+=len(data)
                      if peer is not None: heapq.heappush(q,(time.monotonic()+delay_ms/1000,seq,data,peer)); seq+=1
                  else:
                      peer=addr; st['forward_seen']+=1; st['forward_bytes']+=len(data)
                      if rng.random() < loss/100:
                          st['forward_dropped']+=1; continue
                      heapq.heappush(q,(time.monotonic()+delay_ms/1000,seq,data,target)); seq+=1
              with open(stats,'w') as f: json.dump(st,f)

          def ping(port,count,size,window,timeout_ms,out):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('127.0.0.1',0)); s.connect(('127.0.0.1',port)); s.setblocking(False)
              sent={}; done=set(); samples=[]; nxt=0; deadline=time.monotonic()+10
              def send_one(i):
                  payload=struct.pack('!I',i)+bytes(max(0,size-4)); sent[i]=time.monotonic(); s.send(payload)
              while nxt<count and len(sent)-len(done)<window: send_one(nxt); nxt+=1
              while time.monotonic()<deadline and len(done)<count:
                  r,_,_=select.select([s],[],[],0.01); now=time.monotonic()
                  if r:
                      try: d=s.recv(65535)
                      except BlockingIOError: d=b''
                      if len(d)>=4:
                          i=struct.unpack('!I',d[:4])[0]
                          if i in sent and i not in done:
                              done.add(i); samples.append((now-sent[i])*1000)
                              while nxt<count and len(sent)-len(done)<window: send_one(nxt); nxt+=1
                  expired=[i for i,t in sent.items() if i not in done and (now-t)*1000>timeout_ms]
                  for i in expired: done.add(i)
                  while nxt<count and len(sent)-len(done)<window: send_one(nxt); nxt+=1
              delivered=len(samples)
              result={'samples':count,'delivered':delivered,'delivery_ratio':delivered/count,'mean_ms':sum(samples)/delivered if delivered else 0,'p50_ms':pct(samples,50),'p95_ms':pct(samples,95),'p99_ms':pct(samples,99),'late_ratio':sum(x>100 for x in samples)/delivered if delivered else 1}
              with open(out,'w') as f: json.dump(result,f)
              print(json.dumps(result))

          ap=argparse.ArgumentParser(); sub=ap.add_subparsers(dest='cmd',required=True)
          e=sub.add_parser('echo'); e.add_argument('--port',type=int,required=True)
          p=sub.add_parser('proxy'); p.add_argument('--port',type=int,required=True); p.add_argument('--target-port',type=int,required=True); p.add_argument('--loss',type=float,required=True); p.add_argument('--delay-ms',type=float,required=True); p.add_argument('--seed',type=int,required=True); p.add_argument('--stats',required=True)
          g=sub.add_parser('ping'); g.add_argument('--port',type=int,required=True); g.add_argument('--count',type=int,default=200); g.add_argument('--size',type=int,default=256); g.add_argument('--window',type=int,default=32); g.add_argument('--timeout-ms',type=int,default=1000); g.add_argument('--out',required=True)
          a=ap.parse_args()
          if a.cmd=='echo': echo(a.port)
          elif a.cmd=='proxy': proxy(a.port,a.target_port,a.loss,a.delay_ms,a.seed,a.stats)
          else: ping(a.port,a.count,a.size,a.window,a.timeout_ms,a.out)
          PY
      - name: Run standard FakeTCP plus 20:20 FEC loss sweep
        run: |
          set -euo pipefail
          U=/tmp/oracle/udp2raw/udp2raw_amd64
          S=/tmp/oracle/speeder/speederv2_amd64
          O=/tmp/oracle/oracle.py
          echo 'loss_pct,mean_ms,p50_ms,p95_ms,p99_ms,late_ratio,delivery_ratio,fec_packets,dropped_packets,fec_bytes' > /tmp/oracle/results.csv
          cleanup() { sudo pkill -f udp2raw_amd64 || true; pkill -f speederv2_amd64 || true; pkill -f 'oracle.py echo' || true; pkill -f 'oracle.py proxy' || true; sleep 0.2; }
          trap cleanup EXIT
          for loss in 0 1 2 3 5 8 10 12 15; do
            cleanup
            python3 "$O" echo --port 42000 >/tmp/oracle/echo.log 2>&1 &
            "$S" -s -l127.0.0.1:42001 -r127.0.0.1:42000 -f20:20 --mode 0 --timeout 8 -k wbdtest >/tmp/oracle/speeder-server.log 2>&1 &
            sudo "$U" -s -l127.0.0.1:42002 -r127.0.0.1:42001 -k wbdtest --raw-mode faketcp -a >/tmp/oracle/udp2raw-server.log 2>&1 &
            sudo "$U" -c -l127.0.0.1:42003 -r127.0.0.1:42002 -k wbdtest --raw-mode faketcp -a >/tmp/oracle/udp2raw-client.log 2>&1 &
            python3 "$O" proxy --port 42004 --target-port 42003 --loss "$loss" --delay-ms 25 --seed $((260824+loss)) --stats /tmp/oracle/proxy-$loss.json >/tmp/oracle/proxy-$loss.log 2>&1 & PXY=$!
            "$S" -c -l127.0.0.1:42005 -r127.0.0.1:42004 -f20:20 --mode 0 --timeout 8 -k wbdtest >/tmp/oracle/speeder-client.log 2>&1 &
            sleep 1
            python3 "$O" ping --port 42005 --count 200 --size 256 --window 32 --timeout-ms 1000 --out /tmp/oracle/ping-$loss.json
            kill -TERM "$PXY" || true; wait "$PXY" || true
            python3 - "$loss" <<'PY'
          import csv,json,sys
          loss=sys.argv[1]
          p=json.load(open(f'/tmp/oracle/ping-{loss}.json')); x=json.load(open(f'/tmp/oracle/proxy-{loss}.json'))
          with open('/tmp/oracle/results.csv','a',newline='') as f:
              csv.writer(f).writerow([loss,p['mean_ms'],p['p50_ms'],p['p95_ms'],p['p99_ms'],p['late_ratio'],p['delivery_ratio'],x['forward_seen'],x['forward_dropped'],x['forward_bytes']])
          PY
          done
          cat /tmp/oracle/results.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udp2raw-speeder-loss-oracle
          path: |
            /tmp/oracle/results.csv
            /tmp/oracle/SHA256SUMS.txt
            /tmp/oracle/*.json
            /tmp/oracle/*.log
