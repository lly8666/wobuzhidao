name: validate-shadow-repair-shared100

on:
  push:
    branches:
      - agent/shadow-repair-nohol-0967
    paths:
      - '.github/workflows/validate-shadow-repair-shared100.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: 73c814334ea509fb5c1ea1fe595ddc399ca337b4
  BASE_ASSET_ARTIFACT_ID: '10265571219'

jobs:
  shared100-severe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "WBD_SHARED100_SOURCE source_sha=$SOURCE_SHA helper_sha=$GITHUB_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables tcpdump unzip
      - name: Reuse frozen native assets and rebuild FakeTCP binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/wbd-shared100-assets"
          mkdir -p "$ASSET"
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ASSET_ARTIFACT_ID}/zip" -o /tmp/base-assets.zip
          unzip -q /tmp/base-assets.zip -d "$ASSET"
          test "$(cat "$ASSET/SOURCE_SHA.txt")" = "0967f983c36504dfd430bb76456e1e8f8331dea8"
          go test ./internal/faketcp ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux -count=1
          go build -trimpath -o "$ASSET/wbd-faketcp" ./cmd/wbd-faketcp
          go build -trimpath -o "$ASSET/wbd-faketcp-mux" ./cmd/wbd-faketcp-mux
          printf '%s\n' "$SOURCE_SHA" >"$ASSET/SOURCE_SHA.txt"
          chmod +x "$ASSET"/wbd-* "$ASSET/wbd_dtls_shim"
      - name: Patch validation-only shared 100mbps network model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rotation = Path('scripts/game_lane_rotation_soak.sh')
          s = rotation.read_text()
          pairs = [
              ('[[ "$DURATION_SEC" =~ ^[0-9]+$ && "$DURATION_SEC" -ge 500 ]] || { echo "DURATION_SEC must be >=500" >&2; exit 2; }',
               '[[ "$DURATION_SEC" =~ ^[0-9]+$ && "$DURATION_SEC" -ge 20 ]] || { echo "DURATION_SEC must be >=20" >&2; exit 2; }'),
              ('[[ "$RATE_BPS" == 1000000 ]] || { echo "RATE_BPS must be exactly 1000000" >&2; exit 2; }',
               '[[ "$RATE_BPS" == 10000000 ]] || { echo "RATE_BPS must be exactly 10000000" >&2; exit 2; }'),
              ("if summary['loss_ratio'] > 0.001: raise SystemExit(13)",
               "# shared100 probe records loss; workflow below owns policy assertions"),
              ("if summary['down_payload_bps'] < rate_bps*0.995: raise SystemExit(14)",
               "# shared100 probe records goodput; workflow below owns policy assertions"),
          ]
          for old,new in pairs:
              if s.count(old) != 1:
                  raise SystemExit('validation guard drift: '+old)
              s=s.replace(old,new,1)
          if '--shadow-recovery legacy' not in s:
              raise SystemExit('replacement recovery marker missing')
          s=s.replace('--shadow-recovery legacy','--shadow-recovery sack-rack')
          s=s.replace('recovery=legacy','recovery=sack-rack')
          rotation.write_text(s)

          base=Path('scripts/game_lane_fullstack.sh')
          s=base.read_text()
          if '--shadow-recovery legacy' not in s:
              raise SystemExit('initial recovery marker missing')
          s=s.replace('--shadow-recovery legacy','--shadow-recovery sack-rack')
          mux='"$ASSET_DIR/wbd-faketcp-mux" server \\\n  --listen 10.89.0.1:${RAW} --dtls-shim "$ASSET_DIR/wbd_dtls_shim" \\\n'
          mux_new='"$ASSET_DIR/wbd-faketcp-mux" server \\\n  --shadow-recovery sack-rack \\\n  --listen 10.89.0.1:${RAW} --dtls-shim "$ASSET_DIR/wbd_dtls_shim" \\\n'
          if s.count(mux) != 1:
              raise SystemExit('server mux launch marker drift')
          s=s.replace(mux,mux_new,1)
          s=s.replace('recovery=legacy','recovery=sack-rack')
          base.write_text(s)

          # gc0/gs0 are the single shared public veth pair carrying all four
          # lanes. netem's rate parameter therefore caps aggregate egress at
          # 100 Mbit/s per direction, not 100 Mbit/s per lane. Keep queue depth
          # well above the 300ms BDP so random 20% loss, not queue overflow,
          # remains the intended impairment.
          control=Path('scripts/game_lane_rotation_soak_control.sh')
          s=control.read_text()
          old_c='sudo ip netns exec "$C" tc qdisc replace dev gc0 root netem delay "${NETEM_DELAY_MS}ms" loss random "${NETEM_LOSS_PCT}%"'
          old_s='sudo ip netns exec "$S" tc qdisc replace dev gs0 root netem delay "${NETEM_DELAY_MS}ms" loss random "${NETEM_LOSS_PCT}%"'
          new_c='sudo ip netns exec "$C" tc qdisc replace dev gc0 root netem limit 20000 rate 100mbit delay "${NETEM_DELAY_MS}ms" loss random "${NETEM_LOSS_PCT}%"'
          new_s='sudo ip netns exec "$S" tc qdisc replace dev gs0 root netem limit 20000 rate 100mbit delay "${NETEM_DELAY_MS}ms" loss random "${NETEM_LOSS_PCT}%"'
          if s.count(old_c)!=1 or s.count(old_s)!=1:
              raise SystemExit('shared100 netem insertion point drift')
          s=s.replace(old_c,new_c,1).replace(old_s,new_s,1)
          marker='echo "WBD_HOSTED_NETEM_READY delay_ms=${NETEM_DELAY_MS} loss_pct=${NETEM_LOSS_PCT} direction=bidirectional"'
          replacement='echo "WBD_HOSTED_NETEM_READY delay_ms=${NETEM_DELAY_MS} loss_pct=${NETEM_LOSS_PCT} direction=bidirectional aggregate_rate_mbit=100"'
          if s.count(marker)!=1:
              raise SystemExit('netem ready marker drift')
          control.write_text(s.replace(marker,replacement,1))
          PY
          echo 'WBD_SHARED100_HARNESS lanes=4 inner_rate_bps_per_lane=10000000 aggregate_outer_rate_mbit=100 delay_ms=300 loss_pct=20 fec=20:20 horizon=1536'
      - name: Run shared 100mbps 4-lane severe probe
        env:
          LANES: '4'
          FEC: '20:20'
          DURATION_SEC: '20'
          RATE_BPS: '10000000'
          PAYLOAD_BYTES: '1000'
          ROTATE_INTERVAL_SEC: '10'
          ROTATIONS: '1'
          NETEM_DELAY_MS: '300'
          NETEM_LOSS_PCT: '20'
          SOAK_REPLICA: '1'
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/shared100"
          mkdir -p "$LOG"
          sudo -E bash "$GITHUB_WORKSPACE/scripts/game_lane_rotation_soak_control.sh" "$RUNNER_TEMP/wbd-shared100-assets" "$LOG"
          cat "$LOG/load-result.json"
          cat "$LOG/netem.log"
          grep -q 'aggregate_rate_mbit=100' "$LOG/netem.log"
          grep -q 'rate 100Mbit' "$LOG/netem.log"
          grep -q 'READY role=server-mux.*recovery=sack-rack' "$LOG/faketcp-mux.log"
          python3 - "$LOG" <<'PY'
          import glob,json,os,sys
          root=sys.argv[1]
          d=json.load(open(os.path.join(root,'load-result.json')))
          stats=[]
          for path in glob.glob(root+'/*faketcp*.log'):
              for line in open(path,errors='replace'):
                  if 'WBD_FAKETCP_STATS ' not in line: continue
                  try: stats.append(json.loads(line.split('WBD_FAKETCP_STATS ',1)[1]))
                  except Exception: pass
          senders=[x['sender'] for x in stats if x.get('role')=='client' and 'sender' in x]
          receivers=[x['receiver'] for x in stats if x.get('role')=='client' and 'receiver' in x]
          if not senders or not receivers:
              raise SystemExit('missing client stats')
          enq=sum(x.get('EnqueuedBytes',0) for x in senders)
          retx=sum(x.get('RetransmitBytes',0) for x in senders)
          result={
              'down_payload_bps':d['down_payload_bps'],
              'loss_ratio':d['loss_ratio'],
              'sent':d['sent'],
              'received_unique':d['received_unique'],
              'repair_to_fresh_bytes':retx/enq if enq else 0,
              'repair_bytes':retx,
              'fresh_bytes':enq,
              'peak_pending':max(x.get('PeakPending',0) for x in senders),
              'repair_deferred_bytes':sum(x.get('RepairDeferredBytes',0) for x in senders),
              'forgiven_gaps':sum(x.get('ForgivenGaps',0) for x in receivers),
              'forgiven_bytes':sum(x.get('ForgivenBytes',0) for x in receivers),
              'peak_receiver_out_of_order':max(x.get('PeakBufferedOO',0) for x in receivers),
          }
          print('WBD_SHARED100_RESULT '+json.dumps(result,sort_keys=True))
          assert d['bad_payload']==0 and d['duplicates']==0, d
          assert result['peak_receiver_out_of_order']==1536, result
          assert result['forgiven_gaps']>0, result
          PY
          waits=$(grep -R -c 'pending=4096 limit=4096 action=wait' "$LOG" 2>/dev/null || true)
          echo "WBD_SHARED100_PRESSURE_WAIT_MATCHES=$waits"
      - name: Diagnose failure
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/shared100"
          echo '=== LOAD ==='; cat "$LOG/load-result.json" 2>/dev/null || true
          echo '=== NETEM ==='; cat "$LOG/netem.log" 2>/dev/null || true
          echo '=== PRESSURE ==='; grep -R 'WBD_FAKETCP_OUTSTANDING_PRESSURE' "$LOG" 2>/dev/null || true
          echo '=== STATS ==='; grep -R 'WBD_FAKETCP_STATS' "$LOG" 2>/dev/null || true
          tail -n 160 "$LOG/faketcp-mux.log" 2>/dev/null || true
      - name: Scrub one-time auth material
        if: always()
        run: |
          set +e
          LOG="$RUNNER_TEMP/shared100"
          sudo rm -rf "$LOG/tickets" "$LOG"/ticket-*.txt "$LOG"/tunnel-*.json "$LOG"/front-*.log
