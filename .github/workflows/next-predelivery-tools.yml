name: next-predelivery-tools
on:
  push:
    branches: ['next/tlslike-dataplane']
    paths: ['tools/**', 'scripts/**', 'internal/runtimeentry/**', 'internal/runtimeowner/**', 'internal/datapath/**', 'internal/platformflow/**', '.github/workflows/next-config-effective.yml', '.github/workflows/next-target-soak.yml', '.github/workflows/next-predelivery-tools.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  egress-blackhole-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Qualify scoped raw-send network loss and owned cleanup
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq iproute2
          mkdir -p artifacts
          sudo env GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" python3 tools/test_physical_egress_blackhole.py | tee artifacts/egress-fixture.json
          sudo env GITHUB_ACTIONS=true python3 tools/test_physical_fragment_kernel.py | tee artifacts/reverse-fragment-fixture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'egress-fixture-${{ github.sha }}', path: artifacts/*.json}
  physical-helper-compile:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded native helpers without a workload or driver access
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -Path tools/physical_udp_client.cs
          ./tools/test_physical_send_lag.ps1
          Add-Type -Path tools/physical_npcap_watch.cs
          ./tools/test_physical_dns_metadata.ps1
          ./tools/test_physical_fragment_ownership.ps1
          Add-Type -Path tools/native_mtu_probe.cs
          Add-Type -Path tools/native_lifecycle_udp_client.cs
          foreach($fixture in @(@(-1,0),@(0,0),@(29.9,29.9),@(30,30),@(119.9,30),@(120,30),@(149.9,59.9),@(150,60),@(239.9,60),@(240,60),@(299.9,119.9),@(300,120),@(400,120))) {
            if([Math]::Abs([WBDNativeLifecycleUDP]::ActiveSeconds($fixture[0])-$fixture[1]) -gt 0.000001){throw 'Lifecycle quiet window accrued backlog'}
          }
          ./tools/test_windows_tun_mtu.ps1
          foreach($path in @('tools/native_windows_lifecycle_udp.ps1','tools/native_windows_mtu_boundary.ps1','tools/physical_windows_udp.ps1','tools/physical_windows_dns.ps1','tools/physical_windows_dns_watch.ps1','tools/physical_windows_fragments.ps1','tools/physical_windows_mtu.ps1','tools/physical_windows_header_watch.ps1','tools/physical_windows_session.ps1')) {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){throw ($errors | Out-String)}
          }
  harness-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bounded collector and harness fixtures (no workload)
        run: |
          python3 -m unittest discover -s tools -p 'test_soak*.py' -v
          python3 -m unittest discover -s tools -p 'test_config*.py' -v
          python3 -m py_compile tools/soak_stats.py tools/soak_capture.py tools/prepare_soak_harness.py tools/check_target_soak.py tools/soak_weaknet_stage.py
          mkdir -p artifacts/soak-template
          python3 tools/prepare_soak_harness.py --artifact-dir artifacts/soak-template --duration 1800
          bash -n artifacts/soak-template/generated-soak.sh
          python3 tools/check_performance_workflow_policy.py
          python3 -m py_compile tools/config_effective_args.py tools/config_business.py tools/prepare_config_harness.py tools/check_config_effective.py
          python3 -m py_compile tools/collect_p6_receipts.py
          python3 -m py_compile tools/native_mtu_boundary_target.py
          python3 tools/test_native_mtu_target.py
          python3 tools/test_native_lifecycle_schedule.py
          python3 tools/test_native_idle_observer.py
          python3 tools/test_physical_inner_fragments.py
          python3 tools/test_realpath_pacing.py
          python3 tools/test_physical_send_lag.py
          python3 tools/prepare_config_harness.py --case f20-l4-p1 --artifact-dir artifacts/config-template
          bash -n artifacts/config-template/generated-config.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'soak-harness-fixtures-${{ github.sha }}', path: artifacts/soak-template}
  transient-overlap-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: true}
      - name: Deterministic replacement barrier repeated with race detector
        run: go test -race ./internal/runtimeentry -run '^TestLifecycleEntryGameReplacementDormantWakeKeepsStableLease$' -count=30 -timeout=8m
      - name: Failed business Wake and retired SYN candidate repetitions
        run: go test -race ./internal/runtimeentry -run '^(TestBusinessDemandAfterFailedDormantWakeRetriesWithoutClosingOwner|TestLifecycleSYNACK.*|TestLifecycleRetiredAssociation.*)$' -count=60 -timeout=8m
