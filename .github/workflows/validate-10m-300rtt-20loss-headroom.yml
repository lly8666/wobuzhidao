name: validate-singlelane-shadow-edge-matrix

on:
  push:
    branches:
      - agent/validate-singlelane-20m-300ms-20loss-d3b
    paths:
      - '.github/workflows/validate-10m-300rtt-20loss-headroom.yml'

permissions:
  contents: read
  actions: read

jobs:
  edge:
    name: ${{ matrix.case }}-${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - case: low1-p1000
            candidate: shadow-a-bounded
            source_sha: 484e29463bb83c503ee3baf669c23b013dd44d6c
            loss_pct: '1'
            payload_bytes: '1000'
          - case: low1-p1000
            candidate: shadow-b-adaptive
            source_sha: 8bc9e89f07e05a5be74761b16e37fb180f84864a
            loss_pct: '1'
            payload_bytes: '1000'
          - case: low1-p1000
            candidate: shadow-c-conservative
            source_sha: 1276eeffd13c86934105dcfc2af68ac44f46a84c
            loss_pct: '1'
            payload_bytes: '1000'
          - case: loss20-p512
            candidate: shadow-a-bounded
            source_sha: 484e29463bb83c503ee3baf669c23b013dd44d6c
            loss_pct: '20'
            payload_bytes: '512'
          - case: loss20-p512
            candidate: shadow-b-adaptive
            source_sha: 8bc9e89f07e05a5be74761b16e37fb180f84864a
            loss_pct: '20'
            payload_bytes: '512'
          - case: loss20-p512
            candidate: shadow-c-conservative
            source_sha: 1276eeffd13c86934105dcfc2af68ac44f46a84c
            loss_pct: '20'
            payload_bytes: '512'
          - case: loss20-p1360
            candidate: shadow-a-bounded
            source_sha: 484e29463bb83c503ee3baf669c23b013dd44d6c
            loss_pct: '20'
            payload_bytes: '1360'
          - case: loss20-p1360
            candidate: shadow-b-adaptive
            source_sha: 8bc9e89f07e05a5be74761b16e37fb180f84864a
            loss_pct: '20'
            payload_bytes: '1360'
          - case: loss20-p1360
            candidate: shadow-c-conservative
            source_sha: 1276eeffd13c86934105dcfc2af68ac44f46a84c
            loss_pct: '20'
            payload_bytes: '1360'
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          path: helper
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          path: product
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install build/network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool iproute2 iptables tcpdump unzip gcc make openssl
      - name: Run exact candidate edge case
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ matrix.candidate }}-${{ matrix.case }}
          SOURCE_SHA: ${{ matrix.source_sha }}
          TEST_LOSS_PCT: ${{ matrix.loss_pct }}
          TEST_PAYLOAD_BYTES: ${{ matrix.payload_bytes }}
          WOLFSSL_SOURCE_ARTIFACT_ID: '9529710833'
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/helper/.github/scripts/validate_singlelane_shadow_candidate.sh"
          sed -i "s/export NETEM_LOSS_PCT=20/export NETEM_LOSS_PCT=${TEST_LOSS_PCT}/" "$SCRIPT"
          sed -i "s/loss_pct_each_direction=20/loss_pct_each_direction=${TEST_LOSS_PCT}/" "$SCRIPT"
          sed -i "s/export PAYLOAD_BYTES=1000/export PAYLOAD_BYTES=${TEST_PAYLOAD_BYTES}/" "$SCRIPT"
          bash "$SCRIPT" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singlelane-shadow-${{ matrix.case }}-${{ matrix.candidate }}-${{ matrix.source_sha }}
          path: |
            ${{ runner.temp }}/singlelane-${{ matrix.candidate }}-${{ matrix.case }}
          if-no-files-found: warn
          retention-days: 7
