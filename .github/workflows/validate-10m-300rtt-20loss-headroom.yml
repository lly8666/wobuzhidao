name: validate-singlelane-shadow-latency-sweep

on:
  push:
    branches:
      - agent/validate-singlelane-20m-300ms-20loss-d3b
    paths:
      - '.github/workflows/validate-10m-300rtt-20loss-headroom.yml'

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    name: ${{ matrix.profile.name }}-${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate:
          - shadow-a-bounded
          - shadow-b-adaptive
          - shadow-b2-pressure-age
          - shadow-c-conservative
        profile:
          - name: low2-rate20m
            loss_pct: '2'
            rate_bps: '20000000'
          - name: low2-rate80m
            loss_pct: '2'
            rate_bps: '80000000'
          - name: loss20-rate20m
            loss_pct: '20'
            rate_bps: '20000000'
          - name: loss25-rate20m
            loss_pct: '25'
            rate_bps: '20000000'
          - name: loss30-rate20m
            loss_pct: '30'
            rate_bps: '20000000'
          - name: loss35-rate20m
            loss_pct: '35'
            rate_bps: '20000000'
          - name: loss40-rate20m
            loss_pct: '40'
            rate_bps: '20000000'
          - name: loss20-rate40m
            loss_pct: '20'
            rate_bps: '40000000'
          - name: loss20-rate80m
            loss_pct: '20'
            rate_bps: '80000000'
          - name: loss20-rate120m
            loss_pct: '20'
            rate_bps: '120000000'
          - name: loss30-rate40m
            loss_pct: '30'
            rate_bps: '40000000'
          - name: loss30-rate80m
            loss_pct: '30'
            rate_bps: '80000000'
          - name: loss35-rate40m
            loss_pct: '35'
            rate_bps: '40000000'
          - name: loss35-rate80m
            loss_pct: '35'
            rate_bps: '80000000'
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Resolve exact candidate SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.candidate }}' in
            shadow-a-bounded) sha='484e29463bb83c503ee3baf669c23b013dd44d6c' ;;
            shadow-b-adaptive) sha='8bc9e89f07e05a5be74761b16e37fb180f84864a' ;;
            shadow-b2-pressure-age) sha='e10887a55a6b830c7c6c07d0f84b22d89435dfa4' ;;
            shadow-c-conservative) sha='1276eeffd13c86934105dcfc2af68ac44f46a84c' ;;
            *) echo 'unknown candidate' >&2; exit 2 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: product

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install build/network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool iproute2 iptables tcpdump unzip gcc make openssl

      - name: Run latency/loss/rate case
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ matrix.candidate }}-${{ matrix.profile.name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TEST_LOSS_PCT: ${{ matrix.profile.loss_pct }}
          TEST_RATE_BPS: ${{ matrix.profile.rate_bps }}
          TEST_PAYLOAD_BYTES: '1000'
          WOLFSSL_SOURCE_ARTIFACT_ID: '9529710833'
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/helper/.github/scripts/validate_shadow_latency_matrix.sh" \
            "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"

      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-latency-${{ matrix.profile.name }}-${{ matrix.candidate }}-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/singlelane-${{ matrix.candidate }}-${{ matrix.profile.name }}
          if-no-files-found: warn
          retention-days: 7
