name: validate-10m-300oneway-20loss-perlane

on:
  push:
    branches:
      - agent/validate-10m-300oneway-20loss-perlane-d3b
    paths:
      - '.github/workflows/validate-10m-300rtt-20loss-headroom.yml'
      - 'scripts/validate_perlane_diag_d3b.sh'

permissions:
  contents: read
  actions: read

jobs:
  exact-source-perlane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: d3b54dced255cc9becb3e501991f71a034e7438f
          path: product

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc iproute2 iptables tcpdump curl unzip openssl

      - name: Run exact-source per-lane diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HELPER="$GITHUB_WORKSPACE/helper/scripts/validate_perlane_diag_d3b.sh"
          python3 - "$HELPER" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          out = []
          hits = 0
          for line in lines:
              if "new_line = old_line.replace('root netem delay'" in line:
                  out.append("    new_line = old_line.replace('root netem delay', 'root netem limit 24000 delay', 1)\n")
                  hits += 1
              else:
                  out.append(line)
          if hits != 1:
              raise SystemExit(f'expected one netem patch line, found {hits}')
          p.write_text(''.join(out))
          PY
          set +e
          bash "$HELPER" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
          rc=$?
          set -e
          if [ -e "$RUNNER_TEMP/tenm-300oneway-20loss" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/tenm-300oneway-20loss" || true
          fi
          exit "$rc"

      - name: Upload per-lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perlane-10m-300oneway-20loss-${{ github.sha }}
          path: ${{ runner.temp }}/tenm-300oneway-20loss
          if-no-files-found: warn
