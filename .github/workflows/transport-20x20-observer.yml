name: transport-20x20-observer

on:
  push:
    paths:
      - '.github/workflows/transport-20x20-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- wbd-transport-20x20-observer -->';
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'transport-20x20-matrix.yml',
              branch: 'dev/wbd-raw-fec-v2',
              per_page: 10,
            });
            const run = data.workflow_runs[0];
            const body = run
              ? `${marker}\n**Latest WBD transport matrix run**\n\n- run: ${run.id}\n- head: \`${run.head_sha}\`\n- event: ${run.event}\n- status: **${run.status}**\n- conclusion: **${run.conclusion || 'pending'}**\n- run URL: ${run.html_url}`
              : `${marker}\nNo transport-20x20-matrix run found on dev/wbd-raw-fec-v2.`;
            const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: 3, per_page: 100});
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: old.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 3, body});
            }
