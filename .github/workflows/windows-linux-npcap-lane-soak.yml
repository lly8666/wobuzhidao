name: windows-linux-npcap-lane-soak

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/windows-linux-npcap-lane-soak.yml'
      - '.github/scripts/mtu_budget.go'
      - '.github/scripts/windows_game_load.py'
      - 'scripts/windows_linux_wintun_lane_soak.ps1'
      - 'scripts/windows_npcap_ephemeral_ci.ps1'
      - 'scripts/wsl_wintun_lane_soak_server.sh'
      - 'scripts/windows_faketcp_underlay.ps1'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/linux_shared_tun_firewall.sh'
      - 'cmd/wbd-faketcp/**'
      - 'cmd/wbd-faketcp-mux/**'
      - 'cmd/wbd-link-proxy/**'
      - 'cmd/wbd-link-server-mux/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-game-lane-server/**'
      - 'cmd/wbd-tun/**'
      - 'cmd/wbd-ip-gateway-shared/**'
      - 'internal/fec/**'
      - 'internal/linkdata/**'
      - 'internal/pathmtu/**'
      - 'internal/tunnel/**'
      - 'internal/dataplane/**'
      - 'internal/windowsruntime/**'

permissions:
  contents: read

concurrency:
  group: windows-linux-npcap-lane-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight_npcap:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NPCAP_INSTALLER_URL: ${{ secrets.NPCAP_INSTALLER_URL }}
      NPCAP_INSTALLER_SHA256: ${{ secrets.NPCAP_INSTALLER_SHA256 }}
    steps:
      - name: Verify authorized Npcap installer source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NPCAP_INSTALLER_URL}" || -z "${NPCAP_INSTALLER_SHA256}" ]]; then
            echo '::error::NPCAP_INSTALLER_URL and NPCAP_INSTALLER_SHA256 repository/environment secrets are required. The URL must point to an authorized unattended Npcap installer; the installer itself is intentionally not stored in GitHub secrets or this repository.'
            exit 1
          fi
          if [[ "${NPCAP_INSTALLER_URL}" != https://* ]]; then
            echo '::error::NPCAP_INSTALLER_URL must use HTTPS.'
            exit 1
          fi
          if [[ ! "${NPCAP_INSTALLER_SHA256}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo '::error::NPCAP_INSTALLER_SHA256 must be exactly 64 hexadecimal characters.'
            exit 1
          fi
          echo 'WBD_NPCAP_AUTHORIZED_SOURCE_PREFLIGHT_PASS'

  build-linux:
    needs: preflight_npcap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build Linux server assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc openssl
          git clone --depth 1 --branch v5.9.2-stable https://github.com/wolfSSL/wolfssl.git "$RUNNER_TEMP/wolfssl"
          test "$(git -C "$RUNNER_TEMP/wolfssl" rev-parse HEAD)" = ac01707f552c611fbd135cc723b2682b3e7f80f2
          (cd "$RUNNER_TEMP/wolfssl" && ./autogen.sh)
          mkdir -p "$RUNNER_TEMP/wolf-build" "$RUNNER_TEMP/linux-assets"
          (cd "$RUNNER_TEMP/wolf-build" && "$RUNNER_TEMP/wolfssl/configure" --enable-dtls13 --disable-shared --enable-static CFLAGS='-O2 -DWOLFSSL_DTLS_WINDOW_WORDS=128')
          make -C "$RUNNER_TEMP/wolf-build" -j2 src/libwolfssl.la
          gcc -DWOLFSSL_DTLS_WINDOW_WORDS=128 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP/wolf-build" -I"$RUNNER_TEMP/wolfssl" native/dtls/wbd_dtls_shim.c "$RUNNER_TEMP/wolf-build/src/.libs/libwolfssl.a" -lm -o "$RUNNER_TEMP/linux-assets/wbd_dtls_shim"
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-faketcp-mux" ./cmd/wbd-faketcp-mux
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-link-server-mux" ./cmd/wbd-link-server-mux
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-game-lane-server" ./cmd/wbd-game-lane-server
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-ip-gateway-shared" ./cmd/wbd-ip-gateway-shared
          cp scripts/linux_shared_tun_firewall.sh "$RUNNER_TEMP/linux-assets/linux_shared_tun_firewall.sh"
          chmod +x "$RUNNER_TEMP/linux-assets/linux_shared_tun_firewall.sh"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-front.invalid' -keyout "$RUNNER_TEMP/linux-assets/front.key" -out "$RUNNER_TEMP/linux-assets/front.pem" >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-dtls.invalid' -keyout "$RUNNER_TEMP/linux-assets/dtls.key" -out "$RUNNER_TEMP/linux-assets/dtls.pem" >/dev/null 2>&1
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/linux-assets/SOURCE_SHA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux-soak-linux-assets
          path: ${{ runner.temp }}/linux-assets
          retention-days: 1

  build-windows:
    needs: preflight_npcap
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build native Windows client assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'windows-assets'; New-Item -ItemType Directory -Force $out | Out-Null
          go build -trimpath -o (Join-Path $out 'wbd-faketcp.exe') .\cmd\wbd-faketcp
          if($LASTEXITCODE){throw 'wbd-faketcp build failed'}
          go build -trimpath -o (Join-Path $out 'wbd-link-proxy.exe') .\cmd\wbd-link-proxy
          if($LASTEXITCODE){throw 'wbd-link-proxy build failed'}
          go build -trimpath -o (Join-Path $out 'wbd-game-lane-client.exe') .\cmd\wbd-game-lane-client
          if($LASTEXITCODE){throw 'wbd-game-lane-client build failed'}
          go build -trimpath -o (Join-Path $out 'wbd-tun.exe') .\cmd\wbd-tun
          if($LASTEXITCODE){throw 'wbd-tun build failed'}
          $wintunZip=Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -UseBasicParsing 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wintunZip
          $got=(Get-FileHash -Algorithm SHA256 $wintunZip).Hash.ToLowerInvariant()
          $want='07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if($got -ne $want){throw "Wintun ZIP SHA256 mismatch: got=$got want=$want"}
          $wintunDir=Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -LiteralPath $wintunZip -DestinationPath $wintunDir
          $wintunDll=Get-ChildItem -Path $wintunDir -Recurse -Filter wintun.dll | Where-Object {$_.FullName -match '[\\/]amd64[\\/]'} | Select-Object -First 1
          if(-not $wintunDll){throw 'amd64 wintun.dll not found in locked archive'}
          Copy-Item -LiteralPath $wintunDll.FullName -Destination (Join-Path $out 'wintun.dll')
          Write-Output "WBD_WINDOWS_WINTUN_COMPAT_ARTIFACT_PASS sha256=$got"
          git clone --depth 1 --branch v5.9.2-stable https://github.com/wolfSSL/wolfssl.git "$env:RUNNER_TEMP\wolfssl"
          Push-Location "$env:RUNNER_TEMP\wolfssl"
          if((git rev-parse HEAD).Trim() -ne 'ac01707f552c611fbd135cc723b2682b3e7f80f2'){throw 'wolfSSL pin mismatch'}
          cmake -S . -B build -DWOLFSSL_DTLS13=yes -DWOLFSSL_DTLS=yes -DWOLFSSL_EXAMPLES=no -DWOLFSSL_CRYPT_TESTS=no -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded '-DCMAKE_C_FLAGS=/DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384'
          if($LASTEXITCODE){throw 'wolfSSL configure failed'}
          cmake --build build --config Release --target wolfssl
          if($LASTEXITCODE){throw 'wolfSSL build failed'}
          Pop-Location
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          $vcvars=Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd=Join-Path $env:RUNNER_TEMP 'build-dtls.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /O2 /MT /DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384 /I"$env:RUNNER_TEMP\wolfssl" /I"$env:RUNNER_TEMP\wolfssl\build" /I"$env:RUNNER_TEMP\wolfssl\wolfssl" native\dtls\wbd_dtls_shim.c /Fe:"$out\wbd_dtls_shim.exe" /link "$env:RUNNER_TEMP\wolfssl\build\Release\wolfssl.lib" ws2_32.lib crypt32.lib advapi32.lib
          "@ | Set-Content -LiteralPath $cmd -Encoding ascii
          & $cmd
          if($LASTEXITCODE){throw 'DTLS shim build failed'}
          Set-Content -LiteralPath (Join-Path $out 'SOURCE_SHA.txt') -Value $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux-soak-windows-assets
          path: ${{ runner.temp }}\windows-assets
          retention-days: 1

  soak:
    needs: [build-linux, build-windows]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lanes: 1
            fec: 'off'
            loss: 15
            slug: '1lane-fec-off-loss15'
          - lanes: 1
            fec: '20:20'
            loss: 30
            slug: '1lane-fec-on-loss30'
          - lanes: 4
            fec: 'off'
            loss: 15
            slug: '4lane-fec-off-loss15'
          - lanes: 4
            fec: '20:20'
            loss: 30
            slug: '4lane-fec-on-loss30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux-soak-linux-assets
          path: ${{ runner.temp }}\linux-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux-soak-windows-assets
          path: ${{ runner.temp }}\windows-assets

      - name: Provision and verify WSL Linux runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          wsl.exe --status
          if($LASTEXITCODE){throw 'WSL2 runtime is unavailable'}
          $marker=Join-Path $env:RUNNER_TEMP 'wbd-soak-ephemeral-wsl.txt'
          $distros=@(& wsl.exe -l -q | ForEach-Object {$_.Trim([char]0).Trim()} | Where-Object {$_})
          if($distros.Count -eq 0){
            $d='Ubuntu-24.04'
            Write-Output "WBD_WSL_DISTRO_INSTALL_BEGIN distro=$d"
            & wsl.exe --install -d $d --no-launch --web-download
            if($LASTEXITCODE){throw "WSL distro install failed: $LASTEXITCODE"}
            $deadline=[DateTime]::UtcNow.AddMinutes(3)
            do {
              Start-Sleep -Seconds 2
              $distros=@(& wsl.exe -l -q | ForEach-Object {$_.Trim([char]0).Trim()} | Where-Object {$_})
            } while(($distros -notcontains $d) -and [DateTime]::UtcNow -lt $deadline)
            if($distros -notcontains $d){throw "WSL distro $d did not register"}
            Set-Content -LiteralPath $marker -Value $d -Encoding ascii
            & wsl.exe -d $d -u root -- bash -lc "printf '[user]\ndefault=root\n' > /etc/wsl.conf"
            if($LASTEXITCODE){throw 'failed to configure ephemeral WSL default user'}
            & wsl.exe --terminate $d
            Write-Output "WBD_WSL_DISTRO_INSTALL_PASS distro=$d"
          } else {
            $d=$distros[0]
            Write-Output "WBD_WSL_DISTRO_REUSE distro=$d"
          }
          & wsl.exe -d $d -u root -- bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables python3 sudo'
          if($LASTEXITCODE){throw 'WSL prerequisite install failed'}
          & wsl.exe -d $d -u root -- bash -lc 'test -x /usr/sbin/iptables && command -v tc && command -v python3 && command -v sudo'
          if($LASTEXITCODE){throw 'WSL prerequisites unavailable'}
          Write-Output "WBD_WSL_RUNTIME_READY distro=$d"

      - name: Install authorized ephemeral Npcap
        shell: pwsh
        env:
          NPCAP_INSTALLER_URL: ${{ secrets.NPCAP_INSTALLER_URL }}
          NPCAP_INSTALLER_SHA256: ${{ secrets.NPCAP_INSTALLER_SHA256 }}
        run: |
          $ErrorActionPreference='Stop'
          $existing=Get-Service -Name npcap -ErrorAction SilentlyContinue
          $installer=Join-Path $env:RUNNER_TEMP 'npcap-authorized.exe'
          if(-not $existing){
            if([string]::IsNullOrWhiteSpace($env:NPCAP_INSTALLER_URL) -or [string]::IsNullOrWhiteSpace($env:NPCAP_INSTALLER_SHA256)){
              throw 'Npcap is absent and NPCAP_INSTALLER_URL/NPCAP_INSTALLER_SHA256 secrets are required for the authorized unattended installer'
            }
            $uri=[Uri]$env:NPCAP_INSTALLER_URL
            if($uri.Scheme -ne 'https'){throw 'NPCAP_INSTALLER_URL must use HTTPS'}
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $installer
            if(-not (Test-Path -LiteralPath $installer)){throw 'authorized Npcap installer download did not create a file'}
          }
          .\scripts\windows_npcap_ephemeral_ci.ps1 -Action Install -InstallerPath $installer -InstallerSHA256 $env:NPCAP_INSTALLER_SHA256
          .\scripts\windows_npcap_ephemeral_ci.ps1 -Action Status

      - name: Run 300 second physical-path Wintun plus Npcap soak
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'wbd-soak-${{ matrix.slug }}'
          New-Item -ItemType Directory -Force $log | Out-Null
          .\scripts\windows_linux_wintun_lane_soak.ps1 `
            -BinDir "$env:RUNNER_TEMP\windows-assets" `
            -LinuxAssets "$env:RUNNER_TEMP\linux-assets" `
            -Lanes ${{ matrix.lanes }} `
            -FEC '${{ matrix.fec }}' `
            -ConnectionMTU 1420 `
            -DurationSec 300 `
            -RateBps 2000000 `
            -LossPct ${{ matrix.loss }} `
            -RotateEverySec 90 `
            -LogDir $log

      - name: Print scenario summary
        if: always()
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'wbd-soak-${{ matrix.slug }}'
          if(Test-Path "$log\mtu-budget.json"){Get-Content "$log\mtu-budget.json"}
          if(Test-Path "$log\summary.json"){Get-Content "$log\summary.json"}
          if(Test-Path "$log\load-result.json"){Get-Content "$log\load-result.json" | Select-Object -First 1}
          if(Test-Path "$log\network-end.log"){Get-Content "$log\network-end.log"}

      - name: Remove ephemeral Npcap
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          .\scripts\windows_npcap_ephemeral_ci.ps1 -Action Cleanup
          if($LASTEXITCODE){exit $LASTEXITCODE}

      - name: Remove ephemeral WSL distribution
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $marker=Join-Path $env:RUNNER_TEMP 'wbd-soak-ephemeral-wsl.txt'
          if(Test-Path -LiteralPath $marker){
            $d=(Get-Content -LiteralPath $marker -Raw).Trim()
            if($d){
              & wsl.exe --terminate $d 2>$null
              & wsl.exe --unregister $d
              if($LASTEXITCODE){throw "failed to unregister ephemeral WSL distro $d"}
              Write-Output "WBD_WSL_DISTRO_CLEANUP_PASS distro=$d"
            }
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          } else {
            Write-Output 'WBD_WSL_DISTRO_CLEANUP_SKIP reason=preexisting_or_not_installed'
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-linux-npcap-wintun-soak-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}\wbd-soak-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14