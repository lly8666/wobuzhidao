name: fec-horizon64-verify

on:
  push:
    branches:
      - fix/fec-recovery-horizon64-20260913
    paths:
      - internal/fec/**
      - internal/session/**
      - .github/workflows/fec-horizon64-verify.yml
      - .github/triggers/fec-horizon64-verify.txt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          gofmt -d internal/fec/block.go internal/fec/decoder_observe.go internal/fec/block_horizon_test.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: FEC unit tests
        run: go test ./internal/fec/...
      - name: FEC and session race tests
        run: go test -race ./internal/fec/... ./internal/session/...
      - name: Focused horizon tests verbose
        run: go test -v ./internal/fec -run 'TestBlockDecoder(RecoveryHorizon|LateFirstSeen)'
