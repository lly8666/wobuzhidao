name: next-adaptive-n2-ge-eventmap-preflight-only
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n2-ge-eventmap-preflight-only.yml"
      - "tools/adaptive_n2_ge_eventmap.c"
      - "tools/adaptive_n2_ge_eventmap.py"
      - "tools/adaptive_n2_ge_eventmap_probe.py"
      - "docs/evidence/adaptive-n2-c10-ctmc-event-trace-freeze-v1.json"
permissions:
  contents: read
jobs:
  one-ge-kernel-eventmap-readback-no-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen GE event trace exact canonical hash and zero-traffic units
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 -m py_compile tools/adaptive_n2_ge_eventmap.py tools/adaptive_n2_ge_eventmap_probe.py
          python3 tools/adaptive_n2_ge_eventmap.py unit
          python3 tools/adaptive_n2_ge_eventmap_probe.py unit
          mkdir -p artifacts/n2-c10-eventmap-preflight
          python3 tools/adaptive_n2_ge_eventmap.py freeze \
            --output artifacts/n2-c10-eventmap-preflight/ge-frozen-trace.json
          echo "NO PRODUCT BUSINESSES/BINARIES OR PERFORMANCE JOBS"
      - name: Install kernel event-map compiler and inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang llvm libbpf-dev iproute2 iputils-ping
          clang -O2 -g -target bpf -I "/usr/include/$(uname -m)-linux-gnu" \
            -c tools/adaptive_n2_ge_eventmap.c \
            -o artifacts/n2-c10-eventmap-preflight/ge-eventmap.o
          llvm-objdump -h artifacts/n2-c10-eventmap-preflight/ge-eventmap.o \
            > artifacts/n2-c10-eventmap-preflight/elf-sections.txt
          grep 'classifier' artifacts/n2-c10-eventmap-preflight/elf-sections.txt
      - name: Two real kernel event-map loaders 1ms wall-time binary search and 50pct BAD smoke
        id: load
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ART="$GITHUB_WORKSPACE/artifacts/n2-c10-eventmap-preflight"
          A=wbdgeA B=wbdgeB
          rpid=""
          cleanup() {
            if [ -n "$rpid" ]; then kill "$rpid" 2>/dev/null || true; fi
            sudo ip netns del "$A" 2>/dev/null || true
            sudo ip netns del "$B" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$A"
          sudo ip netns add "$B"
          sudo ip link add vethGEa type veth peer name vethGEb
          sudo ip link set vethGEa netns "$A"
          sudo ip link set vethGEb netns "$B"
          sudo ip -n "$A" addr add 198.19.20.1/30 dev vethGEa
          sudo ip -n "$B" addr add 198.19.20.2/30 dev vethGEb
          sudo ip -n "$A" link set lo up
          sudo ip -n "$B" link set lo up
          sudo ip -n "$A" link set vethGEa up
          sudo ip -n "$B" link set vethGEb up
          sudo ip netns exec "$A" ping -q -c 2 -W 1 198.19.20.2
          sudo ip netns exec "$A" tc qdisc add dev vethGEa clsact
          sudo ip netns exec "$B" tc qdisc add dev vethGEb clsact
          sudo ip netns exec "$A" tc filter add dev vethGEa egress pref 1 bpf da obj "$ART/ge-eventmap.o" sec classifier
          sudo ip netns exec "$B" tc filter add dev vethGEb egress pref 1 bpf da obj "$ART/ge-eventmap.o" sec classifier
          # Native bpf() map enumeration/load/readback; no Ubuntu 24.04
          # virtual bpftool package or kernel-version-specific wrapper.
          # Shared exact epoch; 12s budget includes BPF map update/readback, Python startup.
          START_NS="$(python3 - <<'PY'
          import time
          print(((time.monotonic_ns()//200_000_000)+60)*200_000_000)
          PY
          )"
          printf '%s\n' "$START_NS" > "$ART/start-monotonic-ns.txt"
          sudo python3 tools/adaptive_n2_ge_eventmap.py load \
            --mode smoke --start-ns "$START_NS" \
            --output "$ART/maps-loaded.json"
          sudo ip netns exec "$B" python3 "$GITHUB_WORKSPACE/tools/adaptive_n2_ge_eventmap_probe.py" \
            receive --start-ns "$START_NS" --output "$ART/received.json" &
          rpid=$!
          sleep 0.3
          sudo ip netns exec "$A" python3 "$GITHUB_WORKSPACE/tools/adaptive_n2_ge_eventmap_probe.py" \
            send --start-ns "$START_NS" --output "$ART/sent.json"
          wait "$rpid"
          rpid=""
          sudo python3 tools/adaptive_n2_ge_eventmap.py audit \
            --mode smoke --start-ns "$START_NS" \
            --output "$ART/maps-audited.json"
          python3 tools/adaptive_n2_ge_eventmap_probe.py verify \
            --sent "$ART/sent.json" --received "$ART/received.json" \
            --output "$ART/result.json"
      - name: Preserve exact files hash and unsupported fail state
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/n2-c10-eventmap-preflight
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          p=pathlib.Path("artifacts/n2-c10-eventmap-preflight")
          files=["tools/adaptive_n2_ge_eventmap.c","tools/adaptive_n2_ge_eventmap.py",
                 "tools/adaptive_n2_ge_eventmap_probe.py",
                 "docs/evidence/adaptive-n2-c10-ctmc-event-trace-freeze-v1.json"]
          files.extend(str(x) for x in sorted(p.iterdir()) if x.is_file())
          d={"schema":1,"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
             "kind":"C10_REAL_CTMC_MAP_LOADER_CAPABILITY_ONLY",
             "product_N2_PASS":False,"real_product_measurement_jobs":0,
             "sha256":{x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest()
                       for x in files if pathlib.Path(x).is_file()}}
          (p/"receipt.json").write_text(json.dumps(d,sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n2-c10-ge-eventmap-capability-${{ github.sha }}
          path: artifacts/n2-c10-eventmap-preflight/
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce kernel event-map probe even after artifact collection
        if: always()
        env:
          LOAD_RESULT: ${{ steps.load.outcome }}
        shell: bash
        run: |
          test "$LOAD_RESULT" = success
