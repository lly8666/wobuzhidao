name: next-fec-retrans-300ms-single
run-name: fec-retrans-300ms-${{ github.sha }}
on:
  push:
    branches: ["experiment/fec-policy-sequential-20261009"]
    paths:
      - ".github/fec-retrans-probe.json"
permissions:
  contents: read
concurrency:
  group: fec-policy-sequential-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-fec-off-wire-retrans-forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ART: "${{ github.workspace }}/artifacts/fec-retrans-single"
      PRODUCT_SOURCE: a2db258b436a41fdee98c6c53abec9bab6ce600f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Static foundation and exact one-case gate
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 -m py_compile tools/fec_wire_retrans_observer.py tools/fec_retrans_probe.py tools/fec_policy_batch.py tools/prepare_large_mtu_harness.py tools/check_large_mtu_mixed.py
          python3 -m unittest discover -s tools -p 'test_fec_policy_adapter.py' -v
          python3 -m unittest discover -s tools -p 'test_fec_retrans_probe.py' -v
          python3 tools/fec_retrans_probe.py --mode verify --root "$ART"
      - name: Install five netns realpath dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
      - name: Build frozen product once and seeded tc
        run: |
          set -euo pipefail
          mkdir -p "$ART/binaries"
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          test "$(git rev-parse "$PRODUCT_SOURCE^{commit}")" = "$PRODUCT_SOURCE"
          git worktree add --detach "$RUNNER_TEMP/wbd-product" "$PRODUCT_SOURCE"
          cd "$RUNNER_TEMP/wbd-product"
          go build -trimpath -o "$ART/binaries/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/binaries/wbd-server" ./cmd/wbd-server
          sha256sum "$ART/binaries/wbd-client" "$ART/binaries/wbd-server" > "$ART/product-binaries.sha256"
      - name: ONE 120s real UDP5 FEC-off 300ms outer replay observation
        id: sample
        continue-on-error: true
        run: python3 tools/fec_retrans_probe.py --mode run --root "$ART"
      - name: Emergency raw capture and secret cleanup
        if: always()
        run: |
          if test -d "$ART"; then
            sudo find "$ART" -type f -name '*.pcap*' -delete
            sudo chmod -R a+rX "$ART"
          fi
      - name: Upload sanitized numeric evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fec-retrans-single-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.ART }}/retrans-report.json
            ${{ env.ART }}/retrans-run-failed.json
            ${{ env.ART }}/product-binaries.sha256
            ${{ env.ART }}/s04/retrans-wire.json
            ${{ env.ART }}/s04/summary.json
            ${{ env.ART }}/s04/efficiency-ledger.json
            ${{ env.ART }}/s04/case-receipt.json
            ${{ env.ART }}/s04/sanitized-startup-errors.json
            ${{ env.ART }}/s04/manifest.json
            ${{ env.ART }}/s04/runtime-flags.json
            ${{ env.ART }}/s04/generated.sh.receipt.json
            ${{ env.ART }}/s04/emergency-capture-cleanup.json
      - name: Fail closed on missing or incomplete retrans evidence
        if: always()
        env:
          SAMPLE: ${{ steps.sample.outcome }}
        run: |
          test "$SAMPLE" = success
          test -s "$ART/retrans-report.json"
