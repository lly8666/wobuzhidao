name: next-runtimeowner-recovery

on:
  push:
    branches:
      - next/tlslike-dataplane
    paths:
      - "internal/runtimeowner/**"
      - ".github/workflows/next-runtimeowner-recovery.yml"
      - "docs/qualification/RUNTIMEOWNER_RECOVERY_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtimeowner-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - name: Runtimeowner bounded recovery unit tests
        run: |
          set -euo pipefail
          go test ./internal/runtimeowner -count=1
      - name: Runtimeowner bounded recovery race
        run: |
          set -euo pipefail
          go test -race ./internal/runtimeowner -count=1
