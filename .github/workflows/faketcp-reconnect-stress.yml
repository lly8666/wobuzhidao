name: faketcp-reconnect-stress

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconnect_stress:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[mux2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc curl unzip openssl iproute2 iptables conntrack
      - name: Build pinned DTLS and reconnect stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wolf-art /tmp/wolf/src /tmp/wolf/build /tmp/reconnect
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9529710833/zip" -o /tmp/wolfssl-source.zip
          unzip -q /tmp/wolfssl-source.zip -d /tmp/wolf-art
          echo '4a7ff40a32db0d7a262aaea2d2e674da6708250cba908441c737c981fc84f88b  /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz -C /tmp/wolf/src --strip-components=1
          (cd /tmp/wolf/src && ./autogen.sh)
          (cd /tmp/wolf/build && /tmp/wolf/src/configure --enable-dtls13 --disable-shared --enable-static)
          make -C /tmp/wolf/build -j2 src/libwolfssl.la
          gcc -O2 -Wall -Wextra -Werror -I/tmp/wolf/build -I/tmp/wolf/src \
            native/dtls/wbd_dtls_shim.c /tmp/wolf/build/src/.libs/libwolfssl.a -lm -o /tmp/reconnect/wbd_dtls_shim
          go test ./internal/faketcp -count=1
          go build -trimpath -o /tmp/reconnect/wbd-faketcp ./cmd/wbd-faketcp
          go build -trimpath -o /tmp/reconnect/wbd-faketcp-mux ./cmd/wbd-faketcp-mux

          cat >/tmp/reconnect/server.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:wbd.test
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj '/CN=WBD Reconnect Root CA' \
            -keyout /tmp/reconnect/ca.key -out /tmp/reconnect/ca.pem >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -sha256 -subj '/CN=wbd.test' \
            -keyout /tmp/reconnect/dtls.key -out /tmp/reconnect/dtls.csr >/dev/null 2>&1
          openssl x509 -req -in /tmp/reconnect/dtls.csr \
            -CA /tmp/reconnect/ca.pem -CAkey /tmp/reconnect/ca.key -CAcreateserial \
            -days 2 -sha256 -extfile /tmp/reconnect/server.ext -out /tmp/reconnect/dtls.pem >/dev/null 2>&1
          openssl verify -CAfile /tmp/reconnect/ca.pem /tmp/reconnect/dtls.pem
      - name: Reconnect thirty times after ungraceful client death
        run: |
          set -euo pipefail
          C=wbdrecc$$
          R=wbdrecr$$
          S=wbdrecs$$
          PIDS=''
          cleanup() {
            set +e
            for p in ${PIDS:-}; do sudo kill -KILL "$p" 2>/dev/null || true; done
            sudo ip netns pids "$C" 2>/dev/null | xargs -r sudo kill -KILL 2>/dev/null
            sudo ip netns pids "$S" 2>/dev/null | xargs -r sudo kill -KILL 2>/dev/null
            sudo ip netns del "$C" 2>/dev/null
            sudo ip netns del "$R" 2>/dev/null
            sudo ip netns del "$S" 2>/dev/null
          }
          trap cleanup EXIT

          sudo ip netns add "$C"
          sudo ip netns add "$R"
          sudo ip netns add "$S"
          sudo ip link add c0 type veth peer name rc0
          sudo ip link add rs0 type veth peer name s0
          sudo ip link set c0 netns "$C"
          sudo ip link set rc0 netns "$R"
          sudo ip link set rs0 netns "$R"
          sudo ip link set s0 netns "$S"
          sudo ip -n "$C" addr add 10.94.0.2/24 dev c0
          sudo ip -n "$R" addr add 10.94.0.1/24 dev rc0
          sudo ip -n "$R" addr add 198.19.0.1/24 dev rs0
          sudo ip -n "$S" addr add 198.19.0.2/24 dev s0
          for ns in "$C" "$R" "$S"; do sudo ip -n "$ns" link set lo up; done
          sudo ip -n "$C" link set c0 up
          sudo ip -n "$R" link set rc0 up
          sudo ip -n "$R" link set rs0 up
          sudo ip -n "$S" link set s0 up
          sudo ip -n "$C" route add default via 10.94.0.1
          sudo ip -n "$S" route add default via 198.19.0.1
          sudo ip netns exec "$R" sysctl -qw net.ipv4.ip_forward=1
          sudo ip netns exec "$R" iptables -t nat -A POSTROUTING -s 10.94.0.0/24 -o rs0 -j MASQUERADE
          sudo ip netns exec "$R" iptables -A FORWARD -i rc0 -o rs0 -j ACCEPT
          sudo ip netns exec "$R" iptables -A FORWARD -i rs0 -o rc0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip netns exec "$S" iptables -I OUTPUT -p tcp --sport 443 --tcp-flags RST RST -j DROP

          cat >/tmp/reconnect/echo.py <<'PY'
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',47000))
          while True:
              b,a=s.recvfrom(65535)
              s.sendto(b,a)
          PY
          sudo ip netns exec "$S" python3 /tmp/reconnect/echo.py >/tmp/reconnect/echo.log 2>&1 & ECHO=$!
          PIDS="$ECHO"
          sudo ip netns exec "$S" /tmp/reconnect/wbd-faketcp-mux server \
            --listen 198.19.0.2:443 --dtls-shim /tmp/reconnect/wbd_dtls_shim \
            --link-target 127.0.0.1:47000 --cert /tmp/reconnect/dtls.pem --key /tmp/reconnect/dtls.key \
            --max-sessions 64 >/tmp/reconnect/mux.log 2>&1 & MUX=$!
          PIDS="$PIDS $MUX"
          for i in $(seq 1 200); do grep -q 'READY role=server-mux' /tmp/reconnect/mux.log && break; sleep .05; done
          grep -q 'READY role=server-mux' /tmp/reconnect/mux.log

          run_phase() {
            phase=$1
            count=$2
            echo "RECONNECT_PHASE_START phase=${phase} count=${count}" | tee -a /tmp/reconnect/results.log
            for i in $(seq 1 "$count"); do
              if [ "$phase" = fixed ]; then sport=41001; else sport=$((42000+i)); fi
              local_udp=45101
              plain=46101
              flog="/tmp/reconnect/fake-${phase}-${i}.log"
              dlog="/tmp/reconnect/dtls-${phase}-${i}.log"

              sudo ip netns exec "$C" /tmp/reconnect/wbd-faketcp client \
                --local-udp 127.0.0.1:${local_udp} --source 10.94.0.2:${sport} --remote 198.19.0.2:443 \
                >"$flog" 2>&1 & FPID=$!
              fake_ready=0
              for n in $(seq 1 240); do
                if grep -q 'READY role=client' "$flog"; then fake_ready=1; break; fi
                sleep .05
              done
              if [ "$fake_ready" != 1 ]; then
                echo "RECONNECT_FAIL phase=${phase} iter=${i} stage=faketcp sport=${sport}" | tee -a /tmp/reconnect/results.log
                cat "$flog"
                return 1
              fi

              sudo ip netns exec "$C" /tmp/reconnect/wbd_dtls_shim client ${plain} 127.0.0.1 ${local_udp} /tmp/reconnect/ca.pem wbd.test \
                >"$dlog" 2>&1 & DPID=$!
              dtls_ready=0
              for n in $(seq 1 240); do
                if grep -q 'READY role=client version=DTLSv1.3.*verify=peer-hostname' "$dlog"; then dtls_ready=1; break; fi
                sleep .05
              done
              if [ "$dtls_ready" != 1 ]; then
                echo "RECONNECT_FAIL phase=${phase} iter=${i} stage=dtls sport=${sport}" | tee -a /tmp/reconnect/results.log
                cat "$flog" "$dlog" /tmp/reconnect/mux.log
                return 1
              fi

              sudo ip netns exec "$C" python3 - "$plain" "$phase-$i" <<'PY'
          import socket,sys
          port=int(sys.argv[1]); tag=sys.argv[2].encode()
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',0)); s.settimeout(3)
          msg=b'wbd-reconnect-'+tag
          s.sendto(msg,('127.0.0.1',port))
          data,_=s.recvfrom(65535)
          assert data==msg,(data,msg)
          PY
              echo "RECONNECT_PASS phase=${phase} iter=${i} sport=${sport}" | tee -a /tmp/reconnect/results.log
              sudo kill -KILL "$DPID" "$FPID" 2>/dev/null || true
              wait "$DPID" 2>/dev/null || true
              wait "$FPID" 2>/dev/null || true
              DPID= FPID=
              sleep .08
            done
          }

          run_phase fixed 30
          sudo kill -KILL "$MUX" 2>/dev/null || true
          wait "$MUX" 2>/dev/null || true
          sudo ip netns pids "$S" | grep -v "^${ECHO}$" | xargs -r sudo kill -KILL 2>/dev/null || true
          sleep .2
          : >/tmp/reconnect/mux-rotate.log
          sudo ip netns exec "$S" /tmp/reconnect/wbd-faketcp-mux server \
            --listen 198.19.0.2:443 --dtls-shim /tmp/reconnect/wbd_dtls_shim \
            --link-target 127.0.0.1:47000 --cert /tmp/reconnect/dtls.pem --key /tmp/reconnect/dtls.key \
            --max-sessions 64 >/tmp/reconnect/mux-rotate.log 2>&1 & MUX2=$!
          PIDS="$ECHO $MUX2"
          for i in $(seq 1 200); do grep -q 'READY role=server-mux' /tmp/reconnect/mux-rotate.log && break; sleep .05; done
          grep -q 'READY role=server-mux' /tmp/reconnect/mux-rotate.log
          mv /tmp/reconnect/mux.log /tmp/reconnect/mux-fixed.log
          mv /tmp/reconnect/mux-rotate.log /tmp/reconnect/mux.log
          run_phase rotate 30

          fixed_pass=$(grep -c '^RECONNECT_PASS phase=fixed' /tmp/reconnect/results.log)
          rotate_pass=$(grep -c '^RECONNECT_PASS phase=rotate' /tmp/reconnect/results.log)
          reconnects=$(grep -c 'WBD_FAKETCP_MUX_RECONNECT' /tmp/reconnect/mux-fixed.log || true)
          echo "RECONNECT_SUMMARY fixed=${fixed_pass}/30 rotate=${rotate_pass}/30 server_reconnect_markers=${reconnects}" | tee -a /tmp/reconnect/results.log
          [ "$fixed_pass" -eq 30 ]
          [ "$rotate_pass" -eq 30 ]
          [ "$reconnects" -ge 20 ]
          echo 'FAKETCP_RECONNECT_STRESS_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faketcp-reconnect-stress-evidence
          path: /tmp/reconnect/*.log
