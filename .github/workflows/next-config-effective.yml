name: next-config-effective
run-name: config-${{ inputs.case_id }}
on:
  workflow_dispatch:
    inputs:
      case_id: {type: string, default: f0-l1-p0, required: true}
permissions: {contents: read}
jobs:
  single-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ART: ${{ github.workspace }}/artifacts/configuration
      WBD_LIFECYCLE_SCENARIO: l0_config
      WBD_LIFECYCLE_LANES: '1'
      WBD_LIFECYCLE_SEED: '404'
      WBD_LIFECYCLE_FEC: '0'
      WBD_LIFECYCLE_PADDING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: true}
      - name: Prepare formal binaries and real network topology
        run: |
          mkdir -p "$ART"
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables tcpdump openssl
          sudo modprobe tun || true
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          python3 tools/prepare_config_harness.py --case '${{ inputs.case_id }}' --artifact-dir "$ART"
          bash -n "$ART/generated-config.sh"
      - name: Actual UDP DNS TCP HTTPS configuration probe
        id: sample
        continue-on-error: true
        run: sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_LIFECYCLE_SCENARIO,WBD_LIFECYCLE_LANES,WBD_LIFECYCLE_SEED,WBD_LIFECYCLE_FEC,WBD_LIFECYCLE_PADDING env WBD_LIFECYCLE_ARTIFACT_DIR="$ART" bash "$ART/generated-config.sh"
      - name: Check real runtime and wire effects
        id: validate
        if: always()
        continue-on-error: true
        run: python3 tools/check_config_effective.py --artifact-dir "$ART" --case '${{ inputs.case_id }}' --source-sha "$GITHUB_SHA" --output "$ART/summary-config.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-summary-${{ inputs.case_id }}-${{ github.sha }}
          path: |
            ${{ env.ART }}/summary-config.json
            ${{ env.ART }}/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'config-raw-${{ inputs.case_id }}-${{ github.sha }}', path: '${{ env.ART }}', compression-level: 1}
      - name: Preserve collection and analyzer failures
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          ANALYZER_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$ANALYZER_OUTCOME" = success
