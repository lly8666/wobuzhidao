name: next-default-network
on:
  push:
    branches: ['next/tlslike-dataplane']
    paths: ['internal/dnsroute/**','internal/openwrtclient/**','cmd/wbd-client/**','tools/*dns*','tools/prepare_dns_network_harness.py','.github/workflows/next-default-network.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  default-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {mode: [default, custom, off]}
    env:
      ART: '${{ github.workspace }}/artifacts/default-network-${{ matrix.mode }}'
      WBD_LIFECYCLE_SCENARIO: l0_config
      WBD_LIFECYCLE_LANES: '1'
      WBD_LIFECYCLE_SEED: '101'
      WBD_LIFECYCLE_FEC: '20'
      WBD_LIFECYCLE_PADDING: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12'}
      - name: Core DNS validation and race
        run: go test -race ./internal/dnsroute ./internal/openwrtclient -count=1
      - name: Build formal exact-source binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl
          sudo modprobe tun || true
          mkdir -p "$ART"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
      - name: Actual default DNS fallback and IPv6 sink
        run: |
          python3 tools/prepare_dns_network_harness.py --mode '${{ matrix.mode }}' --artifact-dir "$ART"
          bash -n "$ART/generated-dns-network.sh"
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_LIFECYCLE_SCENARIO,WBD_LIFECYCLE_LANES,WBD_LIFECYCLE_SEED,WBD_LIFECYCLE_FEC,WBD_LIFECYCLE_PADDING env WBD_LIFECYCLE_ARTIFACT_DIR="$ART" bash "$ART/generated-dns-network.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'default-network-${{ matrix.mode }}-${{ github.sha }}'
          path: '${{ env.ART }}'
          retention-days: 30
