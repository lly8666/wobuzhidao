name: product-lifecycle-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-lifecycle-e2e.yml'
      - 'internal/logicaltunnel/**'
      - 'internal/gamelane/**'
      - 'internal/windowsruntime/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-game-lane-server/**'
  push:
    branches:
      - dev/wbd-raw-fec-v2
      - feat/single-flow-reality-faketcp
    paths:
      - '.github/workflows/product-lifecycle-e2e.yml'
      - 'internal/logicaltunnel/**'
      - 'internal/gamelane/**'
      - 'internal/windowsruntime/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-game-lane-server/**'

concurrency:
  group: product-lifecycle-e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Logical Tunnel, dynamic Game membership, dormant and MBB
        run: |
          set -euo pipefail
          go test ./internal/logicaltunnel ./internal/gamelane ./cmd/wbd-game-lane-client ./cmd/wbd-game-lane-server ./internal/windowsruntime -count=1
          echo 'WBD_PRODUCT_LIFECYCLE_LINUX_PASS fec_primary=off logical_tunnel=1 lanes=1..4 game_race=1 mbb=1 dormant_wake=1 shared_tun_preserved=1'

  windows-control-plane:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Windows exact lifecycle controller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/logicaltunnel ./internal/gamelane ./internal/windowsruntime -count=1
          if ($LASTEXITCODE -ne 0) { throw "Windows lifecycle tests failed" }
          Write-Host 'WBD_PRODUCT_LIFECYCLE_WINDOWS_PASS fec_primary=off lanes=1..4 mbb=1 dormant_wake=1 shared_game_tun=1'

  aggregate:
    needs: [linux-control-plane, windows-control-plane]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish lifecycle authority marker
        run: |
          echo 'WBD_PRODUCT_LIFECYCLE_PASS fec_primary=off fec_20x20=smoke_elsewhere windows=1 linux=1 logical_tunnel=1 lanes=1..4 game_race=1 mbb=1 dormant_wake=1'
