name: validate-10m-300oneway-20loss-tcdiag

on:
  push:
    branches:
      - agent/validate-10m-300oneway-20loss-perlane-d3b
    paths:
      - '.github/workflows/validate-10m-300oneway-20loss-tcdiag.yml'
      - 'scripts/patch_mux_teardown_stats_d3b.py'

permissions:
  contents: read
  actions: read

jobs:
  exact-source-tcdiag:
    name: receiver-horizon-r${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout exact receiver-horizon candidate
        uses: actions/checkout@v4
        with:
          ref: eb3de969b045fab1e88034345bfbf0f641cfd592
          path: product

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc iproute2 iptables tcpdump curl unzip openssl

      - name: Verify exact source and focused semantics
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/product"
          test "$(git rev-parse HEAD)" = eb3de969b045fab1e88034345bfbf0f641cfd592
          go test ./internal/faketcp -count=1
          go test ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux -count=1

      - name: Add teardown-only receiver evidence
        run: |
          python3 "$GITHUB_WORKSPACE/helper/scripts/patch_mux_teardown_stats_d3b.py" "$GITHUB_WORKSPACE/product"
          (cd "$GITHUB_WORKSPACE/product" && gofmt -w cmd/wbd-faketcp-mux/main_linux.go)

      - name: Run unchanged 20-second severe diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          SOAK_REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/helper/scripts/validate_perlane_tc_diag_d3b.sh" "$RUNNER_TEMP/receiver-horizon-tcdiag.sh"
          sed -i 's/d3b54dced255cc9becb3e501991f71a034e7438f/eb3de969b045fab1e88034345bfbf0f641cfd592/g' "$RUNNER_TEMP/receiver-horizon-tcdiag.sh"
          bash "$RUNNER_TEMP/receiver-horizon-tcdiag.sh" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
          if [ -e "$RUNNER_TEMP/tenm-300oneway-20loss-tc" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/tenm-300oneway-20loss-tc" || true
          fi

      - name: Show receiver horizon evidence
        if: always()
        run: |
          echo '=== receiver candidate ==='
          grep -hE 'WBD_SOAK_LOAD_RESULT|WBD_TCDIAG_SUMMARY|WBD_FAKETCP_MUX_STATS|WBD_FAKETCP_STATS' "$RUNNER_TEMP/tenm-300oneway-20loss-tc"/*.log 2>/dev/null || true
          cat "$RUNNER_TEMP/tenm-300oneway-20loss-tc/tcdiag-result.json" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-horizon-10m-r${{ matrix.replica }}-${{ github.sha }}
          path: ${{ runner.temp }}/tenm-300oneway-20loss-tc
          if-no-files-found: warn
          retention-days: 7
