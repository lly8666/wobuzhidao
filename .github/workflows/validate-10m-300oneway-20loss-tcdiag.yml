name: validate-10m-300oneway-20loss-tcdiag

on:
  push:
    branches:
      - agent/validate-10m-300oneway-20loss-perlane-d3b
    paths:
      - '.github/workflows/validate-10m-300oneway-20loss-tcdiag.yml'
      - 'scripts/validate_perlane_tc_diag_d3b.sh'
      - 'scripts/patch_mux_teardown_stats_d3b.py'
      - 'scripts/patch_raw_rcvbuf_d3b.py'
      - 'scripts/patch_tc_data_counters_d3b.py'

permissions:
  contents: read
  actions: read

jobs:
  exact-source-tcdiag:
    name: tcdiag-rcvbuf-${{ matrix.rcvbuf }}-r${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rcvbuf: [default, 16m]
        replica: [1, 2]
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: d3b54dced255cc9becb3e501991f71a034e7438f
          path: product

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc iproute2 iptables tcpdump curl unzip openssl

      - name: Add teardown-only server FakeTCP stats
        run: |
          python3 "$GITHUB_WORKSPACE/helper/scripts/patch_mux_teardown_stats_d3b.py" "$GITHUB_WORKSPACE/product"

      - name: Add raw receive-buffer diagnostic hook
        run: |
          python3 "$GITHUB_WORKSPACE/helper/scripts/patch_raw_rcvbuf_d3b.py" "$GITHUB_WORKSPACE/product"
          (cd "$GITHUB_WORKSPACE/product" && gofmt -w cmd/wbd-faketcp-mux/main_linux.go)

      - name: Add data-only tc counters to helper
        run: |
          python3 "$GITHUB_WORKSPACE/helper/scripts/patch_tc_data_counters_d3b.py" "$GITHUB_WORKSPACE/helper/scripts/validate_perlane_tc_diag_d3b.sh"
          bash -n "$GITHUB_WORKSPACE/helper/scripts/validate_perlane_tc_diag_d3b.sh"

      - name: Run low-overhead exact-source tc diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          SOAK_REPLICA: ${{ matrix.replica }}
          DIAG_LINKRX: off
          WBD_DIAG_RAW_RCVBUF_BYTES: ${{ matrix.rcvbuf == '16m' && '16777216' || '' }}
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/helper/scripts/validate_perlane_tc_diag_d3b.sh" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
          rc=$?
          set -e
          if [ -e "$RUNNER_TEMP/tenm-300oneway-20loss-tc" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/tenm-300oneway-20loss-tc" || true
          fi
          exit "$rc"

      - name: Show receive-path evidence
        if: always()
        run: |
          grep -E 'WBD_RAW_RCVBUF|WBD_FAKETCP_MUX_STATS|WBD_TCDIAG_RESULT|WBD_TCDIAG_SUMMARY' "$RUNNER_TEMP/tenm-300oneway-20loss-tc/faketcp-mux.log" "$RUNNER_TEMP/tenm-300oneway-20loss-tc/tcdiag-result.json" 2>/dev/null || true

      - name: Upload tc diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcdiag-10m-rcvbuf-${{ matrix.rcvbuf }}-r${{ matrix.replica }}-${{ github.sha }}
          path: ${{ runner.temp }}/tenm-300oneway-20loss-tc
          if-no-files-found: warn
          retention-days: 7
