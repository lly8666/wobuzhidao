name: validate-singlelane-shadow-candidates

on:
  push:
    branches:
      - agent/validate-singlelane-20m-300ms-20loss-d3b
    paths:
      - '.github/singlelane-case.env'

permissions:
  contents: read
  actions: read

jobs:
  severe:
    name: isolated-singlelane-case
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          path: helper
      - name: Read exact case
        id: case
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/helper/.github/singlelane-case.env"
          case "$CANDIDATE" in
            d3b-baseline|eb3de-late-first|shadow-a-bounded|shadow-b-adaptive|shadow-c-conservative) ;;
            *) echo "bad candidate: $CANDIDATE" >&2; exit 2 ;;
          esac
          case "$LOSS_PCT" in 20|30|40) ;; *) echo "bad loss: $LOSS_PCT" >&2; exit 2 ;; esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad source sha" >&2; exit 2; }
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "loss_pct=$LOSS_PCT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.case.outputs.source_sha }}
          path: product
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install build/network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool iproute2 iptables tcpdump unzip gcc make openssl
      - name: Run isolated severe case
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.case.outputs.candidate }}
          SOURCE_SHA: ${{ steps.case.outputs.source_sha }}
          LOSS_PCT: ${{ steps.case.outputs.loss_pct }}
          WOLFSSL_SOURCE_ARTIFACT_ID: '9529710833'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/helper/.github/scripts/validate_singlelane_shadow_candidate.sh" "$RUNNER_TEMP/run-singlelane-case.sh"
          sed -i "s/loss_pct_each_direction=20/loss_pct_each_direction=${LOSS_PCT}/" "$RUNNER_TEMP/run-singlelane-case.sh"
          sed -i "s/export NETEM_LOSS_PCT=20/export NETEM_LOSS_PCT=${LOSS_PCT}/" "$RUNNER_TEMP/run-singlelane-case.sh"
          bash "$RUNNER_TEMP/run-singlelane-case.sh" "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singlelane-${{ steps.case.outputs.candidate }}-loss${{ steps.case.outputs.loss_pct }}
          path: ${{ runner.temp }}/singlelane-${{ steps.case.outputs.candidate }}
          if-no-files-found: warn
          retention-days: 7
