name: next-longmix-udp-sample
run-name: longmix-A-p${{ inputs.loss_percent }}-seed${{ inputs.seed }}-sourceb4

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Exactly one A real-socket UDP sample"
        required: true
        type: choice
        options: ["A"]
      loss_percent:
        description: "Two-direction fixed netem percent for 300s"
        required: true
        type: choice
        options: ["0", "5", "20", "30"]
      seed:
        description: "Paired workload seed 2608101"
        required: true
        default: "2608101"
        type: string
      product_source_sha:
        description: "Exact immutable product SOURCE; no implied HEAD qualification"
        required: true
        default: "b4ea061178a6e09b7e7c8587d72b4b8535492567"
        type: string

permissions:
  contents: read

jobs:
  one-realpath-a-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ART: ${{ github.workspace }}/artifacts/longmix-single
      WBD_STRICT_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/longmix-single
      WBD_STRICT_MODE: normal
      WBD_STRICT_SCENARIO: lossless
      WBD_STRICT_SEED: ${{ inputs.seed }}
      WBD_STRICT_RATE_MBPS: "10"
      WBD_STRICT_LANES: "1"
      WBD_STRICT_FEC_PARITY: "20"
      WBD_STRICT_FEC_SCREEN: "0"
      WBD_STRICT_CPU_PROFILE: "0"
      WBD_STRICT_STATEFUL_GATE: "0"
      WBD_STRICT_WAN_NEIGHBORS: dynamic
      WBD_LONGMIX_LOSS: ${{ inputs.loss_percent }}
      WBD_PRODUCT_SOURCE: ${{ inputs.product_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract, source pin, and claim one sample
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          mkdir -p "$ART"
          python3 - <<'PY'
          import json,os,sys
          sys.path.insert(0,"tools")
          from longmix_profile import validate_sample
          x={"workload":"A", "loss_percent":int(os.environ["WBD_LONGMIX_LOSS"]),
             "seed":int(os.environ["WBD_STRICT_SEED"]),
             "source_sha":os.environ["WBD_PRODUCT_SOURCE"],
             "duration_s":300, "drain_s":10}
          validate_sample(x)
          with open(os.environ["ART"]+"/sample.json","w") as f:
              json.dump(x,f,indent=2)
          PY
          echo "WBD_HARNESS_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TESTED_SOURCE_SHA=$WBD_PRODUCT_SOURCE" >> "$GITHUB_ENV"
          python3 tools/perf_sample_guard.py claim             --identity "longmix:A:p$WBD_LONGMIX_LOSS:seed$WBD_STRICT_SEED:source$WBD_PRODUCT_SOURCE:helper$GITHUB_SHA"             --receipt "$ART/sample-claim.json"

      - name: Install isolated namespace/tc dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl             build-essential bison flex pkg-config libbpf-dev libelf-dev             libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true

      - name: Build pinned seeded tc and exact b4 product
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/wbd-product-source" "$WBD_PRODUCT_SOURCE"
          cd "$RUNNER_TEMP/wbd-product-source"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"

      - name: Build exact one-sample script from validated strict harness
        run: |
          set -euo pipefail
          python3 tools/prepare_longmix_udp.py --sample "$ART/sample.json" --artifact-dir "$ART"
          bash -n "$ART/generated-longmix-udp-a.sh"

      - name: Run one fullstack 300s A sample
        id: sample
        continue-on-error: true
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,WBD_LONGMIX_LOSS,WBD_HARNESS_SHA,WBD_STRICT_ARTIFACT_DIR,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_FEC_PARITY,WBD_STRICT_FEC_SCREEN,WBD_STRICT_CPU_PROFILE,WBD_STRICT_STATEFUL_GATE,WBD_STRICT_WAN_NEIGHBORS,WBD_STRICT_TC             env GITHUB_SHA="$TESTED_SOURCE_SHA"             bash "$ART/generated-longmix-udp-a.sh"

      - name: Validate loss, route, fragmented sizes and first delivery
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_longmix_udp_compact.py --artifact-dir "$ART"             --sample "$ART/sample.json" --output "$ART/summary-longmix.json"

      - name: Audit and delete bounded header pcaps and executables
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["ART"]).resolve()
          assert p==Path(os.environ["GITHUB_WORKSPACE"]).resolve()/"artifacts/longmix-single"
          rows=[]
          for f in p.glob("*.pcap*"):
              if not f.is_file():continue
              h=hashlib.sha256()
              with f.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(65536),b""):
                      h.update(chunk)
              rows.append({"name":f.name,"bytes":f.stat().st_size,"sha256":h.hexdigest()})
              f.unlink()
          for name in ("wbd-client","wbd-server"):
              f=p/name
              if f.exists():f.unlink()
          (p/"capture-audit.json").write_text(json.dumps({
             "raw_deleted":True,"capture_header_snaplen_bytes":256,
             "records":rows,"only_numeric_summary_retained":True},indent=2))
          PY

      - name: Upload one sample compact immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmix-A-p${{ inputs.loss_percent }}-seed${{ inputs.seed }}-${{ github.sha }}
          path: |
            ${{ env.ART }}/*.json
            ${{ env.ART }}/*.jsonl
            ${{ env.ART }}/*.txt
            ${{ env.ART }}/*.log
          retention-days: 30
          if-no-files-found: error

      - name: Preserve failures, no false PASS
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          ANALYZER_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          echo "sample=$SAMPLE_OUTCOME analyzer=$ANALYZER_OUTCOME"
          test "$SAMPLE_OUTCOME" = success
          test "$ANALYZER_OUTCOME" = success
