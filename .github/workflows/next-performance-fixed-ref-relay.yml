name: next-performance-fixed-ref-relay

on:
  push:
    branches: [main]
    paths:
      - .github/perf-fixed-ref-request.json
      - .github/workflows/next-performance-fixed-ref-relay.yml

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Load fixed-ref request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          d=json.load(open('.github/perf-fixed-ref-request.json', encoding='utf-8'))
          required=('ref','expected_sha','workflow','mode','scenario','seed','rate_mbps','lanes')
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit(f'missing keys: {missing}')
          if d['ref'] != 'next/tlslike-dataplane' or d['workflow'] != 'next-strict-weaknet.yml':
              raise SystemExit('unexpected ref/workflow')
          if not re.fullmatch(r'[0-9a-f]{40}', d['expected_sha']):
              raise SystemExit('expected_sha must be full sha')
          if d['scenario'] not in {'lossless','5205','5305'}:
              raise SystemExit('unexpected scenario')
          if d['mode'] == 'normal':
              if str(d['rate_mbps']) != '10' or str(d['lanes']) != '1':
                  raise SystemExit('normal must be 10Mbps/1lane')
          elif d['mode'] == 'game':
              if str(d['rate_mbps']) != '3' or str(d['lanes']) != '4':
                  raise SystemExit('game must be 3Mbps/4lanes')
          else:
              raise SystemExit('unexpected mode')
          if not re.fullmatch(r'[0-9]+', str(d['seed'])):
              raise SystemExit('seed must be decimal')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key,name in (
                  ('ref','PERF_REF'),('expected_sha','EXPECTED_SHA'),('workflow','PERF_WORKFLOW'),
                  ('mode','PERF_MODE'),('scenario','PERF_SCENARIO'),('seed','PERF_SEED'),
                  ('rate_mbps','PERF_RATE'),('lanes','PERF_LANES')):
                  f.write(f'{name}={d[key]}\n')
          PY

      - name: Require exact product branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$PERF_REF" | awk '{print $1}')"
          echo "expected=$EXPECTED_SHA remote=$remote_sha attempt=$GITHUB_RUN_ATTEMPT"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Arm first attempt or dispatch exact sample
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "WBD_FIXED_REF_RELAY_ARMED_ONLY expected_sha=$EXPECTED_SHA"
            exit 0
          fi
          title="strict-${PERF_MODE}-${PERF_SCENARIO}-seed${PERF_SEED}-rate${PERF_RATE}-lanes${PERF_LANES}"
          existing="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$PERF_WORKFLOW/runs"             -f event=workflow_dispatch -f branch="$PERF_REF" -f per_page=100             --jq ".workflow_runs[] | select(.head_sha == \"$EXPECTED_SHA\" and .display_title == \"$title\") | .id"             | head -n1)"
          if [ -n "$existing" ]; then
            echo "WBD_FIXED_REF_RELAY_ALREADY_PRESENT run=$existing title=$title"
            exit 0
          fi
          gh workflow run "$PERF_WORKFLOW" --ref "$PERF_REF"             -f mode="$PERF_MODE" -f scenario="$PERF_SCENARIO" -f seed="$PERF_SEED"             -f rate_mbps="$PERF_RATE" -f lanes="$PERF_LANES"
          echo "WBD_FIXED_REF_RELAY_DISPATCHED title=$title expected_sha=$EXPECTED_SHA"
