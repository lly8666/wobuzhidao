name: tmp-udp2raw-speeder-loss-oracle-v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-udp2raw-speeder-loss-oracle-v2.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iptables
      - name: Fetch pinned binaries
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/u.tgz https://github.com/wangyu-/udp2raw/releases/download/20230206.0/udp2raw_binaries.tar.gz
          curl -LfsS -o /tmp/s.tgz https://github.com/wangyu-/UDPspeeder/releases/download/20230206.0/speederv2_binaries.tar.gz
          mkdir -p /tmp/o/u /tmp/o/s
          tar -xzf /tmp/u.tgz -C /tmp/o/u; tar -xzf /tmp/s.tgz -C /tmp/o/s
          chmod +x /tmp/o/u/udp2raw_amd64 /tmp/o/s/speederv2_amd64
          sha256sum /tmp/u.tgz /tmp/s.tgz /tmp/o/u/udp2raw_amd64 /tmp/o/s/speederv2_amd64 > /tmp/o/SHA256SUMS.txt
      - name: Write harness
        run: |
          cat > /tmp/o/h.py <<'PY'
          import argparse,heapq,json,math,random,select,signal,socket,struct,time
          def pc(a,p):
            if not a:return 0
            a=sorted(a);return a[max(0,min(len(a)-1,math.ceil(p*len(a)/100)-1))]
          def echo(port):
            s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.bind(('127.0.0.1',port))
            while 1:
              d,a=s.recvfrom(65535);s.sendto(d,a)
          def proxy(port,target,loss,delay,seed,out):
            s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.bind(('127.0.0.1',port));s.setblocking(False);t=('127.0.0.1',target);peer=None;q=[];r=random.Random(seed);n=0;stop=False;st={'seen':0,'drop':0,'bytes':0,'reverse':0}
            def x(*_):
              nonlocal stop;stop=True
            signal.signal(signal.SIGTERM,x)
            while not stop:
              now=time.monotonic()
              while q and q[0][0]<=now:
                _,_,d,a=heapq.heappop(q);s.sendto(d,a)
              rr,_,_=select.select([s],[],[],.005)
              if not rr:continue
              try:d,a=s.recvfrom(65535)
              except BlockingIOError:continue
              if a==t:
                st['reverse']+=1
                if peer:heapq.heappush(q,(time.monotonic()+delay/1000,n,d,peer));n+=1
              else:
                peer=a;st['seen']+=1;st['bytes']+=len(d)
                if r.random()<loss/100:st['drop']+=1;continue
                heapq.heappush(q,(time.monotonic()+delay/1000,n,d,t));n+=1
            if out:
              with open(out,'w') as f:json.dump(st,f)
          def ping(port,count,window,out):
            s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.bind(('127.0.0.1',0));s.connect(('127.0.0.1',port));s.setblocking(False);sent={};done=set();v=[];n=0;end=time.monotonic()+12
            def send(i):sent[i]=time.monotonic();s.send(struct.pack('!I',i)+bytes(252))
            while n<count and len(sent)-len(done)<window:send(n);n+=1
            while time.monotonic()<end and len(done)<count:
              rr,_,_=select.select([s],[],[],.005);now=time.monotonic()
              if rr:
                try:d=s.recv(65535)
                except BlockingIOError:d=b''
                if len(d)>=4:
                  i=struct.unpack('!I',d[:4])[0]
                  if i in sent and i not in done:done.add(i);v.append((now-sent[i])*1000)
              for i,t in list(sent.items()):
                if i not in done and now-t>1:done.add(i)
              while n<count and len(sent)-len(done)<window:send(n);n+=1
            z={'n':count,'delivery':len(v)/count,'mean':sum(v)/len(v) if v else 0,'p50':pc(v,50),'p95':pc(v,95),'p99':pc(v,99),'late':sum(x>100 for x in v)/len(v) if v else 1}
            if out:
              with open(out,'w') as f:json.dump(z,f)
            print(json.dumps(z))
          a=argparse.ArgumentParser();q=a.add_subparsers(dest='c',required=True)
          e=q.add_parser('echo');e.add_argument('port',type=int)
          p=q.add_parser('proxy');p.add_argument('port',type=int);p.add_argument('target',type=int);p.add_argument('loss',type=float);p.add_argument('delay',type=float);p.add_argument('seed',type=int);p.add_argument('out')
          g=q.add_parser('ping');g.add_argument('port',type=int);g.add_argument('count',type=int);g.add_argument('window',type=int);g.add_argument('out')
          x=a.parse_args()
          if x.c=='echo':echo(x.port)
          elif x.c=='proxy':proxy(x.port,x.target,x.loss,x.delay,x.seed,x.out if x.out!='-' else None)
          else:ping(x.port,x.count,x.window,x.out if x.out!='-' else None)
          PY
      - name: Run warmed 3-seed sweep
        run: |
          set -euo pipefail
          U=/tmp/o/u/udp2raw_amd64; S=/tmp/o/s/speederv2_amd64; H=/tmp/o/h.py
          echo 'seed,loss,mean_ms,p50_ms,p95_ms,p99_ms,late_ratio,delivery_ratio,fec_packets,dropped_packets,fec_bytes' > /tmp/o/results.csv
          clean(){ sudo pkill -f udp2raw_amd64 || true; pkill -f speederv2_amd64 || true; pkill -f '/tmp/o/h.py echo' || true; pkill -f '/tmp/o/h.py proxy' || true; sleep .15; }
          trap clean EXIT
          for seed in 260824 260825 260826; do
            for loss in 0 1 2 3 5 8 10 12 15; do
              clean
              python3 "$H" echo 42000 >/dev/null 2>&1 &
              "$S" -s -l127.0.0.1:42001 -r127.0.0.1:42000 -f20:20 --mode 0 --timeout 8 -k wbdtest >/tmp/o/ss.log 2>&1 &
              sudo "$U" -s -l127.0.0.1:42002 -r127.0.0.1:42001 -k wbdtest --raw-mode faketcp -a >/tmp/o/us.log 2>&1 &
              sudo "$U" -c -l127.0.0.1:42003 -r127.0.0.1:42002 -k wbdtest --raw-mode faketcp -a >/tmp/o/uc.log 2>&1 &
              python3 "$H" proxy 42004 42003 0 25 $seed - >/dev/null 2>&1 & WP=$!
              "$S" -c -l127.0.0.1:42005 -r127.0.0.1:42004 -f20:20 --mode 0 --timeout 8 -k wbdtest >/tmp/o/sc.log 2>&1 &
              sleep .6
              python3 "$H" ping 42005 64 1 - >/dev/null
              kill -TERM "$WP" || true; wait "$WP" || true; sleep .05
              python3 "$H" proxy 42004 42003 "$loss" 25 $((seed+loss*1009)) /tmp/o/x.json >/dev/null 2>&1 & P=$!
              sleep .05
              python3 "$H" ping 42005 200 32 /tmp/o/p.json >/dev/null
              kill -TERM "$P" || true; wait "$P" || true
              python3 - "$seed" "$loss" <<'PY'
          import csv,json,sys
          seed,loss=sys.argv[1:];p=json.load(open('/tmp/o/p.json'));x=json.load(open('/tmp/o/x.json'))
          with open('/tmp/o/results.csv','a',newline='') as f:csv.writer(f).writerow([seed,loss,p['mean'],p['p50'],p['p95'],p['p99'],p['late'],p['delivery'],x['seen'],x['drop'],x['bytes']])
          PY
            done
          done
          python3 - <<'PY'
          import csv,statistics
          r=list(csv.DictReader(open('/tmp/o/results.csv')));cols=['mean_ms','p50_ms','p95_ms','p99_ms','late_ratio','delivery_ratio']
          with open('/tmp/o/median.csv','w',newline='') as f:
            w=csv.writer(f);w.writerow(['loss']+cols)
            for loss in ['0','1','2','3','5','8','10','12','15']:
              a=[x for x in r if x['loss']==loss];w.writerow([loss]+[statistics.median(float(x[c]) for x in a) for c in cols])
          PY
          cat /tmp/o/median.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udp2raw-speeder-loss-oracle-v2
          path: |
            /tmp/o/results.csv
            /tmp/o/median.csv
            /tmp/o/SHA256SUMS.txt
            /tmp/o/*.log
