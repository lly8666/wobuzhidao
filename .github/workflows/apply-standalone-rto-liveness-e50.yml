name: apply-standalone-rto-liveness-e50

on:
  push:
    branches:
      - agent/fix-faketcp-congestion-e50
    paths:
      - '.github/workflows/apply-standalone-rto-liveness-e50.yml'

permissions:
  contents: write

env:
  BRANCH: agent/fix-faketcp-congestion-e50

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply and verify source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('cmd/wbd-faketcp/main.go')
          s = p.read_text()
          old = "\t\tcase now := <-t.C:\n\t\t\te.senderMu.Lock()\n\t\t\tp := e.sender.RetransmitDue(now)\n\t\t\tvar err error\n\t\t\tif p != nil {\n\t\t\t\terr = e.sendDataPending(p)\n\t\t\t}\n\t\t\te.senderMu.Unlock()\n\t\t\tif err != nil {\n\t\t\t\treturn err\n\t\t\t}\n"
          new = "\t\tcase now := <-t.C:\n\t\t\te.senderMu.Lock()\n\t\t\tpending := e.sender.RetransmitDueBatch(now, faketcp.SteadyStateRetransmitBatch)\n\t\t\tvar err error\n\t\t\tfor _, p := range pending {\n\t\t\t\tif err = e.sendDataPending(p); err != nil {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t}\n\t\t\te.senderMu.Unlock()\n\t\t\tif err != nil {\n\t\t\t\treturn err\n\t\t\t}\n"
          if s.count(old) != 1:
              raise SystemExit('standalone retransmit anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          test_b64 = ' '.replace(' ', '')
          Path('cmd/wbd-faketcp-mux/liveness_test.go').write_bytes(base64.b64decode(test_b64))
          PY
          gofmt -w cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/liveness_test.go
          go test ./internal/faketcp ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux ./cmd/wbd-link-proxy -count=1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-standalone-rto-liveness-e50.yml
          git add cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/liveness_test.go
          git commit -m 'fix(faketcp): align bounded recovery and liveness'
          git push origin HEAD:"$BRANCH"
