name: windows-tun-admin-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-tun-admin-smoke.yml'
      - 'cmd/wbd-tun/**'
      - 'internal/tunnel/**'
      - 'internal/dataplane/**'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/windows_tun_dataplane_probe.go'
      - 'deps/platform-lock.json'
  push:
    branches:
      - dev/wbd-raw-fec-v2
    paths:
      - '.github/workflows/windows-tun-admin-smoke.yml'
      - 'cmd/wbd-tun/**'
      - 'internal/tunnel/**'
      - 'internal/dataplane/**'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/windows_tun_dataplane_probe.go'
      - 'deps/platform-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download locked official signed Wintun compatibility artifact
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wintun-0.14.1.zip"
          Invoke-WebRequest -UseBasicParsing 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $want = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($got -ne $want) { throw "Wintun ZIP SHA256 mismatch: got=$got want=$want" }
          $dir = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match '[\\/]amd64[\\/]' } | Select-Object -First 1
          if (-not $dll) { throw 'amd64 wintun.dll not found in locked archive' }
          Copy-Item -LiteralPath $dll.FullName -Destination "$env:RUNNER_TEMP\wintun.dll"
          Write-Output "WBD_WINDOWS_WINTUN_COMPAT_ARTIFACT_PASS sha256=$got"
      - name: Build WBD TUN client and real dataplane probe
        shell: pwsh
        run: |
          go test ./internal/tunnel ./internal/dataplane ./cmd/wbd-tun -count=1
          go build -trimpath -o "$env:RUNNER_TEMP\wbd-tun.exe" ./cmd/wbd-tun
          go build -trimpath -o "$env:RUNNER_TEMP\wbd-tun-dataplane-probe.exe" ./scripts/windows_tun_dataplane_probe.go
      - name: Administrator adapter route dataplane and cleanup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\wbd-tun.exe"
          $probeExe = "$env:RUNNER_TEMP\wbd-tun-dataplane-probe.exe"
          $state = "$env:RUNNER_TEMP\wbd-route-state.json"
          $stdout = "$env:RUNNER_TEMP\wbd-tun.stdout.log"
          $stderr = "$env:RUNNER_TEMP\wbd-tun.stderr.log"
          $probeOut = "$env:RUNNER_TEMP\wbd-tun-probe.stdout.log"
          $probeErr = "$env:RUNNER_TEMP\wbd-tun-probe.stderr.log"
          $proc = $null
          $probe = $null
          try {
            $probe = Start-Process -FilePath $probeExe -ArgumentList @('-listen','127.0.0.1:49999','-target','203.0.113.7','-timeout','15s') -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
            $probeReady = $false
            for ($i = 0; $i -lt 50; $i++) {
              if ($probe.HasExited) { break }
              if ((Test-Path $probeOut) -and ((Get-Content $probeOut -Raw) -match 'WBD_WINDOWS_TUN_DATAPLANE_PROBE_READY')) { $probeReady = $true; break }
              Start-Sleep -Milliseconds 100
            }
            if (-not $probeReady) {
              if (Test-Path $probeErr) { Get-Content $probeErr }
              throw 'WBD TUN dataplane probe did not become ready'
            }

            $proc = Start-Process -FilePath $exe -ArgumentList @('-mode','client','-ifname','WBDCI','-mtu','1400','-transport','127.0.0.1:49999','-run-for','20s') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              if ($proc.HasExited) { break }
              if ((Test-Path $stderr) -and ((Get-Content $stderr -Raw) -match 'WBD_TUN_READY')) { $ready = $true; break }
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready) {
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Wintun-backed wbd-tun did not become ready'
            }
            $adapter = Get-NetAdapter -Name WBDCI -ErrorAction Stop
            $ifIndex = [uint32]$adapter.ifIndex
            Write-Output "WBD_WINDOWS_WINTUN_ADAPTER_PASS ifindex=$ifIndex"

            # Reproduce the physical 2026-08-30 failure deterministically: a
            # prior crash leaves a route-state file whose saved NRPT GUID has
            # already disappeared. Apply must treat the missing WBD-owned NRPT
            # object as idempotent, remove the stale state, and continue.
            $stale = [ordered]@{
              Schema='wbd-windows-route-state/v3'
              AdapterAlias='WBDCI'
              AdapterInterfaceIndex=$ifIndex
              MTU4=$null
              MTU6=$null
              DNSConfigured=$true
              NRPTRuleName='{00000000-0000-0000-0000-000000000001}'
              Addresses=@()
              UnderlayRoutes=@()
              DirectRoutes=@()
              CaptureRoutes=@()
            }
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($state, ($stale | ConvertTo-Json -Depth 6), $utf8NoBom)

            $applyLog = (& ./scripts/windows_tun_route.ps1 -Action Apply -Mode Split -AdapterAlias WBDCI -TunnelAddress4 10.66.0.2/30 -Underlay4 1.1.1.1 -Prefix4 203.0.113.0/24 -MTU 1400 -StatePath $state 2>&1 | Out-String)
            Write-Output $applyLog
            if ($applyLog -notmatch 'WBD_WINDOWS_TUN_STALE_STATE_RECOVERED') { throw 'stale route-state recovery marker missing' }
            if ($applyLog -notmatch 'WBD_WINDOWS_TUN_NRPT_ALREADY_ABSENT') { throw 'missing-NRPT idempotency marker missing' }
            $stateBytes = [System.IO.File]::ReadAllBytes($state)
            if ($stateBytes.Length -ge 3 -and $stateBytes[0] -eq 0xEF -and $stateBytes[1] -eq 0xBB -and $stateBytes[2] -eq 0xBF) { throw 'route state contains UTF-8 BOM' }
            Write-Output 'WBD_WINDOWS_TUN_STALE_STATE_RECOVERY_PASS missing_nrpt=benign utf8_bom=0'

            if (-not (Get-NetIPAddress -InterfaceIndex $ifIndex -IPAddress 10.66.0.2 -ErrorAction SilentlyContinue)) { throw 'Wintun IPv4 address missing after apply' }
            if (-not (Get-NetRoute -DestinationPrefix 203.0.113.0/24 -InterfaceIndex $ifIndex -ErrorAction SilentlyContinue)) { throw 'WBD split capture route missing after apply' }
            $escape = Get-NetRoute -DestinationPrefix 1.1.1.1/32 -ErrorAction SilentlyContinue | Where-Object { [uint32]$_.InterfaceIndex -ne $ifIndex } | Select-Object -First 1
            if (-not $escape) { throw 'underlay /32 was not locked outside Wintun' }
            Write-Output "WBD_WINDOWS_TUN_ADMIN_APPLY_PASS underlay_ifindex=$($escape.InterfaceIndex)"

            # This is a real bidirectional Wintun dataplane assertion. PING.EXE
            # emits an IPv4 ICMP request into the split route; wbd-tun must read
            # it from Wintun and frame it over UDP. The qualification peer
            # validates WBDP/IP, builds an ICMP reply, and sends the framed reply
            # to wbd-tun, which must write it back through Wintun for ping to
            # report success.
            & "$env:SystemRoot\System32\PING.EXE" -n 1 -w 3000 203.0.113.7
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path $probeOut) { Get-Content $probeOut }
              if (Test-Path $probeErr) { Get-Content $probeErr }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "real Wintun dataplane ping failed with exit code $LASTEXITCODE"
            }
            # Start-Process -PassThru returns a Process object that remains valid
            # after the child exits. Waiting by numeric PID races with a fast,
            # successful probe because Wait-Process performs a fresh lookup and
            # can report "process not found" after the OS has reaped it.
            if (-not $probe.WaitForExit(5000)) { throw 'WBD TUN dataplane probe did not exit after replying' }
            $probe.Refresh()
            if ($probe.ExitCode -ne 0) {
              if (Test-Path $probeErr) { Get-Content $probeErr }
              throw "WBD TUN dataplane probe exited $($probe.ExitCode)"
            }
            $probeLog = Get-Content $probeOut -Raw
            if ($probeLog -notmatch 'WBD_WINDOWS_TUN_DATAPLANE_PROBE_PASS') { throw 'missing Wintun dataplane probe pass marker' }
            Get-Content $probeOut
            Write-Output 'WBD_WINDOWS_TUN_DATAPLANE_PASS direction=bidirectional framing=WBDP_IP'

            & ./scripts/windows_tun_route.ps1 -Action Cleanup -StatePath $state
            if (Test-Path $state) { throw 'route state survived cleanup' }
            if (Get-NetRoute -DestinationPrefix 203.0.113.0/24 -InterfaceIndex $ifIndex -ErrorAction SilentlyContinue) { throw 'WBD capture route survived cleanup' }
            if (Get-NetIPAddress -InterfaceIndex $ifIndex -IPAddress 10.66.0.2 -ErrorAction SilentlyContinue) { throw 'WBD address survived cleanup' }
            Write-Output 'WBD_WINDOWS_TUN_ADMIN_CLEANUP_PASS'

            if (-not $proc.WaitForExit(25000)) { throw 'wbd-tun did not exit after qualification lifetime' }
            $proc.Refresh()
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "wbd-tun exited $($proc.ExitCode)"
            }
            Write-Output 'WBD_WINDOWS_TUN_ADMIN_SMOKE_PASS compatibility_only=1 dataplane=real_bidirectional release_authority=0'
          } finally {
            try { & ./scripts/windows_tun_route.ps1 -Action Cleanup -StatePath $state 2>$null | Out-Null } catch { }
            if ($probe -and -not $probe.HasExited) { Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue }
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
