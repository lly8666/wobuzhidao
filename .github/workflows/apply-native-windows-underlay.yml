name: Apply native Windows underlay discovery

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/apply-native-windows-underlay.yml'
      - 'tools/apply_native_windows_underlay.py'
      - 'tools/fix_native_windows_underlay_legacy_iphelper.py'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply native underlay implementation
        shell: pwsh
        run: |
          python tools/apply_native_windows_underlay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fix_native_windows_underlay_legacy_iphelper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format and inspect
        shell: pwsh
        run: |
          gofmt -w internal/windowsruntime/controller.go internal/windowsruntime/underlay_path.go internal/windowsruntime/underlay_default_windows.go internal/windowsruntime/underlay_default_other.go internal/windowsruntime/underlay_native_windows.go internal/windowsruntime/underlay_native_windows_test.go
          git diff --check
          git status --short
      - name: Test Windows runtime
        shell: pwsh
        run: |
          go test ./internal/windowsruntime -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/windowsgui ./cmd/wbd-windows-gui ./cmd/wbd-windows-portable -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows client entry points
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-H=windowsgui" -o $env:RUNNER_TEMP\wbd-windows-gui.exe .\cmd\wbd-windows-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-H=windowsgui" -o $env:RUNNER_TEMP\wbd.exe .\cmd\wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert default steady-state path is native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controller = Get-Content internal\windowsruntime\controller.go -Raw
          if ($controller -notmatch 'defaultUnderlayDiscoverer\(\)') { throw 'controller default did not switch to platform-native underlay discovery' }
          $native = Get-Content internal\windowsruntime\underlay_native_windows.go -Raw
          foreach ($needle in @('GetIpForwardTable','GetAdaptersAddresses','SendARP')) {
            if ($native -notmatch $needle) { throw "native underlay missing $needle" }
          }
          if ($native -match 'GetIpForwardTable2') { throw 'underlay still depends on unavailable GetIpForwardTable2 wrapper' }
          Write-Output 'WBD_WINDOWS_NATIVE_UNDERLAY_PASS route=iphlpapi-v4 adapters=iphlpapi arp=iphlpapi powershell_steady_state=0'
      - name: Commit tested product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/windowsruntime/controller.go internal/windowsruntime/underlay_path.go internal/windowsruntime/underlay_default_windows.go internal/windowsruntime/underlay_default_other.go internal/windowsruntime/underlay_native_windows.go internal/windowsruntime/underlay_native_windows_test.go
          git commit -m "refactor: use native Windows underlay discovery"
          git push origin HEAD:agent/fix-per-association-mtu-20260914
