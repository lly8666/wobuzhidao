name: next-performance-final18-fixed-ref-coordinator

on:
  push:
    branches: [main]
    paths:
      - .github/perf-final18-fixed-ref-request.json
      - .github/workflows/next-performance-final18-fixed-ref-coordinator.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-missing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load and verify fixed final head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          d=json.load(open('.github/perf-final18-fixed-ref-request.json', encoding='utf-8'))
          if d.get('ref') != 'next/tlslike-dataplane':
              raise SystemExit('unexpected canonical ref')
          if d.get('workflow') != 'next-strict-weaknet.yml':
              raise SystemExit('unexpected workflow')
          sha=d.get('expected_sha','')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('expected_sha must be full sha')
          dispatch_ref=d.get('dispatch_ref',d['ref'])
          if dispatch_ref != d['ref']:
              m=re.fullmatch(r'perf-fixed/([0-9a-f]{40})(?:-r[0-9]+)?', dispatch_ref)
              if not m or m.group(1) != sha:
                  raise SystemExit('dispatch_ref must be fixed to expected_sha')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"PERF_REF={d['ref']}\n")
              f.write(f"DISPATCH_REF={dispatch_ref}\n")
              f.write(f"EXPECTED_SHA={sha}\n")
              f.write(f"PERF_WORKFLOW={d['workflow']}\n")
              f.write(f"GENERATION={d.get('generation','')}\n")
          PY
          PERF_REF="$(jq -r .ref .github/perf-final18-fixed-ref-request.json)"
          DISPATCH_REF="$(jq -r '.dispatch_ref // .ref' .github/perf-final18-fixed-ref-request.json)"
          EXPECTED_SHA="$(jq -r .expected_sha .github/perf-final18-fixed-ref-request.json)"
          PERF_WORKFLOW="$(jq -r .workflow .github/perf-final18-fixed-ref-request.json)"
          GENERATION="$(jq -r '.generation // ""' .github/perf-final18-fixed-ref-request.json)"
          export PERF_REF DISPATCH_REF EXPECTED_SHA PERF_WORKFLOW GENERATION
          remote_sha="$(git ls-remote origin "refs/heads/$DISPATCH_REF" | awk '{print $1}')"
          echo "generation=$GENERATION canonical_ref=$PERF_REF dispatch_ref=$DISPATCH_REF expected=$EXPECTED_SHA remote=$remote_sha"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Validate and dispatch each missing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/final18.txt" <<'EOF'
          game 5205 101 3 4
          game 5305 101 3 4
          normal lossless 101 10 1
          game lossless 101 3 4
          normal 5205 101 10 1
          normal 5305 101 10 1
          normal lossless 202 10 1
          game lossless 202 3 4
          normal 5205 202 10 1
          game 5205 202 3 4
          normal 5305 202 10 1
          game 5305 202 3 4
          normal lossless 303 10 1
          game lossless 303 3 4
          normal 5205 303 10 1
          game 5205 303 3 4
          normal 5305 303 10 1
          game 5305 303 3 4
          EOF

          PLAN="$RUNNER_TEMP/final18.txt" python3 - <<'PY'
          import os
          from pathlib import Path
          rows=[tuple(x.split()) for x in Path(os.environ['PLAN']).read_text().splitlines() if x.strip()]
          if len(rows)!=18 or len(set(rows))!=18:
              raise SystemExit('plan must contain exactly 18 unique identities')
          expected=set()
          for mode in ('normal','game'):
              rate,lanes=('10','1') if mode=='normal' else ('3','4')
              for scenario in ('lossless','5205','5305'):
                  for seed in ('101','202','303'):
                      expected.add((mode,scenario,seed,rate,lanes))
          if set(rows)!=expected:
              raise SystemExit('plan mismatch')
          print('WBD_FINAL18_COORDINATOR_PLAN_PASS count=18')
          PY

          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$PERF_WORKFLOW/runs" \
            -f event=workflow_dispatch -f branch="$DISPATCH_REF" -f per_page=100)"

          dispatched=0
          present=0
          while read -r mode scenario seed rate lanes; do
            title="strict-${mode}-${scenario}-seed${seed}-rate${rate}-lanes${lanes}"
            existing="$(jq -r --arg sha "$EXPECTED_SHA" --arg title "$title" \
              '.workflow_runs[] | select(.head_sha == $sha and .display_title == $title) | .id' \
              <<<"$runs" | head -n1)"
            if [ -n "$existing" ]; then
              echo "PRESENT title=$title run=$existing"
              present=$((present+1))
              continue
            fi
            gh workflow run "$PERF_WORKFLOW" --ref "$DISPATCH_REF" \
              -f mode="$mode" -f scenario="$scenario" -f seed="$seed" \
              -f rate_mbps="$rate" -f lanes="$lanes"
            echo "DISPATCHED title=$title expected_sha=$EXPECTED_SHA dispatch_ref=$DISPATCH_REF"
            dispatched=$((dispatched+1))
          done < "$RUNNER_TEMP/final18.txt"
          echo "WBD_FINAL18_COORDINATOR_DONE present=$present dispatched=$dispatched expected_sha=$EXPECTED_SHA dispatch_ref=$DISPATCH_REF"
