name: next-adaptive-n4-userspace-no-powershell-feasibility
on:
  push:
    branches: ["next/adaptive-fec-aes-tun-20261010"]
    paths:
      - ".github/workflows/next-adaptive-n4-userspace-no-powershell-feasibility.yml"
      - "internal/windowsclient/n4_native_api_gate_windows_test.go"
      - "internal/windowsclient/userspace_tcp_direct_windows.go"
      - "internal/windowsclient/userspace_tcp_direct_windows_test.go"
      - "internal/windowsclient/compact_plan.go"
      - "internal/windowsclient/native_route_windows.go"
      - "internal/windowsclient/native_route_windows_test.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  userspace-direct-and-native-api-gate:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - name: Check SOURCE and Windows API exports without PowerShell
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -mod=readonly ./internal/windowsclient -run '^TestN4NativeNetworkDLLExportsAvailable$' -count=1 -v
      - name: Compile and test active userspace TCP Direct scope and bounded queues
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly ./internal/windowsclient \
            -run 'TestN4TCP' -count=1 -v
      - name: Verify Win32 native route ABI and read-only API path
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly ./internal/windowsclient -run 'TestN4NativeRoute' -count=1 -v
      - name: Record limited feasibility scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '{"schema":"wbd-n4-userspace-nops-feasibility/v1","source_sha":"%s","outcome":"SCOPED_NATIVE_EXPORTS_AND_TCP_QUEUE_BUILD_PASS","driver_loaded":false,"admin_network_mutation":false,"real_wintun":false,"physical_tcp":false,"no_powershell_used_in_test":true,"native_dns_firewall_lifecycle":"NOT_IMPLEMENTED","native_route_lifecycle":"NOT_IMPLEMENTED"}\n' "$GITHUB_SHA" > artifacts/n4-userspace-nops-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n4-userspace-nops-gate-${{ github.sha }}
          path: artifacts/n4-userspace-nops-gate.json
          if-no-files-found: warn
          retention-days: 30
