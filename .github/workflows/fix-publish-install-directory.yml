name: fix-publish-install-directory

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/fix-publish-install-directory.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-per-association-mtu-20260914
          fetch-depth: 1
      - name: Patch test release to preserve the complete Windows install directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/publish-test-release.yml')
          s = p.read_text()
          start_marker = "          mapfile -t win_files < <(find stage/windows -type f -name wbd.exe -print)\n"
          end_marker = "          cp \"${arm_files[0]}\" \"release/wbd-linux-server-arm64-$SOURCE_SHA.tar.gz\"\n"
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('Windows release packaging markers changed unexpectedly')
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          replacement = r'''          mapfile -t win_manifests < <(find stage/windows -type f -name manifest.json -print)
          mapfile -t amd_files < <(find stage/linux-amd64 -type f -name 'wbd-linux-server-amd64.tar.gz' -print)
          mapfile -t arm_files < <(find stage/linux-arm64 -type f -name 'wbd-linux-server-arm64.tar.gz' -print)
          [[ ${#win_manifests[@]} -eq 1 ]] || { echo "expected exactly one Windows install-directory manifest" >&2; exit 1; }
          [[ ${#amd_files[@]} -eq 1 ]] || { echo "expected exactly one amd64 server tarball" >&2; exit 1; }
          [[ ${#arm_files[@]} -eq 1 ]] || { echo "expected exactly one arm64 server tarball" >&2; exit 1; }

          win_root="$(dirname "${win_manifests[0]}")"
          required=(
            wbd.exe
            wbd-reality-front.exe
            wbd-faketcp.exe
            wbd_dtls_shim.exe
            wbd-link-proxy.exe
            wbd-game-lane-client.exe
            wbd-tun.exe
            wbd-windows-gui.exe
            wintun.dll
            WINTUN-LICENSE.txt
            SOURCE_SHA.txt
            windows_tun_route.ps1
            windows_tun_rebind.ps1
            windows_ipv6_killswitch.ps1
            windows_faketcp_underlay.ps1
            windows_npcap_prepare.ps1
            manifest.json
          )
          for file in "${required[@]}"; do
            [[ -f "$win_root/$file" ]] || { echo "Windows install directory missing $file" >&2; exit 1; }
          done

          [[ "$(jq -r '.schema' "$win_root/manifest.json")" == 'wbd-windows-install-directory/v1' ]] || {
            echo 'Windows manifest schema mismatch' >&2
            exit 1
          }
          [[ "$(jq -r '.launch' "$win_root/manifest.json")" == 'wbd.exe' ]] || {
            echo 'Windows manifest launch entry mismatch' >&2
            exit 1
          }
          [[ "$(jq -r '.extraction' "$win_root/manifest.json")" == 'false' ]] || {
            echo 'Windows manifest unexpectedly enables extraction' >&2
            exit 1
          }
          [[ "$(tr -d '\r\n' < "$win_root/SOURCE_SHA.txt")" == "$SOURCE_SHA" ]] || {
            echo 'Windows artifact SOURCE_SHA mismatch' >&2
            exit 1
          }
          (
            cd "$win_root"
            jq -r '.files | to_entries[] | "\(.value)  \(.key)"' manifest.json | sha256sum -c -
          )

          mkdir -p release/windows release/test-tools
          cp -a "$win_root/." release/windows/
          (cd release/windows && zip -q -r "../wbd-windows-portable-$SOURCE_SHA.zip" .)
          cp "${amd_files[0]}" "release/wbd-linux-server-amd64-$SOURCE_SHA.tar.gz"
          cp "${arm_files[0]}" "release/wbd-linux-server-arm64-$SOURCE_SHA.tar.gz"
'''
          s = s[:start] + replacement + s[end:]

          old_notes = '''          - Functional/lifecycle FEC: **off**
          - Compatibility FEC smoke only: **20:20**
'''
          new_notes = '''          - Windows runtime packaging: **install-directory**, no temp/cache extraction
          - Client FEC profiles included: **off, 20:4, 20:8, 20:10, 20:12, 20:16, 20:20**
          - Hosted mixed-session FEC qualification: tracked by the exact-source full-stack matrix
'''
          if s.count(old_notes) != 1:
              raise SystemExit('release-note FEC markers changed unexpectedly')
          s = s.replace(old_notes, new_notes)
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/publish-test-release.yml').read_text()
          required = [
              "win_root=\"$(dirname \"${win_manifests[0]}\")\"",
              "wbd-windows-install-directory/v1",
              "'.extraction'",
              'cp -a "$win_root/." release/windows/',
              'zip -q -r "../wbd-windows-portable-$SOURCE_SHA.zip" .',
              'windows_npcap_prepare.ps1',
              'wbd-windows-gui.exe',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'missing release packaging contract: {item}')
          if 'zip -q "../wbd-windows-portable-$SOURCE_SHA.zip" wbd.exe' in s:
              raise SystemExit('stale single-file Windows release packaging remains')
          print('WBD_PUBLISH_INSTALL_DIRECTORY_CONTRACT_PASS extraction=0 full_directory=1')
          PY
      - name: Commit product workflow and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-publish-install-directory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/publish-test-release.yml .github/workflows/fix-publish-install-directory.yml
          git diff --cached --check
          git commit -m 'fix: publish full Windows install directory'
          git push origin HEAD:agent/fix-per-association-mtu-20260914
