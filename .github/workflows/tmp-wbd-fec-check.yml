name: tmp-wbd-fec-check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-wbd-fec-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore experimental FEC source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lly8666/wobuzhidao/git/blobs/fc6bf624278766db46f0325822af091a29fb30c3" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/fecstage.b64
          base64 -d /tmp/fecstage.b64 > /tmp/fecstage.tgz
          tar -xzf /tmp/fecstage.tgz
          gofmt -w internal/benchmark/fec.go internal/benchmark/fec_test.go
      - name: Validate FEC math and package
        run: |
          set -euo pipefail
          go test ./internal/benchmark -run 'TestFEC' -count=1 -v
          go test ./internal/benchmark -count=1
          go vet ./internal/benchmark
