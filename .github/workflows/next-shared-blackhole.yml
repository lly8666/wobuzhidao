name: next-shared-blackhole
on:
  workflow_dispatch:
    inputs:
      blackout_ms:
        description: "shared all-lane blackout duration"
        required: true
        default: "100"
        type: choice
        options: ["100", "500"]
      seed:
        description: "single sample seed"
        required: true
        default: "601"
        type: string
permissions:
  contents: read
jobs:
  blackhole-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ART: ${{ github.workspace }}/artifacts/shared-blackhole
      WBD_STRICT_MODE: game
      WBD_STRICT_SCENARIO: blackhole${{ inputs.blackout_ms }}
      WBD_STRICT_SEED: ${{ inputs.seed }}
      WBD_STRICT_RATE_MBPS: "3"
      WBD_STRICT_LANES: "4"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.12", cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Repository and one-sample contract
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          mkdir -p "$ART"
          python3 tools/perf_sample_guard.py claim \
            --identity "blackhole:game:${{ inputs.blackout_ms }}ms:seed$WBD_STRICT_SEED:rate3:lanes4:sha$GITHUB_SHA" \
            --receipt "$ART/sample-claim.json"
      - name: Install network tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
      - name: Build exact source and pinned tc
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"
      - name: Run exactly one shared-blackhole sample
        id: sample
        continue-on-error: true
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC \
            env WBD_STRICT_ARTIFACT_DIR="$ART" bash scripts/strict_weaknet_sample.sh
      - name: Build base lossless accounting
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_weaknet_loss_tolerant_v1.py --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --mode game --scenario lossless --seed "$WBD_STRICT_SEED" --target-mbps 3 --lanes 4 \
            --output "$ART/summary-base-lossless.json"
      - name: Analyze shared-blackhole-v1
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_blackhole.py --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --seed "$WBD_STRICT_SEED" --target-mbps 3 --lanes 4 --blackhole-ms "${{ inputs.blackout_ms }}" \
            --base-summary "$ART/summary-base-lossless.json" --output "$ART/summary-blackhole-v1.json"
      - name: Upload compact analyzer summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-summary-${{ inputs.blackout_ms }}ms-seed${{ inputs.seed }}-${{ github.sha }}
          path: ${{ env.ART }}/summary-blackhole-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-single-${{ inputs.blackout_ms }}ms-seed${{ inputs.seed }}-${{ github.sha }}
          path: ${{ env.ART }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Preserve collection failure
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
        run: |
          echo "sample=$SAMPLE_OUTCOME analyzer=${{ steps.validate.outcome }}"
          test "$SAMPLE_OUTCOME" = success
