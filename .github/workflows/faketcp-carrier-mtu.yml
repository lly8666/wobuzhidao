name: faketcp-carrier-mtu

on:
  push:
    paths:
      - '.github/workflows/faketcp-carrier-mtu.yml'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'
  pull_request:
    paths:
      - '.github/workflows/faketcp-carrier-mtu.yml'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'

permissions:
  contents: read

jobs:
  carrier-mtu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables tcpdump
      - name: Build native FakeTCP
        run: go build -trimpath -o /tmp/wbd-faketcp ./cmd/wbd-faketcp
      - name: Qualify 1478-byte datagram on 1500-byte carrier
        run: |
          set -euo pipefail
          C=wbdmtuc$$
          S=wbdmtus$$
          cleanup() {
            set +e
            [[ -n "${CPID:-}" ]] && sudo kill -TERM "$CPID" 2>/dev/null
            [[ -n "${SPID:-}" ]] && sudo kill -TERM "$SPID" 2>/dev/null
            [[ -n "${EPID:-}" ]] && sudo kill -TERM "$EPID" 2>/dev/null
            [[ -n "${CAPID:-}" ]] && sudo kill -TERM "$CAPID" 2>/dev/null
            sleep .2
            sudo ip netns del "$C" 2>/dev/null
            sudo ip netns del "$S" 2>/dev/null
          }
          trap cleanup EXIT

          sudo ip netns add "$C"
          sudo ip netns add "$S"
          sudo ip link add vc type veth peer name vs
          sudo ip link set vc netns "$C"
          sudo ip link set vs netns "$S"
          sudo ip -n "$C" addr add 10.83.0.1/24 dev vc
          sudo ip -n "$S" addr add 10.83.0.2/24 dev vs
          sudo ip -n "$C" link set lo up
          sudo ip -n "$S" link set lo up
          sudo ip -n "$C" link set vc mtu 1500 up
          sudo ip -n "$S" link set vs mtu 1500 up
          sudo ip netns exec "$C" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          sudo ip netns exec "$S" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP

          cat >/tmp/wbd_mtu_echo.py <<'PY'
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',53000))
          while True:
              b,a=s.recvfrom(65535)
              s.sendto(b,a)
          PY
          sudo ip netns exec "$S" python3 /tmp/wbd_mtu_echo.py >/tmp/mtu-echo.log 2>&1 & EPID=$!

          sudo ip netns exec "$S" tcpdump --immediate-mode -U -i vs -s 0 -w /tmp/carrier-mtu.pcap \
            'tcp and host 10.83.0.1 and host 10.83.0.2' >/tmp/carrier-tcpdump.log 2>&1 & CAPID=$!
          for i in $(seq 1 100); do
            grep -q 'listening on vs' /tmp/carrier-tcpdump.log && break
            sleep .05
          done
          cat /tmp/carrier-tcpdump.log
          grep -q 'listening on vs' /tmp/carrier-tcpdump.log

          sudo ip netns exec "$S" /tmp/wbd-faketcp server \
            --listen 10.83.0.2:53003 --target-udp 127.0.0.1:53000 >/tmp/mtu-server.log 2>&1 & SPID=$!
          sleep .15
          sudo ip netns exec "$C" /tmp/wbd-faketcp client \
            --local-udp 127.0.0.1:53004 --source 10.83.0.1:53010 --remote 10.83.0.2:53003 >/tmp/mtu-client.log 2>&1 & CPID=$!
          for i in $(seq 1 200); do
            grep -q 'READY role=client.*carrier_mtu=1500.*recovery=legacy' /tmp/mtu-client.log && \
            grep -q 'READY role=server.*carrier_mtu=1500.*recovery=legacy' /tmp/mtu-server.log && break
            sleep .05
          done
          cat /tmp/mtu-client.log
          cat /tmp/mtu-server.log
          grep -q 'READY role=client.*carrier_mtu=1500.*recovery=legacy' /tmp/mtu-client.log
          grep -q 'READY role=server.*carrier_mtu=1500.*recovery=legacy' /tmp/mtu-server.log

          cat >/tmp/wbd_mtu_probe.py <<'PY'
          import socket,struct
          SIZE=1478
          ROUNDS=4
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',0))
          s.settimeout(5)
          for i in range(ROUNDS):
              payload=struct.pack('!I',i)+bytes(((j+i*17)%251 for j in range(SIZE-4)))
              assert len(payload)==SIZE
              s.sendto(payload,('127.0.0.1',53004))
              echoed,_=s.recvfrom(65535)
              assert echoed==payload,(i,len(echoed),len(payload))
          print(f'WBD_CARRIER_APPLICATION_ROUNDTRIP_PASS datagram_bytes={SIZE} rounds={ROUNDS}')
          PY
          sudo ip netns exec "$C" python3 /tmp/wbd_mtu_probe.py

          sudo kill -TERM "$CPID" "$SPID"
          wait "$CPID" || true
          wait "$SPID" || true
          CPID= SPID=
          sudo kill -TERM "$CAPID" || true
          wait "$CAPID" || true
          CAPID=
          sudo chmod 0644 /tmp/carrier-mtu.pcap

          python3 - <<'PY'
          import struct
          path='/tmp/carrier-mtu.pcap'
          raw=open(path,'rb').read()
          assert len(raw)>=24, len(raw)
          magic=raw[:4]
          if magic in (b'\xd4\xc3\xb2\xa1', b'M<\xb2\xa1'):
              endian='<'
          elif magic in (b'\xa1\xb2\xc3\xd4', b'\xa1\xb2<M'):
              endian='>'
          else:
              raise AssertionError(f'unsupported pcap magic {magic.hex()}')
          off=24
          ip_lengths=[]
          marker_frames=0
          full_budget_frames=0
          fragmented_ipv4=0
          while off+16<=len(raw):
              _,_,incl,_=struct.unpack_from(endian+'IIII',raw,off)
              off+=16
              pkt=raw[off:off+incl]
              off+=incl
              if len(pkt)<14 or pkt[12:14]!=b'\x08\x00':
                  continue
              ipoff=14
              if len(pkt)<ipoff+20 or (pkt[ipoff]>>4)!=4 or pkt[ipoff+9]!=6:
                  continue
              ihl=(pkt[ipoff]&0x0f)*4
              total=struct.unpack_from('!H',pkt,ipoff+2)[0]
              frag=struct.unpack_from('!H',pkt,ipoff+6)[0]
              if frag & 0x3fff:
                  fragmented_ipv4+=1
              tcpoff=ipoff+ihl
              if len(pkt)<tcpoff+20:
                  continue
              thl=(pkt[tcpoff+12]>>4)*4
              payload=pkt[tcpoff+thl:ipoff+total]
              ip_lengths.append(total)
              if payload.startswith(b'WBDFRAG1'):
                  marker_frames+=1
                  if len(payload)==1460 and total==1500:
                      full_budget_frames+=1
          assert ip_lengths, 'no IPv4/TCP packets captured'
          assert max(ip_lengths)<=1500, max(ip_lengths)
          assert fragmented_ipv4==0, fragmented_ipv4
          # Four 1478-byte request datagrams and four echoed response datagrams
          # each require exactly two carrier frames on a 1500-byte IPv4 path.
          assert marker_frames>=16, marker_frames
          assert full_budget_frames>=8, full_budget_frames
          print('WBD_FAKETCP_CARRIER_MTU_PASS',
                'path_mtu=1500', 'datagram_bytes=1478',
                f'max_ipv4_total={max(ip_lengths)}',
                f'marker_frames={marker_frames}',
                f'full_budget_frames={full_budget_frames}')
          PY
