name: apply-carrier-connection-mtu-fix

on:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - .github/workflows/apply-carrier-connection-mtu-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply carrier connection MTU fix
        run: python3 .github/scripts/apply_carrier_connection_mtu_fix.py
      - name: Format Go changes
        run: gofmt -w internal/faketcp/carrier_path.go internal/faketcp/carrier_path_ceiling_test.go cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/main_linux.go internal/windowsruntime/plan.go internal/windowsruntime/faketcp_connection_mtu_test.go
      - name: Focused regression tests
        run: go test ./internal/faketcp ./internal/windowsruntime ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/faketcp/carrier_path.go internal/faketcp/carrier_path_ceiling_test.go cmd/wbd-faketcp/main.go cmd/wbd-faketcp-mux/main_linux.go internal/windowsruntime/plan.go internal/windowsruntime/faketcp_connection_mtu_test.go scripts/linux_server_manager.sh
          git diff --cached --check
          git commit -m 'fix: honor configured FakeTCP connection MTU'
          git push origin HEAD:agent/fix-per-association-mtu-20260914
