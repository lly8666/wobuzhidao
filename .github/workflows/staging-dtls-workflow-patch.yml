name: staging-dtls-workflow-patch

on:
  push:
    branches:
      - agent/fec-zombie-fix-7d859
    paths:
      - '.github/workflows/staging-dtls-workflow-patch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate asserted workflow patch
        run: |
          set -euo pipefail
          python3 scripts/staging_patch_dtls_workflows.py
          git diff --check
          for f in $(grep -rl -E 'native[/\\]dtls[/\\]wbd_dtls_shim\.c' .github/workflows --include='*.yml'); do
            echo "DTLS_BUILD_ENTRY $f"
            grep -q 'WOLFSSL_DTLS_WINDOW_WORDS=128' "$f"
          done
          grep -q 'agent/fec-zombie-fix-7d859' .github/workflows/windows-portable-bundle.yml
          grep -q 'agent/fec-zombie-fix-7d859' .github/workflows/reconnect-netem.yml
          grep -q 'agent/fec-zombie-fix-7d859' .github/workflows/linux-server-release.yml
      - name: Export patched workflow tree
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- .github/workflows | sort)
          if (( ${#files[@]} == 0 )); then
            echo 'no patched workflows' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee /tmp/dtls-workflows-changed.txt
          git diff -- .github/workflows > /tmp/dtls-workflows.patch
          tar -czf /tmp/dtls-workflows-tree.tar.gz "${files[@]}"
          sha256sum /tmp/dtls-workflows-tree.tar.gz /tmp/dtls-workflows.patch /tmp/dtls-workflows-changed.txt | tee /tmp/SHA256SUMS.txt
          echo "WBD_STAGING_DTLS_WORKFLOW_EXPORT_PASS count=${#files[@]}"
      - name: Upload patched workflow tree
        uses: actions/upload-artifact@v4
        with:
          name: staging-dtls-workflow-tree
          path: |
            /tmp/dtls-workflows-tree.tar.gz
            /tmp/dtls-workflows.patch
            /tmp/dtls-workflows-changed.txt
            /tmp/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
