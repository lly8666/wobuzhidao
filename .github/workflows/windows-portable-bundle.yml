name: windows-portable-bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-portable-bundle.yml'
      - 'cmd/wbd-windows-portable/**'
      - 'cmd/wbd-windows-gui/**'
      - 'cmd/wbd-reality-front/**'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'
      - 'cmd/wbd-link-proxy/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-tun/**'
      - 'internal/windowsbundle/**'
      - 'internal/windowsdiag/**'
      - 'internal/windowsruntime/**'
      - 'internal/windowsgui/**'
      - 'internal/ipset/**'
      - 'internal/releasecontract/**'
      - 'native/dtls/**'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/windows_tun_rebind.ps1'
      - 'scripts/windows_ipv6_killswitch.ps1'
      - 'scripts/windows_faketcp_underlay.ps1'
      - 'scripts/windows_npcap_prepare.ps1'
      - 'deps/platform-lock.json'
      - 'deps/upstream-lock.json'
  push:
    branches:
      - dev/wbd-raw-fec-v2
      - feat/single-flow-reality-faketcp
      - agent/fec-zombie-fix-7d859
      - agent/integrate-pressure-mtu-dtls-20b7
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/windows-portable-bundle.yml'
      - 'cmd/wbd-windows-portable/**'
      - 'cmd/wbd-windows-gui/**'
      - 'cmd/wbd-reality-front/**'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'
      - 'cmd/wbd-link-proxy/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-tun/**'
      - 'internal/windowsbundle/**'
      - 'internal/windowsdiag/**'
      - 'internal/windowsruntime/**'
      - 'internal/windowsgui/**'
      - 'internal/ipset/**'
      - 'internal/releasecontract/**'
      - 'native/dtls/**'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/windows_tun_rebind.ps1'
      - 'scripts/windows_ipv6_killswitch.ps1'
      - 'scripts/windows_faketcp_underlay.ps1'
      - 'scripts/windows_npcap_prepare.ps1'
      - 'deps/platform-lock.json'
      - 'deps/upstream-lock.json'

permissions:
  contents: read

env:
  WBD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WBD_SOURCE_SHA }}
      - name: Verify exact package source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $got = (git rev-parse HEAD).Trim()
          if ($got -ne $env:WBD_SOURCE_SHA) { throw "source mismatch: got=$got want=$env:WBD_SOURCE_SHA" }
          Write-Output "WBD_WINDOWS_RELEASE_SOURCE source_sha=$env:WBD_SOURCE_SHA run_sha=$env:GITHUB_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build WBD Windows child runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\windows-runtime | Out-Null
          go build -trimpath -ldflags "-s -w" -o build\windows-runtime\wbd-reality-front.exe .\cmd\wbd-reality-front
          if ($LASTEXITCODE -ne 0) { throw "wbd-reality-front build failed: $LASTEXITCODE" }
          go build -trimpath -ldflags "-s -w" -o build\windows-runtime\wbd-faketcp.exe .\cmd\wbd-faketcp
          if ($LASTEXITCODE -ne 0) { throw "wbd-faketcp build failed: $LASTEXITCODE" }
          go build -trimpath -ldflags "-s -w" -o build\windows-runtime\wbd-link-proxy.exe .\cmd\wbd-link-proxy
          if ($LASTEXITCODE -ne 0) { throw "wbd-link-proxy build failed: $LASTEXITCODE" }
          go build -trimpath -ldflags "-s -w" -o build\windows-runtime\wbd-game-lane-client.exe .\cmd\wbd-game-lane-client
          if ($LASTEXITCODE -ne 0) { throw "wbd-game-lane-client build failed: $LASTEXITCODE" }
          go build -trimpath -ldflags "-s -w" -o build\windows-runtime\wbd-tun.exe .\cmd\wbd-tun
          if ($LASTEXITCODE -ne 0) { throw "wbd-tun build failed: $LASTEXITCODE" }
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o build\windows-runtime\wbd-windows-gui.exe .\cmd\wbd-windows-gui
          if ($LASTEXITCODE -ne 0) { throw "wbd-windows-gui build failed: $LASTEXITCODE" }
      - name: Build pinned wolfSSL DTLS shim with static CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v5.9.2-stable'
          $commit = 'ac01707f552c611fbd135cc723b2682b3e7f80f2'
          git clone --depth 1 --branch $tag https://github.com/wolfSSL/wolfssl.git upstream-wolfssl
          Push-Location upstream-wolfssl
          $got = (git rev-parse HEAD).Trim()
          if ($got -ne $commit) { throw "wolfSSL commit mismatch: got=$got want=$commit" }
          cmake -S . -B build -DWOLFSSL_DTLS13=yes -DWOLFSSL_DTLS=yes -DWOLFSSL_EXAMPLES=no -DWOLFSSL_CRYPT_TESTS=no -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded '-DCMAKE_C_FLAGS=/DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384'
          if ($LASTEXITCODE -ne 0) { throw "wolfSSL CMake configure failed: $LASTEXITCODE" }
          cmake --build build --config Release --target wolfssl
          if ($LASTEXITCODE -ne 0) { throw "wolfSSL build failed: $LASTEXITCODE" }
          Pop-Location
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw 'Visual Studio C++ toolchain not found' }
          $vcvars = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $shimBuild = Join-Path $env:RUNNER_TEMP 'build-wbd-dtls-shim.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /O2 /MT /DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384 /Iupstream-wolfssl /Iupstream-wolfssl\build /Iupstream-wolfssl\wolfssl native\dtls\wbd_dtls_shim.c /Fe:build\windows-runtime\wbd_dtls_shim.exe /link upstream-wolfssl\build\Release\wolfssl.lib ws2_32.lib crypt32.lib advapi32.lib
          "@ | Set-Content -LiteralPath $shimBuild -Encoding ascii
          & $shimBuild
          if ($LASTEXITCODE -ne 0) { throw "DTLS shim build failed: $LASTEXITCODE" }
          Write-Output 'WBD_DTLS_REPLAY_WINDOW_BUILD_PASS words=128 records=4096'
          Write-Output 'WBD_DTLS_LOGICAL_MTU_BUILD logical_mtu=16384 source=wolfssl-max-record'
      - name: Fetch locked Wintun compatibility DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\wintun-0.14.1.zip"
          Invoke-WebRequest -UseBasicParsing 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $want = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($got -ne $want) { throw "Wintun ZIP SHA256 mismatch: got=$got want=$want" }
          $dir = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match '[\\/]amd64[\\/]' } | Select-Object -First 1
          if (-not $dll) { throw 'amd64 wintun.dll not found in locked archive' }
          $license = Get-ChildItem -Path $dir -Recurse -File | Where-Object { $_.Name -match '^LICENSE(\.txt)?$' } | Select-Object -First 1
          if (-not $license) { throw 'Wintun license file not found in locked archive' }
          Copy-Item -LiteralPath $dll.FullName -Destination build\windows-runtime\wintun.dll
          Copy-Item -LiteralPath $license.FullName -Destination build\windows-runtime\WINTUN-LICENSE.txt
      - name: Verify Windows child runtime PE dependency allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($dumpbin) -or -not (Test-Path $dumpbin)) { throw 'dumpbin.exe not found in Visual Studio C++ toolchain' }
          $allowed = @('KERNEL32.dll','USER32.dll','ADVAPI32.dll','WS2_32.dll','IPHLPAPI.DLL','SHELL32.dll','CRYPT32.dll','DNSAPI.dll','OLE32.dll','OLEAUT32.dll','SETUPAPI.dll','WINHTTP.dll')
          Get-ChildItem build\windows-runtime\*.exe | ForEach-Object {
            $deps = & $dumpbin /dependents $_.FullName | Select-String -Pattern '^\s+([A-Za-z0-9_.-]+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToUpperInvariant() }
            $bad = @($deps | Where-Object { $allowed -notcontains $_ })
            if ($bad.Count -gt 0) { throw "$($_.Name) unexpected runtime dependencies: $($bad -join ', ')" }
          }
      - name: Seed verified portable CN routing bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $input = Join-Path $env:RUNNER_TEMP 'delegated-apnic-latest'
          Invoke-WebRequest -UseBasicParsing 'https://ftp.apnic.net/stats/apnic/delegated-apnic-latest' -OutFile $input
          $sourceSha = (Get-FileHash -Algorithm SHA256 $input).Hash.ToLowerInvariant()
          go run .\cmd\wbd-ipset -action install -input $input -dir build\windows-runtime -source "apnic-release:$sourceSha"
          if ($LASTEXITCODE -ne 0) { throw "portable CN ipset install failed: $LASTEXITCODE" }
          go run .\cmd\wbd-ipset -action verify -dir build\windows-runtime
          if ($LASTEXITCODE -ne 0) { throw "portable CN ipset verify failed: $LASTEXITCODE" }
          foreach ($name in @('cn4.txt','cn6.txt','cn-manifest.json')) {
            if (-not (Test-Path (Join-Path 'build\windows-runtime' $name))) { throw "portable CN ipset missing $name" }
          }
          Write-Output "WBD_WINDOWS_CN_BUNDLE_PASS source_sha256=$sourceSha dir=build\windows-runtime"

      - name: Assemble install-directory client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'build\windows-runtime'
          Copy-Item scripts\windows_tun_route.ps1 "$payload\windows_tun_route.ps1"
          Copy-Item scripts\windows_tun_rebind.ps1 "$payload\windows_tun_rebind.ps1"
          Copy-Item scripts\windows_ipv6_killswitch.ps1 "$payload\windows_ipv6_killswitch.ps1"
          Copy-Item scripts\windows_faketcp_underlay.ps1 "$payload\windows_faketcp_underlay.ps1"
          Copy-Item scripts\windows_npcap_prepare.ps1 "$payload\windows_npcap_prepare.ps1"
          Copy-Item docs\testing\wbd.example.json "$payload\wbd.example.json"
          Set-Content -LiteralPath "$payload\SOURCE_SHA.txt" -Encoding ascii -Value $env:WBD_SOURCE_SHA
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "$payload\wbd.exe" .\cmd\wbd-windows-portable
          if ($LASTEXITCODE -ne 0) { throw "installed launcher build failed: $LASTEXITCODE" }
          $required = @(
            'wbd.exe','wbd-reality-front.exe','wbd-faketcp.exe','wbd_dtls_shim.exe','wbd-link-proxy.exe','wbd-game-lane-client.exe','wbd-tun.exe','wbd-windows-gui.exe',
            'wintun.dll','WINTUN-LICENSE.txt','SOURCE_SHA.txt','wbd.example.json','cn4.txt','cn6.txt','cn-manifest.json','windows_tun_route.ps1','windows_tun_rebind.ps1','windows_ipv6_killswitch.ps1','windows_faketcp_underlay.ps1','windows_npcap_prepare.ps1'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $payload $name))) { throw "install directory missing $name" }
          }
          if (Test-Path 'internal\windowsbundle\payload.zip') {
            $length = (Get-Item 'internal\windowsbundle\payload.zip').Length
            if ($length -gt 0) { throw 'release packaging must not consume an embedded payload.zip' }
          }
          $files = [ordered]@{}
          Get-ChildItem $payload -File | Sort-Object Name | ForEach-Object {
            if ($_.Name -ne 'manifest.json') {
              $files[$_.Name] = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{
            schema = 'wbd-windows-install-directory/v1'
            launch = 'wbd.exe'
            extraction = $false
            files = $files
            wintun_version = '0.14.1'
            wintun_zip_sha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$payload\manifest.json" -Encoding utf8
          Write-Output "WBD_WINDOWS_INSTALL_DIR_PASS source_sha=$env:WBD_SOURCE_SHA files=$($files.Count) extraction=0"
      - name: Qualify installed runtime directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/windowsgui ./internal/windowsruntime ./cmd/wbd-windows-gui ./cmd/wbd-windows-portable -count=1
          if ($LASTEXITCODE -ne 0) { throw "installed runtime tests failed: $LASTEXITCODE" }
          $manifest = Get-Content build\windows-runtime\manifest.json -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'wbd-windows-install-directory/v1') { throw 'wrong install-directory manifest schema' }
          if ($manifest.extraction -ne $false) { throw 'install-directory manifest unexpectedly enables extraction' }
          if ($manifest.launch -ne 'wbd.exe') { throw 'install-directory launch entry is not wbd.exe' }
          go run .\cmd\wbd-ipset -action verify -dir build\windows-runtime
          if ($LASTEXITCODE -ne 0) { throw "installed portable CN ipset verification failed: $LASTEXITCODE" }
          Write-Output 'WBD_WINDOWS_NO_EXTRACTION_PASS temp_payload=0 installed_runtime=1'
      - name: Verify portable EXE PE dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($dumpbin) -or -not (Test-Path $dumpbin)) { throw 'dumpbin.exe not found in Visual Studio C++ toolchain' }
          $deps = & $dumpbin /dependents build\windows-runtime\wbd.exe | Out-String
          if ($deps -match '(?im)^\s*(VCRUNTIME|MSVCP|ucrtbase)[^\s]*\.dll\s*$') { throw "portable outer EXE imports dynamic CRT:`n$deps" }
          Write-Output 'WBD_WINDOWS_INSTALL_ENTRY_DEPS_PASS dynamic_crt=0'
      - name: Upload install-directory bundle
        uses: actions/upload-artifact@v4
        with:
          name: wbd-windows-portable-${{ env.WBD_SOURCE_SHA }}
          path: build/windows-runtime/**
          if-no-files-found: error
