name: next-performance-artifact-reader

on:
  push:
    branches:
      - next/tlslike-dataplane
    paths:
      - .github/perf-artifact-request.json
      - .github/workflows/next-performance-artifact-reader.yml

permissions:
  contents: read
  actions: read

jobs:
  read-existing-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Load and validate request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('.github/perf-artifact-request.json', encoding='utf-8'))
          for k in ('artifact_id','source_run','source_job','source_sha','artifact_name'):
              if k not in d:
                  raise SystemExit(f'missing {k}')
          if not str(d['artifact_id']).isdigit():
              raise SystemExit('artifact_id must be numeric')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"ARTIFACT_ID={d['artifact_id']}\n")
              f.write(f"SOURCE_RUN={d['source_run']}\n")
              f.write(f"SOURCE_JOB={d['source_job']}\n")
              f.write(f"SOURCE_SHA={d['source_sha']}\n")
              f.write(f"EXPECTED_NAME={d['artifact_name']}\n")
          PY

      - name: Verify immutable artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          echo "$meta" | jq '{id,name,size_in_bytes,digest,expired,workflow_run}'
          test "$(echo "$meta" | jq -r .name)" = "$EXPECTED_NAME"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "$SOURCE_RUN"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$SOURCE_SHA"
          test "$(echo "$meta" | jq -r .expired)" = false

      - name: Download existing artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/evidence.zip"
          ls -lh "$RUNNER_TEMP/evidence.zip"

      - name: Extract summary and selected dataplane counters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-reader
          python3 - <<'PY'
          import json, os, zipfile
          zpath=os.path.join(os.environ['RUNNER_TEMP'],'evidence.zip')
          wanted_suffixes=('summary-loss-tolerant-v1.json','client-diag.jsonl','server-diag.jsonl','resources.jsonl','stage-events.jsonl')
          keys=[
              'Outstanding','PeakOutstanding','Pending','Abandoned','ForgivenGaps',
              'RepairEvictionCalls','RepairEvictionScanSteps','RepairEvictionMaxScan',
              'FreshBlocked','FreshWindowBypass','FreshEmitFailures','RepairExpiredSkipped',
              'RecoveryTicks','GapForgiveChecks','GapIndexSteps','GapMetadataDropped',
              'GapExpiredForgiven','RepairEvictionNS','RepairEvictionMaxNS',
              'FreshLockWaitNS','FreshLockWaitMaxNS','FreshCriticalNS','FreshCriticalMaxNS',
              'OldestOutstandingAge','OldestOutOfOrderAge','FreshSent','Retransmitted',
              'FastRepairs','RTORepairs','RepairSelected','RepairAttempts','RepairSucceeded',
              'RepairFailures','RepairDeferred','Received','Duplicates','LateFirstArrival'
          ]
          def read_jsonl_zip(z,name):
              out=[]
              with z.open(name) as fh:
                  for raw in fh:
                      try:
                          out.append(json.loads(raw))
                      except Exception:
                          pass
              return out
          def parse_skmem(text):
              import re
              out={'rmem_alloc':0,'rcv_buf':0,'drops':0}
              for body in re.findall(r"skmem:\(([^\n)]*)\)", text or ''):
                  fields={}
                  for token in body.split(','):
                      token=token.strip()
                      m=re.fullmatch(r"(rb|tb|bl|r|t|f|w|o|d)(-?\\d+)",token)
                      if m:
                          fields[m.group(1)]=int(m.group(2))
                  out['rmem_alloc']=max(out['rmem_alloc'],fields.get('r',0))
                  out['rcv_buf']=max(out['rcv_buf'],fields.get('rb',0))
                  out['drops']=max(out['drops'],fields.get('d',0))
              out['rmem_ratio']=(out['rmem_alloc']/out['rcv_buf']) if out['rcv_buf'] else 0.0
              return out
          def process_ticks(row,label):
              p=((row.get('processes') or {}).get(label) or {})
              st=p.get('stat') or {}
              u=st.get('utime_ticks')
              s=st.get('stime_ticks')
              return (u+s) if isinstance(u,int) and isinstance(s,int) else None
          def stage_bounds(events):
              by={x.get('event'):x for x in events}
              return {
                  'pre':(by['pre_start']['unix_ns'],by['pre_end']['unix_ns']),
                  'stress':(by['stress_start']['unix_ns'],by['stress_end']['unix_ns']),
                  'post':(by['post_start']['unix_ns'],by['post_end']['unix_ns']),
              }
          def stage_for(ts,bounds):
              for name,(a,b) in bounds.items():
                  if a <= ts < b:
                      return name
              return 'outside'
          def nearest_transport(rows,side,ts):
              good=[]
              for row in rows:
                  p=product(row,side)
                  if p:
                      good.append((abs(int(row.get('unix_ns',0))-ts),row,p))
              if not good:
                  return None
              _,row,p=min(good,key=lambda x:x[0])
              lanes={}
              for lane in p.get('lanes') or []:
                  tr=lane.get('transport') or {}
                  lanes[lane_id(lane)]={k:tr[k] for k in keys if k in tr}
              return {'unix_ns':row.get('unix_ns'),'lanes':lanes}
          def resource_drop_timeline(resources,events,client_rows,server_rows):
              bounds=stage_bounds(events)
              origin=bounds['pre'][0]
              hz=os.sysconf('SC_CLK_TCK')
              transitions=[]
              stage_drop_delta={k:0 for k in ('pre','stress','post','outside')}
              prev=None
              prev_drops=0
              for row in resources:
                  ns=row.get('namespaces') or {}
                  server_ss=(((ns.get('server') or {}).get('ss_packet') or {}).get('stdout') or '')
                  client_ss=(((ns.get('client') or {}).get('ss_packet') or {}).get('stdout') or '')
                  server=parse_skmem(server_ss)
                  client=parse_skmem(client_ss)
                  drops=server['drops']
                  delta=drops-prev_drops
                  if delta>0:
                      stage=stage_for(int(row.get('unix_ns',0)),bounds)
                      stage_drop_delta[stage]=stage_drop_delta.get(stage,0)+delta
                      cdelta=sdelta=None
                      if prev is not None:
                          a,b=process_ticks(prev,'client'),process_ticks(row,'client')
                          if a is not None and b is not None:
                              cdelta=(b-a)/hz
                          a,b=process_ticks(prev,'server'),process_ticks(row,'server')
                          if a is not None and b is not None:
                              sdelta=(b-a)/hz
                      transitions.append({
                          'unix_ns':row.get('unix_ns'),
                          'elapsed_s':(int(row.get('unix_ns',0))-origin)/1e9,
                          'stage':stage,
                          'delta_drops':delta,
                          'server_packet':server,
                          'client_packet':client,
                          'client_cpu_delta_s':cdelta,
                          'server_cpu_delta_s':sdelta,
                          'procs_running':(row.get('proc_stat') or {}).get('procs_running'),
                          'procs_blocked':(row.get('proc_stat') or {}).get('procs_blocked'),
                          'loadavg':row.get('loadavg'),
                          'client_transport_nearest':nearest_transport(client_rows,'client',int(row.get('unix_ns',0))),
                          'server_transport_nearest':nearest_transport(server_rows,'server',int(row.get('unix_ns',0))),
                      })
                  prev=row
                  prev_drops=drops
              return {
                  'stage_drop_delta':stage_drop_delta,
                  'transitions':transitions,
                  'final_server_packet_drops':prev_drops,
              }
          def find_name(z,suffix):
              ms=[n for n in z.namelist() if n.endswith(suffix)]
              if len(ms)!=1:
                  raise SystemExit(f'{suffix}: matches={ms}')
              return ms[0]
          def product(row, side):
              p=row.get('product') or {}
              if side=='server':
                  return p.get('tunnel') if p.get('present') else None
              return p
          def lane_id(lane):
              ref=lane.get('ref') or {}
              return f"{ref.get('ID',0)}:{ref.get('Generation',0)}"
          def diag_summary(z,name,side):
              states={}
              line_count=0
              with z.open(name) as fh:
                  for raw in fh:
                      try:
                          row=json.loads(raw)
                      except Exception:
                          continue
                      line_count+=1
                      p=product(row,side)
                      if not p:
                          continue
                      for lane in p.get('lanes') or []:
                          tr=lane.get('transport') or {}
                          lid=lane_id(lane)
                          vals={k:tr[k] for k in keys if k in tr}
                          st=states.setdefault(lid,{'first':vals,'last':vals,'max':dict(vals)})
                          st['last']=vals
                          for k,v in vals.items():
                              if isinstance(v,(int,float)):
                                  old=st['max'].get(k)
                                  st['max'][k]=v if not isinstance(old,(int,float)) else max(old,v)
              for lid,st in states.items():
                  delta={}
                  for k,v in st['last'].items():
                      a=st['first'].get(k)
                      if isinstance(v,(int,float)) and isinstance(a,(int,float)):
                          delta[k]=v-a
                  st['delta']=delta
              return {'lines':line_count,'lanes':states}
          with zipfile.ZipFile(zpath) as z:
              names={s:find_name(z,s) for s in wanted_suffixes}
              summary=json.loads(z.read(names['summary-loss-tolerant-v1.json']))
              client_rows=read_jsonl_zip(z,names['client-diag.jsonl'])
              server_rows=read_jsonl_zip(z,names['server-diag.jsonl'])
              resources=read_jsonl_zip(z,names['resources.jsonl'])
              events=read_jsonl_zip(z,names['stage-events.jsonl'])
              out={
                  'artifact_id':int(os.environ['ARTIFACT_ID']),
                  'source_run':int(os.environ['SOURCE_RUN']),
                  'source_job':int(os.environ['SOURCE_JOB']),
                  'source_sha':os.environ['SOURCE_SHA'],
                  'zip_entries_selected':names,
                  'summary':summary,
                  'diag_selected':{
                      'client':diag_summary(z,names['client-diag.jsonl'],'client'),
                      'server':diag_summary(z,names['server-diag.jsonl'],'server'),
                  },
                  'resource_drop_timeline':resource_drop_timeline(resources,events,client_rows,server_rows),
              }
          path='artifact-reader/artifact-summary.json'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write('\n')
          compact={
              'artifact_id':out['artifact_id'],
              'source_sha':out['source_sha'],
              'classifications':summary.get('classifications'),
              'errors':summary.get('errors'),
              'generator':summary.get('generator'),
              'latency':summary.get('latency'),
              'drain':summary.get('drain'),
              'resource':summary.get('resource'),
              'transport_hygiene':summary.get('transport_hygiene'),
              'cost':summary.get('cost'),
              'diag_selected':out['diag_selected'],
              'resource_drop_timeline':out['resource_drop_timeline'],
          }
          print('WBD_ARTIFACT_READER '+json.dumps(compact,sort_keys=True))
          PY

      - name: Upload compact extracted evidence
        uses: actions/upload-artifact@v4
        with:
          name: strict-summary-reader-${{ env.ARTIFACT_ID }}-${{ env.SOURCE_SHA }}
          path: artifact-reader/artifact-summary.json
          if-no-files-found: error
          retention-days: 30
