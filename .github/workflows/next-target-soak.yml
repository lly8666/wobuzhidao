name: next-target-soak
run-name: soak-${{ inputs.mode }}-${{ inputs.duration }}s-seed${{ inputs.seed }}
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [normal, game], default: normal, required: true}
      duration: {type: choice, options: ['180', '1800'], default: '180', required: true}
      seed: {type: string, default: '404', required: true}
permissions: {contents: read}
jobs:
  single-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ART: ${{ github.workspace }}/artifacts/target-soak
      WBD_STRICT_MODE: ${{ inputs.mode }}
      WBD_STRICT_SCENARIO: '5205'
      WBD_STRICT_SEED: ${{ inputs.seed }}
      WBD_STRICT_RATE_MBPS: ${{ inputs.mode == 'normal' && '10' || '3' }}
      WBD_STRICT_LANES: ${{ inputs.mode == 'normal' && '1' || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.12', cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Claim exactly one long workload
        run: |
          mkdir -p "$ART"
          python3 tools/perf_sample_guard.py claim --identity "soak:$WBD_STRICT_MODE:${{ inputs.duration }}:seed$WBD_STRICT_SEED:sha$GITHUB_SHA" --receipt "$ART/sample-claim.json"
          python3 tools/check_performance_workflow_policy.py
      - name: Prepare native network tools and exact-source binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          python3 tools/prepare_soak_harness.py --artifact-dir "$ART" --duration '${{ inputs.duration }}'
      - name: Run exactly one bounded target soak
        id: sample
        continue-on-error: true
        run: sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC env WBD_STRICT_ARTIFACT_DIR="$ART" bash "$ART/generated-soak.sh"
      - name: Validate full duration, all phases and drain
        id: validate
        if: always()
        continue-on-error: true
        run: python3 tools/check_target_soak.py --artifact-dir "$ART" --source-sha "$GITHUB_SHA" --output "$ART/summary-soak.json"
      - name: Verify native raw paths
        if: steps.sample.outcome == 'success'
        run: python3 tools/collect_raw_io_receipt.py --artifact-dir "$ART"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-summary-${{ inputs.mode }}-${{ inputs.duration }}-${{ inputs.seed }}-${{ github.sha }}
          path: |
            ${{ env.ART }}/summary-soak.json
            ${{ env.ART }}/manifest.json
            ${{ env.ART }}/raw-io-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-diagnostics-${{ inputs.mode }}-${{ inputs.duration }}-${{ inputs.seed }}-${{ github.sha }}
          path: |
            ${{ env.ART }}/*.json
            ${{ env.ART }}/*.jsonl
            ${{ env.ART }}/*.log
            ${{ env.ART }}/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-raw-${{ inputs.mode }}-${{ inputs.duration }}-${{ inputs.seed }}-${{ github.sha }}
          path: ${{ env.ART }}
          compression-level: 0
          if-no-files-found: error
      - name: Preserve collection and analyzer failures
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          ANALYZER_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          test "$SAMPLE_OUTCOME" = success
          test "$ANALYZER_OUTCOME" = success
