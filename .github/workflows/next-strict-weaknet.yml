name: next-strict-weaknet

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal or game"
        required: true
        default: normal
        type: choice
        options: [normal, game]
      scenario:
        description: "lossless, 5205, or 5305"
        required: true
        default: lossless
        type: choice
        options: [lossless, "5205", "5305"]
      seed:
        description: "single sample seed"
        required: true
        default: "601"
        type: string
      rate_mbps:
        description: "logical application Mbps per direction"
        required: true
        default: "10"
        type: string
      lanes:
        description: "1 for Normal; 2..4 for Game"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  strict-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ART: ${{ github.workspace }}/artifacts/strict-single
      WBD_STRICT_MODE: ${{ inputs.mode }}
      WBD_STRICT_SCENARIO: ${{ inputs.scenario }}
      WBD_STRICT_SEED: ${{ inputs.seed }}
      WBD_STRICT_RATE_MBPS: ${{ inputs.rate_mbps }}
      WBD_STRICT_LANES: ${{ inputs.lanes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository and one-sample contract
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          mkdir -p "$ART"
          python3 tools/perf_sample_guard.py claim \
            --identity "strict:$WBD_STRICT_MODE:$WBD_STRICT_SCENARIO:seed$WBD_STRICT_SEED:rate$WBD_STRICT_RATE_MBPS:lanes$WBD_STRICT_LANES:sha$GITHUB_SHA" \
            --receipt "$ART/sample-claim.json"

      - name: Install network tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl \
            build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true

      - name: Build exact source and pinned tc
        run: |
          set -euo pipefail
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          go build -trimpath -o "$ART/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/wbd-server" ./cmd/wbd-server
          "$ART/wbd-client" --version > "$ART/client-version.txt"
          "$ART/wbd-server" --version > "$ART/server-version.txt"

      - name: Run exactly one strict sample
        id: sample
        continue-on-error: true
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_SHA,WBD_STRICT_MODE,WBD_STRICT_SCENARIO,WBD_STRICT_SEED,WBD_STRICT_RATE_MBPS,WBD_STRICT_LANES,WBD_STRICT_TC \
            env WBD_STRICT_ARTIFACT_DIR="$ART" bash scripts/strict_weaknet_sample.sh

      - name: Analyze loss-tolerant-v1
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_strict_weaknet_loss_tolerant_v1.py \
            --artifact-dir "$ART" --source-sha "$GITHUB_SHA" \
            --mode "$WBD_STRICT_MODE" --scenario "$WBD_STRICT_SCENARIO" \
            --seed "$WBD_STRICT_SEED" --target-mbps "$WBD_STRICT_RATE_MBPS" \
            --lanes "$WBD_STRICT_LANES" \
            --output "$ART/summary-loss-tolerant-v1.json"

      - name: Upload immutable sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-single-${{ inputs.mode }}-${{ inputs.scenario }}-seed${{ inputs.seed }}-${{ github.sha }}
          path: ${{ env.ART }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Preserve collection failure
        if: always()
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
        run: |
          echo "sample=$SAMPLE_OUTCOME analyzer=${{ steps.validate.outcome }}"
          test "$SAMPLE_OUTCOME" = success
