name: diagnostic-fresh-rack-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/recovery-fresh-rack-08b9
    paths:
      - '.github/workflows/diagnostic-fresh-rack-candidate.yml'
      - 'internal/faketcp/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Materialize exact fresh-evidence RACK candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/faketcp/arq.go')
          s = p.read_text()
          old_comment = '''\t\t// RACK is deliberately restricted to one failed-repair inference. The\n\t\t// SACK scoreboard/classic dup-ACK path owns the first fast repair. Once\n\t\t// that repair has itself been inferred lost, a second fast repair is\n\t\t// allowed; further attempts fall back to the existing backed-off RTO.\n\t\t// This bounds duplicate traffic when old SACK ranges fall out of the\n\t\t// receiver's four-block advertisement under a large outstanding window.\n'''
          new_comment = '''\t\t// A retransmission may be repaired again only after the receiver has\n\t\t// delivered a transmission that was sent later than that repair. The\n\t\t// rackLatestTx fence plus the reordering window make the evidence fresh:\n\t\t// replaying the same old SACK blocks cannot repeatedly retransmit a hole.\n'''
          if s.count(old_comment) != 1:
              raise SystemExit('old bounded-RACK comment not found exactly once')
          s = s.replace(old_comment, new_comment, 1)
          old_cond = 'if p == nil || p.SACKed || p.LastSent.IsZero() || !p.WasRetried || p.Retries != 1 {'
          new_cond = 'if p == nil || p.SACKed || p.LastSent.IsZero() || !p.WasRetried {'
          if s.count(old_cond) != 1:
              raise SystemExit('old RACK retry cap not found exactly once')
          p.write_text(s.replace(old_cond, new_cond, 1))

          Path('internal/faketcp/rack_fresh_evidence_test.go').write_text(r'''package faketcp

import (
    "testing"
    "time"
)

func TestRACKFreshEvidenceAllowsRepeatedRepairWithoutStaleStorm(t *testing.T) {
    now := time.Unix(100, 0)
    s := NewSenderWithRecovery(100, time.Second, RecoverySACKRACK)
    p1 := s.Enqueue(make([]byte, 10), now) // 100..110: repeatedly lost hole.
    p2 := s.Enqueue(make([]byte, 10), now) // 110..120: its repair becomes evidence.
    _ = s.Enqueue(make([]byte, 10), now)   // 120..130 delivered.
    _ = s.Enqueue(make([]byte, 10), now)   // 130..140 delivered.
    _ = s.Enqueue(make([]byte, 10), now)   // 140..150 delivered.

    // Three delivered originals prove p1 lost and cause its first repair.
    if got := s.AckSelective(100, []SACKBlock{{Start: 120, End: 150}}, now.Add(10*time.Millisecond)); got != p1 || p1.Retries != 1 {
        t.Fatalf("first repair got=%#v retries=%d", got, p1.Retries)
    }
    // The same scoreboard then repairs p2. That transmission is newer than p1's repair.
    if got := s.AckSelective(100, []SACKBlock{{Start: 120, End: 150}}, now.Add(20*time.Millisecond)); got != p2 || p2.Retries != 1 {
        t.Fatalf("p2 repair got=%#v retries=%d", got, p2.Retries)
    }
    // Delivery of p2's newer repair is fresh evidence that p1's first repair was lost.
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 150}}, now.Add(30*time.Millisecond)); got != p1 || p1.Retries != 2 {
        t.Fatalf("second p1 repair got=%#v retries=%d", got, p1.Retries)
    }
    // Replaying identical old SACK evidence cannot retransmit p1 again: p1's LastSent
    // is now newer than rackLatestTx.
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 150}}, now.Add(45*time.Millisecond)); got != nil {
        t.Fatalf("stale SACK retriggered repair: %#v", got)
    }

    // A newly sent/delivered segment advances rackLatestTx past p1's second repair.
    p6 := s.Enqueue(make([]byte, 10), now.Add(40*time.Millisecond)) // 150..160.
    if p6.Seq != 150 { t.Fatalf("p6 seq=%d", p6.Seq) }
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 160}}, now.Add(55*time.Millisecond)); got != p1 || p1.Retries != 3 {
        t.Fatalf("third p1 repair got=%#v retries=%d", got, p1.Retries)
    }
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 160}}, now.Add(70*time.Millisecond)); got != nil {
        t.Fatalf("same evidence retriggered third repair: %#v", got)
    }

    // And another genuinely newer delivered transmission can prove that third repair lost.
    p7 := s.Enqueue(make([]byte, 10), now.Add(60*time.Millisecond)) // 160..170.
    if p7.Seq != 160 { t.Fatalf("p7 seq=%d", p7.Seq) }
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 170}}, now.Add(75*time.Millisecond)); got != p1 || p1.Retries != 4 {
        t.Fatalf("fourth p1 repair got=%#v retries=%d", got, p1.Retries)
    }

    st := s.Stats()
    if st.RTOTransmits != 0 {
        t.Fatalf("fresh-evidence repairs unexpectedly fell back to RTO: %#v", st)
    }
    // p1 repairs 1..4 plus p2's first scoreboard repair.
    if st.FastRetransmits != 5 {
        t.Fatalf("fast retransmits=%d want 5: %#v", st.FastRetransmits, st)
    }
}

func TestRACKLegacyModeDoesNotUseFreshEvidenceRepair(t *testing.T) {
    now := time.Unix(200, 0)
    s := NewSenderWithRecovery(100, time.Second, RecoveryLegacy)
    p1 := s.Enqueue(make([]byte, 10), now)
    _ = s.Enqueue(make([]byte, 10), now)
    _ = s.Enqueue(make([]byte, 10), now)
    _ = s.Enqueue(make([]byte, 10), now)

    // One selective ACK observation alone must not opt legacy into RACK behavior.
    if got := s.AckSelective(100, []SACKBlock{{Start: 110, End: 140}}, now.Add(20*time.Millisecond)); got != nil {
        t.Fatalf("legacy unexpectedly used SACK/RACK repair: %#v", got)
    }
    if p1.Retries != 0 {
        t.Fatalf("legacy retries=%d want 0", p1.Retries)
    }
}
''')
          PY
          gofmt -w internal/faketcp/arq.go internal/faketcp/rack_fresh_evidence_test.go
      - name: Run focused recovery tests
        run: |
          set -euo pipefail
          go test ./internal/faketcp -count=1
          go test ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux -count=1
          git diff --check
      - name: Show candidate diff
        run: git diff -- internal/faketcp/arq.go internal/faketcp/rack_fresh_evidence_test.go
