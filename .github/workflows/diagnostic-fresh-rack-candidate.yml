name: diagnostic-fresh-rack-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/recovery-fresh-rack-08b9
    paths:
      - '.github/workflows/diagnostic-fresh-rack-candidate.yml'
      - 'scripts/diagnostic_fresh_rack_candidate.py'
      - 'internal/faketcp/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Materialize candidate
        run: python3 scripts/diagnostic_fresh_rack_candidate.py
      - name: Format and test
        run: |
          set -euo pipefail
          gofmt -w internal/faketcp/arq.go internal/faketcp/retransmit_storm_test.go internal/faketcp/rack_fresh_evidence_test.go
          go test ./internal/faketcp -count=1
          go test ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux -count=1
          git diff --check
      - name: Export validated source files
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rack-candidate-files
          path: |
            internal/faketcp/arq.go
            internal/faketcp/retransmit_storm_test.go
            internal/faketcp/rack_fresh_evidence_test.go
          retention-days: 7
      - name: Show candidate diff
        run: git diff -- internal/faketcp/arq.go internal/faketcp/retransmit_storm_test.go internal/faketcp/rack_fresh_evidence_test.go
