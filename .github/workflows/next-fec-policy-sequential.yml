name: next-fec-policy-sequential
run-name: fec-policy-${{ github.sha }}
on:
  push:
    branches: ["experiment/fec-policy-sequential-20261009"]
    paths:
      - ".github/fec-policy-batch.json"
permissions:
  contents: read
concurrency:
  group: fec-policy-sequential-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-serial-fullstack-fec-policy-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ART: "${{ github.workspace }}/artifacts/fec-policy-sequential"
      PRODUCT_SOURCE: a2db258b436a41fdee98c6c53abec9bab6ce600f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Static repository and scoped serial policy gate
        env:
          CHANGE_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 tools/check_performance_workflow_policy.py
          python3 -m py_compile tools/fec_policy_batch.py tools/prepare_large_mtu_harness.py tools/large_mtu_mixed_business.py tools/large_mtu_loss_stage.py tools/efficiency_http_https.py tools/check_large_mtu_mixed.py tools/efficiency_cost_ledger.py tools/large_mtu_resource_report.py
          python3 -m unittest discover -s tools -p 'test_fec_policy_adapter.py' -v
          python3 tools/fec_policy_batch.py --mode verify --root "$ART"
      - name: Exact phase
        id: phase
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open(".github/fec-policy-batch.json"))
          assert d["phase"] in ("preflight","pilot","batch_a")
          print("value="+d["phase"])
          PY
      - name: Actions functional adapter preflight, no traffic
        if: steps.phase.outputs.value == 'preflight'
        run: python3 tools/fec_policy_batch.py --mode preflight --root "$ART"
      - name: Install five netns harness dependencies
        if: steps.phase.outputs.value == 'pilot' || steps.phase.outputs.value == 'batch_a'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables tcpdump openssl build-essential bison flex pkg-config libbpf-dev libelf-dev libmnl-dev libcap-dev xz-utils curl
          sudo modprobe tun || true
          sudo modprobe sch_netem || true
          sudo modprobe nf_tproxy_ipv4 || true
          sudo modprobe nft_tproxy || true
      - name: Build frozen source once and seeded tc
        if: steps.phase.outputs.value == 'pilot' || steps.phase.outputs.value == 'batch_a'
        run: |
          set -euo pipefail
          mkdir -p "$ART/binaries"
          bash scripts/build_seeded_tc.sh "$RUNNER_TEMP/wbd-tc"
          echo "WBD_STRICT_TC=$RUNNER_TEMP/wbd-tc" >> "$GITHUB_ENV"
          test "$(git rev-parse "$PRODUCT_SOURCE^{commit}")" = "$PRODUCT_SOURCE"
          git worktree add --detach "$RUNNER_TEMP/wbd-product" "$PRODUCT_SOURCE"
          cd "$RUNNER_TEMP/wbd-product"
          go build -trimpath -o "$ART/binaries/wbd-client" ./cmd/wbd-client
          go build -trimpath -o "$ART/binaries/wbd-server" ./cmd/wbd-server
          sha256sum "$ART/binaries/wbd-client" "$ART/binaries/wbd-server" > "$ART/product-binaries.sha256"
          "$ART/binaries/wbd-client" --version > "$ART/client-version.txt"
          "$ART/binaries/wbd-server" --version > "$ART/server-version.txt"
      - name: Two 15s real fullstack pilot cases, not a cost measurement
        id: pilot
        if: steps.phase.outputs.value == 'pilot'
        continue-on-error: true
        run: python3 tools/fec_policy_batch.py --mode pilot --root "$ART"
      - name: Run 12 strictly serial fresh fullstack cases
        id: batch
        if: steps.phase.outputs.value == 'batch_a'
        continue-on-error: true
        run: python3 tools/fec_policy_batch.py --mode run --root "$ART"
      - name: Emergency bounded pcap removal
        if: always()
        run: |
          if test -d "$ART"; then
            sudo find "$ART" -type f -name '*.pcap*' -delete
            sudo chmod -R a+rX "$ART"
          fi
      - name: Upload numerical evidence without key, binary, logs or raw capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fec-policy-sequential-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.ART }}/batch-manifest.json
            ${{ env.ART }}/pilot-manifest.json
            ${{ env.ART }}/product-binaries.sha256
            ${{ env.ART }}/s*/preflight.json
            ${{ env.ART }}/s*/case-receipt.json
            ${{ env.ART }}/s*/sanitized-startup-errors.json
            ${{ env.ART }}/pilot-*/case-receipt.json
            ${{ env.ART }}/pilot-*/sanitized-startup-errors.json
            ${{ env.ART }}/s*/summary.json
            ${{ env.ART }}/s*/efficiency-ledger.json
            ${{ env.ART }}/s*/manifest.json
            ${{ env.ART }}/s*/runtime-flags.json
            ${{ env.ART }}/s*/generated.sh.receipt.json
            ${{ env.ART }}/s*/emergency-capture-cleanup.json
      - name: Gate batch outcome after evidence
        if: always()
        env:
          PHASE: ${{ steps.phase.outputs.value }}
          BATCH: ${{ steps.batch.outcome }}
          PILOT: ${{ steps.pilot.outcome }}
        run: |
          if test "$PHASE" = batch_a; then
            test "$BATCH" = success
            test -s "$ART/batch-manifest.json"
          elif test "$PHASE" = pilot; then
            test "$PILOT" = success
            test -s "$ART/pilot-manifest.json"
          else
            test "$PHASE" = preflight
          fi
