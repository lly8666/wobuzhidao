name: windows-fec-physical-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/windows-fec-physical-matrix.yml'
      - 'scripts/windows_linux_wintun_lane_soak.ps1'
      - 'scripts/wsl_wintun_lane_soak_server.sh'
      - 'scripts/windows_npcap_driver_ci.ps1'
      - 'scripts/windows_faketcp_underlay.ps1'
      - 'scripts/windows_npcap_prepare.ps1'
      - 'scripts/windows_tun_route.ps1'
      - 'scripts/windows_ipv6_killswitch.ps1'
      - 'scripts/linux_shared_tun_firewall.sh'
      - 'cmd/wbd-faketcp/**'
      - 'cmd/wbd-faketcp-mux/**'
      - 'cmd/wbd-link-proxy/**'
      - 'cmd/wbd-link-server-mux/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-game-lane-server/**'
      - 'cmd/wbd-tun/**'
      - 'cmd/wbd-ip-gateway-shared/**'
      - 'cmd/wbd-windows-qualify/**'
      - 'internal/fec/**'
      - 'internal/linkdata/**'
      - 'internal/pathmtu/**'
      - 'internal/tunnel/**'
      - 'internal/dataplane/**'
      - 'internal/windowsruntime/**'

permissions:
  contents: read

concurrency:
  group: windows-fec-physical-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build pinned Linux server assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc openssl
          git clone --depth 1 --branch v5.9.2-stable https://github.com/wolfSSL/wolfssl.git "$RUNNER_TEMP/wolfssl"
          test "$(git -C "$RUNNER_TEMP/wolfssl" rev-parse HEAD)" = ac01707f552c611fbd135cc723b2682b3e7f80f2
          (cd "$RUNNER_TEMP/wolfssl" && ./autogen.sh)
          mkdir -p "$RUNNER_TEMP/wolf-build" "$RUNNER_TEMP/linux-assets"
          (cd "$RUNNER_TEMP/wolf-build" && "$RUNNER_TEMP/wolfssl/configure" --enable-dtls13 --disable-shared --enable-static CFLAGS='-O2 -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384')
          make -C "$RUNNER_TEMP/wolf-build" -j2 src/libwolfssl.la
          gcc -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP/wolf-build" -I"$RUNNER_TEMP/wolfssl" native/dtls/wbd_dtls_shim.c "$RUNNER_TEMP/wolf-build/src/.libs/libwolfssl.a" -lm -o "$RUNNER_TEMP/linux-assets/wbd_dtls_shim"
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-faketcp-mux" ./cmd/wbd-faketcp-mux
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-link-server-mux" ./cmd/wbd-link-server-mux
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-game-lane-server" ./cmd/wbd-game-lane-server
          go build -trimpath -o "$RUNNER_TEMP/linux-assets/wbd-ip-gateway-shared" ./cmd/wbd-ip-gateway-shared
          cp scripts/linux_shared_tun_firewall.sh "$RUNNER_TEMP/linux-assets/linux_shared_tun_firewall.sh"
          chmod +x "$RUNNER_TEMP/linux-assets/linux_shared_tun_firewall.sh"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-front.invalid' -keyout "$RUNNER_TEMP/linux-assets/front.key" -out "$RUNNER_TEMP/linux-assets/front.pem" >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -subj '/CN=unrelated-dtls.invalid' -keyout "$RUNNER_TEMP/linux-assets/dtls.key" -out "$RUNNER_TEMP/linux-assets/dtls.pem" >/dev/null 2>&1
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/linux-assets/SOURCE_SHA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fec-physical-linux-assets
          path: ${{ runner.temp }}/linux-assets
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native Windows client assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'windows-assets'; New-Item -ItemType Directory -Force $out | Out-Null
          go build -trimpath -o (Join-Path $out 'wbd-faketcp.exe') .\cmd\wbd-faketcp
          go build -trimpath -o (Join-Path $out 'wbd-link-proxy.exe') .\cmd\wbd-link-proxy
          go build -trimpath -o (Join-Path $out 'wbd-game-lane-client.exe') .\cmd\wbd-game-lane-client
          go build -trimpath -o (Join-Path $out 'wbd-tun.exe') .\cmd\wbd-tun
          go build -trimpath -o (Join-Path $out 'wbd-windows-qualify.exe') .\cmd\wbd-windows-qualify
          if($LASTEXITCODE){throw 'Windows Go client build failed'}
          Copy-Item .\scripts\windows_npcap_prepare.ps1 $out
          Copy-Item .\scripts\windows_faketcp_underlay.ps1 $out
          Copy-Item .\scripts\windows_tun_route.ps1 $out
          Copy-Item .\scripts\windows_ipv6_killswitch.ps1 $out
          $zip=Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -UseBasicParsing 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $got=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant(); $want='07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if($got-ne$want){throw "Wintun hash mismatch: got=$got want=$want"}
          $wd=Join-Path $env:RUNNER_TEMP 'wintun'; Expand-Archive -LiteralPath $zip -DestinationPath $wd
          $dll=Get-ChildItem -Path $wd -Recurse -Filter wintun.dll|Where-Object{$_.FullName-match'[\\/]amd64[\\/]'}|Select-Object -First 1
          if(-not$dll){throw 'amd64 wintun.dll missing'}; Copy-Item $dll.FullName (Join-Path $out 'wintun.dll')
          git clone --depth 1 --branch v5.9.2-stable https://github.com/wolfSSL/wolfssl.git "$env:RUNNER_TEMP\wolfssl"
          Push-Location "$env:RUNNER_TEMP\wolfssl"
          if((git rev-parse HEAD).Trim()-ne'ac01707f552c611fbd135cc723b2682b3e7f80f2'){throw 'wolfSSL pin mismatch'}
          cmake -S . -B build -DWOLFSSL_DTLS13=yes -DWOLFSSL_DTLS=yes -DWOLFSSL_EXAMPLES=no -DWOLFSSL_CRYPT_TESTS=no -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded '-DCMAKE_C_FLAGS=/DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384'
          cmake --build build --config Release --target wolfssl
          Pop-Location
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'; $vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath|Select-Object -First 1); $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'; $cmd=Join-Path $env:RUNNER_TEMP 'build-dtls.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /O2 /MT /DWOLFSSL_DTLS_WINDOW_WORDS=128 /DWOLFSSL_MAX_MTU=16384 /I"$env:RUNNER_TEMP\wolfssl" /I"$env:RUNNER_TEMP\wolfssl\build" /I"$env:RUNNER_TEMP\wolfssl\wolfssl" native\dtls\wbd_dtls_shim.c /Fe:"$out\wbd_dtls_shim.exe" /link "$env:RUNNER_TEMP\wolfssl\build\Release\wolfssl.lib" ws2_32.lib crypt32.lib advapi32.lib
          "@|Set-Content -LiteralPath $cmd -Encoding ascii
          & $cmd; if($LASTEXITCODE){throw 'DTLS shim build failed'}
          Set-Content -LiteralPath (Join-Path $out 'SOURCE_SHA.txt') -Value $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fec-physical-windows-assets
          path: ${{ runner.temp }}\windows-assets
          retention-days: 1

  physical-fec:
    needs: [build-linux, build-windows]
    runs-on: windows-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { lanes: 1, fec: 'off',   loss: 15, duration: 120, rotate: 30, slug: '1lane-off' }
          - { lanes: 1, fec: '20:4',  loss: 15, duration: 120, rotate: 30, slug: '1lane-20x4' }
          - { lanes: 1, fec: '20:8',  loss: 15, duration: 120, rotate: 30, slug: '1lane-20x8' }
          - { lanes: 1, fec: '20:10', loss: 15, duration: 120, rotate: 30, slug: '1lane-20x10' }
          - { lanes: 1, fec: '20:12', loss: 15, duration: 120, rotate: 30, slug: '1lane-20x12' }
          - { lanes: 1, fec: '20:16', loss: 15, duration: 120, rotate: 30, slug: '1lane-20x16' }
          - { lanes: 1, fec: '20:20', loss: 15, duration: 120, rotate: 30, slug: '1lane-20x20' }
          - { lanes: 4, fec: 'off',   loss: 15, duration: 150, rotate: 45, slug: '4lane-off' }
          - { lanes: 4, fec: '20:20', loss: 15, duration: 150, rotate: 45, slug: '4lane-20x20' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fec-physical-linux-assets
          path: ${{ runner.temp }}\linux-assets
      - uses: actions/download-artifact@v4
        with:
          name: fec-physical-windows-assets
          path: ${{ runner.temp }}\windows-assets
      - name: Provision WSL Linux runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; wsl.exe --status; if($LASTEXITCODE){throw 'WSL2 unavailable'}
          $marker=Join-Path $env:RUNNER_TEMP 'wbd-fec-ephemeral-wsl.txt'; $distros=@(& wsl.exe -l -q|ForEach-Object{$_.Trim([char]0).Trim()}|Where-Object{$_})
          if($distros.Count-eq0){$d='Ubuntu-24.04'; & wsl.exe --install -d $d --no-launch --web-download; if($LASTEXITCODE){throw 'WSL distro install failed'}; $deadline=[DateTime]::UtcNow.AddMinutes(3); do{Start-Sleep 2;$distros=@(& wsl.exe -l -q|ForEach-Object{$_.Trim([char]0).Trim()}|Where-Object{$_})}while(($distros-notcontains$d)-and[DateTime]::UtcNow-lt$deadline); if($distros-notcontains$d){throw 'WSL distro did not register'}; Set-Content $marker $d -Encoding ascii; & wsl.exe -d $d -u root -- bash -lc "printf '[user]\ndefault=root\n' > /etc/wsl.conf"; & wsl.exe --terminate $d}else{$d=$distros[0]}
          & wsl.exe -d $d -u root -- bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iptables python3 sudo'; if($LASTEXITCODE){throw 'WSL prerequisites failed'}
          Write-Output "WBD_FEC_WSL_READY distro=$d"
      - name: Install signed ephemeral Npcap 1.88
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $driverUrl='https://github.com/user-attachments/files/32200327/npcap.zip'; $driverZip=Join-Path $env:RUNNER_TEMP 'npcap-test.zip'; $driverDir=Join-Path $env:RUNNER_TEMP 'npcap-test'; Invoke-WebRequest -UseBasicParsing $driverUrl -OutFile $driverZip
          $driverHash=(Get-FileHash -Algorithm SHA256 $driverZip).Hash.ToLowerInvariant(); if($driverHash-ne'6380ebe6d5b06bbb0dc03a43151ee05a4a25be97efebd742c463e0e466621a32'){throw 'approved Npcap driver hash mismatch'}; Expand-Archive $driverZip $driverDir -Force
          $officialUrl='https://npcap.com/dist/npcap-1.88.exe'; $official=Join-Path $env:RUNNER_TEMP 'npcap-1.88.exe'; $extract=Join-Path $env:RUNNER_TEMP 'npcap-1.88-extract'; Invoke-WebRequest -UseBasicParsing $officialUrl -OutFile $official
          $officialHash=(Get-FileHash -Algorithm SHA256 $official).Hash.ToLowerInvariant(); if($officialHash-ne'a2f4ec1e5ea353ff67efd24b2ebf081ba44532410fae8d5e146af0310aa4f56b'){throw 'Npcap official hash mismatch'}; $sig=Get-AuthenticodeSignature $official; if($sig.Status-ne[System.Management.Automation.SignatureStatus]::Valid-or[string]$sig.SignerCertificate.Subject-notmatch'Nmap Software LLC'){throw 'Npcap signature invalid'}
          New-Item -ItemType Directory -Force $extract|Out-Null; & 7z x -y "-o$extract" $official|Out-Null; if($LASTEXITCODE){throw 'Npcap extraction failed'}
          .\scripts\windows_npcap_driver_ci.ps1 -Action Install -DriverPackageDir $driverDir -UserlandExtractDir $extract; .\scripts\windows_npcap_driver_ci.ps1 -Action Status; Add-Content $env:GITHUB_PATH "$env:SystemRoot\System32\Npcap"
          "NPCAP_TEST_SOURCE_URL=$driverUrl"|Out-File $env:GITHUB_ENV -Append -Encoding utf8; "NPCAP_TEST_ZIP_SHA256=$driverHash"|Out-File $env:GITHUB_ENV -Append -Encoding utf8; "NPCAP_OFFICIAL_URL=$officialUrl"|Out-File $env:GITHUB_ENV -Append -Encoding utf8; "NPCAP_OFFICIAL_SHA256=$officialHash"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'WBD_FEC_NPCAP_READY version=1.88'
      - name: Start independent PktMon capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $log=Join-Path $env:RUNNER_TEMP 'wbd-fec-${{ matrix.slug }}'; New-Item -ItemType Directory -Force $log|Out-Null; & pktmon.exe stop *> $null; $global:LASTEXITCODE=0; $etl=Join-Path $log 'physical.etl'; & pktmon.exe start --capture --pkt-size 0 --file-name $etl; if($LASTEXITCODE){throw "pktmon start failed: $LASTEXITCODE"}; Write-Output "WBD_PKTMON_CAPTURE_STARTED etl=$etl"
      - name: Run physical FEC scenario
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $log=Join-Path $env:RUNNER_TEMP 'wbd-fec-${{ matrix.slug }}'
          [ordered]@{version='1.88';driver_source_url=$env:NPCAP_TEST_SOURCE_URL;driver_zip_sha256=$env:NPCAP_TEST_ZIP_SHA256;official_userland_source_url=$env:NPCAP_OFFICIAL_URL;official_userland_container_sha256=$env:NPCAP_OFFICIAL_SHA256} | ConvertTo-Json | Set-Content (Join-Path $log 'npcap-source.json') -Encoding utf8
          .\scripts\windows_linux_wintun_lane_soak.ps1 -BinDir "$env:RUNNER_TEMP\windows-assets" -LinuxAssets "$env:RUNNER_TEMP\linux-assets" -Lanes ${{ matrix.lanes }} -FEC '${{ matrix.fec }}' -ConnectionMTU 1420 -DurationSec ${{ matrix.duration }} -RateBps 2000000 -LossPct ${{ matrix.loss }} -RotateEverySec ${{ matrix.rotate }} -LogDir $log
          if($LASTEXITCODE){throw "physical FEC scenario failed: $LASTEXITCODE"}
          Write-Output "WBD_FEC_PHYSICAL_SCENARIO_PASS fec=${{ matrix.fec }} lanes=${{ matrix.lanes }} loss=${{ matrix.loss }} duration=${{ matrix.duration }}"
      - name: Finalize and qualify pcapng
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'; $log=Join-Path $env:RUNNER_TEMP 'wbd-fec-${{ matrix.slug }}'; $etl=Join-Path $log 'physical.etl'; $pcap=Join-Path $log 'physical.pcapng'; & pktmon.exe stop; if(Test-Path $etl){& pktmon.exe etl2pcap $etl --out $pcap; if((Test-Path $pcap)-and(Get-Item $pcap).Length-gt1024){$sha=(Get-FileHash -Algorithm SHA256 $pcap).Hash.ToLowerInvariant(); [ordered]@{schema='wbd-physical-pcap/v1';fec='${{ matrix.fec }}';lanes=${{ matrix.lanes }};loss_pct=${{ matrix.loss }};bytes=(Get-Item $pcap).Length;sha256=$sha;npcap_raw_synack_required=$true}|ConvertTo-Json|Set-Content (Join-Path $log 'capture-summary.json') -Encoding utf8; Write-Output "WBD_PHYSICAL_PCAPNG_PASS fec=${{ matrix.fec }} lanes=${{ matrix.lanes }} bytes=$((Get-Item $pcap).Length) sha256=$sha"}else{Write-Error 'pcapng missing or too small'; exit 1}}else{Write-Error 'PktMon ETL missing'; exit 1}
      - name: Print physical evidence summary
        if: always()
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'wbd-fec-${{ matrix.slug }}'; foreach($name in @('capture-summary.json','npcap-source.json','mtu-budget.json','summary.json','load-result.json','network-end.log','error-scan.log')){$p=Join-Path $log $name;if(Test-Path $p){Write-Output "=== $name ===";Get-Content $p|Select-Object -First 300}}
      - name: Cleanup Npcap and WSL
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'; .\scripts\windows_npcap_driver_ci.ps1 -Action Cleanup; $marker=Join-Path $env:RUNNER_TEMP 'wbd-fec-ephemeral-wsl.txt'; if(Test-Path $marker){$d=(Get-Content $marker -Raw).Trim(); if($d){& wsl.exe --terminate $d 2>$null; & wsl.exe --unregister $d}; Remove-Item $marker -Force -ErrorAction SilentlyContinue}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fec-physical-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}\wbd-fec-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
