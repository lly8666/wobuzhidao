name: release-qualification-kick

on:
  push:
    branches:
      - feat/single-flow-reality-faketcp
    paths:
      - '.github/workflows/release-qualification-kick.yml'
      - 'docs/development/QUALIFICATION_KICK.md'
      - 'internal/releasecontract/release_qualification_matrix_test.go'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: release-qualification-kick-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: aggregate exact-head product qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: feat/single-flow-reality-faketcp
    steps:
      - name: Require aggregator commit is still branch HEAD
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${REPO}/branches/${BRANCH}" --jq '.commit.sha')"
          printf 'aggregator_sha=%s branch_sha=%s\n' "$GITHUB_SHA" "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Dispatch exact-head product gates
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/wbd-release-dispatch.tsv"
          : >"$manifest"
          workflows=(
            product-lifecycle-e2e.yml
            game-settings-matrix.yml
            windows-manual-reconnect.yml
            windows-route-rebind.yml
            windows-linux-single-flow.yml
            windows-portable-bundle.yml
            windows-tun-build.yml
            windows-tun-admin-smoke.yml
            windows-rawip-gateway.yml
            windows-faketcp-persona.yml
            windows-ipv6-killswitch.yml
            windows-dtls-build.yml
            linux-server-release.yml
            linux-server-firewall.yml
            single-flow-rawip-e2e.yml
            mux-load-100m.yml
            single-flow-startup-stress.yml
            single-flow-link-fullstack.yml
            faketcp-recovery-ab.yml
            openwrt-fullstack-one-shot.yml
            game-lane-fullstack.yml
            shared-tun-two-client.yml
          )
          # FEC research is frozen in this phase. game-lane-fullstack carries the
          # mandatory 20:20 product smoke, while mux-load-100m retains the frozen
          # weak-network/load operating-point evidence. No separate 60/80M FEC
          # research workflow is dispatched by release authority.
          for workflow in "${workflows[@]}"; do
            current="$(gh api "repos/${REPO}/branches/${BRANCH}" --jq '.commit.sha')"
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "branch moved before dispatching ${workflow}: current=${current} expected=${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "dispatch ${workflow} ref=${BRANCH} sha=${GITHUB_SHA}"
            run_url="$(gh workflow run "$workflow" --repo "$REPO" --ref "$BRANCH")"
            run_url="$(printf '%s\n' "$run_url" | tail -n 1 | tr -d '\r')"
            run_id="${run_url##*/}"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "could not parse dispatched run id workflow=${workflow} output=${run_url}" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$workflow" "$run_id" >>"$manifest"
            echo "WBD_RELEASE_CHILD_DISPATCH workflow=${workflow} run_id=${run_id} expected_head=${GITHUB_SHA} url=${run_url}"
          done
          cat "$manifest"

      - name: Wait for exact-head dispatched gates
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/wbd-release-dispatch.tsv"
          while IFS=$'\t' read -r workflow run_id; do
            [[ -n "$workflow" && "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid dispatch manifest row workflow=${workflow} run_id=${run_id}" >&2; exit 1; }
            deadline=$((SECONDS + 12600))
            while true; do
              row="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '[.status, (.conclusion // ""), .head_sha, .event, .html_url] | map(tostring) | join("|")')"
              IFS='|' read -r status conclusion head_sha event url <<<"$row"
              if [[ "$head_sha" != "$GITHUB_SHA" || "$event" != "workflow_dispatch" ]]; then
                echo "child identity mismatch workflow=${workflow} run_id=${run_id} head=${head_sha} event=${event} expected_head=${GITHUB_SHA}" >&2
                exit 1
              fi
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then echo "child failed workflow=${workflow} run_id=${run_id} conclusion=${conclusion} url=${url}" >&2; exit 1; fi
                jobs_json="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
                total_jobs="$(jq -r '.total_count' <<<"$jobs_json")"
                seen_jobs="$(jq -r '.jobs | length' <<<"$jobs_json")"
                if [[ "$total_jobs" -eq 0 || "$total_jobs" -ne "$seen_jobs" ]]; then
                  echo "child job inventory incomplete workflow=${workflow} run_id=${run_id} total=${total_jobs} seen=${seen_jobs}" >&2
                  exit 1
                fi
                bad_jobs="$(jq -r '[.jobs[] | select(.status != "completed" or .conclusion != "success") | "\(.name)=\(.status)/\(.conclusion // "null")"] | join(",")' <<<"$jobs_json")"
                if [[ -n "$bad_jobs" ]]; then
                  echo "child has non-success job workflow=${workflow} run_id=${run_id} jobs=${bad_jobs}" >&2
                  exit 1
                fi
                echo "WBD_RELEASE_CHILD_JOBS_PASS workflow=${workflow} run_id=${run_id} mandatory_jobs=${total_jobs} mandatory_skipped=0"
                echo "WBD_RELEASE_CHILD_PASS workflow=${workflow} event=${event} run_id=${run_id} head_sha=${head_sha} conclusion=${conclusion} url=${url}"
                break
              fi
              if (( SECONDS >= deadline )); then echo "child timeout workflow=${workflow} run_id=${run_id} status=${status} url=${url}" >&2; exit 1; fi
              sleep 20
            done
          done <"$manifest"

      - name: Require exact-source release artifact receipts
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/wbd-release-dispatch.tsv"

          run_id_for() {
            local workflow="$1"
            awk -F '\t' -v workflow="$workflow" '$1 == workflow { print $2 }' "$manifest"
          }

          require_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local role="$3"
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "missing artifact producer run role=${role}" >&2; exit 1; }
            payload="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts?per_page=100")"
            total="$(jq -r '.total_count' <<<"$payload")"
            seen="$(jq -r '.artifacts | length' <<<"$payload")"
            if [[ "$total" -ne "$seen" ]]; then
              echo "artifact inventory incomplete role=${role} run_id=${run_id} total=${total} seen=${seen}" >&2
              exit 1
            fi
            count="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | length' <<<"$payload")"
            if [[ "$count" -ne 1 ]]; then
              echo "artifact receipt mismatch role=${role} run_id=${run_id} name=${artifact_name} count=${count}" >&2
              exit 1
            fi
            receipt="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)][0] | [(.expired|tostring), (.workflow_run.id|tostring), .workflow_run.head_sha, .name] | join("|")' <<<"$payload")"
            IFS='|' read -r expired producer_id source_sha actual_name <<<"$receipt"
            if [[ "$expired" != "false" || "$producer_id" != "$run_id" || "$source_sha" != "$GITHUB_SHA" || "$actual_name" != "$artifact_name" ]]; then
              echo "artifact source fence failed role=${role} run_id=${run_id} expired=${expired} producer=${producer_id} source_sha=${source_sha} expected_sha=${GITHUB_SHA} name=${actual_name}" >&2
              exit 1
            fi
            echo "WBD_RELEASE_ARTIFACT_PASS role=${role} run_id=${run_id} source_sha=${source_sha} name=${actual_name}"
          }

          windows_run_id="$(run_id_for windows-portable-bundle.yml)"
          linux_run_id="$(run_id_for linux-server-release.yml)"
          require_artifact "$windows_run_id" "wbd-windows-portable-${GITHUB_SHA}" windows-portable
          require_artifact "$linux_run_id" "wbd-linux-server-amd64-${GITHUB_SHA}" linux-amd64
          require_artifact "$linux_run_id" "wbd-linux-server-arm64-${GITHUB_SHA}" linux-arm64

      - name: Resolve and wait for exact-candidate push gates
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            ci.yml
            faketcp-native.yml
            faketcp-pcap-20loss.yml
            faketcp-first-arrival.yml
            fullstack-first-arrival.yml
            openwrt-tcp-tproxy.yml
            single-flow-e2e.yml
            single-flow-no-hol.yml
            single-flow-tcp-persona.yml
          )
          for workflow in "${workflows[@]}"; do
            run_id=""
            for attempt in $(seq 1 120); do
              run_id="$(gh api "repos/${REPO}/actions/workflows/${workflow}/runs?branch=${BRANCH}&event=push&per_page=100" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty')"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then echo "could not resolve exact-head push run: ${workflow} sha=${GITHUB_SHA}" >&2; exit 1; fi
            deadline=$((SECONDS + 12600))
            while true; do
              row="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '[.status, (.conclusion // ""), .head_sha, .event, .html_url] | map(tostring) | join("|")')"
              IFS='|' read -r status conclusion head_sha event url <<<"$row"
              if [[ "$head_sha" != "$GITHUB_SHA" || "$event" != "push" ]]; then echo "push-gate identity mismatch workflow=${workflow} run_id=${run_id} head=${head_sha} event=${event} expected_head=${GITHUB_SHA}" >&2; exit 1; fi
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then echo "push gate failed workflow=${workflow} run_id=${run_id} conclusion=${conclusion} url=${url}" >&2; exit 1; fi
                jobs_json="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
                total_jobs="$(jq -r '.total_count' <<<"$jobs_json")"
                seen_jobs="$(jq -r '.jobs | length' <<<"$jobs_json")"
                if [[ "$total_jobs" -eq 0 || "$total_jobs" -ne "$seen_jobs" ]]; then
                  echo "push gate job inventory incomplete workflow=${workflow} run_id=${run_id} total=${total_jobs} seen=${seen_jobs}" >&2
                  exit 1
                fi

                if [[ "$workflow" == "ci.yml" ]]; then
                  expected_jobs='["test","transport_prepare","transport_smoke","transport_bench","transport_aggregate"]'
                  unexpected_jobs="$(jq -r --argjson expected "$expected_jobs" '[.jobs[] | select((.name as $name | $expected | index($name)) == null) | .name] | join(",")' <<<"$jobs_json")"
                  if [[ -n "$unexpected_jobs" ]]; then
                    echo "ci push gate has unclassified jobs run_id=${run_id} jobs=${unexpected_jobs}" >&2
                    exit 1
                  fi
                  test_count="$(jq -r '[.jobs[] | select(.name == "test")] | length' <<<"$jobs_json")"
                  test_bad="$(jq -r '[.jobs[] | select(.name == "test" and (.status != "completed" or .conclusion != "success")) | "\(.name)=\(.status)/\(.conclusion // "null")"] | join(",")' <<<"$jobs_json")"
                  if [[ "$test_count" -ne 1 || -n "$test_bad" ]]; then
                    echo "ci mandatory test job failed run_id=${run_id} count=${test_count} jobs=${test_bad}" >&2
                    exit 1
                  fi
                  optional_count="$(jq -r '[.jobs[] | select(.name == "transport_prepare" or .name == "transport_smoke" or .name == "transport_bench" or .name == "transport_aggregate")] | length' <<<"$jobs_json")"
                  optional_invalid="$(jq -r '[.jobs[] | select((.name == "transport_prepare" or .name == "transport_smoke" or .name == "transport_bench" or .name == "transport_aggregate") and (.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))) | "\(.name)=\(.status)/\(.conclusion // "null")"] | join(",")' <<<"$jobs_json")"
                  optional_skipped="$(jq -r '[.jobs[] | select((.name == "transport_prepare" or .name == "transport_smoke" or .name == "transport_bench" or .name == "transport_aggregate") and .conclusion == "skipped")] | length' <<<"$jobs_json")"
                  if [[ "$optional_count" -ne 4 || -n "$optional_invalid" ]]; then
                    echo "ci optional transport job contract mismatch run_id=${run_id} count=${optional_count} jobs=${optional_invalid}" >&2
                    exit 1
                  fi
                  echo "WBD_RELEASE_CHILD_JOBS_PASS workflow=${workflow} run_id=${run_id} mandatory_jobs=1 mandatory_skipped=0 optional_transport_jobs=4 optional_transport_skipped=${optional_skipped}"
                else
                  bad_jobs="$(jq -r '[.jobs[] | select(.status != "completed" or .conclusion != "success") | "\(.name)=\(.status)/\(.conclusion // "null")"] | join(",")' <<<"$jobs_json")"
                  if [[ -n "$bad_jobs" ]]; then
                    echo "push gate has non-success mandatory job workflow=${workflow} run_id=${run_id} jobs=${bad_jobs}" >&2
                    exit 1
                  fi
                  echo "WBD_RELEASE_CHILD_JOBS_PASS workflow=${workflow} run_id=${run_id} mandatory_jobs=${total_jobs} mandatory_skipped=0"
                fi
                echo "WBD_RELEASE_CHILD_PASS workflow=${workflow} event=${event} run_id=${run_id} head_sha=${head_sha} conclusion=${conclusion} url=${url}"
                break
              fi
              if (( SECONDS >= deadline )); then echo "push gate timeout workflow=${workflow} run_id=${run_id} status=${status} url=${url}" >&2; exit 1; fi
              sleep 20
            done
          done

      - name: Require branch stayed on candidate and publish authority marker
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${REPO}/branches/${BRANCH}" --jq '.commit.sha')"
          printf 'aggregator_sha=%s final_branch_sha=%s\n' "$GITHUB_SHA" "$current"
          test "$current" = "$GITHUB_SHA"
          echo 'WBD_RELEASE_QUALIFICATION_PASS exact_head=1 dispatched=22 push_gates=9 total_children=31 mandatory_jobs_success_only=1 mandatory_skipped=0 ci_optional_transport_jobs=non_authority release_artifacts=3 artifact_source_fence=1 windows_linux=1 logical_tunnel=1 lanes=1..4 game_settings=1 game_race=1 mbb=1 dormant_wake=1 route_rebind=1 manual_reconnect=1 server_close=1 shared_tun_one_nat=1 fec_primary=off fec_20x20=smoke_only fec_research=frozen'
