name: game-lane-rotation-oversize

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/game-lane-rotation-oversize.yml'
      - 'scripts/game_lane_rotation_soak.sh'
      - 'scripts/game_lane_rotation_soak_control.sh'
      - 'internal/linkdata/**'
      - 'internal/pathmtu/**'
      - 'internal/releasecontract/**'
      - 'cmd/wbd-link-proxy/**'
      - 'cmd/wbd-link-server-mux/**'
      - 'cmd/wbd-faketcp/**'
      - 'cmd/wbd-faketcp-mux/**'
      - 'cmd/wbd-game-lane-client/**'
      - 'cmd/wbd-game-lane-server/**'

concurrency:
  group: game-lane-rotation-oversize-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc curl unzip openssl
      - name: Build exact-source stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/wbd-oversize-assets"
          mkdir -p /tmp/wolf-art /tmp/wolf/src /tmp/wolf/build "$ASSET"
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9529710833/zip" -o /tmp/wolfssl-source.zip
          unzip -q /tmp/wolfssl-source.zip -d /tmp/wolf-art
          echo '4a7ff40a32db0d7a262aaea2d2e674da6708250cba908441c737c981fc84f88b  /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wolf-art/wolfssl-ac01707f-source.tar.gz -C /tmp/wolf/src --strip-components=1
          (cd /tmp/wolf/src && ./autogen.sh)
          (cd /tmp/wolf/build && /tmp/wolf/src/configure --enable-dtls13 --disable-shared --enable-static CFLAGS='-O2 -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384')
          make -C /tmp/wolf/build -j2 src/libwolfssl.la
          gcc -DWOLFSSL_DTLS_WINDOW_WORDS=128 -DWOLFSSL_MAX_MTU=16384 -O2 -Wall -Wextra -Werror -I/tmp/wolf/build -I/tmp/wolf/src \
            native/dtls/wbd_dtls_shim.c /tmp/wolf/build/src/.libs/libwolfssl.a -lm -o "$ASSET/wbd_dtls_shim"

          go test ./internal/linkdata ./internal/pathmtu ./internal/gamelane ./internal/faketcp ./internal/session \
            ./cmd/wbd-faketcp ./cmd/wbd-faketcp-mux ./cmd/wbd-game-lane-client ./cmd/wbd-game-lane-server \
            ./cmd/wbd-link-proxy ./cmd/wbd-link-server-mux -count=1
          go build -trimpath -o "$ASSET/wbd-faketcp" ./cmd/wbd-faketcp
          go build -trimpath -o "$ASSET/wbd-faketcp-mux" ./cmd/wbd-faketcp-mux
          go build -trimpath -o "$ASSET/wbd-link-proxy" ./cmd/wbd-link-proxy
          go build -trimpath -o "$ASSET/wbd-link-server-mux" ./cmd/wbd-link-server-mux
          go build -trimpath -o "$ASSET/wbd-game-lane-client" ./cmd/wbd-game-lane-client
          go build -trimpath -o "$ASSET/wbd-game-lane-server" ./cmd/wbd-game-lane-server
          printf '%s\n' "$GITHUB_SHA" >"$ASSET/SOURCE_SHA.txt"
          echo "WBD_DTLS_LOGICAL_MTU_BUILD logical_mtu=16384 source=wolfssl-max-record"

          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj '/CN=unrelated-front.invalid' -keyout "$ASSET/front.key" -out "$ASSET/front.pem" >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj '/CN=unrelated-dtls.invalid' -keyout "$ASSET/dtls.key" -out "$ASSET/dtls.pem" >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: game-lane-rotation-oversize-assets
          path: ${{ runner.temp }}/wbd-oversize-assets
          retention-days: 1

  oversize-rotation:
    needs: build-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - connection_mtu: 1280
            fec: 'off'
            fec_slug: off
          - connection_mtu: 1280
            fec: '20:20'
            fec_slug: fec20
          - connection_mtu: 1500
            fec: 'off'
            fec_slug: off
          - connection_mtu: 1500
            fec: '20:20'
            fec_slug: fec20
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables tcpdump
      - uses: actions/download-artifact@v4
        with:
          name: game-lane-rotation-oversize-assets
          path: ${{ runner.temp }}/wbd-oversize-assets
      - name: Restore exact-source executables
        run: |
          chmod +x "$RUNNER_TEMP"/wbd-oversize-assets/wbd-* "$RUNNER_TEMP"/wbd-oversize-assets/wbd_dtls_shim
          test "$(cat "$RUNNER_TEMP/wbd-oversize-assets/SOURCE_SHA.txt")" = "$GITHUB_SHA"
      - name: Run oversized logical datagrams across four replacements
        env:
          LANES: '4'
          CONNECTION_MTU: ${{ matrix.connection_mtu }}
          FEC: ${{ matrix.fec }}
          DURATION_SEC: '140'
          MIN_DURATION_SEC: '120'
          RATE_BPS: '1000000'
          PAYLOAD_BYTES: '1800'
          POST_SMALL_PROBE_BYTES: '256'
          REQUIRE_LINK_FRAGMENTATION: '1'
          STRICT_LOAD_QUALITY: '0'
          ROTATE_INTERVAL_SEC: '25'
          ROTATIONS: '4'
          NETEM_DELAY_MS: '0'
          NETEM_LOSS_PCT: '0'
        run: |
          set -euo pipefail
          slug="${{ matrix.connection_mtu }}-${{ matrix.fec_slug }}"
          LOG="$RUNNER_TEMP/game-lane-rotation-oversize-$slug"
          mkdir -p "$LOG"
          sudo -E bash "$GITHUB_WORKSPACE/scripts/game_lane_rotation_soak_control.sh" "$RUNNER_TEMP/wbd-oversize-assets" "$LOG"
          python3 - "$LOG" "${{ matrix.connection_mtu }}" "${{ matrix.fec }}" <<'PY'
          import json,pathlib,re,subprocess,sys
          root=pathlib.Path(sys.argv[1]); connection=int(sys.argv[2]); fec=sys.argv[3]
          result=json.loads((root/'load-result.json').read_text())
          assert result['rotations']==4 and result['peer_resets']==4, result
          assert result['no_client_rx_expire']==0 and result['duplicates']==0 and result['bad_payload']==0, result
          assert result['lost']==0, result
          assert result['post_small_probe_bytes']==256 and result['post_small_probe_pass'] is True, result
          budget=json.loads(subprocess.check_output([
              'go','run',str(pathlib.Path.cwd()/'.github/scripts/mtu_budget.go'),
              '-connection-mtu',str(connection),'-fec',fec], text=True))
          link=int(budget['LinkPlaintextMTU'])
          assert 1800 > link, (1800,link)

          fake_logs=sorted(root.glob('lane-*-faketcp.log'))
          link_logs=sorted(root.glob('lane-*-link.log'))
          assert len(fake_logs)>=4 and len(link_logs)>=4, (len(fake_logs),len(link_logs))
          for p in fake_logs:
              txt=p.read_text(errors='replace')
              assert re.search(rf'READY role=client .*carrier_mtu={connection}\b', txt), (p,connection)

          stat_re=re.compile(r'WBD_LINK_PATH_STATS role=client mtu=(\d+).*fragmented_tx=(\d+).*fragment_tx_frames=(\d+).*max_fragment_tx=(\d+).*fragment_rx_frames=(\d+).*max_fragment_rx=(\d+).*reassembled_rx=(\d+)')
          for p in link_logs:
              txt=p.read_text(errors='replace')
              rows=stat_re.findall(txt)
              assert rows, p
              mtu,ftx,frames,max_tx,rxframes,max_rx,rrx=map(int,rows[-1])
              assert mtu==link, (p,mtu,link)
              assert ftx>0 and frames>0 and rxframes>0 and rrx>0, (p,rows[-1])
              assert max_tx<=mtu and max_rx<=mtu, (p,rows[-1])

          server_txt=(root/'link-server.log').read_text(errors='replace')
          server_re=re.compile(r'WBD_LINK_SERVER_PATH_STATS .*?mtu=(\d+).*?fragmented_tx=(\d+).*?fragment_tx_frames=(\d+).*?max_fragment_tx=(\d+).*?fragment_rx_frames=(\d+).*?max_fragment_rx=(\d+).*?reassembled_rx=(\d+)')
          server_rows=server_re.findall(server_txt)
          assert len(server_rows)>=8, len(server_rows)
          for row in server_rows:
              mtu,ftx,frames,max_tx,rxframes,max_rx,rrx=map(int,row)
              assert mtu==link, (mtu,link)
              assert ftx>0 and frames>0 and rxframes>0 and rrx>0, row
              assert max_tx<=mtu and max_rx<=mtu, row

          game=(root/'game-client.log').read_text(errors='replace')
          assert 'WBD_GAME_LANE_CLIENT_LANE_FAIL ' not in game, game[-4000:]
          print(f'WBD_OVERSIZE_ROTATION_PASS connection_mtu={connection} fec={fec} link_mtu={link} candidate_logs={len(link_logs)} server_paths={len(server_rows)}')
          PY
      - name: Diagnose failure
        if: failure()
        run: |
          set +e
          slug="${{ matrix.connection_mtu }}-${{ matrix.fec_slug }}"
          LOG="$RUNNER_TEMP/game-lane-rotation-oversize-$slug"
          for f in "$LOG"/*.log; do
            echo "--- $f"
            tail -n 160 "$f" 2>/dev/null || true
          done
      - name: Scrub one-time auth material
        if: always()
        run: |
          set +e
          slug="${{ matrix.connection_mtu }}-${{ matrix.fec_slug }}"
          LOG="$RUNNER_TEMP/game-lane-rotation-oversize-$slug"
          sudo rm -rf "$LOG/tickets" "$LOG"/ticket-*.txt "$LOG"/tunnel-*.json "$LOG"/front-*.log
          sudo chmod -R a+rX "$LOG" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-lane-rotation-oversize-${{ matrix.connection_mtu }}-${{ matrix.fec_slug }}
          path: ${{ runner.temp }}/game-lane-rotation-oversize-*
          retention-days: 14
