name: linux-shared-port

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-shared-port.yml'
      - 'scripts/linux_shared_port_smoke.sh'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'
  push:
    branches: [dev/wbd-raw-fec-v2]
    paths:
      - '.github/workflows/linux-shared-port.yml'
      - 'scripts/linux_shared_port_smoke.sh'
      - 'cmd/wbd-faketcp/**'
      - 'internal/faketcp/**'

permissions:
  contents: read

jobs:
  coexistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iptables
      - name: Build and test shared public TCP port demux
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/faketcp -count=1
          go build -trimpath -o /tmp/wbd-faketcp ./cmd/wbd-faketcp
          chmod +x scripts/linux_shared_port_smoke.sh
          sudo env WBD_FAKETCP_BIN=/tmp/wbd-faketcp WBD_SHARED_PORT=52443 scripts/linux_shared_port_smoke.sh
