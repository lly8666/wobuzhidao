name: faketcp-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables
      - name: Unit tests and build native FakeTCP
        run: |
          go test ./internal/faketcp -count=1
          go build -trimpath -o /tmp/wbd-faketcp ./cmd/wbd-faketcp
      - name: Controlled finite-recovery qualification
        run: |
          set -euo pipefail
          # Explicit loss/repair ordering, bounded well below forgiveness pressure.
          # Both sender recovery algorithms must recover every record here.
          go test ./internal/faketcp -run '^TestControlledRecoveryCompletesBeforeForgiveness$' -count=1 -v
      - name: Run SACK/RACK bounded-recovery random-loss smoke
        run: |
          set -euo pipefail
          # Keep the historical native 10% bidirectional-loss scenario. SACK/RACK
          # selects loss evidence/retransmission candidates; it does not replace the
          # shared bounded steady-state gap-forgiveness policy with reliable delivery.
          C=wbdftc$$
          S=wbdfts$$
          cleanup() {
            set +e
            [[ -n "${CPID:-}" ]] && sudo kill -TERM "$CPID" 2>/dev/null
            [[ -n "${SPID:-}" ]] && sudo kill -TERM "$SPID" 2>/dev/null
            [[ -n "${EPID:-}" ]] && sudo kill -TERM "$EPID" 2>/dev/null
            sleep .2
            sudo ip netns del "$C" 2>/dev/null
            sudo ip netns del "$S" 2>/dev/null
          }
          trap cleanup EXIT
          sudo ip netns add "$C"
          sudo ip netns add "$S"
          sudo ip link add vc type veth peer name vs
          sudo ip link set vc netns "$C"
          sudo ip link set vs netns "$S"
          sudo ip -n "$C" addr add 10.82.0.1/24 dev vc
          sudo ip -n "$S" addr add 10.82.0.2/24 dev vs
          sudo ip -n "$C" link set lo up
          sudo ip -n "$S" link set lo up
          sudo ip -n "$C" link set vc up
          sudo ip -n "$S" link set vs up
          sudo ip netns exec "$C" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          sudo ip netns exec "$S" iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
          sudo ip netns exec "$C" tc qdisc add dev vc root netem delay 10ms loss 10%
          sudo ip netns exec "$S" tc qdisc add dev vs root netem delay 10ms loss 10%

          cat >/tmp/wbd_echo.py <<'PY'
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',52000))
          while True:
              b,a=s.recvfrom(65535)
              s.sendto(b,a)
          PY
          sudo ip netns exec "$S" python3 /tmp/wbd_echo.py >/tmp/echo.log 2>&1 & EPID=$!
          sudo ip netns exec "$S" /tmp/wbd-faketcp server --shadow-recovery sack-rack --listen 10.82.0.2:52003 --target-udp 127.0.0.1:52000 >/tmp/fts.log 2>&1 & SPID=$!
          sleep .15
          sudo ip netns exec "$C" /tmp/wbd-faketcp client --shadow-recovery sack-rack --local-udp 127.0.0.1:52004 --source 10.82.0.1:52010 --remote 10.82.0.2:52003 >/tmp/ftc.log 2>&1 & CPID=$!
          for i in $(seq 1 200); do
            grep -q 'READY role=client.*recovery=sack-rack' /tmp/ftc.log && grep -q 'READY role=server.*recovery=sack-rack' /tmp/fts.log && break
            sleep .05
          done
          cat /tmp/ftc.log
          cat /tmp/fts.log
          grep -q 'READY role=client.*recovery=sack-rack' /tmp/ftc.log
          grep -q 'READY role=server.*recovery=sack-rack' /tmp/fts.log

          cat >/tmp/wbd_probe.py <<'PY'
          import json,socket,struct,threading,time
          N=1000
          SIZE=200
          TAIL=64
          got=set()
          duplicates=0
          bad=[]
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.bind(('127.0.0.1',0))
          s.settimeout(.1)
          end=False
          def rx():
              global duplicates
              while not end:
                  try: b,_=s.recvfrom(2048)
                  except socket.timeout: continue
                  if len(b)!=SIZE:
                      bad.append({'kind':'size','size':len(b)})
                      continue
                  idx=struct.unpack('!I',b[:4])[0]
                  if idx>=N or b[4:]!=bytes(SIZE-4):
                      bad.append({'kind':'payload','idx':idx})
                      continue
                  if idx in got:
                      duplicates += 1
                  got.add(idx)
          t=threading.Thread(target=rx); t.start()
          start=time.time()
          for i in range(N):
              s.sendto(struct.pack('!I',i)+bytes(SIZE-4),('127.0.0.1',52004))
              time.sleep(.001)
          deadline=time.time()+120
          while len(got)<N and time.time()<deadline: time.sleep(.02)
          end=True; t.join()
          missing=sorted(set(range(N))-got)
          tail_received=sum(1 for i in range(N-TAIL,N) if i in got)
          out={
              'sent':N,
              'record_bytes':SIZE,
              'received':len(got),
              'missing':missing,
              'ratio':len(got)/N,
              'duplicates':duplicates,
              'bad':bad[:16],
              'max_received':max(got) if got else -1,
              'tail_window':TAIL,
              'tail_received':tail_received,
              'wall_s':time.time()-start,
          }
          open('/tmp/probe.json','w').write(json.dumps(out)+'\n')
          print('PROBE',json.dumps(out))
          PY
          sudo ip netns exec "$C" python3 /tmp/wbd_probe.py

          sudo kill -TERM "$CPID" "$SPID"
          wait "$CPID" || true
          wait "$SPID" || true
          CPID= SPID=
          cat /tmp/ftc.log
          cat /tmp/fts.log
          grep -q 'WBD_FAKETCP_STATS' /tmp/ftc.log
          grep -q 'WBD_FAKETCP_STATS' /tmp/fts.log
          python3 - <<'PY'
          import json,re
          probe=json.load(open('/tmp/probe.json'))
          rows=[]
          for p in ['/tmp/ftc.log','/tmp/fts.log']:
              txt=open(p).read()
              m=re.findall(r'WBD_FAKETCP_STATS (\{.*\})',txt)
              assert m,p
              rows.append(json.loads(m[-1]))
          by_role={r['role']:r for r in rows}
          client=by_role['client']
          server=by_role['server']

          # Historical bounded-recovery runs before the temporary strict-mode
          # regression delivered roughly 984-986/1000 in this random scenario.
          # 980 is only a regression floor; it is NOT the correctness criterion.
          baseline_reference=984
          baseline_floor=980
          missing=probe['sent']-probe['received']
          reasons={
              'forgiven_gaps':sum(r['receiver']['ForgivenGaps'] for r in rows),
              'forgiven_bytes':sum(r['receiver']['ForgivenBytes'] for r in rows),
              'soft_forgiven_gaps':sum(r['receiver']['SoftForgivenGaps'] for r in rows),
              'emergency_forgiven_gaps':sum(r['receiver']['EmergencyForgivenGaps'] for r in rows),
              'repair_evicted':sum(r['sender']['RepairEvicted'] for r in rows),
              'repair_evicted_bytes':sum(r['sender']['RepairEvictedBytes'] for r in rows),
              'repair_metadata_evicted':sum(r['sender']['RepairMetadataEvicted'] for r in rows),
              'repair_deferred':sum(r['sender']['RepairDeferred'] for r in rows),
              'repair_budget_spent':sum(r['sender']['RepairBudgetSpent'] for r in rows),
          }

          # Split end-to-end loss by direction using the product counters. Every
          # datagram delivered by the server is echoed once; every echoed datagram
          # is then eligible for client delivery. Missing records must therefore
          # be attributable on the direction where progress skipped them.
          forward_missing=probe['sent']-server['receiver']['Delivered']
          echoed=server['sender']['Enqueued']
          return_missing=echoed-client['receiver']['Delivered']
          directional={
              'forward_missing':forward_missing,
              'return_missing':return_missing,
              'forward_forgiven_bytes':server['receiver']['ForgivenBytes'],
              'return_forgiven_bytes':client['receiver']['ForgivenBytes'],
              'forward_sender_evicted':client['sender']['RepairEvicted'],
              'forward_sender_evicted_bytes':client['sender']['RepairEvictedBytes'],
              'forward_sender_metadata_evicted':client['sender']['RepairMetadataEvicted'],
              'return_sender_evicted':server['sender']['RepairEvicted'],
              'return_sender_evicted_bytes':server['sender']['RepairEvictedBytes'],
              'return_sender_metadata_evicted':server['sender']['RepairMetadataEvicted'],
          }
          summary={
              'probe':probe,
              'bounded_recovery_baseline_reference':baseline_reference,
              'delta_from_reference':probe['received']-baseline_reference,
              'loss_reason_counters':reasons,
              'directional_loss_explanation':directional,
              'arq':rows,
          }
          print('BOUNDED_RECOVERY_FINAL',json.dumps(summary,sort_keys=True))

          # Integrity and liveness are independent gates.
          assert not probe['bad'], probe
          assert probe['duplicates'] == 0, probe
          assert probe['received'] >= baseline_floor, summary
          assert probe['max_received'] >= probe['sent']-probe['tail_window'], summary
          assert probe['tail_received'] >= 48, summary
          assert all(r['recovery']=='sack-rack' for r in rows), rows
          assert sum(r['sender']['FastRetransmits']+r['sender']['RTOTransmits'] for r in rows)>0, rows
          assert sum(r['sender']['SACKed'] for r in rows)>0, rows

          # Concrete state bounds and fresh-data isolation remain product gates.
          assert all(r['sender']['PeakPending'] <= 4096 for r in rows), rows
          assert all(r['sender']['FreshBlockedByRepair'] == 0 for r in rows), rows

          # Cross-check application delivery with transport delivery before using
          # transport counters as the explanation for missing application IDs.
          assert forward_missing >= 0 and return_missing >= 0, summary
          assert echoed == server['receiver']['Delivered'], summary
          assert probe['received'] == client['receiver']['Delivered'], summary
          assert missing == forward_missing + return_missing, summary

          # A permanent miss needs directional abandonment evidence. Budget defer
          # alone is deliberately not accepted as an explanation: it is temporary.
          # Forgiven sequence bytes and evicted repair records are the existing
          # finite-recovery mechanisms that can make a miss permanent.
          size=probe['record_bytes']
          forward_explainable=(server['receiver']['ForgivenBytes']//size +
                               client['sender']['RepairEvicted'] +
                               client['sender']['RepairMetadataEvicted'])
          return_explainable=(client['receiver']['ForgivenBytes']//size +
                              server['sender']['RepairEvicted'] +
                              server['sender']['RepairMetadataEvicted'])
          assert forward_missing <= forward_explainable, summary
          assert return_missing <= return_explainable, summary
          PY
