name: windows-fec-profile-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-per-association-mtu-20260914
    paths:
      - '.github/workflows/windows-fec-profile-matrix.yml'
      - 'internal/fec/**'
      - 'internal/control/**'
      - 'internal/linkdata/**'
      - 'internal/windowsruntime/**'
      - 'cmd/wbd-link-proxy/**'

permissions:
  contents: read

jobs:
  fec-profile:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ['off', '20:4', '20:8', '20:10', '20:12', '20:16', '20:20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact FEC profile
        shell: pwsh
        env:
          FEC_PROFILE: ${{ matrix.profile }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Shared immutable-link and Windows admission contracts remain common
          # to every cell. Link-proxy execution itself is deliberately scoped to
          # the profile under test so unrelated liveness timing tests cannot be
          # mistaken for an FEC-profile failure; those remain covered by normal CI.
          go test ./internal/control ./internal/linkdata ./internal/windowsruntime -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:FEC_PROFILE -eq 'off') {
            go test ./cmd/wbd-link-proxy -run '^TestImmutableLinkProxyOffNoAuth$' -count=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $repair = [int]($env:FEC_PROFILE.Split(':')[1])
            go test ./internal/fec -run "^TestFixedParityProfileMatrixRecoversEquivalentSystematicLoss/20_$repair$" -count=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go test ./cmd/wbd-link-proxy -run "^TestImmutableLinkProxyFixedProfileMatrix/20_$repair$" -count=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          go build -trimpath -o $env:RUNNER_TEMP\wbd-link-proxy.exe .\cmd\wbd-link-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "WBD_FEC_PROFILE_MATRIX_PASS profile=$env:FEC_PROFILE"
